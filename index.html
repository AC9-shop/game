 أعاد تمريرها على حجر لزج بالزيت، مسحها بعناية، جربها على ظفره قبل الشروع في حلاقة رأسي."}, {"fr": "Il commença au sommet du crâne, m’obligea à baisser le nez jusqu’aux genoux, racla à petits coups le duvet de ma nuque. II revint ensuite aux côtés, fit le tour de la mèche qui pendait sur mon oreille droite. Le rasoir me brûlait lin peu. Je ne disais rien. Je n’écoutais même plus la conversation. Une torpeur m’en- vahit. Je finis par m’endormir. Ma tête s’en alla de travers et la lame me mordit légèrement. Je me réveillai en sursaut. Le coiffeur discutait toujours. Des gouttes de sueur couvraient mon front, dégoulinaient le long de mon nez.", "ar": "بدأ من قمة الجمجمة، أجبرني على إخفاض أنفي حتى الركبتين، فرك بضربات خفيفة زغب رقبتي. عاد بعد ذلك إلى الجوانب، قام بجولة حول الخصلة التي كانت تتدلى على أذني اليمنى. كانت الموسى تحرقني قليلا. لم أكن أقول شيئا. لم أعد أسمع الحديث حتى. انتابني فتور. انتهى بي الأمر بالنوم. ذهب رأسي بطريقة منحرفة و جرحتني الشفرة قليلا. 79 استيقظت منتفضا. كان الحلاق ما يزال يتكلم. كانت قطرات العرق تغطي جبيني، تسيل على طول أنفي."}, {"fr": "Il s’arrêta enfin, épousseta mon visage et mon cou à l’aide d’une serviette et me démaillota. Je me sen- tis léger, comme saigné à blanc. J’eus mal au cœur. Je cherchai des yeux mon père. II s’aperçut de mon malaise, se mit debout, se porta à mon secours.", "ar": "توقف أخيرا، نفض وجهي و عنقي باستعمال منشفة و نزع عني المنشفة الكبيرة. أحسست بأنني خفيف، كما لو أنه تم إفراغ كل دمي. أحسست بألم في قلبي. بحثت عن أبي بعيني. انتبه لتوعكي، وقف، هب لإنقاذي."}, {"fr": "- Viens, me dit-il, l’air frais te fera du bien. Si Abderrahman, j’ai besoin d’être rasé moi aussi, mais je reviendrai le soir; cet enfant paraît fatigué. Messieurs, je vous laisse dans la paix d’Allah !", "ar": "- قال لي: تعال، سيفيدك الهواء الطلق. سي عبد الرحمان، أنا كذلك في حاجة إلى الحلاقة، لكن سأعود في المساء؛ يبدو هذا الطفل متعبا. يا سادة، سأترككم في رعاية الله!"}, {"fr": "Nous voici de nouveau dans la rue ; jamais elle ne me parut aussi belle, aussi enchantée que ce jour-là. Je me sentis beaucoup mieux. Arrivés à la maison, nous nous installâmes pour le repas. Le bourdonne- ment des tambourins nous parvenait de toutes les terrasses.", "ar": "ها نحن من جديد في الشارع؛ لم يسبق لي أن رأيته بهذا الجمال و السحر قبل هذا اليوم. أحسست بحال أفضل بكثير. عند وصولنا إلى البيت، جلسنا من أجل الطعام. كان صدى « الطعارج » يصلنا من كل السطوح."}, {"fr": "Au premier étage, Zineb tapait sans rythme sur son jouet de quatre sous, une tarifa en terre cuite qui ne mesurait pas plus d’un empan. Je pris à peine le temps de manger, j’avais hâte de la faire mourir de jalousie. Je trouvai deux bâtonnets, je me passai le tambour en forme de sablier en bandoulière et je com- mençai une nouba de ma composition à crever le tympan de tous les habitants du quartier.", "ar": "في الطابق الأول، كانت زينب تضرب بدون إيقاع لعبتها ذات الأربع فلوس، طعريجة من الطين التي لم يكن طولها يتجاوز شبرا واحدا. لقد أخذت بالكاد وقتا لآكل، كنت أتطلع لأجعل زينب تموت من الغيرة. وجدت عصيتين، تقلدت « بدربوكتي المزدوجة » و بدأت ن وبة تثقب طبلة أذن كل سكان الحي."}, {"fr": "Je réfléchis. Ma musique devait être plus riche. Je m’équipai en homme-orchestre. Je m’assis, mis mon tambour par terre sur ses bords, je réussis à coincer ma trompette entre les genoux. Mes mains manièrent le bâtonnet avec vigueur. Je soufflai de toutes mes forces dans la trompette. Bruits de tambour et mugis- sements se mêlèrent. La musique devenait assourdissante. Zineb vint me rejoindre pour prendre part à la fête. Nous improvisâmes le plus beau concert qui eût jamais fait résonner les murs de notre maison.", "ar": "فكرت. يجب أن تكون موسيقاي أكثر غنى. تحولت إلى رجل الأركسترا. جلست، وضعت طبلي أرضا على جوانبه، تمكنت من إمساك بوقي بركبتي. أمسكت يداي العصية بقوة. نفخت في بوقي بكل قوتي. اختلط صوت الطبل بالخوار. صارت الموسيقى مصمة. التحقت بي زينب لتشارك في الحفلة. أقمنا أجمل حفلة موسيقية جعلت جدران بيتنا ترن."}, {"fr": "Les femmes, y compris ma mère, crièrent grâce. Elles n’appréciaient pas notre musique. Elles nous conseillèrent de monter sur le belvédère de la terrasse charmer les oreilles des voisins. Auparavant ma mère me demanda d’enlever ma djellaba et mon vieux gilet. Elle désirait m’essayer une chemise neuve. Elle me la passa par-dessus la vieille. Elle craquait d’apprêt.", "ar": "طلبت جميع النساء، مع احتساب أمي، الرحمة. لم تكن موسيقانا تعجبهن. نصحننا بالصعود إلى بلكون السطح و سحر آذان الجيران. طلبت أمي مني قبل ذلك أن أخلع جلبابي و صداري القديم. كانت ترغب في أن تجرب قميصا جديدا علي. ألبستني إياه فوق القديم. كان يطقطق من التجهيز."}, {"fr": "Ma mère paraissait satisfaite du travail de la couturière. La chemise me couvrait entièrement et tombait jusqu’au sol. Mes bras se perdaient dans les immenses manches. Le col, de deux doigts de hauteur, était fait de plusieurs épaisseurs de tissu et fermait sur le côté par un cordonnet de soie blanche. Je ne pensais qu’à mon tambour, cette séance d’essayage m’ennuyait. Je pus me libérer, reprendre mon vieux gilet et ma djellaba. Je courus vers la terrasse. Zineb m’attendait en compagnie de deux filles et d’un garçon venus des maisons mitoyennes, chacun avec son instrument de musique. Le garçon tenait un tambourin comme les filles. Il l’abandonna pour s’emparer de ma trompette. Il était plus âgé que moi et se connaissait en musique. Il sut tirer de cette trompette, simple en apparence, les rugissements les plus inattendus. Nous nous abandonnâmes à la joie du rythme, nous nous soulâmes de bruit.", "ar": "كانت أمي تبدو راضية عن عمل الخياطة. كان القميص يغطيني كليا و يسقط حتى الأرض. كانت ذراعاي تضيعان داخل الأكمام الكبيرة. كانت 80 ياقتي التي يبلغ ارتفاعها أصبعين مصنوعة من عدة سموك من القماش و كان يغلق حافتها بريم من الحرير الأبيض. لم أكن أفكر إلا في طبلي، كانت حصة القياس هذه تشعرني بالملل. استطعت التحرر، استعدت صداري القديم و جلبابي. ركضت إلى السطح. كانت زينب في انتظاري برفقة بنتين و ولد قدموا من المنازل المجاورة، كان كل واحد يملك آلاته الموسيقية. كان الولد يملك طعريجة مثل البنات، تخلى عنها للحصول على بوقي. كان أكبر مني و يفهم في الموسيقى. عرف كيف يخرج من هذا البوق، الزمزمات الأكثر مفاجئة. استسلمنا لفرح الإيقاع، سكرنا في الضجة."}, {"fr": "Des femmes richement habillées se perchèrent sur les murs pour nous admirer. Elles riaient de notre excitation, nous encourageaient par des mots gentils qui se perdaient dans le tintamarre. Nous jouâmes jusqu’au coucher du soleil. Ma mère vint me chercher. A l’entendre, je m’étais assez amusé ce soir. Il fallait venir dîner et me coucher. Elle comptait me réveiller à la première heure du jour pour aller au Msid commencer l’année dans la joie, le travail et la récitation des versets sacrés. Elle m’ame- na à la cuisine. Là, l’auge de bois qui servait les jours de lessive débordait d’eau bouillante. Pour rendre cette eau moins brûlante, elle y versa un seau d’eau fraîche. Elle me déshabilla, me plongea dans ce savant mélange. J’eus la respiration coupée. Je me mis à hurler, à me débattre afin d’échapper aux mains de ma mère qui me frottait vigoureusement à l’aide d’une rondelle de liège, emprisonnée dans un tissu particu- lièrement rêche. Une fois lavé, je mangeai quelques bouchées de pain trempées dans la sauce d’un plat de viande au citron. Je m’allongeai sur mon matelas. Ma mère étendit sur moi une chaude couverture. Je ne tardai pas à sombrer dans le noir, un noir peuplé de petites filles taquines et bêtes et de barbiers bavards.", "ar": "تسلقت نساء مثقلات بالثياب الجدران لتنظرن إلينا. كن يضحكن من إثارتنا، تشجعننا بكلمات لطيفة كانت تضيع في الجعجعة. لعبنا حتى غروب الشمس. أتت أمي لاصطحابي. حسب قولها، ك نت قد استمتعت بما فيه الكفاية هذا المساء. كان يجب الذهاب للعشاء و النوم. كانت تنوي إيقاظي مع أول ساعات النهار للذهاب للمسيد و بدء السنة بالفرح، العمل و تلاوة الآيات الكريمة. أخذتني إلى المطبخ. هناك، كان المعلف الخشبي الذي يستعمل أيام الغسيل مليئا بالماء الفوار. لجعل هذا الماء أقل حرارة، سكبت فيه دلوا من الماء البارد. خلعت لي ملابسي، غمرتني في هذا الخليط الدقيق. انقطع تنفسي. بدأت بالصراخ، التخبط لكي أتخلص من يدي أمي التي كانت تفركني بقوة باستعمال أسطوانة من الفلين ملفوفة داخل قماش خشن للغاية. بعد استحمامي، أكلت بعض اللقم من خبز مغموس في صلصة طبق من اللحم بالحامض. استلقيت على فراشي. غطتني أمي بغطاء دافئ. سرعان ما غرقت في الظلام، ظلام تملأه بنات صغيرات، مزعجات و غبيات بالإضافة إلى حلاقين ثرثارين."}, {"fr": "La voix de ma mère me tira des profondeurs du sommeil. Je nageai, un bon moment, dans une lumière rouge parcourue d’étincelles et d’astres errants, puis, j’ouvris les yeux. Vite, je les refermai, espérant re- trouver le noir si reposant et si frais. La voix insistait :", "ar": "جرني صوت أمي من أعماق النعاس. سبحت، لوقت طويل، في ضوء أحمر تجوبه شرارات و كواكب ضالة، ثم، فتحت عيني. أعدت إغلاقهما بسرعة، على أمل إيجاد الظلام مريحا جدا و باردا جدا. كان الصوت يصر:"}, {"fr": "- Réveille-toi, il est trois heures du matin. Je t’ai préparé ton beau gilet, ta chemise neuve et ta sacoche. Tu n’as pas encore vu ta belle sacoche brodée. Ouvre les yeux! Réveille-toi donc !", "ar": "81 - استيقظ، إنها الثالثة صباحا. لقد جهزت لك صدارك الجميل، قميصك الجديد و حقيبتك. لم ترى حقيبتك المطرزة بعد. افتح عينيك! فلتستيقظ إذن!"}, {"fr": "Je pleurnichai, je me frottai énergiquement les paupières de mes poings fermés. Je tentai plusieurs fois de me recoucher, mais ma mère fut impitoyable. Elle se mouilla la main et me la passa sur la figure. Mes oreilles cessèrent de bourdonner. J’entrouvris mes cils avec précaution. Mon père, habillé d’une djellaba de laine fine, me souriait.", "ar": "تباكيت، فركت جفني بحيوية باستعمال قبضتي. حاولت العودة إلى النوم عدة مرات، لكن أمي كانت قاسية. بللت يدها و مررتها على وجهي. توقفت أذناي عن الأزيز. واربت رموشي بحذر. كان أبي لابسا جلبابا من الصوف الرفيع، يبتسم لي."}, {"fr": "- Prépare-toi pour fêter l’Achoura au Msid avec tes camarades. Du courage! Du courage! Ce fut dans un état de somnambule que je me lavai les yeux, me rinçai la bouche, me rafraîchis les membres. Je retrouvai ma lucidité ‘·lorsque’ ma mère me passa, à même la peau, ma chemise neuve, craquante d’apprêt. Elle me grattait horriblement. A chaque mouvement, je remplissais la pièce d’un bruit de papier froissé. Je mis mon gilet rouge aux dessins compliqués et bien en relief. Ma sacoche en bandoulière, je complétai cet ensemble très élégant par la djellaba blanche qui dormait au fond du coffre de ma mère. Elle sentait la fleur d’oranger et la rose séchée.", "ar": "- استعد لتحتفل بعاشوراء في المسيد مع زملائك. تشجع! تشجع! غسلت عيناي و أنا في حالة سير أثناء النوم، شطفت فمي، أنعشت أطرافي. استعدت وعيي عندما مررت أمي، على بشرتي مباشرة، قميصي الجديد، الذي كان يطقطق من التجهيز. كان يحكني بشكل فظيع. عند كل حركة، كنت أملأ الغرفة بصوت ورق مدعوك. لبست صداري الأحمر ذا الرسوم المعقدة و البارزة جدا. تقلدت بحقيبتي، أكملت هذا المجموع الأنيق جدا بجلبابي الأبيض الذي كان يرقد في قاع صندوق أمي. كانت تفوح منه رائحة أزهار أشجار البرتقال و الورد المجفف."}, {"fr": "Me voilà devenu un autre homme! J’étais complètement réveillé. J’avais hâte de partir à l’école. Les vêtements, les chaussures, tout était neuf. Plein de dignité et d’assurance, je précédai mon père dans l’escalier.", "ar": "ها أنا ذا أصبحت رجلا آخر! كنت مستيقظا كليا. كنت أتطلع للذهاب للكتاب. الملابس، الأحذية، كان كل شيء جديدا. كنت أسبق أبي في الدرج و أنا مفعم بالكرامة و الثقة."}, {"fr": "La lumière brillait à toutes les fenêtres de la maison. Hommes et femmes commençaient l’année dans l’activité. Ceux qui restaient au lit un matin comme celui-ci se sentiraient, durant douze mois, indolents, paresseux.", "ar": "كان الضوء يلمع في كل نوافذ البيت. كان الرجال و النساء يبدأون السنة بالنشاط. أولئك الذين كانوا سيبقون في السرير في صباح مثل هذا، كانوا سيحسون خلال إثني عشر شهرا بالتقاعس و الكسل."}, {"fr": "L’appel d’un mendiant nous arrivait de la rue. J’entendais le bruit de sa canne. C’était sûrement un aveugle.", "ar": "كان صوت أحد المتسولين يبلغنا من الشارع. كنت أسمع صوت عكازه. لا بد من أنه كان شخصا أعمى."}, {"fr": "Je perdais mes babouches tous les trois pas. Mes parents voyaient grand. Ni les vêtements, ni les chaus- sures n’étaient à ma taille. Mais j’étais heureux.", "ar": "كنت أفقد بلغتي كل ثلاثة خطوات. « كان لوالداي عين كبيرة ». لم تكن الملابس و لا الأحذية على مقاسي. لكنني كنت سعيدا."}, {"fr": "Une fois dans la rue, mon père me glissa dans la main une pièce de cinq francs et me mit entre les bras le cierge dont nous avions fait l’acquisition. C’étaient là mes cadeaux de nouvel an pour le maître d’école.", "ar": "ما إن وصلنا إلى الشارع، دس أبي في يدي قطعة نقدية من فئة خمس فرنكات و وضع بين يدي الشمعة الدينية التي قمنا بشرائها. كانت تلك هي هدايا السنة الجديدة خاصتي لمعلم الكتاب."}, {"fr": "Les passants que nous rencontrions me souriaient avec bienveillance. Les boutiques étaient ouvertes, les rues éclairées. Je faisais de terribles efforts pour retenir mes babouches. De loin, j’aperçus les fenêtres à auvents de notre école.", "ar": "82 كان المارة الذين نلتقي بهم يبتسمون لي بتعاطف. كانت الدكاكين مفتوحة و الشوارع مضاءة. كنت أبذل مجهودا رهيبا لأحافظ على بلغتي. لمحت من بعيد نوافذ عرش كتابنا."}, {"fr": "Je faillis lâcher mon cierge d’enthousiasme. Des grappes de lumière pendaient et transformaient cette façade habituellement triste et poussiéreuse en un décor de féerie. Les lampes à huile, diversement colo- rées, scintillaient et par leur seule présence créaient un climat raffiné de fête et de joie.", "ar": "كدت أفلت شمعتي الدينية من الحماسة. كانت عناقيد ضوئية تتدلى و تحول هذه الواجهة الحزينة و المغبرة عادة إلى زينة رائعة. كانت قناديل الزيت، المتعددة الألوان، تتلألأ و كان وجودها في حد ذاته عبارة عن جو نقي من الاحتفال و الفرح."}, {"fr": "Je hâtai le pas. Les voix des élèves montaient claires dans la fraîcheur du matin. Elles rivalisaient de gaîté avec les dizaines de petites flammes qui dansaient dans leur bain d’huile et d’eau teintée des cou- leurs de l’arc-en-ciel. Cette impression de fête fabuleuse s’accentua lorsque je poussai la porte du Msid. Je n’étais plus le prince unique au gilet de drap amarante, je devenais un membre d’une congrégation de jeunes seigneurs, tous richement vêtus, chantant sous la direction d’un roi de légende, des cantiques d’allégresse et des actions de grâce.", "ar": "حثثت الخطى، كانت أصوات التلاميذ تبدو واضحة في برودة الصباح. كانت تتنافس في المرح مع عشرات الشعلات التي كانت ترقص داخل حمام من الزيت و الماء المصبوغ بألوان قوس قزح. اشتد انطباع الاحتفال المذهل هذا عندما دفعت باب المسيد. لم أعد الأمير الوحيد بصدار الجوخ الأرجواني، أصبحت عضوا في اجتماع للأعيان الصغار، كلهم يرتدون ثيابا فاخرة، يتلون تحت إشراف ملك أسطوري أمداح بهجة و دعوات بركة."}, {"fr": "Mon père m’abandonna au milieu de mes condisciples. Je remis solennellement mon cierge d’une livre et ma pièce de cinq francs. Les enfants se serrèrent pour me laisser une place. Je scandai les versets coraniques avec conviction. D’autres élèves arrivèrent. Le paquet de cierges gros- sissait à côté du fqih. La chaleur devenait étouffante. J’avais la tête couverte avec le capuchon de ma djellaba. Je le rejetai. Ma chemise collait à mon corps. Des picotements insupportables me parcouraient le dos. Mon front, mes mains se couvrirent de perles de sueur. L’un des élèves saigna du nez et tacha ses beaux habits de croûtes vermeilles. Je levai les yeux au plafond. Les petites flammes dansaient, gré- sillaient, lançaient parfois une étincelle bleue. Je me taisais pour les entendre psalmodier comme nous la parole de Dieu. Leurs voix se confondaient avec celles des élèves. J’étais convaincu qu’aucune d’elles ne célébrait l’Achoura silencieuse dans sa cage de verre, indifférente aux ondes de bonheur qui déferlaient sur nos visages.", "ar": "تركني أبي وسط رفاق دراستي. وضعت شمعتي الدينية التي وزنها رطل واحد بالإضافة إلى عملتي النقدية من فئة خمسة فرنكات بشكل جليل. تزاحم الأطفال ليدعوا لي مكانا. كنت أجود الآيات القرآنية بخشوع؟ وصل تلاميذ آخرون. كانت كومة الشموع الدينية تكبر بجانب الفقيه. كانت الحرارة تصبح خانقة. كان رأسي مغطى بقلنسوة جلبابي. نزعته. كان قميصي يلتصق بجسمي. كانت وخزات لا تحتمل تجوب ظهري. تغطت يداي و جبيني بلآلئ العرق. نزف أنف أحد التلاميذ و لطخ ملابسه الجميلة بقطرات قرمزية. رفعت عيني إلى السقف. كانت الشعلات الصغيرة ترقص، تئز، تقذف شرارة زرقاء أحيانا. سكتت لأسمعها ترتل كلام الله مثلنا. كانت أصواتها تختلط بخاصة التلاميذ. كنت مقتنعا بأنه لم تكن أي واحدة منها تحتفل بعاشوراء صامتة داخل قفصها الزجاجي، لا مبالية بموجات السعادة التي كانت تنتشر على وجوهنا."}, {"fr": "Ce matin, les objets les plus ordinaires, les êtres les plus déshérités mêlaient leurs voix aux nôtres, éprouvaient la même ferveur, s’abandonnaient à la même extase, clamaient avec la même gravité que nous, la grandeur et la miséricorde de Dieu, créateur de toutes choses vivantes.", "ar": "هذا الصباح، ضمت الأشياء العادية جدا و الكائنات الأكثر حرمانا أصواتها إلى خاصتنا، كانت تشعر بنفس الورع، تصيح بنفس شدتنا بكبر و رحمة الله، خالق جميع الكائنات الحية."}, {"fr": "Après la récitation du Coran, nous chantâmes des cantiques. Les parents de certains élèves psalmo- diaient avec nous. Ils étaient venus accompagner leurs enfants. Ils n’avaient peut-être pas de besogne qui les attendait : ils célébraient l’Achoura au Msid comme au temps de leur enfance.", "ar": "83 بعد تلاوة القرآن، غنينا أمداحا. كان آباء بعض التلاميذ يترنمون معنا. كانوا قد جاءوا ليرافقوا أطفالهم. ربما لم يكن لديهم عمل ينتظرهم: كانوا يحتفلون بعاشوراء في المسيد كما في أيام طفولتهم."}, {"fr": "La lumière des veilleuses devenait jaune, s’anémiait à l’approche du jour. Dans la rue, la circulation était devenue intense. Deux moineaux voletèrent autour des lustres accrochés aux auvents des fenêtres. Le maître, les yeux au plafond, les deux mains ouvertes dans un geste d’offrande prononça de longues invocations. Il demanda à Allah de protéger et de faire prospérer les affaires de la communauté des Mu- sulmans, d’étendre ses grâces sur les vivants et les morts, de développer les liens de solidarité entre les humains, de faire régner sur cette terre l’ordre, la justice et la compassion.", "ar": "كان لون اللمبات يصبح أصفرا، يضعف مع اقتراب النهار. في الشارع، كانت حركة المرور قد أصبحت كثيفة. رفرف دوريان حول الثريات المعلقة على عرش النوافذ. نطق المعلم بأدعية طويلة بعينين نحو السقف و فاتحا يديه كمن يقدم شيئا. طلب من الله أن يحمي أعمال الأمة الإسلامية و يزيد من ازدهارها، أن ينشر نعمه على الأحياء و الأموات، أن يقوي روابط التضامن بين الناس، و أن يجعل النظام، العدالة و التعاطف تسود على هذه الأرض. آمين! آمين!"}, {"fr": "Amine! Amine! C’était la première fois que je voyais le fqih sans baguette de cognassier. II me parut beau, enveloppé dans sa djellaba à raies blanches et noires, les épaules couvertes d’un burnous de drap gris. II nous donna trois jours de repos. Le jour de la rentrée étant un jeudi, le congé durerait quatre jours. J’embrassai la main du fqih avant de rentrer chez nous. II me chargea de présenter à mes parents à ses vœux pour la nouvelle année et prononça quelques invocations en leur faveur. La rue était maintenant très animée. Presque tous les passants s’étaient habillés de neuf. Les uns reve- naient du marché chargés de paniers d’alfa qu’ils tenaient écartés pour ne point salir leurs beaux effets, d’autres flânaient désœuvrés. Ma mère avait sorti une belle mansouria en voile fin, ornée de rayures de satin jaune. Elle s’était coiffée d’un foulard noir à longues franges multicolores.", "ar": "كانت أول مرة أرى فيها الفقيه بدون عصا السفرجل. بدا لي وسيما، ملفوفا بجلبابه ذي الخطوط البيضاء و السوداء، كان يلبس سلهاما من جوخ رمادي على كتفيه. أعطانا ثلاثة أيام عطلة. نظرا لأن يوم الدخول كان يوم خميس كانت العطلة ستدوم أربعة أيام. قبلت يد الفقيه قبل العودة إلى منزلنا. كلفني بتبليغ متمنياته لوالدي بمناسبة السنة الجديدة و نطق ببعض الأدعية لصالحهما. كانت الحركة تدب في الشارع كثيرا الآن. كان كل المارة يرتدون ملابس جديدة تقريبا. كان البعض يعودون من السوق محملين بسلال من الحلفاء التي كانوا يحملونها بعزلة لكي لا يوسخوا مظاهرهم الأنيقة، كان آخرون يتجولون بدون هدف. كانت أمي قد أخرجت منصورية جميلة من الفوال الناعم، مزينة بخطوط من الساتان الأصفر. كانت قد غطت شعرها بمنديل أسود ينتهي بأهداب طويلة متعددة الألوان."}, {"fr": "La bouilloire chantait. Mes parents attendaient mon retour pour déjeuner.", "ar": "كان المرجل يئز. كان والداي ينتظران عودتي للغداء."}, {"fr": "Ma mère avait cuisiné une pile de galettes en pâte feuilletée, de forme carrée. Elle les enduisit de beurre frais et de miel. C’était un délice. Je pris deux grands verres de thé à la menthe. Pendant le repas, mes parents établirent un programme pour la journée. Le matin, mon père se propo- sait de m’emmener à Moulay Idriss, le patron de la ville. Après la prière en commun, nous reviendrions déjeuner. L’après-midi, j’accompagnerais ma mère chez notre amie Lalla Aicha. J’aurais le droit d’empor- ter avec moi l’une de mes trompettes; le tambour en poterie fragile risquait de se casser en route.", "ar": "كانت أمي قد حضرت كومة من الحلوى من العجين المورق، على شكل مربعات. كانت تدهنها بالزبدة الطرية و العسل. كانت شهية. شربت كأسين كبيرين من الشاي بالنعناع. أثناء الطعام، وضع والداي برنامجا للنهار. صباحا، اقترح أبي أن يصطحبني إلى مولاي إدريس، ولي المدينة. بعد صلاة الجماعة، كنا سنعود للغداء. بعد الزوال، كنت سأرافق أمي إلى منزل صديقتها لالة 84 عيشة؟ كنت سأستطيع أن آخذ معي أحد بوقي؛ كان طبل الفخار الهش معرضا للتكسر أثناء الطريق."}, {"fr": "Ma bonne étoile en décida autrement. Après avoir baguenaudé avec mon père dans les rues encom- brées de passants, après avoir fait l’acquisition d’un plat de céramique bleue sur la place des notaires où les potiers exposaient ce jour leur production, nous pénétrâmes dans le sanctuaire de Moulay Idriss. Là, nous accomplîmes les rites de la prière de Louli et nous partîmes déjeuner.", "ar": "كان لحسن طالعي رأي آخر. بعد أن تسكعت مع أبي في الشوارع التي تعج بالمارة، بعد شراء طبق من الخزف الأزرق في ساحة كتاب العدل التي كان بائعو الفخار يعرضون منتجاتهم فيها اليوم، دخلنا إلى مزار مولاي إدريس. قمنا هناك بطقوس صلاة الولي و ذهبنا للغداء."}, {"fr": "Lalla Aicha vint nous surprendre à la fin du repas. Ma mère manifesta une grande joie à la revoir. Les deux femmes se prodiguèrent mutuellement des baisers pointus, des formules de politesse et des mots aimables. Mon père les laissa à leurs effusions, disparut.", "ar": "جاءت لالة عيشة لتفاجئنا عند نهاية الطعام. عبرت أمي عن فرح كبير لرؤيتها من جديد. أغدقت المرأتان على بعضهما قبلات حارة، عبارات احترام و كلمات طيبة. تركهما أبي لإسهابهما، اختفى."}, {"fr": "J’avais une envie folle de jouer du tambour, de lancer quelques beuglements avec ma trompette mais je savais que ma mère ne tolérerait pas de tels débordements. Je m’abstins. J’attendais le soir pour me livrer corps et âme à la musique. Je restais dans un coin à écouter les propos de notre visiteuse. Elle laissa en- tendre dès son arrivée, qu’elle avait beaucoup à raconter. Ma mère disposait de tout son temps et frétillait de curiosité. Elle n’oublia pas, malgré tout, de remplir ses devoirs d’hôtesse. Elle souffla sur la braise, ajouta une bolée d’eau dans la bouilloire, rinça les verres. Elle ouvrit une boîte de fer blanc et en sortit une demi douzaine de gâteaux de semoule.", "ar": "كانت لدي رغبة شديدة في الضرب على الطبل، إطلاق بعض أصوات الصفير من بوقي لكنني كنت أعلم بأن أمي لن تسمح بمثل هذه النزوات. امتنعت عن ذلك. كنت أنتظر المساء لأستسلم للموسيقى روحا و جسدا. بقيت في ركن أسمع كلام زائرتنا. لمحت منذ وصولها إلى أن في جعبتها الكثير لتحكيه. كانت أمي متفرغة كليا و ترتعش من الفضول. لم تنسى، رغم كل شيء، القيام بواجبها كمضيفة. نفخت على الجمر، أضافت قدحا من الماء إلى المرجل، شطفت الكؤوس. فتحت علبة من التنك و أخرجت منها ستة قطع من حلوى السميد."}, {"fr": "- Lalla Aicha, installe- toi sur le grand divan; le thé sera bientôt prêt. Non! Non ! J’ai dit sur le grand divan, à la, place d’honneur! Je t’en supplie, installe-toi confortablement, insista ma mère.", "ar": "- أصرت أمي : لالة عيشة، اجلسي على الأريكة الكبيرة؛ سيكون الشاي جاهزا عما قريب. لا! لا! قلت على الأريكة الكبيرة، في مركز الشرف! أرجوك، اجلسي براحة."}, {"fr": "Lalla Aicha s’affala au milieu des coussins, soupira de satisfaction et commença son récit. Ce n’était pas à vrai dire un récit, mais une série d’événements accolés les uns aux autres. Parfois, les faits devenaient si compliqués que Lalla Aicha elle-même ne savait plus où elle en était. A ces moments, son visage se troublait, une sorte d’angoisse lui crispait les traits, ses yeux trahissaient une profonde inquiétude, mais bientôt un large sourire venait dissiper l’orage et Lalla Aïcha reprenait son monologue.", "ar": "ارتمت لالة عيشة بين الوسائد، تنهدت من الرضى و بدأت قصتها، في الواقع، لم تكن قصة حقيقية، لكن سلسلة أحداث موصولة ببعضها البعض. أحيانا، كانت الوقائع تصبح معقدة جدا لدرجة أن لالة عيشة نفسها كانت تنسى إلى أي حد وصلت. في تلك اللحظات، كان وجهها يرتبك، كان ما يشبه الخوف يقلص ملامحها، كانت عيناها تفضحان قلقا عميقا، لكن سرعان ما تأتي ابتسامة عريضة لتبدد العاصفة و تستأنف لالة عيشة مونولوجها."}, {"fr": "Ma mère subissait les mêmes tourments, communiait dans les mêmes joies, éprouvait les mêmes émo- tions que son amie. Elle ouvrait parfois la bouche comme pour lui venir en aide mais ne trouvant pas le mot qu’il fallait, ne disait rien.", "ar": "كانت أمي تتلقى نفس الآلام، تتحد في نفس الأفراح، تحس بنفس انفعالات صديقتها. كانت تفتح فمها أحيانا كما لو كانت ستساعدها لكن لعدم إيجادها الكلمة اللازمة، كانت تصمت."}, {"fr": "Certains passages de ce long tissu d’anecdotes insignifiantes me transportèrent de plaisir. Lalla Aicha raconta que dans la maison voisine de la sienne toutes les femmes, par un caprice du hasard, s’appelaient Khadija. Pour les différencier, on spécifiait la profession du mari : Khadija, la femme de l’épicier, Khadija, la femme du tailleur, Khadija, la femme du marchand de pétrole.", "ar": "85 كانت بعض المقاطع من شريط النوادر التافهة هذا تملأني بالسرور. حكت لالة عيشة بأنه في المنزل المجاور لخاصتها كان لجميع النساء، بمصادفة غريبة، اسم خديجة. للتمييز بينهن، كانت تحدد مهنة الزوج: خديجة، زوجة البقال، خديجة، زوجة الخياط، خديجة، زوجة بائع الزيت."}, {"fr": "Lalla Aïcha ajouta :", "ar": "أضافت لالة عيشة:"}, {"fr": "- Il serait plus simple de les appeler Khadija la sourde, Khadija la louchonne, Khadija la noire, tout le monde comprendrait de qui il s’agit.", "ar": "- كان سيكون من الأسهل مناداتهن بخديجة الصماء، خديجة الحولاء، خديجة السوداء، كان الجميع سيعرف بمن يتعلق الأمر."}, {"fr": "Nous rîmes de bon cœur à cette plaisanterie. Ma mère s’absenta quelques minutes. Elle revint avec un bouquet de sauge et d’absinthe. Elle entreprit de faire son thé des grands jours. Tout en versant l’eau bouillante dans la théière, elle interrogea Lalla Aicha.", "ar": "ضحكنا من أعماق قلبنا على هذه الدعابة. غابت أمي للحظات. عادت و معها باقة من القصعين و الأفسنتين. شرعت في تحضير شايها الخاص بالأيام العظيمة. بينما كانت تصب الماء الفوار في إبريق الشاي سألت لالة عيشة."}, {"fr": "- Comment va ton homme ? Parle-moi de ses affaires. A-t-il de nouveau un associé? Travaille-t-il tout seul?", "ar": "- كيف حال زوجك؟ حدثيني عن أعماله هل لديه شريك جديد؟ هل يعمل لوحده؟"}, {"fr": "- Il n’a pas d’associé, mais il ne travaille pas seul. Il emploie trois ouvriers. Les babouches se vendent bien et je n’ai pas le droit de me plaindre. Il m’a promis de m’acheter, au début de l’hiver, un caftan de drap abricot, objet que je désirais depuis si longtemps.", "ar": "- ليس له شريك، لكنه لا يعمل لوحده. إنه يوظف ثلاثة عمال. تباع البلغات جيدا و لا أستطيع التذمر. وعدني بأن يشتري لي، عند بداية فصل الشتاء، قفطانا من جوخ مشمشي، شيء كنت أتمناه منذ وقت طويل."}, {"fr": "- Louange à Dieu! Les difficultés finissent toujours par s’aplanir et les misères par tomber dans l’oubli. - Oui! soupira Lalla Aicha.", "ar": "- الحمد لله! تنتهي الصعوبات دائما بالتيسر و تقع المآسي في طي النسيان. - قالت لالة عيشة و هي تتنهد: أجل!"}, {"fr": "Ma mère attendit de nouvelles explications mais, subitement, son amie se taisait. La chose l’inquiéta.", "ar": "انتظرت أمي تفسيرات جديدة لكن صديقتها سكتت بشكل مفاجئ. أقلقها الأمر."}, {"fr": "- A quoi penses-tu, Lalla Aicha? Tu sembles triste. J’espère que tout va selon tes désirs dans ton ménage.", "ar": "- فيم تفكرين، يا لالة عيشة؟ تبدين حزينة. أتمنى بأن يكون كل شيء على ما يرام في أسرتك."}, {"fr": "Lalla Aicha soupira sans rien dire. Ma mère se versa un fond de verre de thé, le goûta. Elle parut satis- faite. Elle servit son invitée et me servit. Lalla Aicha parla enfin. Elle se pencha sur ma mère et lui chuchota à voix basse : - Nous sommes de bien faibles créatures, nous les femmes. Dieu seul est notre soutien et notre man- dataire. Gardons-nous bien de faire confiance aux hommes. Ils sont... Ils sont ...", "ar": "تنهدت لالة عيشة دون قول شيء. سكبت أمي قعر كأس من الشاي، تذوقته. بدت راضية. خدمت ضيفتها و خدمتني. تكلمت لالة عيشة أخيرا. انحنت على أمي و همست لها بصوت خافت: - نحن حقا مخلوقات ضعيفة، نحن النساء. إن الله وحده هو معيننا و وكيلنا. لا يجب أن نثق بالرجال. إنهم... إنهم..."}, {"fr": "Lalla Aicha ne trouva pas l’épithète juste, elle se contenta d’agiter ses mains à la hauteur de ses épaules et de lever les yeux au ciel.", "ar": "86 لم تجد لالة عيشة النعت المناسب، اكتفت بتحريك يديها عند ارتفاع كتفيها و رفع عينيها إلى السماء."}, {"fr": "Ma mère me permit de monter sur la terrasse jouer du tambour. Je compris que les deux femmes avaient des secrets à se communiquer et craignaient mes oreilles indiscrètes. J’étais ravi de l’aubaine. Je montai sur la terrasse. Seul dans ce vaste univers, je me livrai aux joies du rythme. J’inventais les com- binaisons les plus barbares. Je tapais sur les deux faces de parchemin de mon sablier en poterie, d’une baguette rageuse. Les murs multipliaient les sons.", "ar": "سمحت لي أمي بالذهاب إلى السطح لألعب بالطبل. فهمت بأن المرأتين كانتا تملكان أسرارا لتخبرا بعضهما بها و كانتا تخشيان أذني الفضوليتين. فرحت بالمصادفة السعيدة. صعدت إلى السطح. وحيدا في هذا العالم الواسع، كنت أستسلم لفرح الإيقاع. كنت أخترع الألحان الأكثر بربرية. كنت أضرب على كلا الوجهين الجلديين « لدربوكتي المزدوجة » الفخارية، بعصا غاضبة. كانت الجدران تضاعف الأصوات."}, {"fr": "Pendant ce temps, Lalla Aicha et ma mère, penchées l’une sur l’autre, papotaient, papotaient, papo- taient !... Le soir, des bouquets de femmes richement vêtues ornaient toutes les terrasses. Les tambourins réson- naient, les chants fusaient de partout. Le soleil en robe d’or s’attardait à l’horizon, baignait toute la ville de rose fané et de mauve délicat. La première étoile clignota. Ce fut le signal. Lalla Aicha embrassa ma mère et partit. La lampe à pétrole fut allumée. Nous étions sans entrain. Mon tambour et ma trompette gisaient sur un matelas. J’en étais dégoûté. Je retrouvai avec plaisir mes vieux vêtements. De mes habits neufs, je ne gardai que la chemise ; grâce à la chaleur de mon corps, son tissu s’était humanisé.", "ar": "خلال هذا الوقت، كانت أمي و لالة عيشة، تنحني الواحدة منهما على الأخرى، تثرثران، تثرثران، تثرثران!... في المساء، كانت مجموعات من النساء بملابس فاخرة تزين السطوح. كانت « الطعارج » ترن، كانت الغناءات تنهمر من كل مكان. كانت الشمس ما تزال في الأفق بلونها الأصفر، تغطي كل المدينة بلون وردي فاتح و خبازي لطيف. أومضت أول نجمة. قبلت لالة عيشة أمي و رحلت. أشعل قنديل الزيت. كنا بدون مرح. كان طبلي و بوقي موضوعين على أحد التخوت. كنت قد تقززت منهما. استعدت ملابسي القديمة بسرور. من بين ملابسي الجديدة، لم أحتفظ إلا بالقميص؛ بفضل حرارة جسمي، كان ثوبه قد أصبح لينا."}, {"fr": "Pour échapper au bruit des tambours qui bourdonnait encore sous mon crâne, j’ouvris ma Boîte à Merveilles. Mes yeux, hélas, n’avaient plus la force de regarder.", "ar": "لأهرب من صوت الطبول الذي كان ما يزال يدوي تحت جمجمتي، فتحت علبة العجائب خاصتي، للأسف! لم تعد عيناي تقويان على النظر. 87"}]}, {"fr_title": "Chapitre VIII", "ar_title": "الفصل 8", "segs": [{"fr": "Après les jours de liesse de l’Achoura, la vie reprit son cours normal, c’est-à-dire retomba dans sa gri- saille, retrouva sa monotonie. La chaleur commença à sévir. Des colonies de mouches envahirent la mai- son, la remplirent de leurs bourdonnements, l’ornèrent de leurs chiures. Les punaises qui sommeillaient dans les vieilles boiseries firent leur apparition. C’étaient de pauvres punaises épuisées par le jeûne et le froid de l’hiver. Elles étaient d’un brun poussiéreux et toutes plates, comme vidées de leur sang. Quand nous nous installâmes dans cette pièce, leur tribu jouissait d’une grande prospérité. Ma mère leur déclara une guerre totale. Elle utilisa tous les moyens pour en venir à bout. Elle employa des mé- thodes brutales: chaux vive, soufre, pétrole, usa de pratiques plus sournoises, talismans, poudres diverses achetées chez un faiseur de miracles, invocations. Seules quelques familles avaient résisté au massacre. Leurs membres dégénérés traînaient une existence lamentable le long des chevrons et des solives de notre plafond. Ils ne se reproduisaient plus et quand par inadvertance l’un d’eux s’aventurait loin des hauteurs, il se savait condamné. Venir à portée des doigts de l’homme était une manière de suicide, une façon comme une autre d’en finir, de fuir au plus vite ce monde et ses misères.", "ar": "بعد مرور أيام مرح عاشوراء، عادت الحياة إلى مجراها الطبيعي، أي عادت إلى تجهمها، استعادت رتابتها. بدأت الحرارة تشتد. غزت أسراب من الذباب البيت، ملأته بأزيزها، زينته ببرازها. حضر البق الذي كان يغفو في المنجور القديم. كان بقا مسكينا و متعبا من صيام و برد الشتاء. كان ذا لون بني مغبر و هزيلا للغاية، كما لو كان قد أفرغ من دمه. عندما جلسنا في هذه الغرفة، كانت قبيلتهم تتمتع بازدهار كبير. أعلنت أمي حربا شاملة عليهم. استعملت كل الوسائل لتنال منهم. استعملت أساليب عنيفة: جير حي، كبريت، زيت، قامت بممارسات أكثر مكرا، تعويذات، مساحيق متعددة اشترتها من عند صانع معجزات، أدعية. تمكنت بضع عائلات فقط من الإفلات من المجزرة. كانت أعضاؤها المنحلة تحافظ على وجود أليم على طول روافد و عوارض سقفنا. توقفوا عن التكاثر و عندما كان أحدهم يغامر سهوا بعيدا عن المرتفعات، كان يعلم بأنه لا أمل في نجاته. إن المجيء إلى متناول أصابع الإنسان كان طريقة للانتحار، طريقة مثل أخرى لإنهاء الأمر، للهروب بأسرع ما يمكن من هذا العالم و هذه المآسي."}, {"fr": "Cependant les mouches prospéraient de jour en jour. Tous les matins, ma mère les chassait à grands coups de torchon. Elles sortaient par la fenêtre avec des bourdonnements de colère. Le rideau déplié, nous étions à l’abri de ces déplaisantes bestioles. Quelques-unes plus rusées continuaient à faire des rondes dans la pénombre de la pièce.", "ar": "إلا أن الذباب كان يزداد من يوم لآخر. كل صباح، كانت أمي تطردهم بضربات عديدة من الفوطة. كانوا يخرجون من النافذة بأزيز من الغضب. ببسط الستارة، كنا في مأمن من هذه الدويبات المنغصة. كان بعضها الأكثر مكرا يتابع القيام بجولات في ظليل الغرفة."}, {"fr": "Dès la première journée de chaleur, ma mère enleva la natte de jonc, la roula et la cacha derrière le lit. Les matelas reposaient directement sur le sol lavé à grande eau.", "ar": "منذ اليوم الأول من الحرارة، خلعت أمي حصير الأسل، لفته و خبأته خلف السرير. كانت الأفرشة موضوعة مباشرة على الأرض التي تم غسلها بالكثير من الماء."}, {"fr": "Les journées devinrent longues. La salle du Msid, jugée trop chaude et trop étroite, fut abandonnée. Nous déménageâmes un matin nos planchettes et nos encriers et l’école fut installée dans un petit sanc- tuaire deux pas plus loin. Ce mausolée abritait la tombe d’un saint. Les gens du quartier ignoraient son nom mais les jeunes filles qui désiraient se marier dans l’année venaient le jeudi faire sept fois le tour du tombeau. D’autres personnes étaient enterrées dans cette grande salle d’une fraîcheur de paradis.", "ar": "أصبحت الأنهر طويلة، تم هجر قاعة المسيد نظرا لكونها حارة جدا و ضيقة جدا. نقلنا ألواحنا و محبراتنا ذات صباح و جهزنا الكتاب في مزار يقع على بعد خطوات. كان هذا الضريح يؤوي قبر ولي. كان سكان الحي يجهلون اسمه لكن الشابات اللواتي كن يرغبن في الزواج كن يأتين يوم الخميس و يقمن بالدوران سبع مرات حول القبر. كان هناك أشخاص آخرون مدفونون في هذه القاعة الكبيرة ذات برودة الجنة."}, {"fr": "Une niche dans un coin indiquait la direction de l’Orient, Dès le premier jour, à l’appel du muezzin, le fqih nous imposa silence. Il nous envoya faire nos ablutions à la petite fontaine circulaire qui chantonnait dans un coin. Petits et grands, alignés derrière notre maître, nous nous acquittâmes avec gravité du devoir de tout bon musulman : la prière rituelle. Deux fois par jour, pendant tout l’été, les mêmes cérémonies eurent lieu.", "ar": "88 كانت مشكاة في أحد الزوايا تحدد اتجاه الشرق، منذ اليوم الأول، عند نداء المؤذن، أمرنا الفقيه بالصمت. أرسلنا لنتوضأ في النافورة الصغيرة الدائرية التي كانت تخر في إحدى الزوايا. صغارا و كبارا، مصطفين خلف معلمنا، قمنا باتزان بواجب كل مسلم صالح: الصلاة المفروضة. تكررت هذه الطقوس مرتين في اليوم، طوال فصل الصيف."}, {"fr": "Le changement de décor, la lumière si douce qui tombait des ouvertures latérales, une certaine bien- veillance sur le visage du fqih eurent un effet très heureux sur ma santé, physique et morale. Je me mis à aimer l’école. Ma mémoire fit des miracles. De dix lignes sur ma planchette, je passai à quinze. Je n’éprouvais aucune difficulté à les apprendre.", "ar": "كان لتغيير الديكور، النور الخافت الذي كان يسقط من الفتحات الجانبية و نوع من التعاطف على وجه الفقيه أثر جيد جدا على صحتي، المادية و المعنوية. بدأت أحب الكتاب، قامت ذاكرتي بمعجزات. انتقلت من عشرة سطور على لوحي إلى خمسة عشر. لم أجد أية صعوبة في حفظها."}, {"fr": "Un vendredi, mon père, gonflé d’orgueil, raconta à ma mère la conversation qu’il avait eue la veille avec mon maître rencontré dans la rue. Le fqih lui avait assuré que, si je continuais à travailler avec autant de cœur et d’enthousiasme, je deviendrais un jour un savant dont il pourrait être très fier.", "ar": "في يوم من أيام الجمعة، حكى أبي، مفعما بالفخر، لأمي الحديث الذي دار بينه وبين معلمي الذي التقى به في الشارع في اليوم السابق. كان الفقيه قد أكد له بأنني، إذا تابعت العمل بهذا الاجتهاد و الحماسة، سأصبح يوما ما عالما يمكنه أن يكون فخورا جدا به."}, {"fr": "Certes, ce n’était pas le but que je poursuivais. Le mot savant évoquait pour moi l’image d’un homme obèse à figure très large frangée de barbe, aux vêtements amples et blancs, au turban monumental. Je n’avais aucune envie de ressembler à un tel homme.", "ar": "صحيح بأن ذلك لم يكن الهدف الذي كنت أسعى إليه. كانت كلمة عالم تذكرني بصورة رجل بدين بوجه عريض جدا تعمه اللحية، بملابس فضفاضة و بيضاء، بعمامة ضخمة. لم تكن لدي أدنى رغبة في أن أشبه مثل هذا الرجل."}, {"fr": "J’apprenais chaque jour ma leçon parce qu’il me semblait que mes parents m’en aimaient davantage et surtout j’évitais ainsi la rencontre avec la lancinante baguette de cognassier. Je m’étais tracé un vague programme: jusqu’au déjeuner, j’apprenais avec ferveur les versets, tracés sur ma planchette, l’après-midi, je m’accordais deux bonnes heures de rêve, tout en faisant semblant de scander les paroles sacrées.", "ar": "كنت أحفظ درسي كل يوم لأنه كان يبدو لي بأن ذلك يجعل والدي يحبانني أكثر و بالخصوص لأن ذلك كان يجنبني لقاء عصا السفرجل الواخزة. كنت قد وضعت لنفسي برنامجا ملتبسا: حتى الغداء، كنت أحفظ الآيات المرسومة على لوحي بورع، بعد الزوال، كنت أمنح نفسي ساعتين كاملتين من النوم، بينما أتظاهر بتجويد الكلمات المقدسة."}, {"fr": "A cette récréation, je devais tout mon entrain. Mon esprit s’échappait des étroites limites de l’école et s’en allait explorer un autre univers, là il ne subissait aucune contrainte. Dans cet univers, je n’étais pas toujours un petit prince, auquel obéissaient les êtres et les choses, il m’arrivait parfois de devenir homme, l’homme que je souhaitais être plus tard. Je me voyais simple et robuste, portant des vêtements en laine grège, les yeux pleins de flamme et le cœur débordant de tendresse.", "ar": "كنت أدين بكل مرحي لهذه الاستراحة. كانت روحي تهرب من حدود الكتاب الضيقة و تذهب لتستكشف عالما آخر، لم تكن معرضة لأية إكراهات هناك. في ذلك العالم، لم أكن دائما أميرا صغيرا تطيعه الكائنات و الأشياء، كنت أحيانا أصبح رجلا، الرجل الذي كنت أرغب في أن أتحول إليه فيما بعد. كنت أرى نفسي بسيطا و قويا، ألبس ملابس من الصوف الحريري، بعينين مليئتين باللهب و قلب يفيض حنانا."}, {"fr": "La nuit, sous ma couverture, je poursuivais le même songe. Je construisais et reconstruisais ma vie avec ses multiples aventures, ses rencontres, ses actions d’éclat, ses inévitables obstacles, jusqu’au moment où d’immenses îlots noirs venaient séparer les éléments patiemment ajustés et rendre au chaos ce monde à peine naissant. Tout se brouillait. Dans le noir de la nuit, surgissaient de temps à autre, comme emportés par le remous, les fragments épars de mon univers. Le matin je reprenais mes occupations. Nous étions un lundi, lorsque mon père, renonçant à ses habitudes, vint déjeuner à la maison. Il nous expliqua que les djellabas de laine se vendaient moins bien qu’en hiver et qu’il avait l’intention de se lan- cer dans la fabrication des haïks de coton. Ces étoffes jouissent toujours du même succès.", "ar": "في الليل، تحت غطائي، كنت أستأنف نفس المنام. كنت أبني و أعيد بناء حياتي بمغامراتها المتعددة، لقاءاتها، حركاتها اللامعة، عوائقها الحتمية، 89 حتى اللحظة التي تأتي فيها بقع سوداء عملاقة لتفريق العناصر المكيفة بأناة و إحداث الفوضى في هذا العالم الذي بدأت ولادته للتو. كان كل شيء يتبعثر. في ظلام الليل، كانت أجزاء عالمي المشتتة تظهر من حين لآخر، كما لو كانت الدوامة قد حملتها. كنت أعود لأشغالي في الصباح. كان يوم إثنين، عندما غير أبي من عاداته و جاء للغداء في البيت. شرح لنا بأن جلابيب الصوف كانت أقل رواجا من فصل الشتاء و بأنه كان ينوي البدء بإنتاج حوايك القطن."}, {"fr": "Été comme hiver, les femmes de Fès ne peuvent sortir qu’enveloppées dans ces pièces blanches. - Aujourd’hui, ajouta-t-il, j’ai l’intention de vous emmener tous les deux au souk des bijoux. Et s’adressant à ma mère, il continua:", "ar": "كانت هذه الأقمشة تلقى نفس الإقبال دائما. صيفا و شتاء، لا تستطيع نساء فاس الخروج إلا ملفوفات بهذه القطع البيضاء. - أنا أنوي اليوم أن أصطحب كليكما إلى سوق المجوهرات."}, {"fr": "- Il y a longtemps que tu me demandes ces bracelets soleil et lune (or et argent). Il est temps que je te les offre. D’autre part, mon ouvrier a perdu sa mère qui habitait la campagne. Il est parti pour l’enterrement ; demain, il sera de retour et nous reprendrons le travail. Ma mère interrogea.", "ar": "- منذ مدة و أنت تطلبتن مني تلك الأساور المسماة شمس و قمر ( ذهب و فضة ). حان الوقت لأهديها لك. من جهة أخرى، لقد فقد عاملي والدته التي تعيش في البادية. لقد ذهب لحضور مراسم الدفن؛ سيعود في الغد و سنتابع العمل."}, {"fr": "- Est-elle morte d’une maladie? - Je crois, dit mon père, qu’elle est morte surtout de vieillesse, mais peu importe, que Dieu la reçoive dans sa miséricorde !", "ar": "سألت أمي: - هل ماتت بمرض ما؟ - قال أبي: أظن بأنها ماتت بالخصوص لكبرها في السن، لكن لا يهم، فليرحمها الله!"}, {"fr": "- Mais, objectai-je, je ne peux pas manquer le Msid pour vous accompagner au souk des bijoux, j’ai ma leçon à apprendre.", "ar": "- اعترضت: لكنني لا أستطيع التغيب عن المسيد لمرافقتكم إلى سوق المجوهرات، لدي درسي لأحفظه."}, {"fr": "- Ne te tourmente pas, répondit mon père. En passant, j’ai vu le fqih, je l’ai prévenu de ton absence. Tu travailles bien, cette demi-journée de repos sera une juste récompense. Mais peut-être n’aimes-tu pas voir de jolis bijoux et l’animation des enchères ?", "ar": "- أجاب أبي: لا تشغل بالك. لقد قابلت الفقيه في طريقي و أعلمته بغيابك. أنت تعمل جيدا، سيكون نصف اليوم من الراحة هذا مكافئة مستحقة لك. لكن ربما كنت لا تريد رؤية مجوهرات جميلة و إجراء المزاد؟"}, {"fr": "- Oh si ! Les bijoux c’est beau, c’est beau comme… Je n’osai pas poursuivre ma comparaison. Mon père m’encouragea :", "ar": "- أوه بلى! إن المجوهرات جميلة، جميلة مثل... لم أجرؤ على إكمال تشبيهي. شجعني أبي:"}, {"fr": "- Beau comme quoi ? Je baissai les yeux et, d’une voix de confidence, je dis timidement :", "ar": "- جميلة مثل ماذا؟ أخفضت نظري و، بصوت خافت، قلت بخجل:"}, {"fr": "- Les bijoux, c’est beau comme les fleurs.", "ar": "- إن المجوهرات جميلة مثل الأزهار."}, {"fr": "Mon père et ma mère éclatèrent de rire. Je trouvai leur réaction déplacée. Un doute se glissa en moi sur la qualité de leur intelligence.", "ar": "قهقه أبي و أمي. بدت لي ردة فعلهما غير مناسبة. تسرب شك إلى نفسي حول مستوى ذكائهما."}, {"fr": "Le déjeuner fini, j’allai m’asseoir dans l’escalier en attendant l’heure des enchères aux bijoux. Accroupi sur une marche, les mains sur les genoux, je réfléchis très profondément à la conversation du déjeuner. Comparer des bijoux à des fleurs, était-ce signe de stupidité? Le rire de mes parents traduisait cette in- dulgence que les grandes personnes manifestent devant les enfants qui leur tiennent des propos niais ou puérils. Je sentais que ma comparaison exprimait une idée essentielle. Elle devait être accueillie par le silence. Le rire en une telle circonstance devenait une incongruité.", "ar": "90 بعد الغداء، ذهبت لأجلس في الدرج بانتظار وقت مزاد المجوهرات. مقرفصا على إحدى الدرجات، واضعا يدي على ركبتي، فكرت بعمق في حديث الغداء. مقارنة مجوهرات بأزهار، أكان هذا دليلا على البلادة؟ كانت ضحكات والدي تعبر عن التساهل الذي يبديه الأشخاص الكبار مع الأطفال الذين يقولون لهم كلاما فارغا و صبيانيا. كنت أحس بأن تشبيهي كان يعبر عن فكرة مهمة. كان من الواجب استقبالها بالصمت. كان الضحك في ظرف مماثل يعتبر فظاظة."}, {"fr": "Je connaissais quelques fleurs : les soucis et les coquelicots qui s’épanouissent au printemps sur les tombes, les marguerites dodues qui offrent au soleil leurs cœurs d’or, les liserons qui se redressent sous nos pas lorsque, par une belle journée, mon père m’emmenait sur les collines de Bab Guissa.", "ar": "كنت أعرف بعض الأزهار: الآذريون و الخشخاش التي تتفتح في فصل الربيع على القبور، الأقحوان البدين الذي يهب للشمس قلوبه الذهبية، اللبلاب الذي يعتدل تحت أقدامنا عندما كان أبي يأخذني إلى تلال باب كيسة في نهار جميل."}, {"fr": "Sur la terrasse de notre maison, poussaient dans des fragments de poteries, du géranium rosat, des œillets et des roses d’Ispahan.", "ar": "على سطح بيتنا، كانت إبرة الراعي، القرنفل و ورود الأصفهان تنبت في قطع من الفخار."}, {"fr": "Mes connaissances en bijoux étaient moins étendues. J’en avais pourtant vu de somptueux à l’occasion des fêtes sur les femmes et sur les petites filles. Je les classais en deux catégories : les bijoux de tous les jours en argent gris bleu qui me fascinaient et les bijoux de fête rutilants de pierreries. Ceux-ci, forgés par les mains des génies dans des palais souterrains, gardaient encore dans leur miroitement et leur couleur de soleil, le souvenir des flammes où leur matière avait coulé. Pour moi, tous ces bijoux de fête provenaient de trésors cachés, avaient appartenu en des temps immémoriaux à des princesses de rêve dont le souvenir s’était oublié. Il fallait être niais, il fallait être puéril pour croire que ces délicates architectures d’or et de pierres précieuses fussent l’œuvre de quelque artisan besogneux, pressé de les exécuter pour les échanger contre une vile monnaie. Ces ornements magiques naissaient gratuitement par le pouvoir de l’amour. Ils venaient se poser sur les cheveux et sur la chair délicate des princesses de légende. Sous les pas de ces mêmes princesses naissaient aussi gratuitement mais en une matière plus fragile, d’autres bijoux. S’épa- nouissent alors des champs de coquelicots, éclatent les boutons d’or et les soucis, répandent leur parfum les violettes et les iris.", "ar": "كانت معرفتي بالمجوهرات محدودة. إلا أنني رأيت باذخة منها في الحفلات على النساء و الفتيات. كنت أصنفها إلى فئتين: مجوهرات كل الأيام من الفضة الرمادية الزرقاء التي كانت تفتنني و مجوهرات الحفلات البراقة بالحجيرات الكريمة. كانت هذه الأخيرة، المطرقة بأيدي العباقرة في قصور موجودة تحت الأرض، ما تزال تحتفظ، داخل تألقها و لون الشمس خاصتها، بذكرى النيران التي أذابت مادتها. بالنسبة لي، كانت كل مجوهرات الحفلات هذه قادمة من الكنوز الدفينة، كانت تخص أميرات أحلام نسيت ذكراهم منذ زمن بعيد. كان من اللازم أن يكون المرء ساذجا أو صبيانيا ليصدق بأن هندسة الذهب الدقيقة هذه كانت من عمل صانع تقليدي مجتهد، مستعجل لإتمامها من أجل مقايضتها مقابل عملة مقيتة. كانت هذه الحلي السحرية تخلق من العدم بقوة الحب. كانت تأتي لتوضع على الشعر أو البدن الناعم لأميرات الأسطورة. كانت مجوهرات أخرى تخلق من العدم كذلك تحت خطوات هذه الأميرات نفسها إلا أنها كانت مصنوعة من مادة هشة. هكذا كانت تزهر حقول من الخشخاش، يشرق الحوذان و الآذريون، ينشر البنفسج و السوسن عطرهما."}, {"fr": "A six ans, je ne pouvais formuler de telles considérations sur les bijoux et sur les fleurs, aucune disci- pline ne m’avait appris encore à classer méthodiquement mes idées. Mon vocabulaire était trop pauvre pour mettre au jour ce qui grouillait confusément en moi. C’était, je crois, cette impossibilité de faire part aux autres de mes découvertes, qui avait fait naître en moi une douloureuse mélancolie. Je pardon- nais aux grandes personnes de me gronder, au besoin de me frapper pour une futilité, mais je leur en voulais à mort de ne pas essayer de me comprendre.", "ar": "في سن السادسة، لم أكن أستطيع أن أعبر عن آراء مشابهة عن المجوهرات و الأزهار، لم يكن أي نظام قد علمني بعد كيف أنظم أفكاري 91 بشكل منهجي. كان معجمي ما يزال قليلا لكي أجدد ما يعج به ذهني بشكل مشوش. كان، على ما أظن، هذا العجز عن مشاركة الآخرين باكتشافاتي هو من ولد في كآبة مؤلمة. كنت أسامح الأشخاص الكبار على توبيخي، على الحاجة إلى ضربي لارتكابي لحماقة ما، لكنني كنت أحقد عليهم حقدا شديدا لعدم محاولتهم فهمي."}, {"fr": "Pour ma mère, j’étais un garçon parfait si je me lavais les pieds avant d’entrer dans la pièce; pour mon père, j’étais un objet de fierté si le vendredi je copiais ses gestes pour faire la prière rituelle; pour les voisins j’étais un enfant modèle si je ne traçais pas de graffiti sur les murs de l’escalier, si je ne faisais pas de bruit en jouant sur la terrasse. Je serais devenu un monstre de stupidité si j’avais essayé de les initier aux mystères de mon univers particulier. J’avais compris instinctivement les ruses qu’il fallait employer pour vivre en paix avec tous ces hommes et toutes ces femmes qui se prennent au sérieux et sont gonflés à éclater de leur supériorité. Accroupi sur la marche, les mains sur les genoux, je me répétais inlassablement: « Les bijoux, c’est beau comme les fleurs».", "ar": "بالنسبة لأمي، كنت ولدا ممتازا إن كنت أغسل قدمي قبل الدخول إلى الغرفة؛ بالنسبة لأبي، كنت محط فخر إن كنت أقلد حركاته يوم الجمعة لأداء الصلاة المفروضة؛ بالنسبة للجيران، كنت طفلا مثاليا إن لم أرسم جرافيتي على جدران الدرج و إن لم أحدث ضجة عند لعبي في السطح. كنت لأصبح وحشا من البلادة لو حاولت إطلاعهم على أسرار عالمي الخاص. كنت قد تعلمت على نحو غريزي الحيل التي يجب استعمالها للعيش بسلام مع كل هؤلاء الرجال و كل هؤلاء النساء الذين يتكبرون و يفيضون بتعاليهم. مقرفصا على إحدى الدرجات، واضعا يدي على ركبتي، كنت أردد بدون كلل: « المجوهرات جميلة مثل الأزهار »."}, {"fr": "Sur le palier, ma mère et Fatma Bziouya chuchotaient depuis un quart d’heure. De temps à autre, la voix de ma mère éclatait sur un ton de colère pour chasser le chat de Zineb qui rôdait autour d’elle.", "ar": "في البسطة، كانت أمي و فاطمة بزيوية تتهامسان منذ ربع ساعة. من حين لآخر، كان صوت أمي يرتفع بنبرة غاضبة لطرد قط زينب الذي كان يتسكع حولها."}, {"fr": "- Va-t’en, lui disait-elle, galeux, sale comme un rat d’égout, va-t’en promener tes puces ailleurs.", "ar": "- كانت تقول له: إرحل، أيها الأجرب، الوسخ مثل جرذ المجاري، إذهب لتنزه قرادك في مكان آخر."}, {"fr": "Les chuchotements reprenaient. Un rire étouffé, quelques soupirs pleins d’onction, et chacune des femmes se dirigea vers ses appartements. Mon père passa près de moi :", "ar": "كانت الهمسات تستأنف. ضحكة مكتومة، بعض التنهدات المليئة بالنفاق، و اتجهت كل واحدة من النساء إلى شقتها. مر أبي بجانبي:"}, {"fr": "- Continue à jouer, me dit-il; après la prière de l’Aâsser, je reviendrai vous chercher ta mère et toi. - Que fais-tu dans l’escalier? cria ma mère à la cantonade.", "ar": "- قال لي: تابع اللعب، سأعود بعد صلاة العصر لاصطحابك أنت و أمك. - صاحت أمي بصوت عال: ماذا تفعل عند الدرج؟ أجبتها بصوت منافق:"}, {"fr": "D’une voix hypocrite, je répondis: - Je joue.", "ar": "- ألعب. - كرر الصوت: ماذا تلعب؟"}, {"fr": "- A quoi joues-tu? répéta la voix. -Au roi. - Je me demande, dit ma mère, prenant à témoin toute la maison, ce que peut faire un roi dans l’esca- lier, accroupi sur une marche!", "ar": "- ألعب الملك. - قالت أمي و هي تشهد جميع من في المنزل: أنا أتساءل ما الذي يمكن أن يفعله ملك عند الدرج و هو مقرفص على إحدى الدرجات!"}, {"fr": "Les voisines se mirent à rire.", "ar": "92 بدأت الجارات بالضحك."}, {"fr": "La femme du fabricant de charrues trouva spirituel d’ajouter: - Lalla Zoubida, ton fils ira loin, il se prend déjà pour un roi ! Sa phrase, nuancée d’une pointe d’insolence, resta sans écho.", "ar": "وجدت زوجة صانع المحاريث أن من الظريف إضافة: - لالة زبيدة، سيكون لابنك مستقبل باهر، إنه يظن نفسه ملكا منذ الآن! بقيت جملتها التي تعلوها بعض الوقاحة بدون رد."}, {"fr": "Je retombai dans mes réflexions. Et s’il me plaisait à moi d’être roi ! Que peut comprendre la femme d’un fabricant de charrues aux princes et aux rois ? Qu’elle se contente d’éplucher ses légumes, de piler ses épices, de se lamenter sur le prix de l’huile et du charbon qui a subi une hausse d’un sou! Elle n’avait point l’âme d’une princesse, elle n’avait jamais rêvé du bruit des jets d’eau dans les vasques de marbre! Elle n’avait jamais fait le moindre rapprochement entre la beauté des bijoux et celle des fleurs. Elle portait toujours au petit doigt une méchante bague de cuivre ornée d’un cabochon de verre. Les jours de fête, elle accrochait sur sa poitrine, à une boutonnière de sa tunique, une main d’argent aux gravures frustes. Ce soir, ma mère aura aux poignets des bracelets soleil et lune Rahma sera verte de jalousie. Pendant plusieurs jours, je l’entendrai dire sans gaîté: - Je n’ai pas de chance, j’ai épousé un malheureux fabricant de charrues ; il est à peine capable de m’offrir une corde pour sortir l’eau du puits. Ah ! Allah a bien mal départagé les humains. A celle-ci les souffrances et la misère, à d’autres la prospérité, la bonne nourriture, les bijoux d’or et d’argent. Mon Dieu ! Quand finira ma peine?", "ar": "سرحت بتفكيري مجددا. و إن كنت أريد أن أصير ملكا! ماذا يمكن لزوجة صانع محاريث أن تفهم في الأمراء و الملوك؟ فلتكتفي بتقشير خضرها، دق توابلها، النحيب على ثمن الزيت و الفحم الذي ارتفع ثمنه بفلس! لم تكن لديها روح أميرة إطلاقا، لم يسبق لها أن حلمت بنافورة داخل حوض من الرخام! لم تقم في حياتها بأدنى مقاربة بين جمال المجوهرات و الخاص بالأزهار. كانت تلبس دائما في إصبعها الصغير خاتما شريرا من النحاس مزين بحجر زجاجي. في أيام الحفلات، كانت تعلق على صدرها، في عروة تونيكها، يدا من الفضة بنقوش خشنة. هذا المساء، ستلبس أمي في رسغيها سواري شمس و قمر. ستكون رحمة شاحبة من الغيرة. طوال أيام عديدة، سأسمعها تقول بدون مرح: - لست محظوظة، لقد تزوجت صانع محاريث مسكين؛ إنه بالكاد يستطيع إهدائي حبلا لأسحب به الماء من البئر. آه! لم يحسن الله الفصل بين الناس. أعطى لهذه المعاناة و البؤس، و للأخريات الازدهار، الطعام الجيد، المجوهرات الذهبية و الفضية. يا إلاهي! متى سينتهي عذابي؟"}, {"fr": "Ma mère lui répondra avec une courtoisie appuyée:", "ar": "ستجيبها أمي بلباقة بالغة:"}, {"fr": "- Ma sœur, à quoi sert de se plaindre et d’accuser le destin ? Dieu est juste, il donne à chacun selon son cœur.", "ar": "- أختي، فيم ينفع التذمر و لوم القدر؟ إن الله عادل، يعطي لكل واحد حسب نيته."}, {"fr": "- Il n’y a de Dieu que Dieu! diront toutes les voisines.", "ar": "- ستقول جميع الجارات: لا إلاه إلا الله!"}, {"fr": "Certes, il n’y a de Dieu que Dieu! J’entendis le muezzin le proclamer.", "ar": "بالطبع، لا إلاه إلا الله! سمعت المؤذن يعلنها."}, {"fr": "- Est-ce la prière de l’Aâsser, maman?", "ar": "- هل هذا آذان العصر، يا أمي؟"}, {"fr": "- Oui, ton père ne va pas tarder à rentrer. Tiens, tu vas changer ta djellaba pour sortir, celle que tu portes est pleine de taches.", "ar": "- أجل، سيعود أبوك عما قريب. خذ، ستغير جلبابك للخروج، إن الذي تلبسه مليء بالبقع."}, {"fr": "Le petit balai de doum crissait dans la chambre de Fatma Bziouya, il s’arrêta brusquement. Notre voi- sine franchit à pas furtifs le palier, introduisit sa tête dans notre pièce et demanda à mi-voix.", "ar": "كانت مكنسة الدوم الصغيرة تصر في غرفة فاطمة بزيوية، توقفت بشكل مفاجئ. اجتازت جارتنا البسطة بخطوات خفية، أدخلت رأسها في غرفتنا و سألت بصوت خافت."}, {"fr": "- Dois-je aussi me préparer?", "ar": "- هل يجب أن أستعد أيضا؟"}, {"fr": "Ma mère dut faire un signe affirmatif. Fatma se précipita dans sa chambre. Le couvercle d’un coffre claqua.", "ar": "93 لا بد من أن أمي قامت بإشارة إيجابية. أسرعت فاطمة إلى غرفتها. صفق غطاء صندوق."}, {"fr": "Au rez-de-chaussée, la voix de mon père émit la phrase habituelle:", "ar": "في الطابق الأرضي، نطق صوت أبي الجملة المعتادة:"}, {"fr": "- N’y a-t-il personne? Puis-je passer ?", "ar": "- ألا يوجد أحد؟ هل أستطيع الدخول؟"}, {"fr": "Lalla Kanza, du fond de son temple noir de la fumée des aromates, lui répondit:", "ar": "أجابته لالة كنزة من آخر معبدها الأسود المليء بدخان البخور:"}, {"fr": "- Passe, maalem Abdeslem.", "ar": "- أدخل، معلم عبد السلام."}, {"fr": "Son pas résonna dans l’escalier. Je quittai ma marche et j’allai me changer.", "ar": "سمع وقع خطواته في الدرج. تركت درجتي و ذهبت لأغير ملابسي."}, {"fr": "Le souk des bijoutiers ressemblait à l’entrée d’une fourmilière. On s’y bousculait, on s’affairait dans toutes les directions. Personne ne semblait se diriger vers un but précis. Ma mère et Fatma Bziouya nous suivaient, mon père et moi, à petits pas, étroitement enveloppées dans leurs haïks blancs. Elles discutaient à mi-voix à qui mieux mieux. Les boutiques très surélevées offraient à nos yeux le clinquant des bijoux d’argent tout neufs qui semblaient coupés dans du vulgaire fer-blanc, des diadèmes et des ceintures d’or d’un travail si prétentieux qu’ils en perdaient toute noblesse, ces bijoux ne ressemblaient point aux fleurs. Aucun mystère ne les baignait. Des mains humaines les avaient fabriqués sans amour pour contenter la vanité des riches. Ils avaient raison, tous ces boutiquiers, de les vendre au poids, comme des épices. J’en avais mal au cœur. De nombreux chalands s’agitaient d’une boutique à l’autre. Leurs yeux luisaient d’avi- dité et de convoitise. D’autres personnages, hommes et femmes, groupés ça et là, refoulaient leurs larmes. Plus tard, j’ai saisi tout le sens de leur mélancolie. J’ai senti moi-même cette humiliation de venir offrir à la rapacité indifférente des hommes ce qu’on tenait pour son bien le plus précieux. Des bijoux auxquels s’attachaient des souvenirs, des ornements de fête qui prenaient part à toutes nos joies deviennent sur un marché comme celui-ci de pauvres choses qu’on pèse, qu’on renifle, qu’on tourne et qu’on retourne entre les doigts pour finalement en offrir la moitié de leur prix réel.", "ar": "كان سوق المجوهرات يشبه مدخل قرية النمل. كان هناك تدافع، كان الجميع منهمكين في كل الاتجاهات. لم يكن يبدو بأن هناك من يتجه إلى هدف محدد. كانت أمي و فاطمة بزيوية تتبعاننا، أنا و أبي، بخطوات بطيئة، ملفوفتين بإحكام داخل حايكيهما الأبيضين. كانتا تتحدثان بصوت خافت عن من الأفضل. كانت الدكاكين المرتفعة تعرض أمام أعيننا بريق مجوهرات الفضة الجديدة التي كانت تبدو مقطعة في تنك سوقي، تيجان و أحزمة ذهبية ذات عمل متغطرس جدا كان يفقدها كل نبلها، لم تكن هذه المجوهرات تشبه الأزهار على الإطلاق. لم يكن يكسوها أي غموض. كانت أيد بشرية قد صنعتها بدون حب لإرضاء غرور الأغنياء. كانوا على حق، كل هؤلاء الحانوتيين، ببيعها بالوزن، مثل التوابل. كان هذا يشعرني بالغثيان. كان العديد من الزبائن ينتقلون من دكان إلى آخر. كانت أعينهم تلمع من الشراهة و الطمع. كانت هناك شخصيات أخرى، رجال و نساء، متجمعون هنا و هناك، يكبتون دموعهم. فيما بعد، فهمت المعنى الكامل لكآبتهم. لقد أحسست بنفسي بهذا الإذلال الذي يخلقه المجيء لإعطاء جشع الرجال اللامبالي ما كنا نعتبره من أعز أملاكنا. مجوهرات ارتبطت بها ذكريات، حلي حفلات كانت تشاركنا جميع أفراحنا تصبح في سوق مثل هذا أشياء تافهة توزن، تشتم، تدار و تقلب بين الأصابع ليدفع نصف ثمنها الحقيقي في الأخير."}, {"fr": "Dès notre arrivée, des courtiers ou dellals vinrent nous proposer divers articles. Mon père les regardait à peine. Il les refusait d’un signe de tête. Derrière nous, appuyées au mur, les femmes chuchotaient. Le temps me sembla très long avant que mon père finît par prendre, des mains d’un grand diable aux yeux extatiques qui énonçait à perdre haleine un chiffre quelconque, une paire de bracelets tout en cabochons pyramidaux, l’un or et l’autre argent. Il les passa à ma mère qui les examina attentivement, les essaya quatre ou cinq fois, pria Fatma Bziouya de se les passer au poignet pour en admirer l’effet. Elle en discuta pendant un quart d’heure chaque détail. Puis ma mère les rendit à mon père sans explication. Le courtier continuait à répéter mécaniquement le chiffre qui devait représenter le prix de cette marchandise. Mon père lui tendit les bijoux, fit un signe affirmatif. Le chiffre se modifia et le grand diable de dellal plongea dans la foule. Sa main seule voyagea un moment avec les bracelets au-dessus des têtes et finit par dispa- raître.", "ar": "ما إن وصلنا، جاء سماسرة أو دلالون ليقترحوا علينا عدة سلع. كان أبي بالكاد ينظر إليها. يرفضها بتحريك رأسه. كانت المرأتان تتهامسان خلفنا و هما تستندان إلى الجدار. بدا لي الوقت بطيئا جدا قبل أن ينتهي أبي 94 بأخذ، من يدي شيطان كبير بعينين منتشيتين كان ينادي بأعلى صوته بأي رقم كان، زوج أساور تملأه الأحجار الهرمية، أحدها ذهبي و الآخر فضي. أعطاها لأمي التي عاينتها بإمعان، جربتها أربع أو خمس مرات، رجت فاطمة بزيوية أن تضعها على رسغيها لترى مظهرها. ناقشت كل تفصيل لمدة ربع ساعة. ثم أعادتها أمي لأبي دون تفسير. كان السمسار يتابع آليا تكراره للرقم الذي يمثل ثمن هذه البضاعة. مد له أبي المجوهرات، قام بإشارة إيجابية. تغير الرقم و غاص الشيطان الكبير السمسار بين الحشد. كانت يده فقط هي التي تظهر و هي تتحرك فوق الرؤوس ممسكة بالسوارين ثم انتهت بالاختفاء."}, {"fr": "Nous attendîmes longtemps. La fatigue paralysait mes jambes, ma tête tournait, je bâillais à me décro- cher les mâchoires.", "ar": "انتظرنا طويلا. كان التعب يشل ساقي، كان رأسي يدور، كنت أتثاءب حتى أكاد أقتلع فكي."}, {"fr": "Mon père commençait à manifester des signes d’impatience. Le courtier fit irruption. Le chiffre avait augmenté. Sur un nouveau signe affirmatif de mon père, le chiffre se modifia. Le courtier se fondit dans le brouhaha et les remous de la foule.", "ar": "بدأ أبي بإبداء علامات نفاذ الصبر. ظهر السمسار. كان الثمن قد ارتفع. بإشارة إيجابية جديدة من أبي، تغير الثمن. ذاب السمسار وسط صخب و دوامة الناس."}, {"fr": "Le souk battait son plein. Les courtiers s’égosillaient, clamaient à tue-tête des chiffres qu’on avait peine à saisir, couraient d’une direction à l’autre, s’emparaient de la main d’un client et l’entraînaient fougueu- sement derrière eux. Ici et là, des discussions s’élevaient. A peine une dispute s’était-elle apaisée qu’une autre éclatait plus loin.", "ar": "كان السوق في أوجه. كان السماسرة يبحون، يصيحون بأعلى صوتهم بأرقام كنا نجد صعوبة في فهمها، يجرون من اتجاه إلى آخر، يمسكون بيد أحد الزبائن و يجرونه خلفهم بحماسة. كانت نقاشات تسمع هنا و هناك. بالكاد كان شجار يتوقف فيبدأ آخر في مكان أبعد."}, {"fr": "Parfois une vague d’hommes en délire et de femmes hystériques nous submergeait, nous aplatissait contre le mur et s’en allait déferler sur un rivage inconnu.", "ar": "أحيانا، كانت موجة من الرجال الهاذرين و النساء الهستيريات تغمرنا، تسوينا تجاه الحائط ثم تذهب لتتكسر على ضفة مجهولة."}, {"fr": "Je n’en pouvais plus de fatigue. Mon père qui s’en était aperçu me souleva dans ses bras et me tint tout serré contre sa poitrine. Son front ruisselait de sueur. Ma mère courroucée commença à maudire le dellal, à invoquer tous les saints qu’elle connaissait afin qu’ils lui infligent le dur châtiment qu’il mérite. C’était une honte de se conduire ainsi avec les honnêtes gens! Que devait-il combiner pendant cette lon- gue absence? Nous prenait-il pour des campagnards ignorants? Nous saurons démasquer la vérité. Nous paierons le prix équitable et nous ne nous laisserons pas « rouler » par ce mécréant. Mais le mécréant était toujours invisible.", "ar": "لم أعد أحتمل التعب. قام أبي الذي لاحظ ذلك برفعي بين ذراعيه و أبقاني مضموما إلى صدره. كان جبينه يسيل بالعرق. بدأت أمي بلعن الدلال و هي مغتاظة. بالتذرع إلى جميع الأولياء الذين كانت تعرفهم لكي يفرضوا عليه العقوبة التي يستحق. كان التصرف بهذه الطريقة مع الناس الشرفاء أمرا مخزيا! ما الذي يحاول صنعه خلال كل هذا الغياب؟ هل يحسبنا قرويين جهلة؟ سوف نكتشف الحقيقة. سندفع الثمن المنصف و لن نخدع من طرف هذا الجاحد. لكن الجاحد كان ما يزال غائبا."}, {"fr": "Brusquement, mon père me déposa à terre et disparut dans la foule. Son absence dura. Des cris s’éle- vèrent à l’autre bout du souk. Ils dominaient le tumulte, éclataient comme un orage. De grandes ondu- lations parcoururent cette mer humaine. Des explosions de colère fusaient ça et là, reprenaient quelques pas plus loin, se transformaient en tintamarre.", "ar": "فجأة، وضعني أبي أرضا و اختفى بين الحشد. طال غيابه. ارتفعت أصوات في الطرف الآخر من السوق. طغت على الجلبة، هبت مثل العاصفة. حركت أمواج كبيرة هذا البحر البشري. كانت انفجارات من 95 الغضب تنهمر هنا و هناك، تمشي بضع خطوات أبعد من ذلك، تتحول إلى صخب."}, {"fr": "Voici que tous les gens du souk se mirent à courir ; Fatma Bziouya et ma mère répétaient « Allah ! Allah ! », se plaignaient à haute voix de leurs douleurs de pieds que la foule écrasait, essayaient de retenir leurs haïks emportés par le courant.", "ar": "و بدأ ناس السوق بالجري؛ كانت فاطمة بزيوية و أمي تكرران « الله! الله! »، تشتكيان بصوت مرتفع من آلام أقدامهما التي كان الحشد يدوس عليها، تحاولان الإمساك بحايكيهما اللذين يجرفهما التيار."}, {"fr": "Enfin, passèrent mon père et le courtier se tenant mutuellement par le collet. Le souk leur faisait cor- tège. Les deux hommes avaient les yeux rouges et de l’écume au coin des lèvres. Mon père avait perdu son turban et le dellal avait une tache de sang sur la Joue.", "ar": "في الأخير، مر أبي و السمسار و هما يمسكان بخناق بعضهما البعض. كان السوق يشكل جمهورا لهما. كانت عيون الرجلين حمراء و كانت هناك رغوة عند طرف شفاههما. كان أبي قد فقد عمامته و كان للدلال بقعة دم على خده."}, {"fr": "Ils s’en allèrent suivis par les badauds.", "ar": "رحلا و المتسكعون يتبعونهم."}, {"fr": "Ma mère, la voisine et moi, nous nous mîmes à pleurer bruyamment. Nous nous précipitâmes au hasard, à leur poursuite. Nous débouchâmes au souk des fruits secs. Aucune trace des deux antagonistes ni de leur cortège. Je m’attendais à voir des rues désertes, des étalages abandonnés, des turbans et des ba- bouches perdus dans la panique générale. Je fus déçu. Aucune trace de la bagarre n’avait marqué ces lieux. On vendait et on achetait, on plaisantait et de mauvais garnements poussaient l’indifférence jusqu’à chanter des refrains à la mode. Notre tristesse devenait étouffante dans cette atmosphère. Nous sentions tout notre isolement. Ma mère décida de rentrer. - Il ne sert à rien, ajouta-t-elle, de courir dans toutes les directions. Rentrons pour attendre et pour pleurer.", "ar": "بدأت أنا و أمي و الجارة بالبكاء بضجيج. أسرعنا باللحاق بهما عشوائيا. وصلنا إلى سوق الفواكه الجافة. لم يكن هناك أي أثر لا للخصمين ولا لموكبهما. كنت أتوقع أن أرى شوارع خالية، بضائع متخلى عنها، عمامات و بلغات ضائعة خلال الذعر العام. خاب أملي. لم يكن أي أثر للشجار قد ترك بصمته في هذا المكان. كان يباع و يشترى، يتسلى و كان بعض الفتيان الأشقياء يبالغون بلامبالاتهم إلى حد غناء لازمات رائجة. أصبح حزننا خانقا في خضم هذا الجو. كنا نحس بكامل عزلتنا. قررت أمي العودة إلى البيت. - أضافت: لا جدوى من الجري في جميع الاتجاهات. لنعد للانتظار و البكاء."}, {"fr": "A la maison, une fois dans notre chambre, ma mère se débarrassa de son haïk, s’assit sur un matelas et, la tête dans ses deux mains, pleura silencieusement. Pour la première fois, sa douleur me bouleversait. Cela ne ressemblait point aux grands éclats et aux lamentations auxquels elle se livrait parfois pour se soulager le cœur. Ses larmes coulaient sur son menton, s’aplatissaient sur sa poitrine, mais elle restait là, sans bouger, émouvante dans sa solitude.", "ar": "في البيت، بمجرد دخولنا إلى غرفتنا، تخلصت أمي من حايكها، جلست على فراش، بكت بصمت و هي تضع رأسها بين يديها.لأول مرة، كان بكاؤها يؤثر في. لم يكن ذلك يشبه إطلاقا صيحاتها المرتفعة و نوبات أنينها التي كانت تنكب عليها أحيانا لتريح قلبها. كانت دموعها تسيل على ذقنها، تنبسط على صدرها، لكنها كانت تبقى هناك، دون حراك، متأثرة بوحدتها."}, {"fr": "Je pleurai, moi aussi, un moment, troublant le silence de puissants reniflements, puis je m’étendis sur le lit et, les yeux au plafond, j’attendis. Je ne savais pas au juste ce que j’attendais. Le drame du souk des bijoux comportait nécessairement un dénouement. Quand ma mère parla d’attendre, elle y pensait sans aucun doute. A nous deux, nous nous mîmes à exécuter notre programme: ma mère pleurait et moi j’attendais. J’étais rompu depuis longtemps à cet exercice. Le soir tomba. Les lumières brillèrent à toutes les fenêtres de la maison. Notre pièce restait obscure. Dans la pénombre, des figures monstrueuses se formaient devant mes yeux, s’effilochaient, se transfor- maient, cédaient la place à d’immenses étincelles vertes, revenaient me frôler les paupières de leurs voiles brunâtres.", "ar": "بكيت، أنا كذلك، للحظة، معكرا الصمت بشخير مدو، ثم تمددت على السرير و انتظرت بعينين نحو السقف. لم أكن أعرف ماذا كنت أنتظر بالضبط. لابد من أن كارثة السوق كانت لها نهاية ما. عندما تحدثت أمي عن الانتظار، لا بد من أنها كانت تعني ذلك حقا. بدأنا نحن الإثنان بتنفيذ 96 برنامجنا: كانت أمي تبكي و أنا أنتظر. لقد كنت خبيرا في هذا المجال منذ زمن طويل. حل الظلام. كانت الأضواء تلمع في كل نوافذ المنزل. بقيت غرفتنا مظلمة. في الظليل، كانت تتشكل وجوه بشعة أمام عيني، تتبدد، تتحول، تترك المكان لشرارات خضراء عملاقة، تعود لتلامس جفوني بفوالاتها البنية."}, {"fr": "Enfin, la voix de mon père troua les ténèbres. Je me mis sur mon séant. Ma mère, abîmée dans sa douleur, continuait à pousser d’imperceptibles soupirs. Les marches résonnaient de plus en plus distinc- tement sous les pas de mon père. La porte de la chambre s’ouvrit, sa silhouette se détacha en noir épais, sur le gris du mur. - Pourquoi, dit-il, n’avez-vous point allumé la lampe? Où sont les allumettes?", "ar": "في الأخير، ثقب صوت أبي الظلمات. جلست. كانت أمي، و الألم يمزقها، ما تزال تطلق تنهدات مكتومة. كانت الدرجات ترن أكثر فأكثر بشكل أوضح تحت خطوات أبي. فتح باب الغرفة، بدى خياله الأسود الغامق بلون رمادي على الجدار. - قال: لماذا لم تشعلا القنديل؟ أين أعواد الثقاب؟ أجابت أمي بصوت بنت صغيرة:"}, {"fr": "Ma mère, d’une voix de petite fille, répondit: - Elles sont sur l’étagère, contre la boîte à thé en fer-blanc.", "ar": "- إنها على الرف، قبالة علبة الشاي التنكية. سأل أبي: - هل نام سي محمد؟"}, {"fr": "Mon père questionna: - Si Mohammed dort-il déjà? - Non, papa, je ne dors pas.", "ar": "- لا يا أبي، أنا لست نائما. أشعل عود ثقاب، رفع زجاج القنديل."}, {"fr": "Il craqua une allumette, souleva le verre de la lampe.", "ar": "- استأنف: ما الذي كنت تفعله إذن في الظلام؟"}, {"fr": "- Que faisais-tu donc dans le noir? reprit-il - j’attendais ton retour. La lampe allumée, ma mère releva la tête. Son visage ruisselait encore de larmes.", "ar": "- كنت أنتظر عودتك. بعد إشعال القنديل، رفعت أمي رأسها. كان وجهها ما يزال مبللا بالدموع. انتبه أبي إلى الأمر."}, {"fr": "Mon père s’en aperçut. - Pourquoi tant de larmes? Nous n’avons Dieu merci, aucun sujet de tristesse. J’ai dû vous abandonner seules pour corriger ce mécréant qui essayait de nous jouer quelque tour de sa façon. Tout est maintenant rentré dans l’ordre et voici les bracelets. Il déposa les deux bracelets sur le matelas à côté de ma mère.", "ar": "- لماذا كل هذه الدموع؟ لا نملك والحمد لله أي سبب للحزن. لقد اضطررت لترككما لوحدكما لأؤدب هذا الكافر الذي كان يحاول أن يدبر لنا بعض المقالب على طريقته. لقد عاد كل شيء إلى طبيعته الآن و ها هما السواران. وضع السوارين على الفراش بجوار أمي."}, {"fr": "- Je ne veux pas les voir, ces bijoux de mauvais augure, dit ma mère. Je crois que je ne les porterai jamais. Je sens qu’avec eux, le malheur est entré dans cette maison, tu feras bien d’aller les revendre dès demain.", "ar": "- قالت أمي: لا أريد رؤية هذه الحلي المشؤومة. أظن بأنني لن ألبسها أبدا. أظن بأنه بسببها دخل الشؤم إلى هذا المنزل، من الأفضل أن تذهب لبيعها منذ الغد."}, {"fr": "- Ce sont bien là les bracelets que tu désirais, prends-l es et ne prononce pas de paroles inconséquentes.", "ar": "97 - إنهما بالفعل السواران اللذان كنت تريدينهما، خذيهما و لا تقولي كلاما فارغا."}, {"fr": "Ma mère se leva, prit les bijoux sans les regarder, ouvrit son coffre et les jeta dedans avec humeur.", "ar": "نهضت أمي، أخذت المجوهرات دون النظر إليها، فتحت صندوقها و رمتها بداخله بغضب."}, {"fr": "- Tu verras bien: ce que je te dis est la vérité. Je ne suis peut-être pas intelligente, je ne suis qu’une faible femme, mais mon cœur ne ment pas quand il me renseigne sur quelqu’un ou sur quelque chose. Ces bracelets ne m’apportent aucune joie. Maintenant, je vais m’occuper du dîner. Nous touchâmes à peine à ce dîner plutôt improvisé. Nous nous mîmes au lit. Je me souviendrai tou- jours de cette nuit hantée de cauchemars. Je revois encore les scènes de violence et de sang, je revois les monstres, je revois les yeux enflammés de haine qui nous traquaient, ma mère, mon père et moi. Des masses d’hommes aux visages hideux nous poursuivaient à travers la ville pour nous dépouiller de nos richesses. Ils en voulaient particulièrement à ma Boîte à Merveilles. Mon père parut sur un cheval noir. Il avait ma boîte sous le bras. Il fendit la foule au galop. Des mains essayèrent de le retenir. Il piqua des deux. La longue crinière de son cheval se déployait comme un étendard. Ma mère et moi, nous nous trouvâmes brusquement dans une campagne déserte. Ma mère pleurait silencieusement. La lumière de l’été inondait des espaces de sable et de cailloux. La silhouette de mon père se détacha sur une colline. Il nous attendait. Il n’avait plus de cheval. Il serrait toujours sous son bras ma Boîte à Merveilles.", "ar": "- سوف ترى: إن ما أقوله لك هو الحقيقة. ربما لست ذكية، لست سوى امرأة ضعيفة، لكن قلبي لا يكذب عندما يخبرني عن شخص أو شيء ما. لا يشعرني هذان السواران بأية فرحة. سأحضر العشاء الآن. لقد أكلنا بالكاد من هذا العشاء المرتجل. ذهبنا إلى النوم. سأتذكر دائما هذه الليلة المليئة بالكوابيس. لا زلت أرى مشاهد العنف و الدم، أعاود رؤية الوحوش، العيون المشتعلة بالحقد التي كانت تلاحقنا، أنا، أمي و أبي. كانت جموع من الرجال قبيحي الوجوه تتبعنا عبر المدينة لتجردنا من ثرواتنا. كانوا يحقدون بالأخص على علبة العجائب خاصتي. ظهر أبي على حصان أسود. كان يحمل علبتي تحت ذراعه. شق الحشد بالعدو. حاولت أياد إيقافه. جعل الحصان يسرع. كان عرف الحصان الطويل يرفرف مثل علم. وجدت نفسي أنا و أمي بشكل مفاجئ في ضيعة مقفرة. كانت أمي تبكي بصمت. كان ضوء الصيف يغمر مساحات الرمل و الحجارة. ظهر خيال أبي على إحدى التلال. كان ينتظرنا. كان بدون حصان. كان ما يزال يحمل علبة العجائب خاصتي تحت ذراعه. - قال لنا: لقد أنقذتها و أضاف و هو يخاطبني: إنها لك، افتحها إذن."}, {"fr": "- Je l’ai sauvée, nous dit-il, et, s’adressant à moi, il ajouta: Elle est à toi, ouvre-la donc. Je la posai sur la terre nue et l’ouvris avec précaution. Mes yeux furent éblouis: sur un fond de fleurs fraîchement coupées (des œillets et des roses) reposaient comme dans un écrin, des bijoux d’or rehaussés de gemmes. Je n’en avais jamais vu d’aussi beaux, je relevai la tête pour dire à mes parents: « Regardez mon trésor. » Ils jetèrent un coup d’œil dans la Boîte. Ma mère déclara:", "ar": "وضعتها على الأرض الجرداء و فتحتها بحذر. بهرت عيناي: على أرضية من الأزهار المقطوفة حديثا ( قرنفل و ورود ) كانت توجد مجوهرات ذهبية تعلوها أحجار كريمة كما لو كانت داخل علبة مجوهرات. لم يسبق لي أن رأيت شيئا بهذا الجمال، رفعت رأسي لأقول لوالدي: « أنظرا إلى كنزي. » ألقيا نظرة على علبتي. أعلنت أمي:"}, {"fr": "- Les beaux bijoux portent toujours malheur à ceux qui les possèdent.", "ar": "- تكون المجوهرات الجميلة دائما نذير شؤم لأصحابها."}, {"fr": "Un grand froid m’enveloppa ; je refermai la boîte, me mis à sangloter.", "ar": "انتباتني موجة برد؛ أعدت إغلاق العلبة، بدأت بالبكاء."}, {"fr": "- Sidi Mohammed, pourquoi pleures-tu ? Réveille-toi donc! Réveille-toi!", "ar": "- سيدي محمد، لماذا تبكي؟ فلتستيقظ إذن! استيقظ!"}, {"fr": "II faisait déjà jour. Les seaux cliquetaient dans le patio. Mon père se penchait sur moi, me tâtait le front, j’ouvris les yeux.", "ar": "كان النهار قد طلع. كانت الدلاء تخشخش في الفناء. كان أبي ينحنى علي، يجس جبيني، فتحت عيني."}, {"fr": "- Non! affirma mon père, il n’a pas de fièvre. Il a dû simplement avoir un cauchemar.", "ar": "98 - أكد أبي: لا! إنه لا يعاني من الحمى. لا بد من أنه رأى كابوسا بكل بساطة."}, {"fr": "Assise dans son lit, ma mère répétait:", "ar": "كانت أمي تكرر و هي جالسة في سريرها:"}, {"fr": "- Je te dis qu’il est malade. Avec toutes ces émotions d’hier soir et l’agitation du souk des bijoux où tu as cru nécessaire de l’entraîner, cela ne m’étonne pas qu’il soit tombé malade.", "ar": "- أقول لك بأنه مريض. بعد كل تلك الانفعالات بالأمس و اضطراب سوق المجوهرات الذي ظننت بأنه من اللازم أخذه إليه، لا يدهشني أن يمرض."}, {"fr": "- Cet enfant n’a rien, proclama mon père. Un peu de fatigue sans doute. Qu’il n’aille pas à l’école.", "ar": "- أعلن أبي: هذا الطفل لا يشكو من شيء. إنه متعب قليلا بدون شك. فليتغيب عن الكتاب."}, {"fr": "- Mon Dieu! Punis-moi, je suis la principale fautive, mais ne me frappe pas dans mon enfant. Homme, je te dis que je ne veux en aucune façon garder ces bracelets. Avec ces bijoux, le malheur entre dans cette maison. Mon père se dirigea vers la porte. Tout en enfilant ses babouches, il déclara:", "ar": "- يا إلاهي! عاقبني، أنا المخطئة الرئيسية، لكن لا تؤذني بابني. أيها الرجل، أقول لك بأنني لا أريد بأية طريقة الاحتفاظ بهذين السوارين. إن الشؤم يدخل إلى هذا البيت بسبب هذه المجوهرات. توجه أبي نحو الباب. أعلن و هو يلبس بلغته:"}, {"fr": "- Je m’en vais, je sens que si je reste je manquerai de patience.", "ar": "- سأرحل، أشعر بأننني سأفقد صبري لو بقيت هنا."}, {"fr": "- Va, répondit ma mère, tu es un homme, il est naturel que tu aies un cœur de pierre.", "ar": "- أجابت أمي: إذهب، أنت رجل، من الطبيعي أن يكون لك قلب من الحجر."}, {"fr": "Ma mère ne devait pas dire des choses pareilles. Il n’est pas du tout naturel qu’un homme ait un cœur de pierre. Un jour, je serai un homme, je n’aurai pas un cœur de pierre. Seulement, devant les événe- ments, mon père réagit comme doit réagir un homme. Il garde sa lucidité, son sang-froid. Ma mère vou- drait le voir réagir comme elle : s’agiter, crier, exagérer l’importance du moindre incident. Mon père avait d’ailleurs raison: je ne me sentais nullement malade. Pourtant, je dus obéir à ma mère, garder le lit toute la journée. Après déjeuner, nous reçûmes la visite de Lalla Aïcha. Il y avait longtemps que nous n’avions pas eu de ses nouvelles ni de celles de son mari Sidi Larbi le babouchier. Ma mère se hâta de préparer le thé. Elle entreprit ensuite de faire le récit de ses malheurs à sa vieille amie. Elle raconta dans les détails notre équipée au souk des bijoux, l’affreux drame qui se déroula à propos des bracelets, s’interrompit pour pleurer un moment, reprit son histoire entrecoupée de soupirs, d’invocations. Elle prophétisa avec lyrisme, annonça des catastrophes qui ne manqueraient pas de frapper notre foyer si mon père ne se décidait pas à vendre les bracelets de mauvais augure, cause occulte de notre ruine.", "ar": "ما كان يجب على أمي أن تقول أشياء مشابهة. ليس من الطبيعي أبدا أن يكون لرجل قلب من حجر. يوما ما، سأصير رجلا، لن يكون قلبي من حجر. أمام هذه الأحداث فقط، يتصرف أبي كما يجب أن يتصرف الرجل. يحافظ على تبصره و رباطة جأشه. كانت أمي تريد أن تراه و هو ينفعل مثلها: التحرك، الصراخ، تعظيم أهمية أدنى الأحداث. على أية حال، كان أبي على حق: لم أكن أحس بأنني مريض بتاتا. و مع ذلك اضطررت لإطاعة أمي و البقاء في السرير طوال اليوم. بعد الغداء، زارتنا لالة عيشة. لم نسمع أخبارها أو أخبار زوجها سي العربي صانع البلغات منذ وقت طويل. أسرعت أمي بتحضير الشاي. شرعت بعد ذلك بسرد قصة مآسيها لصديقتها القديمة. لقد حكت رحلتنا إلى سوق المجوهرات بجميع تفاصيلها، الكارثة الرهيبة التي حصلت بسبب السوارين، توقفت لتبكي قليلا، استأنفت قصتها التي كانت تتخللها تنهدات، أدعية. تنبأت بحماسة بالكوارث التي لن تلبث أن تضرب بيتنا إن لم يقرر أبي بيع السوارين المشؤومين، السبب الخفي لخرابنا."}, {"fr": "Lalla Aicha, par politesse, approuvait, soupirait, dodelinait de la tête, se donnait de légères tapes sur la joue.", "ar": "99 كانت لالة عيشة، بدافع الأدب، توافق، تتنهد، تهز رأسها، تضرب خديها بشكل خفيف."}, {"fr": "Ma mère, enfin, regarda son amie.", "ar": "نظرت أمي أخيرا إلى صديقتها."}, {"fr": "- Mais toi ? Tu ne me dis rien sur ta maison. Comment vas-tu ? Comment va ton mari ? Lalla Aicha, pour toute réponse, enfouit son visage dans ses mains et éclata en sanglots. Un torrent de larmes coula au travers de ses doigts. Son corps fut secoué de violents spasmes. La douleur l’étranglait par moments. Ma mère lui entoura les épaules de ses deux bras et se mit à sangloter avec elle. Lalla Aicha s’arrêta. Les joues encore luisantes de pleurs, le nez humide, elle dit à ma mère: - Zoubida, je n’ai plus personne au monde, tu es mon amie, tu es ma seule famille. Le fils du péché pour qui je me suis dépouillée, m’a abandonnée pour prendre une seconde femme, la fille d’Abderrah- man le coiffeur.", "ar": "- و أنت؟ لا تخبرينني بشيء عن بيتك. كيف حالك؟ كيف حال زوجك؟ لكي تجيب لالة عيشة، غطت وجهها بيديها و أجهشت بالبكاء. صب سيل من الدموع من خلال أصابعها. هزت تشنجات عنيفة جسمها. كان الألم يخنقها عبر لحظات. أحاطت أمي كتفيها بذراعيها و بدأت بالبكاء معه
