es par la nuit. Je ne reconnaissais aucune rue. J’entendais résonner des pas dans le lointain. Us se rapprochaient, se dissolvaient. Un chien aboya. Une dispute de chats éclata au faîte d’une terrasse. Les deux ennemis se défiaient, clamaient chacun sa bravoure et son courage, crachaient des bouf- fées de colère. Leurs cris s’éloignèrent. Seuls, nos pas, le froufrou de nos vêtements, nos souffles pressés animaient cette ville morte.", "ar": "جاء أبي لإحضارنا. نزلت الدرج متعثرا عند كل درجة. كانت الشوارع قليلة الإنارة. كان أبي يحمل فانوسا من التنك تم تزيينه بزجاج ملون يزيده تألقا. كانت أطياف تبرز في الظلام، تتخذ شكلا بشريا، تختفي بعد لحظة من خلفنا مبتلعة من طرف الليل. لم أكن أعرف أي شارع. كنت أسمع وقع خطوات في البعيد. كانت تقترب ثم تختفي. نبح كلب. نشب شجار قطط على قمة أحد السطوح. كان العدوان يتحديان بعضهما، كان كل واحد يصيح بإقدامه و شجاعته، ينفثان نفخات غضب. ابتعدت أصواتهما. كانت خطواتنا و حفيف ملابسنا فقط من تنعش هذه المدينة الميتة."}, {"fr": "Nous arrivâmes chez nous. Ma mère me coucha. Je m’anéantis dans le sommeil.", "ar": "وصلنا إلى بيتنا، أنامتني أمي. غططت في النوم."}, {"fr": "Le lendemain vendredi, mon père rentra déjeuner selon sa coutume. Il portait une djellaba de laine boutonnée d’une éblouissante blancheur et un turban neuf, tout raide d’apprêt. Le repas fut servi par ma mère. Le menu était particulièrement soigné. Nous mangeâmes du mouton aux artichauts sauvages, du couscous au sucre et à la cannelle et pour finir une délicieuse salade d’oranges à l’huile d’olive.", "ar": "في اليوم الموالي، الجمعة، عاد أبي للبيت لتناول الغداء كما هي عادته. كان يرتدي جلبابا من الصوف ناصع البياض به أزرار و عمامة جديدة، صلبة جدا بفعل الشد. قدمت أمي الطعام، كان طبقا متقنا للغاية، أكلنا لحم الخروف بالخرشوف البري، كسكسا بالسكر و القرفة و في الختام سلطة لذيذة من البرتقال و زيت الزيتون."}, {"fr": "Nous sirotâmes de nombreux verres de thé à la menthe. Au centre du plateau, deux roses d’Ispahan s’épanouissaient dans une Vieille tasse de porcelaine.", "ar": "ارتشفنا عدة كؤوس من الشاي بالنعناع. في وسط الصينية، كانت وردتا أصفهان تتفتحان داخل فنجان قديم من الخزف الصيني."}, {"fr": "Ma mère soupira. Elle s’adressa à mon père:", "ar": "تنهدت أمي و خاطبت أبي:"}, {"fr": "- Le sort se montre parfois bien cruel. Pauvres et riches, bons et méchants sont à la merci de ses revers. J’ai bien du chagrin ! Je pense à Lalla Aïcha et mon cœur saigne. Je n’ai pas voulu t’ennuyer hier soir avec les tristes événements qui se sont déroulés dans la journée. Mon père prêta une oreille attentive. Elle poursuivit :", "ar": "- إن القدر يكون قاسيا جدا أحيانا. كل من الفقراء و الأغنياء، الأخيار و الأشرار يقعون تحت رحمة تقلباته. أشعر بالكآبة! كلما فكرت في لالة عيشة ينزف قلبي. لم أرد إزعاجك مساء البارحة بالأحداث المحزنة التي حدثت في النهار. أصغى أبي باهتمام: تابعت:"}, {"fr": "- Moulay Larbi, le mari de Lalla Aïcha, s’est disputé avec son associé, un certain Abdelkader fils de je ne sais qui. ..", "ar": "38 - مولاي العربي، زوج لالة عيشة، تشاجر مع شريكه، شخص يدعى عبد الحق ابن لا أعرف من..."}, {"fr": "Elle leva les yeux au plafond pour invoquer : - Dieu écarte de notre chemin, de celui de nos enfants et les enfants de nos enfants, tous les fils du péché qui se présentent le sourire aux lèvres et la poitrine pleine de ténèbres. Sois notre protecteur et notre mandataire : Amine ! Cet Abdelkader, ce fils de l’adultère, ce disciple de Satan ne possédait pas une chemise propre quand. Moulay Larbi le prit comme ouvrier dans son atelier à Mechatine. Il le traita avec bienveillance, lui prêta de l’argent, le reçut souvent à déjeuner ou à dîner. Abdelkader se montrait poli et même obséquieux. Il chantait les mérites de Moulay Larbi, louait sa générosité, son bon caractère et la noblesse de ses sentiments. Tous les deux travaillaient beaucoup. Les babouches brodées jouissent auprès des femmes de Fès d’un grand succès. La production de Moulay Larbi et de son ouvrier avait bonne réputation. Abdelkader songea à se marier .Moulay Larbi l’en- couragea dans cette voie et Lalla Aïcha lui trouva une jeune fille digne d’éloges. Les mariages coûtent toujours très cher. Malgré ses nuits de veille, Abdelkader n’avait pas su économiser. Il se trouva assez gêné lorsqu’il fallut une dot à sa fiancée. Il eut recours à son patron. Moulay Larbi réussit à assembler quatre- vingts rials. Il les lui versa sans méfiance. Il commit la faute de lui avancer cet argent sans établir de papier de reconnaissance de dette. Pour permettre à Abdelkader de gagner davantage, il l’associa à son affaire.", "ar": "رفعت عينيها إلى السقف لتدعو: - فليبعد الله عن طريقنا، عن أطفالنا و عن أطفال أطفالنا، كل أولاد الحرام الذين يأتون بالابتسامة على الشفتين و الصدر مليء بالظلمات. كن حامينا و وكيلنا: آمين! عبد القادر هذا، ابن الحرام هذا، لم يكن تابع الشيطان هذا يملك حتى قميصا نظيفا عندما وظفه مولاي العربي كعامل لديه في ورشته التي توجد في مشاطين. كان يحسن معاملته، يقرضه المال، يدعوه دائما للغداء أو العشاء. كان عبد القادر مؤدبا و متملقا حتى. كان يمدح مولاي العربي، يثني على كرمه، طبعه الجيد و نبل أحاسيسه. كان كلاهما يعملان كثيرا. كانت البلغات المطرزة تلقى نجاحا كبيرا لدى نساء فاس. كان لإنتاج مولاي العربي و عامله سمعة جيدة. فكر عبد القادر في الزواج. شجعه مولاي العربي على هذا القرار و وجدت له لالة عيشة شابة تستحق المديح. لازالت الأعراس تكلف الكثير. رغم الليالي التي سهرها، لم يتمكن عبد القادر من الادخار. لقد كان محرجا عندما تطلب الأمر دفع مهر لخطيبته. لجأ لرئيسه. تمكن مولاي العربي من جمع ثمانين ريال. أودعها له بنية صافية. لقد ارتكب خطأ تسبيق هذه النقود له دون كتابة وثيقة الاعتراف بالدين. ليساعد عبد القادر على ربح المزيد جعله شريكا له في عمله."}, {"fr": "- Sais-tu comment ce fils du péché l’a remercié de ses bienfaits?", "ar": "- هل تعرف كيف شكره ابن الحرام هذا على أفضاله؟"}, {"fr": "Mon père ne savait pas.", "ar": "لم يكن أبي يعرف."}, {"fr": "Ma mère ne lui laissa d’ailleurs pas le temps de répondre. Elle continua en ces termes :", "ar": "على أية حال، لم تدع له أمي الوقت للإجابة. تابعت بهذه الكلمات:"}, {"fr": "- Non! Tu ne pourras jamais le deviner! Les gens qui n’ont pas de pudeur, les va-nu-pieds de mauvaise foi, ceux-là qui offensent Dieu et son Envoyé par leurs agissements malhonnêtes auront à rendre compte de leurs mauvaises actions le jour de la Balance. Abdelkader a nié, il n’a pas simplement nié, il a même prétendu avoir versé la moitié du capital de l’affaire de Moulay Larbi pour l’achat du matériel, des cuirs et du fil d’or. Le Pacha ne pouvait pas connaître tous les détails de cette histoire. Il n’a accepté aucune des versions des deux adversaires. Un garde du pacha a été chargé de mener l’enquête, mais il s’est contenté de discuter avec les plaideurs. Il leur a réclamé une somme fabuleuse pour le temps qu’il avait perdu, dit-il, à les réconcilier. Ils se sont exécutés. L’affaire a été portée devant le prévôt des marchands. Il les a fait de nouveau accompagner par un de ses gardes qui leur a demandé de lui exposer les faits, mais ils ont refusé. « Seuls les experts de la Corporation peuvent comprendre l’objet du litige », dirent-ils. Les experts ont été réunis. Ils ont discuté jusqu’au soir. Finalement, ils se sont prononcés en faveur d’Abdelkader. Quelle époque ! Il n’y a plus de justice! Ce n’est point de leur faute à ces juges, me diras-t-il. Il est diffi- cile de connaître les tenants et les aboutissants d’une telle affaire. Qu’a-t-on à juger les affaires dont on ne connaît pas toutes les données? Je sais, le monde est ainsi fait, il faut des juges et des escrocs pour leur donner du travail. Ce sont toujours les honnêtes gens qui sont sacrifiés. Mon père intervint : - Pas toujours! Parfois les juges commettent des erreurs.", "ar": "- لا! لن تخمن أبدا! الناس عديمو الحياء، البائسون سيئو النوايا، أولئك الذين يغضبون الله و رسوله بأفعالهم الوضيعة سيلقون جزاء أفعالهم السيئة في يوم الحساب. أنكر عبد القادر، لم يكتفي بالإنكار فقط، بل ادعى بأنه دفع نصف رأس مال عمل مولاي العربي لشراء العدة، الجلد و الخيوط الذهبية. لم يكن الباشا مطلعا على جميع تفاصيل القصة. لم يقبل أية رواية من كلا الطرفين. كان أحد حراس الباشا مكلفا بإجراء التحقيق، لكنه اكتفى بالحديث مع الخصمين. لقد طلب منهما مبلغا خياليا من أجل الوقت الذي ضيعه، يقول: للصلح بينهما. رضخا للأمر. تم عرض القضية على قاضي 39 التجار. أرسل هو الآخر معهما أحد حراسه الذي طلب منهما أن يعرضا عليه الأحداث، لكنهما رفضا. قالا: « يمكن فقط لمتخصصي المجلس أن يفهموا موضوع النزاع »، اجتمع المتخصصون، تحدثوا حتى المساء. في آخر المطاف، حكموا لصالح عبد القادر. ياله من زمن! لم تعد هناك عدالة! ستقول لي: ليس خطأ هؤلاء القضاة إطلاقا، من الصعب معرفة جذور و نتائج قضية كهذه. كيف للمرء أن يحكم على قضية لا يعرف كل معطياتها؟ أعرف، إن العالم هكذا، يلزم قضاة و نصابون ليوفروا لهم العمل. إن الناس الشرفاء هم الضحايا دائما. تدخل أبي:"}, {"fr": "Même juges, ils n’en sont pas moins hommes c’est-à-dire soumis à l’erreur. Dieu seul ne se trompe jamais. - Il n’y a de puissance qu’en Lui, l’Unique, qui n’a point d’associé, dit ma mère, et elle ajouta : - Enfin tout cela nous a bouleversées. Lalla Aicha a pleuré, le soir, elle souffrait de violents maux de tête.", "ar": "- ليس دائما! يرتكب القضاة الأخطاء أحيانا. حتى و إن كانوا قضاة، فهم يظلون بشرا، يعني أنهم معرضون للخطأ. الله وحده من لا يخطئ أبدا. - قالت أمي: لا حول و لا قوة إلا بالله، وحده، لا شريك له، ثم أضافت: - لقد ضايقنا كل هذا في الأخير. لقد بكت لالة عيشة، في المساء، كانت تعاني من صداع عنيف."}, {"fr": "Un silence suivit cette conclusion.", "ar": "تبع صمت هذه الخاتمة."}, {"fr": "J’entendais les grains du chapelet qu’égrenaient les longs doigts de mon père. Rahma tapait sur son pain pour savoir s’il était levé. Zineb jouait avec le chat, un chat noir, maladif, que la famille avait adopté pour satisfaire un caprice de leur fille. J’écoutais ce qu’elle lui racontait. Il y était question de le nourrir de miel et de beurre, de gâteaux fourrés, d’amandes et de cuisses de poulets ; le grand bébé aurait un burnous de velours et porterait des turbans de soie.", "ar": "كنت أسمع حبات المسبحة التي كان أبي يضغطها بأصابعه الطويلة. كانت رحمة تضرب فوق خبزها لترى إن كان قد تخمر. كانت زينب تلعب مع القط، قط أسود، ز م ن ، كانت الأسرة قد تبنته لترضي نزوة ابنتها. كنت أسمع ما تحكيه له. كان الأمر يتعلق بإطعامه عسلا و زبدة، حلويات محشوة، لوزا و أفخاد دجاج؛ كان الرضيع الكبير سيحظى بسلهام مخملي و يلبس عمامة من الحرير."}, {"fr": "Grande niaise! Depuis quand les chats raffolent-ils de miel ? Un chat avec un turban de soie serait la chose la plus ridicule du monde. Une fille aussi bête que Zineb ne peut rien trouver d’amusant dans sa pauvre cervelle. Elle ne savait pas jouer, à mon avis. Elle était donc particulièrement pauvre et méprisable. Moi, j’avais des trésors cachés dans ma Boîte à Merveilles. J’étais seul à les connaître. Je pouvais m’évader de ce monde de contrainte encombré de pachas, de prévôts des marchands, et de gardes vénaux et me ré- fugier dans mon royaume où tout était harmonie, chants et musique. J’avais pour compagnons des héros et des princes équitables. Pour entendre raconter leurs nouveaux exploits, je me promettais d’aller écouter Abdallah, l’épicier. Je n’avais d’ailleurs jamais vu Abdallah, mais il tenait une place importante dans mon univers. Toutes les histoires merveilleuses que j’avais eu l’occasion d’entendre, je les lui attribuais. Pour- tant Abdallah avait existé. Mon père, qui ne parlait pas souvent, consacra une soirée entière à entretenir ma mère d’Abdallah et de ses histoires. Le récit de mon père excita mon imagination, il m’obséda durant toute mon enfance.", "ar": "خرقاء كبيرة! منذ متى كانت القطط مولعة بالعسل؟ سيكون قط بعمامة من الحرير أسخف شيء في العالم. لم تكن بنت بمثل غباء زينب لتجد شيئا أكثر تسلية في رأسها الفارغ. لم تكن تعرف اللعب في نظري. كانت إذن مسكينة للغاية و محتقرة. أنا، كان لدي كنوز مخبأة في علبة العجائب خاصتي. كنت الوحيد الذي يعرفها. كنت أستطيع الهرب من عالم الإكراهات هذا الذي يعج بالباشوات، بقضاة التجار، بالحراس المستأجرين و ألتجأ إلى مملكتي التي كان كل شيء فيها في وئام، أناشيد و موسيقى. كان رفاقي عبارة عن أبطال و أمراء عادلين. لسماع آخر إنجازاتهم، كنت أنوي الذهاب للإنصات لعبد الله، البقال، عدا عن ذلك، لم يسبق لي أن 40 رأيت عبد الله، لكنه كان يحتل مكانا مهما في عالمي. كل القصص الرائعة التي كانت لي فرصة سماعها، كنت أنسبها له. لكن عبد الله كان له وجود. خصص أبي، الذي لم يكن يتكلم كثيرا، أمسية كاملة ليحدث أمي عن عبد الله و عن قصصه. أثارت قصة أبي خيالي، أسرتني طيلة طفولتي."}, {"fr": "C’était l’hiver, le vent faisait claquer la porte de la terrasse et sifflait dans l’escalier. J’avais la tête posée sur les genoux de mon père. J’écoutais. Il parlait lentement, de sa voix grave.", "ar": "كان فصل الشتاء، كان الريح يصفق باب السطح و يصفر في الدرج. كنت أضع رأسي على ركبتي أبي. كنت أسمع. كان يتكلم ببطء، بصوته الخشن، هاهي قصته:"}, {"fr": "Voici son récit: « Abdallah connaît nombre d’histoires. Celles qu’il raconte sont rarement amusantes. Elles se termi- nent brusquement, sans recherche d’effets, sans conclusion apparente. « Abdallah ressemble étrangement à ses histoires. Il y a de la poésie et du mystère en lui. Il tient bou- tique à Haffarine, dans cette ruelle si fraîche en été et si peu fréquentée en toute saison.", "ar": "\" يعرف عبد الله العديد من القصص. نادرا ما تكون القصص التي يحكي ممتعة. تنتهي بشكل مفاجئ، دون البحث عن مؤثرات و لا نهاية واضحة. يشبه عبد الله قصصه بشكل غريب، إن بداخله شعرا و غموضا. لديه متجر في حفارين، في ذلك الزقاق البارد جدا في الصيف و الخالي في جميع فصول السنة."}, {"fr": "« Abdallah vend toutes sortes d’objets poussiéreux, défraîchis, pendus de guingois à des étagères non moins poussiéreuses, non moins défraîchies. Il a peu de clients, mais beaucoup d’amis. Du matin au soir, Abdallah balance son chasse-mouches, assis en tailleur sur une peau de mouton rongée de mites. « Il y a très longtemps qu’il s’est installé dans le quartier. Son fonds de commerce consistait en deux grappes de balais de palmier nain, une dizaine de couffins de trois dimensions différentes, un paquet de ficelle et quelques boîtes en fer-blanc qu’on suppose remplies d’épices.", "ar": "\" يبيع عبد الله جميع أنواع الأشياء المغبرة، الباهتة، معلقة بالمقلوب على رفوف ليست أقل اغبرارا، ليست أقل بهتا. لديه قليل من الزبائن، لكن كثير من الأصدقاء. من الصباح إلى المساء، يأرجح عبد الله منشته، متربعا على جلد خروف أكله العث. إنه يسكن في الحي منذ زمن بعيد. كان رأسماله يتمثل في عسوين، عشرة وسائد من ثلاثة أحجام مختلفة، حزمة خيوط و بعض علب التنك التي يفترض أن بها توابلا."}, {"fr": "« Depuis, sa barbe a blanchi et les grappes de balais ont bien peu diminué de volume, il y a encore les deux tiers des couffins, quant à la ficelle et aux épices, l’occasion ne s’est point présentée de les entamer. « Il en a raconté des histoires, Abdallah, depuis son arrivée! Il ne répète jamais la même et semble inépuisable. Il en raconte aux enfants, aux grandes personnes, aux citadins et aux campagnards, à ceux qui le connaissent comme aux visiteurs d’un jour.", "ar": "منذ ذلك الحين، ابيضت لحيته و تقلص حجم العسوان، لايزال هناك ثلثا الوسائد، أما بخصوص الخيط و التوابل، فلم تسنح أي فرصة باستعمالها. لقد حكى قصصا، منذ وصوله! لا يكرر عبد الله نفس القصة و يبدو كأنه يعرف عددا لا يحصى. يحكي منها للأطفال، للناس الكبار، للحضريين و للقرويين، للذين يعرفونه كما لزوار يوم واحد."}, {"fr": "« Les histoires d’Abdallah durent parfois un quart d’heure et parfois une matinée. Il les raconte sans sourire, au rythme solennel de son chasse-mouches. Il conte sans interruption, sans boire ni se racler la gorge, sans agiter les mains, ni occuper ses doigts.", "ar": "أحيانا، تدوم قصص عبد الله ربع ساعة و أحيانا أخرى صبيحة كاملة. يحكيها بدون ابتسامة، بإيقاع منشته الاحتفالي. يروي بدون توقف، دون أن يشرب أو يتنحنح، دون تحريك يديه، أو شغل أصابعه."}, {"fr": "« Aucune des formules de bénédiction si chères aux conteurs arabes n’émaille son récit. Il raconte d’étranges batailles, de merveilleuses idylles, des voyages passionnants dans les pays féeriques ou simple- ment la dispute d’un boutiquier avec son voisin, la nuit d’un va-nu-pieds à la belle étoile, le repas d’un mendiant.", "ar": "لم تكن أي واحدة من عبارات البركة الغالية على القصاصين العرب تزين قصته. يحكي معارك غريبة، قصص حب بريء مذهلة، أسفارا مشوقة في 41 بلدان خرافية أو بكل بساطة شجار حانوتي مع جاره، ليلة بائس في العراء، طعام متسول."}, {"fr": "« Les uns l’aiment, les autres le détestent sans le lui dire, mais tous l’écoutent subjugués. « Abdallah paraît détaché; ni l’amour des uns, ni la haine camouflée des autres ne le tirent de son indif- férence. Les amis disent : Abdallah le sage, Abdallah le poète et même Abdallah le voyant. Ses ennemis le qualifient de menteur, d’hypocrite et parfois de sorcier. Qu’est-il donc ? « C’est un épicier qui raconte des histoires.", "ar": "« البعض يحبونه، البعض الآخر يكرهونه لكن لا يخبرونه بذلك، لكن الجميع يستمعون له و هم مفتونون. « يبدو عبد الله لا مباليا؛ لم يكن حب البعض، و لا كره الآخرين يخرجه عن لا مبالاته. يقول الأصدقاء، عبد الله الحكيم، عبد الله الشاعر و أيضا عبد الله العراف. يصفه أعداؤه بالكاذب، بالمنافق و أحيانا بالساحر. ماذا يكون إذن؟"}, {"fr": "« Un notable particulièrement malveillant avait demandé au chef du quartier d’aller écouter les his- toires d’Abdallah parce qu’il y découvrait des allusions et des critiques dirigées contre le Maghzen bien- aimé. « Un autre, au contraire, affirmait que le Maghzen paie cet épicier sans épices pour abrutir la popula- tion et l’empêcher de se mêler des affaires de l’Empire.", "ar": "« إنه بقال يحكي قصصا. « طلب أحد الوجهاء سيئي النوايا من زعيم الحي أن يذهب لسماع قصص عبد الله لأنه اكتشف فيها تلميحات و انتقادات تمس المخزن المحترم. على العكس، أكد واحد آخر بأن المخزن يدفع لهذا البقال عديم البقالة ليخبل الشعب و يمنعه من التدخل في شؤون الحكومة."}, {"fr": "« A tout cela, Abdallah répond par des histoires. Le chef du quartier est devenu son auditeur assidu et fait grand cas de son savoir ou de ce qu’il appelle ainsi; Abdallah prétend ne rien savoir, car, dit-il, les vrais savants ne doivent pas raconter d’histoires, mais dire la vérité, la dire et l’écrire.", "ar": "« كان عبد الله يرد على كل هذا بقصص. أصبح زعيم الحي من مستمعيه المواظبين و كان يقدر علمه أو ما كان يدعوه بهذا؛ يدعي عبد الله بأنه لا يعلم شيئا، لأنه يقول: لا يجب على العلماء الحقيقيين أن يحكوا القصص، بل أن يقولوا الحقيقة، أن يقولوها و يكتبوها."}, {"fr": "« Un savant ayant consacré sa vie à une œuvre d’importance prit un jour tous les feuillets de ses livres et les exposa sur le toit de la Kâaba, la maison de Dieu. Un an après, les feuillets étaient encore à leur place, sans trace de pluie, sans atteinte des agents extérieurs. L’encre s’étalait fraîche sur le papier blanc. Il n’imprima son ouvrage qu’après cette suprême épreuve. Il avait mille fois raison : rien ne peut détruire, effacer ou altérer la vérité.", "ar": "« في يوم من الأيام، أخذ أحد العلماء الذين كرسوا حياتهم لعمل بالغ الأهمية جميع أوراق كتبه و وضعها على سقف الكعبة، بيت الله. بعد مرور عام، كانت الأوراق لاتزال في مكانها، دون أثر مطر، دون مس من عوامل خارجية، كان الحبر يمتد طريا على الورق الأبيض. لم يطبع كتابه إلا بعد هذه التجربة العظيمة. لقد كان معه حق ألف مرة: لا يمكن لشيء أن يدمر، يمسح أو يتلف الحقيقة."}, {"fr": "Et Abdallah ajoutait :", "ar": "« و كان عبد الله يضيف:"}, {"fr": "« - Je ne suis pas un Savant, mes histoires entrent par une oreille et sortent par l’autre. « Est-ce absolument vrai? Est-ce surtout sans exception? Assurément non.", "ar": "« - لست عالما، تدخل قصصي من أذن و تخرج من أخرى. « هل هذا صحيح تماما؟ هل كان بدون استثناء على وجه الخصوص؟ بالتأكيد لا."}, {"fr": "« Les histoires d’Abdallah subissent le sort de toutes les histoires que se transmet l’humanité à travers les âges. Ceux-ci en rient, ceux-là en pleurent; ceux-ci sont sensibles à leur forme extérieure, ceux-là sa- vent en interpréter les signes.", "ar": "« كانت قصص عبد الله تلقى مصير كل القصص التي يتناقلها البشر على مر العصور. يضحك عليها هؤلاء، و يبكي عليها أولئك؛ إن هؤلاء حساسون تجاه شكلهم الخارجي، و أولئك يعرفون تأويل الإشارات."}, {"fr": "« Abdallah raconte une histoire à des enfants. L’un d’eux lui dit:", "ar": "42 يحكي عبد الله قصة للأطفال. قال له أحدهم:"}, {"fr": "« - J’en ai lu une bien plus belle dans mon livre de lecture.", "ar": "« - لقد قرأت أجمل منها في كتاب القراءة خاصتي."}, {"fr": "« - C’est bien possible, répondit Abdallah; seulement l’histoire que tu as lue se trouve dans un livre. Tous tes camarades possèdent ce livre, et peuvent la lire. Mais celle que je t’ai racontée n’est que dans un seul livre, c’est celui-ci... Et il désigna son cœur. « Abdallah ferme chaque soir sa boutique et part à petits pas. Tout le monde dans le quartier ignore son domicile. Il y a bien Si Abdennebi, une mauvaise langue, qui affirme l’avoir vu entrer dans un vulgaire fondouk.", "ar": "« - أجاب عبد الله: هذا ممكن جدا، إلا أن القصة التي قرأتها توجد في كتاب. جميع أصدقائك يملكون هذا الكتاب، و يستطيعون قراءتها. لكن تلك التي حكيتها لك لا توجد إلا في كتاب واحد، إنه هذا... و أشار إلى قلبه. « يغلق عبد الله دكانه كل مساء و يذهب بخطى صغيرة. يجهل جميع سكان الحي محل إقامته. لكن هناك سي عبد النبي، أحد النمامين، الذي يؤكد بأنه رآه يدخل إلى فندوق حقير."}, {"fr": "« Lahbib, au contraire, qui l’a suivi, raconte sa curieuse aventure en ces termes : «Notre-Seigneur Abdallah est un ami de Dieu. Je l’ai suivi, que Dieu me pardonne, jusqu’à Seffah, sur l’autre rive de l’Oued Fès. Dans une impasse, s’ouvre la porte d’une zaouia de zellijs vertes. Il y entre et, au bout d’une minute, je l’y suis. Je le cherche en vain. La zaouia était déserte. J’ai poussé un long tekbir et me suis évanoui. Maintenant je n’écoute pas ce que racontent les ignorants, car moi je sais, oui, je sais que les amis de Dieu ont des demeures cachées. « Lahbib a peut-être raison. Abdennebi, qui était présent, répondit :", "ar": "« على العكس، يحكي الحبيب، الذي تبعه، مغامرته الغريبة بهذه الكلمات: « - إن سيدنا عبد الله هو من أولياء الله. لقد تبعته، فليسامحني الله، إلى غاية صفاح، على الضفة الأخرى لواد فاس. في أحد الأزقة، كان يوجد باب إحدى الزاويات بزليج أخضر. دخل إليها و، بعد دقيقة، تبعته إليها. بحثت عنه دون جدوى. كانت الزاوية مهجورة، أطلقت تكبيرا طويلا ثم أغمي علي. لم أعد أستمع لما يقوله الجهلة الآن، لأنني أعلم، أجل، أعلم بأن أولياء الله لديهم مساكن خفية."}, {"fr": "«Lahbib a trop écouté les histoires d’Abdallah, son cerveau en est malade. Allah est le seul savant : les agissements d’Abdallah ne sont pas ceux d’un honnête musulman. L’avez- vous vu jamais faire sa prière? Quitte-t-il sa boutique à l’heure des repas? Respecte-t-il le vendredi? Prononce-t-il jamais une parole pieuse? C’est un corrupteur, un Satan enturbanné, un démon à barbe blanche qui vit dans le mensonge comme un pourceau dans la fange. « Lahbib, de nature paisible d’ordinaire, rougit d’indignation. Il s’écria:", "ar": "« ربما كان الحبيب على صواب. أجاب عبد النبي الذي كان حاضرا: « - لقد أفرط الحبيب في الاستماع لقصص عبد الله، و قد أثر هذا على عقله. إن الله هو العالم الوحيد: إن أفعال عبد الله لا تشبه ما يقوم به مسلم حقيقي. هل سبق و أن رأيتموه يصلي؟ هل يترك محله في أوقات الطعام؟ هل يحترم يوم الجمعة؟ هل يقول أي كلمة تقية؟ إنه مفسد، شيطان بعمامة، عفريت بلحية بيضاء يعيش في الأكاذيب مثل الخنزير في الوحل."}, {"fr": "« - Faudrait-il donc qu’il te ressemble pour mériter le nom de musulman? Tu fais tes prières, nous en sommes témoins, tu quittes ta boutique aux heures des repas; tu respectes le vendredi et tes discours sont fleuris de citations coraniques et de hadiths. Tout cela, nous en sommes témoins. Mais de ta bouche cou- lent souvent le venin de la médisance, les puanteurs de la calomnie, l’odeur de la mort et d’autres germes de destruction. Tu n’es même pas Satan parce qu’aucune de tes œuvres ne porte le sceau d’une certaine grandeur. Tout au plus, tu es un rat d’égout, mais qui se serait roulé dans de la bonne farine bien blanche. Il pense que la farine le rendra pur, alors que son contact suffit à la souiller. « Abdennebi bondit pour le frapper; Lahbib, forgeron de son métier, l’attrapa par les poignets et sans s’émouvoir continua son sermon:", "ar": "« احمر الحبيب، الذي كان ذا طبيعة هادئة في العادة، من السخط و هتف: « - يجب عليه إذن أن يشبهك ليستحق لقب المسلم؟ أنت تصلي، نحن نشهد على ذلك، تترك محلك في أوقات الطعام؛ تحترم يوم الجمعة و أحاديثك تزينها الاستشهادات القرآنية و الحديث. نحن نشهد على كل هذا. لكن يقطر من فمك دائما سم النميمة، نتانات الافتراء، رائحة الموت و براعم دمار أخرى. لست الشيطان حتى لأنه لا واحدة من أعمالك تحمل بصمة عظمة ما. أنت جرذ مجاري على الأكثر، لكنه تدحرج جيدا في الدقيق الأبيض الجيد. يعتقد بأن الدقيق سيجعله نقيا بينما يكفي أن يلمسه ليصبح متسخا. 43 قفز عبد النبي ليضربه؛ أمسكه الحبيب، الذي يعمل حدادا، من معصميه و تابع وعظه دون أن يتأثر:"}, {"fr": "« - Vois-tu, les faibles ont toujours recours à la violence. Mes bras manient le fer et ne craignent pas le feu ; aussi, je ne l’emploierai pas à écraser les blattes de ton espèce. Je ne défends pas Abdallah l’épicier, j’essaie simplement d’éclairer ton ignorance, toi, qui prétends être si savant ! Mais tu as le crâne épais et l’âme momifiée. Tu es un cadavre et je n’aime pas toucher les charognes.", "ar": "« - أرأيت؟ دائما ما يلجأ الضعفاء إلى العنف، إن ذراعاي تمارسان الحديد و لا تخشيان النار؛ زيادة على هذا، لن أستعملهما لسحق الصراصير من أمثالك. أنا لا أدافع عن عبد الله البقال، أحاول فقط أن أنير جهلك، أنت، من تدعي بأنك تعرف الكثير! لكن لديك جمجمة كبيرة و روح محنطة. أنت جثة و لا أحب لمس الجيفة."}, {"fr": "« Lahbib flanqua Abdennebi contre le mur et partit. Il jeûna plus d’une semaine pour se purifier de sa colère. « Ceci fut raconté à Abdellah. Il resta d’abord silencieux, balançant d’un mouvement solennel son chasse-mouches, puis raconta une histoire ».", "ar": "ألقى الحبيب بعبد النبي في اتجاه الحائط و رحل. صام أكثر من أسبوع ليتطهر من غضبه. « تم إخبار عبد الله بما حدث، في البداية بقي صامتا، مأرجحا منشته بحركة احتفالية، ثم حكى قصة. » 44"}]}, {"fr_title": "Chapitre V", "ar_title": "الفصل 5", "segs": [{"fr": "Je n’avais jamais vu le maître du Msid aussi souriant que ce mercredi. Pas un élève ne reçut la baston- nade. La verge de cognassier devenait un accessoire de fantaisie, un de ces objets inutiles que l’on tient pour occuper les doigts.", "ar": "لم يسبق لي أن رأيت معلم المسيد سعيدا مثل هذا الأربعاء. لم يتلقى أي تلميذ ضربات العصا. كانت عصا السفرجل تصير أداة نزوات، واحدة من تلك الأشياء عديمة الفائدة التي ي مس ك بها لشغل الأصابع."}, {"fr": "Je récitai ma leçon comme de coutume. Le maître me félicita :", "ar": "كنت أتلو درسي كما هي العادة. هنأني المعلم:"}, {"fr": "- C’est bien, mon fils, me dit-il, tu seras, s’il plaît à Dieu, un taleb mendiant de la science. Qu’Allah t’ouvre les portes du savoir !", "ar": "- قال لي: هذا جيد، يا بني، ستكون، إن شاء الله طالبا ساعيا في طلب العلم. فليفتح لك الله أبواب العلم!"}, {"fr": "Avant d’aller déjeuner, le fqih nous fit signe de nous taire. Dans le silence général, il nous parla de l’Achoura, la fête du Nouvel An. Nous devions la célébrer dignement selon l’usage. Notre Msid serait illuminé à partir de minuit. Tous les élèves viendraient pour inaugurer la Nouvelle année dans la joie et dans le travail. Nous avions quinze jours pour préparer la fête. Chacun devait apporter la contenance d’un bol d’huile d’olive pour alimenter les lampes, l’école serait blanchie à la chaux, les vieilles nattes changées et remplacées par des nattes neuves. Le fqih nous demanda de mettre nos parents au courant de ces dispositions. Il comptait sur leur générosité. Enfin, à notre grande joie, nous eûmes congé pour le reste la journée. Quel bonheur! Je courus à la maison en faire part à ma mère. Fatma Bziouya m’apprit qu’elle était absente. Lalla Aïcha, son amie, était venue la chercher, il y avait de cela une heure environ. Ma joie se transforma en appréhension, bientôt en inquiétude. Cette sortie avait certainement une relation quelconque avec l’affaire Moulay Larbi, le mari de Lalla Aicha. Peut-être un nouveau différend l’opposait-il encore à ce démon d’Abdelkader, fils de je ne sais qui? Ne l’avait-on pas enfermé dans une sombre prison? Cela sentait le pacha, le prévôt et leurs sbires.", "ar": "قبل الذهاب للغداء، أشار لنا الفقيه بالسكوت. في الصمت التام، تكلم لنا عن عاشوراء، حفل رأس السنة. كان يجب علينا الاحتفال بها بشكل لائق كما العادة. سيكون مسيدنا م نارا ابتداء من منتصف الليل. سيأتي كل التلاميذ لافتتاح السنة الجديدة بالفرح و الاجتهاد. كان أمامنا خمسة عشر يوما لتحضير الحفل. كان يجب على كل واحد إحضار سعة زبدية من زيت الزيتون لإشعال القناديل، سيتم تبييض المدرسة بالجير، تغيير الحصائر القديمة بأخرى جديدة. نصحنا الفقيه بإخبار والدينا عن هذه الترتيبات. كان يعتمد على كرمهم. في الأخير، بفرح كبير، حصلنا على إجازة لبقية اليوم. يا للسعادة! جريت إلى البيت لأخبر أمي بالأمر. أخبرتني فاطمة بزيوية بأنها لم تكن موجودة. لقد أتت صديقتها لالة عيشة لاصطحابها منذ ساعة تقريبا. تحولت فرحتي إلى تخوف، و سرعان ما صارت قلقا. كان لهذه الخرجة علاقة ما بقضية مولاي العربي زوج لالة عيشة من دون شك. ربما نشب نزاع جديد بينه و بين هذا الشيطان عبد القادر، ابن لا أعرف من؟ ألم يحبس في سجن مظلم؟ كان يبدو أن للباشا، القاضي و رجالهم علاقة بالأمر."}, {"fr": "Ma mère avait laissé la clef sur la porte de la chambre. J’entrai. Les objets ne me reconnaissaient plus, ils m’opposaient un visage hostile. Ils s’amusèrent à m’effrayer, ils se transformaient en monstres, rede- venaient objets familiers, empruntaient de nouveaux masques de bêtes d’apocalypse. Je me tenais sur un matelas, terrifié, la gorge sèche, attendant le retour de ma mère, seule personne capable de me délivrer de ces sortilèges. Je ne bougeais pas, de peur d’exciter l’animosité des êtres qui m’épiaient derrière chaque chose. Des siècles passèrent. Les pas traînants de ma mère me parvinrent du rez-de-chaussée. Je l’entendis tousser. La pièce reprit son aspect de tous les jours. Un rayon de soleil anima les mosaïques décolorées.", "ar": "كانت أمي قد تركت المفتاح على باب الغرفة. دخلت، لم تعد الأشياء تعرفني، كانت تبدي لي وجها عدائيا. تسلت بإرعابي، كانت تتحول لوحوش، ثم تعود أشياء مألوفة من جديد، تستعير أقنعة جديدة من وحوش الكتاب المقدس. كنت جالسا على فراش، فزعا، بحلق جاف، منتظرا عودة أمي، الشخص الوحيد القادر على تحريري من هذه الأسحار. كنت جامدا خوفا من إثارة عداوة الكائنات التي كانت تراقبني خلف كل شيء. مرت قرون. سمعت خطوات أمي البطيئة من الطابق السفلي. سمعتها تسعل. 45 استعادت الحجرة مظهرها اليومي. أضاء شعاع شمس فسيفساءنا الباهت الألوان."}, {"fr": "Ma mère, essoufflée, s’arrêta sur le palier. Je me précipitai à sa rencontre. Fatma Bziouya écaillait de petits poissons ciselés comme des bijoux. Elle reposa son couteau, se lava vaguement les mains, s’essuya à un torchon qu’elle portait en guise de tablier et sans poser de questions attendit que maman lui révélât l’objet de son absence.", "ar": "توقفت أمي اللهثانة في البسطة، أسرعت للقائها. كانت فاطمة بزيوية تقشر أسماكا صغيرة منحوتة كالحلي. وضعت سكينها، رفعت يديها على نحو غامض، تنشفت بفوطة كانت تلبسها عوضا عن مئزر و دون أن تطرح أية أسئلة انتظرت من أمي أن تكشف لها عن سبب غيابها."}, {"fr": "Ma mère, mystérieuse, lui fit promettre la plus grande discrétion. Ensuite, elle se lança dans un long discours chuchoté de bouche à oreille, accompagné de mimique, de larges gestes des deux bras, scandé de soupirs, illustré de hochements de tête.", "ar": "بشكل غامض، جعلتها أمي تعدها بالسرية التامة. بعدها، بدأت تهمس خطابا طويلا من الفم إلى الأذن، مصحوبا بإيمائات، حركات كبيرة بالذراعين، مرفوقة بتنهدات، ممثلة بهزات رأس."}, {"fr": "Fatma écoutait de tout son corps tendu, ses yeux suivaient chaque geste, ses doigts esquissaient in- consciemment des mouvements brefs. Aux soupirs de ma mère, elle répondait par des soupirs, aux ho- chements de tête par des hochements de tête. Le récit s’arrêta court. Fatma, la main droite sur la joue, la main gauche sur le cœur, répétait :", "ar": "كانت فاطمة تنصت بجسم يشمله التوتر، كانت عيناها تتابعان كل حركة، كانت أصابعها تطلق حركات قصيرة لاشعوريا. كانت ترد على تنهدات أمي بتنهدات، على هزات الرأس بهزات رأس. توقفت القصة للحظة. كانت فاطمة و هي تضع يدها اليمنى على خدها و يدها اليسرى على قلبها تردد:"}, {"fr": "- Allah ! Allah ! Allah ! Dieu! Dieu ! Dieu ! - Oui ! disait ma mère, oui ! Tout cela fend le cœur et ne peut laisser indifférente l’âme tendre d’un mu- sulman. On ne peut pas souhaiter à son pire ennemi ce qui vient d’arriver à Lalla Aïcha, mais le Croyant doit remercier Dieu, même dans le malheur.", "ar": "- الله! الله! الله! - كانت أمي تقول: أجل، كل هذا يفطر القلب و لا يمكن أن يدع روح مسلم حنونة بدون مبالاة. ما حصل للالة عيشة لا يمكن للمرء تمنيه لعدوه اللدود، لكن يجب على المؤمن أن يحمد الله، حتى في الشقاء."}, {"fr": "Elle finit par s’apercevoir de ma présence. Elle m’invita à la suivre. Elle se débarrassa de son haïk, quitta ses chaussures de basane noire.", "ar": "أدركت وجودي أخيرا. دعتني لألحق بها. تخلصت من حايكها، نزعت أحذيتها المصنوعة من جلد الخروف الأسود."}, {"fr": "- Je vais, me dit-elle, te donner à manger, tu dois mourir de faim.", "ar": "- قالت لي: سأقدم لك الطعام، لا بد من أنك تتضور جوعا."}, {"fr": "Elle sortit de la réserve à provisions une poterie vernissée d’un brun rouge, y introduisit tout l’avant- bras et finit par extraire une longue lanière de viande de conserve. J’aimais la viande de conserve. Elle me servit dans un plat des morceaux gros comme le pouce, nageant dans une graisse délicieuse qu’elle avait réchauffé avec soin. Le pain était frais et parfumé à l’anis. Je mangeai seul. Ma mère disparut. Je savais qu’elle chuchotait quelque part à Rahma, la locataire du premier, la nouvelle histoire de Lalla Aicha, après lui avoir fait promettre le secret. Je savais aussi que je n’avais qu’à attendre. Je glanerai un mot ici, un autre là, je saurai de quoi il s’agit. Je finis en hâte de manger. J’allai rejoindre ma mère sur la terrasse où Rahma, en effet, assise à l’ombre, sur une peau de mouton, se peignait les cheveux. Elle avait interrompu son travail et écoutait. Sa chevelure noire enduite d’huile d’olive se répandait sur ses épaules. Ma mère disait :", "ar": "أخرجت من مستودع المؤونة جرة مورنشة بسمرة حمراء، أدخلت فيها مرفقها بأكمله و انتهت بإخراج قدة لحم محفوظة. كنت أحب اللحم المحفوظ. قدمت لي في طبق قطعا كبيرة بحجم الإبهام تسبح في مرق لذيذ كانت قد سخنته بعناية. كان الخبز طريا و معطرا باليانسون. أكلت لوحدي. اختفت أمي. كنت أعرف بأنها في مكان ما تهمس لرحمة، مستأجرة الطابق الأول، بالقصة الجديدة للالة عيشة بعد أن تعدها بحفظ السر. كنت أعلم كذلك بأنه ما علي إلا الانتظار. سألتقط كلمة هنا و أخرى هناك ثم سأعرف ما الأمر. أنهيت طعامي في عجلة. ذهبت لألتحق بأمي على السطح الذي كانت رحمة فيه بالفعل جالسة في الظل على جلد 46 خروف و تمشط شعرها. كانت قد أوقفت ذلك العمل للاستماع. كان شعرها الأسود المدهون بزيت الزيتون ينسدل على كتفيها. كانت أمي تقول:"}, {"fr": "- La pauvre femme a tout vendu. Même les rats n’ont plus rien à se mettre sous la dent.", "ar": "- لقد باعت المرأة المسكينة كل شيء. حتى الجرذان لم تجد ما تسد به رمقها."}, {"fr": "- Et l’argent ? interrogea Rahma.", "ar": "- سألت رحمة: و النقود؟"}, {"fr": "Ma mère s’empressa de la renseigner.", "ar": "سارعت أمي بإخبارها."}, {"fr": "- L’argent servira à acheter du matériel à Moulay Larbi et à assurer les premiers frais d’installation de son nouvel atelier.", "ar": "- ستستعمل النقود لشراء العدة لمولاي العربي و لتأمين المصاريف الأولى لتجهيز ورشته الجديدة."}, {"fr": "Rahma hocha la tête pour montrer qu’elle avait parfaitement compris. Elle approuvait :", "ar": "هزت رحمة رأسها لتبين بأنها قد فهمت بشكل تام. كانت توافق:"}, {"fr": "- C’est très bien 1 Très bien !", "ar": "- هذا جيد جدا! جيد جدا!"}, {"fr": "Se sentant encouragée, ma mère expliquait :", "ar": "لإحساسها بالتشجيع، كانت أمي تشرح:"}, {"fr": "- Lalla Aicha, chérifa d’une grande tente, ne peut pas laisser son mari déchoir aux yeux de la corpora- tion des babouchiers et de patron devenir simple salarié. Le Croyant dans ce monde rencontre de nom- breux obstacles, l’essentiel pour lui est de surmonter toutes les difficultés sans jamais se révolter contre son Créateur. Moulay Larbi, homme généreux, mérite qu’une femme aux sentiments nobles se dépouille de ses bijoux et de son mobilier afin qu’il ne perde pas la face aux yeux de ses pairs. Lalla Aïcha fait une bonne action. Dieu la lui rendra au centuple, le Jour où le fils ne peut venir en aide à son père, le Jour où le père ne peut dérober les enfants de son sang à la sentence du Suprême Juge. Seules nos bonnes et nos mauvaises actions pèseront dans la Balance. Faibles et chétives comme nous sommes, nous ne pouvons compter que sur la miséricorde d’Allah l’Omnipotent.", "ar": "- لم تكن لالة عيشة، شريفة من الدار الكبيرة، لتسمح بانحدار زوجها في عيون مجلس بائعي الب لغات و يتحول من رئيس إلى موظف بسيط. يواجه المؤمن العديد من العقبات في هذا العالم، المهم بالنسبة له هو تخطي جميع الصعوبات دون التمرد على خالقه. إن مولاي العربي رجل كريم و يستحق أن تتخلى امرأة بمشاعر نبيلة عن مجوهراتها و عقارها لكي لا يفقد ماء وجهه أمام أقرانه. تقوم لالة عيشة بعمل حسن. سيعيده الله لها أضعافا مضاعفة، يوم لا ينفع الابن أباه، يوم لا يقدر الأب على تخليص أطفاله من حساب القاضي الأعلى. ستوزن فقط أفعالنا الحسنة و السيئة في الميزان. ضعيفات و هزيلات كما نحن، لا نستطيع الاعتماد إلا على رحمة الله القدير."}, {"fr": "Rahma lui fit écho :", "ar": "رددت رحمة بعدها:"}, {"fr": "- Qu’il soit glorifié 1 Il n’y a de Dieu que Lui.", "ar": "- تبارك و تعالى! لا إلاه إلا هو."}, {"fr": "Le silence régna. Rahma continua à tirer sur ses cheveux à l’aide d’un peigne de corne. Ma mère se mit debout, poussa un long soupir, dit enfin :", "ar": "عم الصمت. تابعت رحمة مشط شعرها بمشط القرن. وقفت أمي، أطلقت تنهدا طويلا، قالت في الأخير:"}, {"fr": "- J’ai aidé de mon mieux Lalla Aïcha dans ses démarches, maintenant, je me sens triste et fatiguée.", "ar": "- بذلت وسعي لمساعدة لالة عيشة في مساعيها، أحس الآن بأنني حزينة و متعبة."}, {"fr": "Nous nous engageâmes dans l’escalier, ma mère et moi. Des cris, des hurlements déchirèrent l’atmosphère. La tempête de pleurs et de vociférations s’intensi- fia. Le bruit venait de la maison voisine. Nous remontâmes en courant. La surprise passée, des questions fusèrent de partout :", "ar": "توجهت أنا و أمي إلى الدرج. 47 مزقت أصوات و صرخات الجو. اشتدت عاصفة البكاء و الصياح. كان الصوت قادما من المنزل المجاور. أعدنا الصعود جريا. بعد المفاجئة، انهمرت الأسئلة من كل مكان: - من الذي مات؟ من الذي مات؟"}, {"fr": "- Qui est mort ? Qui est mort ? Des groupes de femmes s’étaient formés au-dessus des murs qui surplombaient notre terrasse et celle de la maison d’où partaient les cris de désespoir. Elles jacassaient, expliquaient, gesticulaient, tendaient le cou pour entendre de nouveaux hurlements. On distinguait dans le vacarme une voix plus grêle que les autres se lamenter. Les femmes arrivaient des terrasses éloignées, sautaient par-dessus les murs de séparation, jonglaient avec une échelle trop courte. Les unes se tenaient à califourchon sur le mur, les autres laissaient pendre leurs jambes. Une vieille né- gresse, dont je ne voyais que la tête et les deux bras nus d’un noir luisant, agita ses deux mains dont les paumes rosées me fascinaient ; elle imposa silence aux femmes.", "ar": "كانت مجموعات من النساء قد تشكلت فوق الجدران التي تشرف على سطحنا و على السطح الذي جاءت منه أصوات اليأس. كن يثرثرن، يشرحن، يلوحن، يمددن أعناقهن لسماع أصوات جديدة. كان يسمع وسط الضجة صوت أكثر حدة ينتحب. كانت النساء تأتين من السطوح البعيدة، تقفزن من فوق جدران الفصل، تقمن بألعاب بهلوانية باستعمال سلم قصير. كانت بعضهن تجلسن مفرشخات على الجدار و أخريات يتركن سيقانهن تتدلى. كانت زنجية عجوز لم أكن أرى إلا رأسها و ذراعيها المكشوفين و اللذين كان لهما لون أسود براق، تحرك يديها اللتين كان لونهما الوردي يفتنني؛ أجبرت النساء على الصمت."}, {"fr": "- Je sais qui est mort, répéta à plusieurs reprises la vieille esclave : Sidi Mohammed ben Tahar, le coif- feur. Il était malade depuis deux mois.", "ar": "- رددت العبدة العجوز عدة مرات: أعرف من مات، سيدي محمد بن الطاهر، الحلاق. كان مريضا منذ شهرين."}, {"fr": "- De quoi est-il mort? demanda une jeune femme qui portait sur la tête un foulard jaune.", "ar": "- سألت امرأة شابة كانت تلبس منديلا أصفر على رأسها: بماذا مات؟"}, {"fr": "- Dieu seul le sait, répondit la négresse, mais c’est bien Sidi Mohammed ben Tahar, le coiffeur, qui est mort. Les femmes restèrent silencieuses. La tête de la négresse disparut. Les mains s’arrêtèrent un moment sur l’arête du mur puis s’évanouirent à leur tour.", "ar": "- أجابت الزنجية: الله وحده يعلم، لكن إن سيدي محمد بن الطاهر، الحلاق، هو من مات حقا. بقيت النساء صامتات. اختفى رأس الزنجية. توقفت الأيدي للحظة على حافة الحائط، ثم اختفت بدورها."}, {"fr": "Tout le monde dans le quartier connaissait Sidi Mohammed ben Tahar, le coiffeur. Il s’habillait de blanc, portait une barbe rare et sur ses lèvres flottait un éternel sourire. Il faisait son marché lui-même et maintes fois je l’avais croisé dans notre impasse chargé d’un couffin d’alfa; on y pouvait voir les légumes de la saison, quelquefois un morceau de viande rose, des oignons ou de l’ail.", "ar": "كان جميع من في الحي يعرفون سيدي محمد بن الطاهر، الحلاق. كان يلبس الأبيض، كانت لديه لحية خفيفة و تعلو شفتيه ابتسامة دائمة. كان يتسوق بنفسه و سبق و أن التقيت به عدة مرات في زقاقنا و هو يحمل قفة من الحلفاء؛ كانت تبرز منها خضر الفصل، أحيانا قطعة لحم وردية، بصل أو ثوم."}, {"fr": "Les hurlements s’étaient calmés, le vacarme s’était transformé en lamentations continues sur un ton grave, une sorte de chant au rythme naïf. Ma mère descendit dans la chambre, elle remonta, la tête enveloppée dans une légère couverture. Elle dit à Rahma :", "ar": "كانت الصرخات قد هدأت، كانت الضجة قد تحولت إلى نحيب متواصل بنبرة خفيضة، ما يشبه غناء مستسلما لإيقاع ساذج. نزلت أمي إلى الغرفة، صعدت ثانية، برأس ملفوف بغطاء خفيف. قالت لرحمة:"}, {"fr": "- Je vais passer par-dessus le mur, cela me fera du bien d’aller pleurer un peu.", "ar": "- سأمر من فوق الجدار، سيفيدني الذهاب للبكاء قليلا."}, {"fr": "- Mé, lui dis-je, emmène-moi, je veux, moi aussi, pleurer un peu. - Non, décida ma mère, tu es encore trop jeune et puis tu es un garçon. Tout à l’heure, les récitateurs du Coran viendront psalmodier et tu pourras te joindre à eux.", "ar": "48 - قلت لها: مي، خذيني معك، أنا كذلك أريد البكاء قليلا. - قالت أمي بحزم: لا، لازلت صغيرا ثم إنك ولد. بعد قليل، سيأتي مقرئو القرآن ليجودوا و ستستطيع الالتحاق بهم."}, {"fr": "- Je veux pleurer ! Je veux pleurer ! insistai-je.", "ar": "- أصريت: أريد البكاء! أريد البكاء!"}, {"fr": "- Attrape et pleure pour de bon.", "ar": "- خذ و ابك بجدية."}, {"fr": "Cette phrase fut accompagnée d’un soufflet magistral.", "ar": "كانت هذه الجملة مصحوبة بصفعة قوية."}, {"fr": "Je me mis à sangloter. Rahma intervint en ma faveur. Elle finit par convaincre ma mère de m’emmener. Les deux femmes m’aidèrent à franchir le mur mitoyen. Je ne pleurais plus. Je sautais les marches quatre à quatre pour rejoindre les pleureuses au rez-de-chaussée.", "ar": "بدأت بالبكاء، تدخلت رحمة لصالحي. انتهت بإقناع أمي باصطحابي. ساعدتني المرأتان على تخطي الجدار المشترك. كنت قد توقفت عن البكاء. كنت أقفز الدرجات أربعة بأربعة لألتحق بالباكيات في الطابق السفلي."}, {"fr": "Elles étaient une vingtaine qui manifestaient bruyamment leur douleur. Par terre, il y avait des mate- las et des nattes. D’autres pleureuses arrivaient, s’annonçaient dès l’entrée par des cris stridents. Celles qui étaient déjà à la maison leur répondaient par d’autres vociférations. La femme du coiffeur, la voix enrouée, gémissait, se donnant de grands coups du plat de la main, sur les joues et sur les cuisses. Le spectacle me fascinait au point d’oublier le but de ma visite. J’étais venu pour pleurer et je ne pleurais pas. J’essayais de comprendre ce que disait une vieille femme échevelée. Elle baissait la tête jusqu’au sol, la relevait, chantait en allongeant les finales : Tu étais le pilier de ma maison Tu étais mon parasol et mon bouclier", "ar": "لقد كن عشرين واحدة تعبرن عن ألمهن بصخب. على الأرض، كان هناك فرش و حصائر. كانت باكيات أخريات تأتين، تطلقن أصوات حادة منذ المدخل. كانت أولئك اللواتي كن في البيت مسبقا ي ج ب ن هن بصرخات أخرى. كانت زوجة الحلاق تنتحب بصوت مبحوح وتهوي بضربات قوية بيد مبسوطة على خديها و فخديها. كان المنظر يفتنني لدرجة أنني نسيت هدف زيارتي. كنت قد أتيت للبكاء و لم أكن أبكي. كنت أحاول أن أفهم ما كانت تقوله امرأة عجوز شعثاء. كانت تخفض رأسها حتى الأرض، تعيد رفعه، تغني و هي تمدد النهايات:"}, {"fr": "Tu étais le cavalier courageux. Sans toi la maison deviendra sombre Sans toi, le soleil deviendra froid.", "ar": "لقد كنت عماد المنزل لقد كنت شمسيتي و درعي لقد كنت الفارس الشجاع سيصير المنزل مظلما بدونك بدونك، ستصبح الشمس باردة، بدونك، لم يعد لدي عينان لأرى بهما."}, {"fr": "Sans toi, je n’ai plus d’yeux pour voir. Mes yeux ne pourront plus s’arrêter de couler Mes yeux verseront des larmes de sang.", "ar": "لن تستطيع عيناي التوقف عن البكاء بعد الآن ستبكي عيناي دموع دم."}, {"fr": "Mes yeux se dessécheront et j’errerai dans les ténèbres. Une jeune femme étrangère à la maison restait enveloppée dans son haïk. Elle répétait sur tous les tons: O ma mère ! O ma pauvre mère !", "ar": "ستجف عيناي و سأضيع في الظلمات. بقيت امرأة شابة غريبة عن البيت مغلفة بحايكها. كانت تردد بجميع النبرات:"}, {"fr": "O ma mère ! Je t’aimais plus que tout au monde Certaines hoquetaient sans rien dire, d’autres invoquaient les saints, adressaient de ferventes prières à Dieu et à son Prophète. Dans un coin, des enfants pleurnichaient. Je m’approchai d’eux. Je trouvai Zineb. Elle déployait de vains efforts pour faire comme les autres, se frottait les yeux, mais aucune larme n’en coulait. Ils étaient toujours aussi secs et aussi brillants que quand elle me faisait quelque misère. Je la regardai un moment et d’un mouvement aussi prompt qu’inattendu, je lui envoyai un coup de poing sur le nez. Des torrents de larmes lui inondèrent le visage. Ses cris dominèrent le tumulte. Je me sauvai sur la terrasse.", "ar": "يا أمي! يا أمي المسكينة 49 يا أمي! كنت أحبك أكثر من أي شيء في العالم، كانت بعضهن تفقن دون قول شيء و أخريات تدعين الأولياء، تخاطبن الله و رسوله بأدعية ورعة. في ركن ما، كان هناك أطفال يبكون. اقتربت منهم. وجدت زينب هناك، كانت تحاول عبثا أن تفعل مثل الآخرين، تفرك عينيها، لكن لم تكن أي دمعة تسيل. كانتا دائما جافتين و لامعتين هكذا عندما كانت تتسبب لي ببعض المتاعب. نظرت إليها للحظة وبحركة سريعة و غير متوقعة، باغتها بلكمة على الأنف. غلب صراخها على الجلبة. هربت إلى السطح."}, {"fr": "J’avais perdu de vue ma mère. Je savais qu’elle devait gémir vociférer tout à son aise, sans s’occuper de ses voisines.", "ar": "كانت أمي قد غابت عن ناظري. كنت أعلم بأنها تنتحب و تصرخ براحتها، دون الاكتراث بجاراتها."}, {"fr": "Les psalmistes furent annoncés à la porte de la maison. Les femmes se réfugièrent au premier étage. Elles continuaient à pleurer en sourdine pendant que les récitateurs du Coran entamaient un long cha- pitre. Enfin, ma mère remonta, me prit par la main et m’aida à repasser le mur de séparation.", "ar": "قد م المقرئون أنفسهم عند باب البيت. لجأت النساء إلى الطابق الأول. كن يتابعن البكاء بصمت بينما كان المجودون يباشرون حزبا طويلا. أخيرا، صعدت أمي من جديد، أخذتني من يدي و ساعدتني لأتجاوز جدار الفصل. ذهبنا إلى غرفتنا."}, {"fr": "Nous allâmes dans notre chambre. Fatma Bziouya vint demander à ma mère comment allait la femme du coiffeur. Quelles étaient les femmes qui pleuraient ? La mère du coiffeur était-elle encore vivante? Ma mère parla de la douleur de la femme du coiffeur, cita les noms de quelques assistantes, avoua qu’elle ignorait J’existence de la mère.", "ar": "أتت فاطمة بزيوية لتسأل عن حال زوجة الحلاق. من كانت النساء اللواتي كن يبكين؟ هل كانت أم الحلاق ما تزال حية؟ تكلمت أمي عن ألم زوجة الحلاق، ذكرت أسماء بعض الحاضرات، اعترفت بأنها كانت تجهل إن كانت أم الحلاق ما تزال حية."}, {"fr": "Lalla Kanza, la chouafa, de son rez-de-chaussée, prit part à la conversation. Tout le monde tira de l’évé- nement cette conclusion éminemment philosophique : tous les êtres sont mortels ; tôt ou tard viendra notre tour.", "ar": "اشتركت لالة كنزة، الشوافة، من طابقها الأرضي، في الحديث. خرج الجميع من هذا الحادث بهذا الاستنتاج الفلسفي للغاية: كل الكائنات فانية؛ عاجلا أم آجلا سيأتي دورنا."}, {"fr": "Le bourdonnement des récitateurs nous parvenait à travers les murs. De temps à autre, la femme du coiffeur poussait un long hurlement. Chacun de ses cris arrachait un puissant soupir à ma mère. Je n’osais pas jouer. Pouvais-je décemment sortir mes bibelots, le jour où Sidi Mohammed ben Tahar le coiffeur, une personnalité importante de notre impasse, quittait à jamais ses parents, ses amis et ses clients ? Tout à l’heure, après les ablutions rituelles, il sera vêtu pour la dernière fois de blanc. Des hommes le porteront sur leur tête sur une confortable civière en bois de cèdre et iront l’enfouir dans la terre hu- mide. La terre se refermera pour l’éternité sur Sidi Mohammed ben Tahar, le coiffeur. Je rêvais à tout cela, accoudé à la balustrade de notre fenêtre. Une grande tristesse m’envahit. La fatigue s’empara de mes membres. Je demandai à ma mère la permission de m’allonger sur le grand lit. Elle accepta. Je me jetai dessus et continuai à penser à l’enterrement du coiffeur. Je le voyais, étroitement cousu dans sa cotonnade blanche, rigide sur sa civière recouverte d’un toit, voyager sur une mer de têtes enturbannées, dans un concert de litanies et d’invocations. J’avais déjà vu passer dans la rue des cortèges d’enterrement. Parfois, les hommes marchaient lentement, solennellement et chantaient un cantique avec des voix profondes comme des gouffres, parfois ils étaient très peu nombreux et pressaient le pas. Ils se contentaient de répé- ter d’une voix de tête la formule de l’unité de Dieu: la chahada (Il n’y a de Dieu qu’Allah et Mohammed est son Prophète). J’avais vu même des morts découverts, posés simplement sur la civière et sans personne pour les ac- compagner à leur dernière demeure. J’avais trouvé cela infiniment triste.", "ar": "كان طنين المقرئين يصلنا عبر الجدران. من وقت لآخر، كانت نساء الحلاق تطل قن صرخة طويلة. كانت كل واحدة من هذه الصرخات تنتزع تنهدا قويا من أمي. لم أكن أجرؤ على اللعب. هل كان من اللائق أن أخرج تحفي في اليوم الذي كان فيه سيدي محمد بن الطاهر الحلاق، شخصية مهمة في زقاقنا، يفارق والديه، أصدقاءه و زبائنه إلى الأبد؟ بعد قليل، بعد الغسل الاعتيادي، سيتم تلبيسه بالأبيض لآخر مرة. سيحمله رجال على رؤوسهم في نقالة مريحة من خشب الأرز و سيذهبون لطمره 50 في الأرض المبللة. ستقفل الأرض إلى الأبد على سيدي محمد بن الطاهر، الحلاق، كنت أحلم بكل هذا، متكئا على درابزين نافذتنا. غمرني حزن كبير. تمكن التعب من أعضائي. طلبت من أمي الإذن للتمدد على السرير الكبير. وافقت. ارتميت عليه و تابعت التفكير في دفن الحلاق. كنت أراه، ملفوفا بدقة في قماشه القطني الأبيض، صلبا على نقالته المغطاة بسقف، يسافر على بحر من الرؤوس المعممة، وسط احتفال من الابتهالات و الأدعية. سبق و أن رأيت مواكب دفن تمر في الشارع. أحيانا، كان الرجال يمشون ببطء و وقار و يرددون تراتيل بأصوات عميقة مثل الهاوية، أحيانا، يكونون قليلين جدا و يحثون الخطى. كانوا يكتفون بترديد كلمة التوحيد بنشاز: الشهادة (لا إلاه إلا الله و محمد رسول الله). لقد رأيت موتى مكشوفين حتى، موضوعين على النقالة ببساطة دون شخص لمرافقتهم إلى مثواهم الأخير. لقد بدا لي ذلك محزنا للغاية."}, {"fr": "Mon père, à qui j’avais fait part de mon impression trouva cette histoire pour me consoler : Dans un souk très fréquenté, tenait boutique Sidi... (J’en ai oublié le nom). C’était un homme pieux, honnête et courtois envers tout le monde. Chaque fois qu’un cortège funèbre traversait le souk, ce saint personnage prenait ses babouches les enfilait en hâte, et accompagnait le mort jusqu’au cimetière. Un jour, vinrent à passer deux croquemorts transportant la civière où gisait le cadavre d’un mendiant que personne n’accompagnait. L’homme se leva, prit ses babouches de dessus l’étagère où il les rangeait chaque Jour, mais resta debout sans les enfiler. Il finit par les remettre à leur place. Les boutiquiers jugè- rent sa conduite peu charitable.", "ar": "وجد أبي، الذي أخبرته بانطباعي، هذه القصة لمواساتي: في سوق يتردد عليه الناس كثيرا، كان سيدي... (لقد نسيت اسمه) يملك دكانا، كان رجلا تقيا، شريفا و مؤدبا مع الجميع. في كل مرة يعبر موكب دفن السوق، كان هذا الشخص الطاهر يتناول بلغته، يلبسها سريعا، و يرافق الميت حتى المقبرة. ذات يوم، حدث و أن مر دافنان حاملين نقالة كان يرقد فيها متسول لم يكن يرافقه أحد. نهض الرجل، تناول بلغته من أعلى الرف الذي كان يضعها فيه كل يوم، لكنه بقي واقفا دون أن يلبسها. انتهى بإعادتها إلى مكانها. قال أصحاب الدكاكين بأن تصرفه لم يكن إنسانيا."}, {"fr": "- Il n’accompagne que les cortèges d’enterrement de riches, dirent-ils.", "ar": "- قالوا: لا يرافق إلا مواكب دفن الأغنياء."}, {"fr": "Sidi ... qui surprit leurs murmures leur déclara :", "ar": "أعلن سيدي... الذي سمع تهامسهم:"}, {"fr": "- Êtes-vous des croyants ? Alors, écoutez pourquoi je n’ai pas accompagne ce frère Jusqu’à sa tombe. Quand j’ai pris mes babouches, j’en avais l’intention, mais j’ai vu arriver derrière la civière une foule immense d’êtres d’une incomparable beauté. C’étaient les anges du Paradis. Moi, simple pécheur, je n’ai point ose me mêler à ces formes de lumière. Un ami de Dieu s’en allait dans la miséricorde de son Créa- teur. J’étais heureux de le savoir et me rassis parmi mes épices.", "ar": "- هل أنتم مؤمنون؟ إذن، اسمعوا لماذا لم أرافق ذلك الأخ إلى غاية قبره. عندما تناولت بلغتي، كنت أنوي فعل ذلك، لكنني رأيت وراء النقالة حشدا كبيرا من كائنات فائقة الجمال. لقد كانت ملائكة الجنة. أنا، مجرد آثم، لم أتجرأ مطلقا على الاختلاط بمخلوقات النور هذه. كان عبد لله ينتقل إلى رحمة خالقه. كنت سعيدا لمعرفة ذلك و جلست ثانية بين توابلي."}, {"fr": "Chaque fois que je rencontrais deux croque-morts portant un cadavre solitaire, Je répétais avec eux : - Dieu t’accompagne, ô étranger, sur cette terre! J’ajoutais aussi mentalement : « Lui aussi rejoint sa tombe accompagné d’une foule d’anges d’une incomparable beauté. » J’en étais tout heureux.", "ar": "في كل مرة كنت أرى فيها دافنين حاملين جثة وحيدة، كنت أردد معهما: إن الله معك، يا أيها الغريب، على هذه الأرض! 51 كنت أضيف كذلك في ذهني: « هو كذلك يلتحق بقبره برفقة حشد من الملائكة فائقة الجمال. » كنت سعيدا جدا لذلك."}, {"fr": "Les cris et les hurlements reprenaient avec une intensité croissante. Ils transperçaient les murs, défer- laient comme le bruit des vagues ou le déchaînement d’une tempête.", "ar": "عادت الأصوات و الصرخات بشدة متزايدة. كانوا يخترقون الجدار، يتكسرون مثل صوت الأمواج أو هيجان العاصفة."}, {"fr": "Les femmes de notre maison lâchèrent leur ouvrage. Elles se mirent à pleurer, à gémir près de leurs braseros et de leurs marmites.", "ar": "تركت نساء البيت أعمالها. بدأن بالبكاء، بالنحيب إلى جانب مواقدهن و طناجرهن."}, {"fr": "Le corps devait probablement quitter la maison. C’était un moment pathétique. J’entendais toujours le bourdonnement des psalmistes. Le soleil se cacha derrière un nuage, une immense peine s’abattit sur la terre. J’éclatai en sanglots. Ma mère affolée oublia le coiffeur et son enterrement et se précipita pour me demander les raisons de mes larmes. Elle me questionnait, inquiète.", "ar": "لقد كان الجسم يغادر البيت على الأرجح. كانت لحظة مؤسفة. كنت لا أزال أسمع ضجة المجودين. اختبأت الشمس وراء سحابة، عصف ألم كبير بالأرض. انفجرت بالبكاء. نسيت أمي الحلاق و دفنه و أسرعت و هي مرعوبة لتسألني عن سبب بكائي. كانت تستجوبني و هي قلقة."}, {"fr": "- Où t’es-tu fait mal? Un insecte t’a-t-il piqué? As-tu des coliques?", "ar": "- ما الذي يؤلمك؟ هل لسعتك حشرة؟ هل تشعر بمغص؟"}, {"fr": "Je reniflais de plus belle, je ne répondais pas. La crise dura un long moment. Je refusai de manger. Ma mère avait fait cuire des lentilles à la tomate et aux oignons. Je les aimais d’habitude, mais je ne voulais pas y toucher. Je restais allongé sur le lit. Ma mère étendit sur moi une couverture de laine grège ornée aux extrémités de bandes rouges. Je somnolai jusqu’à l’arrivée de mon père, tard dans la soirée. J’acceptai de boire un verre de lait et me replongeai sous la couverture. Mon père parut très préoccupé à mon sujet. Il me toucha les tempes plusieurs fois, me prit la main, ar- rangea ma couverture avec des gestes d’officiant. Je voyais ses lèvres remuer. Je savais qu’il récitait quelque invocation ou quelque verset au pouvoir salvateur.", "ar": "كنت أتنفس جيدا، لم أكن أجيب. دامت النوبة مدة طويلة. امتنعت عن الأكل. كانت أمي قد طبخت عدسا بالطماطم و البصل. كنت أحبها عادة، لكن لم أكن أريد أن آكلها. بقيت ممددا على السرير. غطتني أمي بغطاء من الصوف الحريري مزين في أطرافه بشرائط حمر. غفوت حتى عودة أبي، في وقت متأخر من المساء. وافقت على شرب كأس حليب و غطست ثانية تحت الغطاء. لقد بدا أبي مشغول البال بشأني. لمس صدغ ي عدة مرات، أمسك يدي، رتب غطائي بحركات ضبط. كنت أرى شفتيه تتحركان. كنت أعلم أنه يتلو بعض الأدعية أو الآيات ذات القدرة الشفائية."}, {"fr": "« Je vais peut-être mourir, moi aussi, pensais-je. Peut-être aurai-je, derrière mon cercueil, des anges beaux comme la lumière du jour! »", "ar": "كنت أفكر: « ربما سأموت، أنا أيضا، ربما سيكون وراء تابوتي ملائكة جميلون مثل ضوء النهار!"}, {"fr": "J’imaginais le cortège : quelques personnes du quartier, le fqih de l’école coranique, mon père, plus grave que jamais et des anges, des milliers d’anges vêtus de soie blanche. A la maison, ma mère pousserait des cris à se déchirer le gosier, elle pleurerait pendant des jours et pendant des nuits. Elle serait toute seule le soir pour attendre le retour de mon père.", "ar": "كنت أتخيل الموكب: بعض الأشخاص من الحي، فقيه الكتاب القرآني، أبي، أكثر جدية من أي وقت و ملائكة، آلاف الملائكة يلبسون حريرا أبيضا. في البيت، كانت أمي لتطلق صرخات تمزق الحلق، كانت لتبكي ليلا و نهارا. كانت لتنتظر أبي لوحدها في المساء."}, {"fr": "Non! Je ne voulais pas mourir !", "ar": "لا! لم أكن أريد الموت!"}, {"fr": "- Je ne veux pas mourir! criais-je en me dressant dans mon lit. Je ne veux pas mourir ! Je rejetai ma couverture et me mis debout, hurlai cette phrase de toute la force de mes poumons. Mon père me recoucha, tempéra par des paroles douces mes angoisses. Ma mère, les yeux bouffis, répétait : - Mon petit enfant ! Mon petit enfant!", "ar": "- كنت أصرخ جالسا في سريري: لا أريد أن أموت! لا أريد أن أموت! رميت الغطاء و وقفت، صحت بهذه الجملة بكامل قوة رئتي. أعادني أبي للنوم بدد مخاوفي بكلمات مطمئنة. كانت أمي تردد بعينين منتفختين: 52 - صغيري! صغيري!"}, {"fr": "Je me calmai. Mes oreilles se mirent à siffler. J’écoutais, à travers ce bruit d’eau, ma mère raconter les événements de la journée. La mort de Sidi Mohammed ben Tahar, le coiffeur, les malheurs de Lalla Ai- cha, la vente de ses bijoux et de son mobilier. Elle disait que Sidi Larbi L’Alaoui allait installer un atelier et se remettre au travail. Elle louait la générosité et le courage de Lalla Aicha, lançait des imprécations contre les hypocrites, les escrocs, les gens sans foi ni loi comme cet Abdelkader, fils de je ne sais qui.", "ar": "هدأت. بدأت أذناي بالصفير. كنت أسمع ، خلال خرير الماء هذا، أمي و هي تروي أحداث النهار. موت سيدي محمد بن الطاهر، الحلاق، متاعب لالة عيشة، بيع مجوهراتها و عقارها. كانت تقول بأن سيدي العربي العلوي سيجهز ورشة جديدة و يستأنف العمل. كانت تمدح كرم و شجاعة لالة عيشة، تلعن المنافقين، النصابين، الناس بدون دين و لا ملة مثل عبد القادر هذا، ابن لا أعلم من."}, {"fr": "Pendant ce temps, entre les franges de mes cils, je voyais descendre du plafond de beaux anges blancs, je distinguais les plumes de leurs ailes couleur d’argent. L’un d’eux posa sur mon lit ma Boîte à Mer- veilles. Elle grandit démesurément, prit la forme d’un cercueil. Tout heureux j’y entrai. Le couvercle tomba. Dans la boîte régnait une fraîcheur de roses et de fleurs d’orangers. La Boîte fut emportée par delà les nuages dans des palais d’émeraude. Tous les oiseaux chantaient. Je retrouvai les deux moineaux qui chaque matin me réveillaient. Ils discutaient comme de coutume:", "ar": "خلال هذا الوقت، بين أهداب رموشي، كنت أرى ملائكة جملاء تنزل من السقف، أميز ريش أجنحتهم بلون الفضة. وضع أحدهم علبة العجائب خاصتي على سريري. كبرت بشكل مبالغ فيه، اتخذت شكل تابوت. دخلت إليها بفرح. أغلق الغطاء. كانت تسود في العلبة برودة ورود و أزهار أشجار البرتقال. حملت العلبة إلى ما وراء السحب و قصور الزمرد. كانت جميع الطيور تغرد. وجدت الدوريين اللذين كانا يوقظانني كل صباح؟ كانا يتحدثان مثل العادة:"}, {"fr": "- J’aime les figues sèches.", "ar": "- أحب التين المجفف."}, {"fr": "- Pourquoi aimes-tu les figues sèches ?", "ar": "- لماذا تحب التين المجفف؟"}, {"fr": "- Tout le monde aime les figues sèches", "ar": "- يحب الجميع التين المجفف."}, {"fr": "- Oui ! Oui ! Oui !", "ar": "- أجل! أجل! أجل!"}, {"fr": "- Tout le monde aime les figues sèches.", "ar": "- يحب الجميع التين المجفف."}, {"fr": "- Les figues sèches !", "ar": "- التين المجفف!"}, {"fr": "- Les figues sèches !", "ar": "- التين المجفف!"}, {"fr": "-Les figues sèches !", "ar": "- التين المجفف!"}, {"fr": "Une sensation de brûlure sur les paupières m’obligea à ouvrir les yeux. Un rayon de soleil entrait par la fenêtre. Il me tombait droit sur le visage. Les moineaux chantaient les vertus des figues sèches. - Que ta matinée soit bénie, mon petit! me dit ma mère avec un large sourire. Tu vas mieux mainte- nant; tu avais un peu de fièvre cette nuit. Aujourd’hui promets-moi d’être bien sage. Tu n’iras pas à l’école.", "ar": "أجبرني شعور بالاحتراق في جفني على فتح عيني. كان هناك شعاع شمس يدخل من النافذة. كان ينزل مباشرة على وجهي. كان الدوريان يتكلمان عن مزايا التين المجفف. - قالت لي أمي بابتسامة عريضة: فليكن صباحك مباركا يا صغيري، هل تحسنت الآن؛ كنت تعاني البارحة من بعض الحمى. عدني اليوم بأن تكون عاقلا جدا. لن تذهب إلى الك تاب."}, {"fr": "- Je ne suis pas malade, lui dis-je.", "ar": "- قلت لها: أنا لست مريضا."}, {"fr": "- Je sais! Je sais ! Joue tranquillement dans ton coin. Mange ce beignet, il est tout chaud.", "ar": "53 - أعرف! أعرف! ا لعب بهدوء في ركنك. كل هذه الفطيرة، إنها ساخنة جدا."}, {"fr": "Je pris le beignet.", "ar": "أخذت الفطيرة."}, {"fr": "Driss le teigneux appela du rez-de-chaussée. Il arrivait avec les provisions pour la journée. Ma mère descendit les chercher. J’entendis Fatma Bziouya qui disait :", "ar": "نادى إدريس الفظ من الطابق الأرضي. لقد جاء محضرا مؤونة اليوم. نزلت أمي لإحضارها. سمعت فاطمة بزيوية تقول:"}, {"fr": "- Déjà de la mauve ! Elle est d’un beau vert!", "ar": "- الخبازى منذ الآن! إنها طرية جدا."}, {"fr": "Ma mère répondit par une phrase que je ne saisis pas. Elle entra dans sa cuisine, remua des seaux, ac- tionna son soufflet, pila dans le mortier de bronze ses épices. Au premier étage Rahma s’affairait sur le palier. Elle activait aussi le feu et pilait des condiments. Quelqu’un chantonnait. Notre vieux soufflet se fit de nouveau entendre. Il était fatigué et ne savait dire que ces mots : Des mouches !", "ar": "أجابت أمي بجملة لم أفهمها. دخلت إلى مطبخها، خشخشت دلاء، حركت منفخها، دقت توابلها داخل مهرسها النحاسي. في الطابق الأول، كانت رحمة تنشغل في البسطة. كانت تشعل النار كذلك و تدق توابلا. كان هناك من يدندن. سمع صوت منفخنا القديم من جديد. لقد كان متعبا و لم يكن يعرف ما يقول إلا هذه الكلمات:"}, {"fr": "Des mouches! Des mouches!", "ar": "ذباب! ذباب! ذباب!"}, {"fr": "Celui de Rahma variait son répertoire. Parfois il prenait plaisir à répéter:", "ar": "كان الخاص برحمة ي ن و ع سجله. كان يستمتع أحيانا بترديد:"}, {"fr": "J’ai chaud!", "ar": "أشعر بالحر!"}, {"fr": "J’ai chaud! J’ai chaud! Ou alors :", "ar": "أشعر بالحر! أشعر بالحر!"}, {"fr": "Je souffre!", "ar": "أو ربما:"}, {"fr": "Je souffre!", "ar": "إنني أتألم!"}, {"fr": "Je souffre! Je cessai d’écouter les soufflets. D’autres bruits venaient me distraire. Des explosions d’étincelles rou- laient comme des billes qui se répandaient sur le parterre en mosaïques. Fatma Bziouya cardait sa laine. Des phrases chuchotées montaient du rez-de-chaussée. Lalla Kanza parlait à une cliente. Un éclat de rire troubla l’atmosphère. Il fut bref et sans conséquence. Un pigeon roucoula sur la terrasse. Il disait des mots si jolis que je souriais aux anges. Je remarquai sur une solive deux mouches se livrer à une poursuite, s’arrêter sans raison puis reprendre leur course à l’aventure. A la porte de la maison quelqu’un heurta le marteau.", "ar": "إنني أتألم! إنني أتألم! توقفت عن الاستماع إلى المنافيخ. قدمت أصوات جديدة لتسليني. كانت انفجارات شرارات تتدحرج مثل البلي التي كانت تنتشر على أرض الفسيفساء. كانت فاطمة بزيوية تندف صوفها. كانت جمل محموسة تصعد من الطابق الأرضي، كانت لالة كنزة تتحدث إلى زبونة. عك رت موجة من الضحك الجو. كانت قصيرة و بدون نتائج. هدلت حمامة على السطح. كانت تقول كلمات جميلة جدا لدرجة أنني ابتسمت للملائكة. رأيت على عارضة خشبية ذبابتين تلاحقان بعضهما، تتوقفان بدون سبب ثم تتابعن سباقهما نحو المغامرة. كان هناك من دق المقرعة عند باب المنزل."}, {"fr": "- Qui est là ? demandèrent plusieurs voix.", "ar": "54 - سألت عدة أصوات: من هناك؟"}, {"fr": "Qui que ce fût, je n’avais nulle envie de le savoir. Du ciel coulait jusqu’à moi un son frêle, un chant ténu et fragile comme un fil de la vierge. Le Moudden annonçait la prière. D’un lointain minaret me parvenait en larges ondes la formule : Dieu est le plus grand ! Le chant mourait, se fondait dans le bleu du ciel, renaissait, s’affirmait avec une certaine vigueur, se dissolvait de nouveau dans l’air du printemps.", "ar": "أيا كان، لم تكن لدي أدنى رغبة في أن أعرف. كان هناك صوت ضعيف يصلني من السماء، غناء رفيع و ضعيف مثل خيط العنكبوت. كان المودن يؤذن للصلاة. كانت عبارة: الله أكبر! تصلني بموجات عريضة من صومعة بعيدة. كان الصوت يموت، يذوب في زرقة السماء، يعود من جديد، يظهر بقوة معينة، يختفي من جديد في جو الربيع."}, {"fr": "Un gros bourdon, d’un noir métallique, se laissa choir par l’ouverture qui dominait le patio, claqua contre le mur et se projeta violemment par la fenêtre de notre chambre, sur le verre de la lampe à pétrole. Le verre tinta mais résista au choc. L’insecte sortit avec autant de précipitation qu’il était entré. Cette visite m’enchanta. Je me mis à rire et à taper des mains. J’épiai encore un moment les bruits de la maison, mais ce jeu me lassa. Ma mère revint me voir, me sourit et satisfaite sans doute de l’état de ma santé et de ma grande sagesse, repartit travailler dans ses seaux et piler ses aromates.", "ar": "سقطة طنانة كبيرة ذات سواد معدني عبر الفتحة التي كانت تغلب على الفناء، صفقت الجدار و ارتمت بعنف عبر نافذة غرفتنا على زجاج قنديل الزيت. رن الزجاج لكنه قاوم الصدمة. خرجت الحشرة بنفس العجلة التي دخلت بها. فتنتني هذه الزيارة. بدأت بالضحك و التصفيق. راقبت أصوات المنزل لمزيد من الوقت، لكنني مللت من هذه اللعبة. عادت أمي لرؤيتي، ابتسمت لي و لكونها راضية بدون شك عن حالتي الصحية و عن هدوئي، عادت ثانية لتقلقل داخل دلاءها و تدق توابلها."}, {"fr": "Pour m’occuper, je récitai le peu de Coran que je savais, d’abord à mi-voix, ensuite de toute la force de mes cordes vocales, je scandais les mots du livre saint avec passion. Ma mémoire tarit. J’hésitai un instant avant de reprendre, avec plus de ferveur, ma psalmodie. J’inventais mon propre Coran. Des mots sans suite et sans signification prenaient leur vol, tournoyaient dans l’atmosphère de la chambre, jaillissaient vers le ciel comme des essaims de papillons richement colorés.", "ar": "لأشغل نفسي، تلوت آيات القرآن القليلة التي كنت أعرف، في البداية بصوت منخفض، ثم بكامل قوة حبالي الصوتية. كنت أرتل كلمات المصحف الكريم بشغف. جفت ذاكرتي. ترددت للحظة قبل أن أستأنف تجويدي بورع أكثر. كنت أخترع قرآني الخاص. كانت كلمات بدون تتمة و بدون معنى ت قل ع، تدور في جو الغرفة، تتدفق نحو السماء مثل سرب من الفراشات ملونة بغنى."}, {"fr": "Ma mère vint encore me voir. Elle me conseilla moins d’ardeur dans mon chant. Je pouvais avoir un accès de fièvre. Elle tira de sa robe une chaînette de cuivre rongée de vert-de-gris et me la tendit:", "ar": "أتت أمي لرؤيتي ثانية. نصحتني بأن أقلل من حيويتي في التجويد. ربما أصاب بنوبة حمى. أخرجت من فستانها سلسلة نحاسية نخرها الزنجار و مدتها لي:"}, {"fr": "- Ajoute ceci à tes merveilles, me dit-elle. La chaînette délicatement travaillée absorba mon attention. Je la contemplai longtemps. Je décidai de la nettoyer. Je savais transformer le cuivre, cette vile matière, en or pur. Je sortis sur le palier. Dans une boîte de conserves cabossée, je découvris du sable fin qui servait au nettoyage des tables rondes et des plateaux à thé. Je m’attelai à l’ouvrage activement. J’en avais mal aux doigts quand le résultat attendu parut à mes yeux. J’effectuai de nombreux rinçages dans un seau d’eau noirâtre où nageait un petit balai de doum. Ma chaîne se changea en bijou d’or. Je l’enroulai autour de mon poignet pour en admirer l’effet : je la tenais par les deux bouts, me l’appliquais sur la poitrine, sur le front, je m’en faisais un bracelet. Je sortis ma Boîte. J’étalai toutes mes richesses sur une couverture.", "ar": "- قالت لي: أضف هذه إلى عجائبك، امتصت السلسلة المصممة بدقة إعجابي. تأملتها لمدة طويلة. قررت تنظيفها. كنت أعرف تحويل النحاس، هذه المادة الحقيرة، إلى ذهب خالص. خرجت إلى البسطة. داخل علبة مصبرات محدبة، وجدت رملا دقيقا كان يستعمل لتنظيف الموائد المستديرة و صينيات الشاي. انهمكت في العمل بحيوية. كانت أصابعي تؤلمني عندما ظهرت النتيجة المنتظرة 55 أمام عيني. قمت بعدة شطفات داخل دلو مس ود كانت مكنسة دوم صغيرة تسبح فيه. تحولت سلسلتي إلى حلية ذهبية. لففتها حول معصمي لأعاين النتيجة: كنت أمسكها من كلا الطرفين، أضعها على صدري، على جبهتي، كنت أجعلها سوارا. أخرجت علبتي. نشرت كل كنوزي على غطاء."}, {"fr": "Les plus humbles de mes boutons et de mes clous, par une opération de magie dont j’avais seul le se- cret, se muèrent en joyaux.", "ar": "تحولت أكثر أزراري و مساميري تواضعا، بعملية سحرية كنت وحدي من يعرف سرها، إلى جواهر."}, {"fr": "Absorbé dans la contemplation de mes trésors, je n’avais pas vu entrer le chat de Zineb. Il ronronna tout contre moi. Je ne le craignais pas. Je décidai de l’associer à ma joie, de lui ouvrir les portes de mon univers. Il s’intéressa gravement à mes discours, allongea la patte pour toucher mon cabochon de verre taillé, regarda avec étonnement ma chaîne d’or. Je lui en fis un collier. Il se montra d’abord tout fier. Il essaya ensuite de l’arracher. Elle ne céda pas à ses coups de griffes. Il se mit en colère, s’affola et partit en flèche, la queue hérissée, les yeux dilatés d’inquiétude. Je courus derrière lui pour récupérer mon bien. Le maudit chat resta sourd à mes appels. Il ne voulait rien avoir de commun avec moi, il grimpait les marches de l’escalier, crachait des menaces.", "ar": "غارقا في تأمل كنوزي، لم أكن قد رأيت قط زينب عند دخوله. ماء بشدة تجاهي. لم أكن أخشاه. قررت أن أش رك ه في فرحي و أفتح له أبواب عالمي. اهتم كثيرا بخطاباتي، مد قائمته ليلمس حجري الكريم من الزجاج المرصع، نظر إلى سلسلتي الذهبية بدهشة. صنعت له منها عقدا. بدا فخورا في البداية. ثم حاول نزعه بعد ذلك. لم يستسلم لضربات مخالبه. استشاط غضبا، ذعر و رحل كالسهم، بذيل منفوش، بعينين متمددتين من القلق. ركضت خلفه لأستعيد ممتلكي. لم يجب القط اللعين على نداءاتي. لم يكن يريد أن تكون له أي صلة بي، كان يتسلق درجات الدرج، يطلق تهديدات."}, {"fr": "J’alertai ma mère, demandai secours à Fatma Bziouya, à Rahma et même à mon ennemie Zineb, la propriétaire de ce démon quadrupède. Tout le monde se précipita sur la terrasse mais le chat, ne sachant pas pourquoi on le poursuivait, s’usait les griffes à grimper le long d’un mur d’une hauteur vertigineuse. J’étais furieux contre le chat. Les femmes essayèrent de me consoler.", "ar": "نبهت أمي، طلبت النجدة من فاطمة بزيوية، من رحمة و حتى من عدوتي زينب، صاحبة هذا العفريت رباعي الأرجل. أسرع الجميع إلى السطح لكن القط، لجهله سبب ملاحقتنا له، كان يكشط مخالبه ليتسلق طول جدار ذو ارتفاع شاهق. كنت حانقا من القط. كانت النساء تحاولن مواساتي."}, {"fr": "- Il reviendra ce soir, Zineb te rendra ta chaîne.", "ar": "- سيعود هذا المساء، ستعيد لك زينب سلسلتك."}, {"fr": "Zineb! Zineb ! C’était elle qui l’avait chargé de venir se frotter contre moi, abuser de ma gentillesse et me voler mon plus beau bijou. Je suffoquais de colère et d’indignation. Ma rage se déchaîna; je me pré- cipitai sur Zineb. Je lui enfonçai les ongles dans les joues, lui arrachai les cheveux par touffes, lui envoyai de formidables coups de pieds dans le ventre. Elle se défendit, la brute, avec violence, me tira les oreilles, me renversa par terre, me marcha sur la poitrine. Les femmes criaient, essayaient de nous séparer et rece- vaient des coups de poing et des coups de tête des deux adversaires.", "ar": "زينب! زينب! كانت هي من حرضه ليأتي و يحتك بي، يستغل طيبتي و يسرق مني أجمل ح ل يي. كنت أختنق من الغضب و السخط. اشتعل غيظي؛ انقضضت على زينب. غرزت أظافري في خديها، نتفت شعرها بخصل، سددت لها ركلات رائعة على البطن. دافعت عن نفسها، المتوحشة، بعنف، شدت أذناي، أوقعتني أرضا، داست على صدري. كانت النساء تصرخن، تحاولن تفريقنا و تتلقين لكمات و ضربات رأس من كلا الخصمين."}, {"fr": "Enfin ma mère réussit à me maîtriser. Elle m’amena dans la chambre, me plongea la tête dans un seau d’eau, m’essuya le visage avec un torchon et m’intima l’ordre de me coucher. La poitrine encore secouée de sanglots, je m’endormis presque immédiatement.", "ar": "تمكنت أمي أخيرا من السيطرة علي. أدخلتني إلى الغرفة، أدخلت رأسي في دلو من الماء، نشفت وجهي بفوطة و أصدرت لي أمرا بالنوم. كان صدري لايزال يهتز بالبكاء، نمت على الفور تقريبا. 56"}]}, {"fr_title": "Chapitre VI", "ar_title": "الفصل 6", "segs": [{"fr": "On accédait à la salle d’école par quatre marches. Le Msid, longue pièce quelque peu rustique, com- portait une vaste soupente. Le maître installa là-haut deux jarres en poterie vernissée, pour recueillir l’huile d’olive que les élèves apportaient par bouteilles et par bols. Les grands en avaient la responsabilité.", "ar": "كنا نلج إلى صالة الكتاب عبر أربعة درجات. المسيد، حجرة طويلة ريفية نوعا ما، كانت بها غرفة علوية واسعة. وضع فيها المعلم جرتين من الخزف المورنش، لاحتواء زيت الزيتون التي كان يحضرها التلاميذ في قنينات و زبديات. كان الكبار مسؤولين عن ذلك."}, {"fr": "Pour l’achat des nattes neuves, chacun y contribua selon ses moyens. Le père d’un élève exerçait le mé- tier de chaufournier. Il fit don à l’école d’une charge d’âne de chaux. Le lundi, huit jours avant la fête de l’Achoura, les vieilles nattes furent remisées dans la soupente. Le maître forma des équipes et en nomma les chefs. On emprunta des seaux et des balayettes de doum.", "ar": "لشراء حصائر جديدة، شارك كل واحد حسب إمكانياته. كان أب أحد التلاميذ يعمل كسخان لغلاية الماء. وهب للمدرسة بح م ل حمار من الجير. في يوم الإثنين، قبل ثمانية أيام من حفل عاشوراء، تم وضع الحصائر القديمة في الغرفة العلوية. ش ك ل المعلم فرقا و عين زعماء عليها. استعرنا دلاء و مكنسات صغيرة من الدوم."}, {"fr": "Le travail commença. Dans un vacarme d’injures, d’exclamations, de pleurs et d’éclats de rire, quelques- uns s’emparèrent des têtes de loup, hautement perchées sur des roseaux, s’escrimèrent longtemps afin de nettoyer le plafond et les murs de leurs toiles d’araignées.", "ar": "بدأ العمل. وسط ضجة من الشتائم، الانفعالات، البكاء و موجات الضحك، فصل البعض رؤوس الذئب، المعلقة بعظمة على أبواص، لقد بذلوا جهدهم لمدة طويلة بهدف تنظيف السقف و الجدران من نسائج العناكب."}, {"fr": "Deux seaux énormes de lait de chaux furent préparés. Une dizaine d’élèves, armés de balayettes, entre- prirent de badigeonner les murs. Ils maniaient hardiment leurs balais, éclaboussaient au passage des enfants qui piaillaient. Ils recevaient dans les yeux la chaux vive, se mettaient à hurler, abandonnant leur besogne. D’autres les remplaçaient, pleins d’ardeur. Des disputes éclataient. Tout le monde criait à la fois. Parfois, au-dessus de cette marée, grondait la voix du maître. Le bruit cessait une seconde, puis reprenait, plus exaspéré, plus aigu. Je réussis à m’emparer d’une balayette, je la plongeai dans le lait de chaux et, tout heureux, je fonçai sur le mur pour montrer à toutes ces larves comment on badigeonnait sérieusement. Je me heurtai à un rempart de bras roses, de bouches ouvertes, d’yeux exorbités de fureur.", "ar": "تم تحضير دلوي كبيرين من حليب الجير. باشر عشرة تلاميذ يحملون مكانس صغيرة، تجيير الجدران. كانوا يمسكون مكانسهم بجرأة، يلطخون في طريقهم أطفالا يصرخون. كانوا يتلقون الجير الحار في أعينهم، يبدأون بالصياح، تاركين أشغالهم. كانوا آخرون يحلون محلهم، مفعمين بالحيوية. كانت تنشب شجارات. كان الجميع يصرخون في الوقت نفسه. أحيانا، فوق هذه الجماعة، كان صوت المعلم يدوي. كانت الضجة تتوقف للحظة، ثم تستأنف أكثر هيجانا و ح د ة. تمكنت من الحصول على مكنسة صغيرة، غمرتها في حليب الجير و كلي فرح، انقضضت على الجدار لأري لهذه اليرقات كيف ن جير بجدية. اصطدمت بحائط من الأذرع الوردية، الأفواه المفتوحة، الأعين الجاحظة من الغضب."}, {"fr": "Des mains s’agrippèrent à ma balayette. Je résistai de toutes mes forces, mais la lutte s’avérait inégale. Je lâchai le précieux instrument et me trouvai assis dans une flaque d’eau qui me gelait le derrière. Je ne songeai pas à pleurer, je me relevai, décidé à reprendre mon bien. Je me jetai dans la mêlée, mais la voix du maître domina le tumulte.", "ar": "تمسكت أيد بمكنستي الصغيرة. قاومت بكل قواي، لكن تبين بأن قتال كان غير متكافئ. أفلت الأداة القيمة و وجدت نفسي جالسا في بركة ماء كانت تجمد مؤخرتي. لم أكن أفكر في البكاء، نهضت، مصمما على استرجاع ممتلكي. ارتميت في العراك، لكن صوت المعلم سيطر على الضجة."}, {"fr": "Nous nous arrêtâmes, frémissants de colère. Étendant nos bras et nos mains, les doigts écartés, nous nous mîmes tous à expliquer l’objet du malentendu; nous demandions tous justice; la voix de chacun de nous essayait de dominer celle des autres.", "ar": "57 توقفنا، منتفضين من الغضب. مادين أذرعنا و أيدينا، بأصابع متباعدة، بدأنا جميعنا بشرح موضوع سوء التفاهم؛ كنا جميعنا نطالب بالعدالة؛ كان صوت كل واحد فينا يحاول أن يغلب على أصوات الآخرين."}, {"fr": "Le maître nous imposa silence, nous releva de nos fonctions et voyant nos mines dépitées, nous conseilla d’attendre qu’il eût besoin de nous. Nous attendîmes dans un coin. Le fqih décréta que, seuls, les grands étaient admis à passer les murs au lait de chaux. Nous attendîmes jusqu’au soir que le maître nous char- geât de rendre le moindre service. Il n’en fut rien!", "ar": "أمرنا المعلم بالصمت، سحب منا وظائفنا و لرؤيته لمظهرنا البائس، نصحنا بانتظار أن يكون في حاجة إلينا، انتظرنا في أحد الأركان. أعلن الفقيه بأن الكبار فقط هم من كان مسموحا لهم بطلاء الجدران بحليب الجير. انتظرنا حتى المساء أن يكلفنا المعلم بأدنى عمل. لم يفعل ذلك."}, {"fr": "Les murs étaient blanchis. Le lendemain, des équipes furent de nouveau constituées, chaque groupe avait sa spécialité. Je devins un personnage important. Je fus nommé chef des frotteurs. On procéda au lavage du sol. Une vingtaine d’élèves, chargés d’énormes seaux, faisait la corvée d’eau. Ils allaient la cher- cher à la fontaine d’une zaouïa située à cinquante pas de notre école.", "ar": "تم تبييض الجدران. في اليوم التالي، تم تكوين مجموعات من جديد، كان لكل مجموعة اختصاصها. أصبحت شخصية مهمة. ع ي نت كزعيم للفاركين. قمنا بغسل الأرض. كان عشرون تلميذا يحملون دلاء كبيرة يقومون بسخرة الماء. كانوا يذهبون لإحضاره من نافورة زاوية تقع على بعد خمسين خطوة من ك ت ابنا."}, {"fr": "Le sol fut inondé. Je pris très au sérieux mon travail et, pour donner l’exemple, je maniai avec énergie ma balayette. J’en avais mal aux reins. De temps à autre, je me redressais tout rouge. Les muscles des bras me faisaient mal. Au repos, je les sentais trembler. Dans l’eau jusqu’aux chevilles, pieds nus, bousculé par celui-ci, insulté par celui-là, j’étais heureux! Adieu les leçons, les récitations collectives, les planchettes rigides, rébarbatives, inhumaines! Frottons le sol en terre battue, incrusté de poussière et de crasse, orné d’énormes étoiles de chaux, qui résistaient à notre brossage énergique.", "ar": "تم غمر الأرض بالماء. حملت عملي على محمل الجد و، لأعطي المثال، كنت أستعمل مكنستي الصغيرة بنشاط. لقد آلمني هذا في كبدي. من وقت لآخر، كنت أقف مح مر ا. كانت عضلات الذراعين تؤلمني. كنت أحس بأنها ترتجف عندما أرتاح. في الماء حتى الكاحلين، حافي القدمين، يدفعني هذا و يشتمني ذاك، كنت سعيدا! وداعا للدروس، التلاوات الجماعية، الألواح الصلبة، البغيضة، القاسية! لنفرك الأرض الترابية المغطاة بالغبار و القذارة، مزينة بنجوم كبيرة من الجير، التي كانت تصمد أمام فركنا الحيوي."}, {"fr": "- Aïe! Tu m’as donné un coup de coude dans l’œil.", "ar": "- آخ! لقد أعطيتني ضربة كوع في عيني."}, {"fr": "- Fais attention ! Tu m’as mouillé jusqu’à la ceinture.", "ar": "- احترس! لقد بللتني حتى الحزام."}, {"fr": "- Regarde Driss, il est tombé dans le seau.", "ar": "- أنظر! لقد سقط إدريس في الدلو."}, {"fr": "- Ha ! Ha ! Il va se noyer ! Il va se noyer! - Frottez paresseux.", "ar": "- ها! ها! سيغرق! سيغرق! - أفركوا أيها الكسالى."}, {"fr": "- Paresseux toi-même, notre coin est plus propre que le tien.", "ar": "- أنت هو الكسول، إن ركننا أنظف من خاصتك."}, {"fr": "Avec des chiffons de jute, nous essuyâmes partout.", "ar": "نشفنا كل مكان بخرق من الجوت."}, {"fr": "Le soir, je revins à la maison mort de fatigue, mais très fier de ma journée. Devant mes parents je me vantai de mes multiples exploits. Je réussis à les convaincre que sans moi aucun résultat sérieux n’aurait été obtenu. Mon père me féli- cita. Il dit à ma mère que je devenais vraiment un homme. Je me mis au lit.", "ar": "في المساء، عدت إلى البيت ميتا من التعب، لكن فخورا جدا بنهاري. 58 كنت أتباهى بإنجازاتي العديدة أمام والدي. نجحت في إقناعهم بأنه لولاي لما كان هناك أي عمل متقن. هنأني والدي. قال لأمي بأنني بدأت أصبح رجلا حقا. ذهبت للنوم."}, {"fr": "Pendant mon sommeil, il m’arriva de me mettre sur mon séant, de hurler des ordres, de distribuer des injures. Ma mère me recouchait avec des gestes tendres, des phrases affectueuses.", "ar": "خلال نعاسي، حدث و أن جلست في سريري، ألقي أوامرا، أوزع شتائما. كانت أمي تعيدني للنوم بحركات رقيقة، ج مل حنونة."}, {"fr": "Le matin, je me préparai pour partir à l’école, ma mère m’
