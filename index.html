en empêcha. Elle m’expliqua qu’elle avait besoin de moi pour l’accompagner à la Kissaria, le marché des tissus. Il était temps de songer à mes habits de fête. J’applaudis avec enthousiasme.", "ar": "في الصباح، استعددت للذهاب للك تاب، منعتني أمي. قالت بأنها كانت في حاجة إلي لأرافقها إلى القيسارية، سوق الأقمشة. كان الأوان قد آن للتفكير في ملابس العيد خاصتي. صفقت بحماسة."}, {"fr": "- Est-ce que j’aurai une chemise neuve?", "ar": "- هل سأحصل على قميص جديد؟"}, {"fr": "- Tu auras une chemise neuve.", "ar": "- ستحصل على قميص جديد."}, {"fr": "- Est-ce que je porterai un gilet avec des soutaches?", "ar": "- هل سأرتدي صدارا بشرائط؟"}, {"fr": "- Tu porteras un gilet avec des soutaches.", "ar": "- سترتدي صدارا بشرائط."}, {"fr": "- Est-ce que je mettrai ma djellaba blanche que tu as rangée dans le coffre ?", "ar": "- هل سألبس جلبابي الأبيض الذي وضعته في الصندوق؟"}, {"fr": "- Tu porteras ta djellaba blanche, des babouches neuves que te fabrique Moulay Larbi, le mari de Lalla Aicha et une belle sacoche brodée.", "ar": "- ستلبس جلبابك الأبيض، البلغة الجديدة التي سيصنعها لك مولاي العربي، زوج لالة عيشة و حقيبة مطرزة."}, {"fr": "Je me dressai de toute ma taille, je bombai le torse; j’esquissai même quelques pas d’une danse barbare. Je ne me livrais à de telles excentricités que dans des circonstances exceptionnelles. J’allais même pousser un ou deux hululements quand ma mère me rappela à plus de dignité.", "ar": "وقفت منتصب القامة، دفعت صدري؛ ابتدأت بعض خطوات رقصة بربرية حتى. لم أكن أستسلم إلى مثل تلك النزوات إلا تحت ظروف استثنائية. كنت سأبلغ حد إصدار صرخة أو اثنتين عندما ذكرتني أمي بأن أحفظ كرامتي."}, {"fr": "Fatma Bziouya riait à gorge déployée. Son rire ne me choquait pas. Ce matin, je me sentais capable de bonté, d’indulgence, j’étais d’une générosité sans bornes. Je pardonnais à Zineb, dans mon for intérieur, toutes les misères qu’elle m’avait fait subir; je pardonnais à son chat qui était revenu après s’être débarrassé de son collier, ma belle chaîne d’or, je pardonnais aux mardis d’être des jours trop longs, à la baguette de cognassier de mordre si souvent la chair fragile de mes oreilles, je pardonnais aux jours de lessive d’être particulièrement froids et tristes, je pardonnais tout au monde ou du moins à ce que je connaissais du monde. Je laissai ma mère vaquer à ses multiples besognes avant de se préparer pour sortir et je montai sur la terrasse où personne ne pouvait me voir éparpiller aux quatre vents l’excès de joie dont je me sentais déborder. Je courais, je chantais, je battais violemment les murs avec une baguette trouvée là par le plus heureux des hasards. La baguette devenait un sabre. Je la maniais avec adresse. Je pourfendais des ennemis invisibles, je coupais la tête aux pachas, aux prévôts des marchands et à leurs sbires. La baguette devenait cheval et je paradais, tortillant du derrière, lançant des ruades. J’étais le cavalier courageux, vêtu d’une djellaba immaculée et d’un gilet à soutaches. Ma sacoche brodée me tirait l’épaule tant ma provision de cartouches pesait lourd. Je lâchai ma baguette, je dégringolai l’escalier pour répondre à l’appel de ma mère.", "ar": "كانت فاطمة بزيوية تضحك ملء شدقيها. لم يكن ضحكها يفاجئني. هذا الصباح، كنت أحس بأنني قادر على إبداء طيبة، ح لم، كنت أبدي كرما لا حدود له. كنت أسامح زينب من أعماق قلبي، كل المتاعب التي سببتها لي؛ كنت أسامح قطها الذي عاد بعد أن تخلص من عقده، سلسلتي الذهبية الجميلة، كنت أسامح أيام الثلاثاء لكونها أياما طويلة جدا، عصا السفرجل لعضها الدائم للحم أذني الضعيف، كنت أسامح أيام الغسيل لكونها باردة و حزينة للغاية، كنت أسامح كل شيء في العالم أو على الأقل ما كنت أعرفه من العالم. تركت أمي تتفرغ لأشغالها المتعددة قبل أن أجهز نفسي للخروج و صعدت إلى السطح الذي لم يكن أحد يستطيع أن يراني فيه و أنا أفرغ فرط السعادة التي كنت أشعر بأنني مفعم بها. كنت أجري. أغني، أضرب الجدران 59 بعنف بواسطة عصا وجدتها هناك و يا لمحاسن الصدف. كانت العصا تصبح سيفا. كنت أستعمله بمهارة. أقطع رؤوس الباشوات، قضاة التجار و رجالهم. كانت العصا تصبح حصانا و أتبختر، أهز مؤخرتي، مرسلا رفسات. كنت الفارس الشجاع، اللابس لجلباب ناصع و صدار بشرائط. كانت حقيبتي المطرزة تجر كتفي نظرا لأن مخزوني من الخراطيش كان ثقيلا. رميت عصاي، نزلت الدرج بسرعة لأجيب نداء أمي."}, {"fr": "Quand je l’avais entendue, elle me traitait déjà de juif, de chien galeux et de bien d’autres noms peu flatteurs. Cela ne devait pas être son premier appel. Elle avait dû, comme toujours, m’appâter par des mots gentils, des phrases du genre :", "ar": "عندما سمعتها، كانت قد بدأت بنعتي باليهودي، بالكلب الأجرب و بأسماء أخرى ليست مستحسنة. لم يكن ذالك نداءها الأول. لا بد من أنها، كما العادة، أغوتني بكلمات لطيفة، كلمات مثل:"}, {"fr": "- Est-ce que mon chérif a assez joué ?", "ar": "- هل لعب شريفي بما فيه الكفاية؟"}, {"fr": "- Mon chérif ne veut-il pas répondre à sa maman ?", "ar": "- ألا يريد شريفي أن يجيب أمه؟"}, {"fr": "- Descends vite, mon chérif!", "ar": "- إنزل بسرعة، يا شريفي!"}, {"fr": "- Qu’attends-tu pour descendre, tête de mule? - Tu ne m’entends pas, âne à face de goudron? - Que t’arrive-t-il, chien galeux?", "ar": "- ما الذي تنتظره لتنزل أيها العنيد؟ - ألا تسمعني، يا حمارا وجهه كالزفت؟"}, {"fr": "- Attends que je monte te chercher, juif sans dignité!", "ar": "- ما الذي حصل لك، أيها الكلب الأجرب؟"}, {"fr": "Dans la fièvre du jeu, l’ivresse de la cavalcade, je n’avais pas entendu toute cette oraison. Seuls les termes insultants de juif et de chien galeux m’avaient brutalement jeté dans le monde du réel. Je rejoignis ma mère, l’oreille basse, le coude levé en bouclier pour parer à toute tentative de violence.", "ar": "- انتظر لأصعد لك، أيها اليهودي عديم الكرامة. في خضم شغف اللعبة و نشوة الركب، لم أكن قد سمعت كل هذا الابتهال. فقط الكلمات الشاتمة يهودي و كلب أجرب هي من رماني في العالم الحقيقي. التحقت بأمي مذلولا و رافعا كوعي لأتفادى أية محاولة عنف."}, {"fr": "Ma mère, tout en me reprochant avec véhémence ma conduite, se contenta de me prendre par les épaules et de me secouer. Elle était prête pour sortir. Drapée dans son haïk blanc, des babouches noires aux pieds, elle se hâta de se voiler le visage étroitement de cotonnade blanche et nous partîmes. Rahma la pria de se renseigner sur les prix actuels des tissus, notamment sur le prix de cette mousseline appelée « persil » et de ce satin à la mode, qui portait le joli nom de « bouquet du sultan ».", "ar": "اكتفت أمي، مع لومي بشدة على سلوكي، بإمساكي من كتفي و توبيخي. كانت جاهزة للخروج، ملفوفة في حايكها الأبيض، ببلغة سوداء في قدميها، أسرعت بتغطية وجهها بقماش قطني أبيض بإحكام و ذهبنا. رجتها رحمة أن تستعلم لها عن الأثمنة الحالية للقماش، لاسيما ثمن ذلك الموصلين المسمى « بقدونس » و ذلك الساتان الرائج، الذي كان يحمل اسم « باقة السلطان »."}, {"fr": "Nous avions déjà parcouru un certain trajet, nous arrivions presque au tournant de la ruelle, quand Lalla Kanza, la chouafa, nous rappela. Ma mère répugnait à refaire le même chemin. Elle lui dem1nda de loin ce qu’elle voulait. De la mai- son, la principale locataire manifesta son intention de renouveler le stock de ses robes de confréries. Il lui fallait un nombre important de coudées de satinette noire pour calmer l’humeur du grand génie bienfaisant, le roi Bel Lahmer. Depuis quelque temps, elle sentait aussi un mal sournois, dû à l’action de Lalla Mira. Pour faire cesser le mal, une robe d’un jaune de flamme s’avérait nécessaire. Il y avait bien Sidi Moussa à satisfaire, sa couleur était le bleu roi, mais la robe de l’année dernière pouvait encore servir. - Donne l’argent à mon fils.", "ar": "كنا قد قطعنا مسافة معينة و كدنا نبلغ منعطف الزقاق، عندما نادتنا لالة كنزة، الشوافة. لم تكن أمي تستحسن فكرة أن نعود أدراجنا. سألتها من بعيد عن ما تريده. من البيت، عبرت المستأجرة الرئيسية عن رغبتها في تغيير مخزون 60 فساتين أخوياتها. كان يلزمها عدد كبير من الأذرع من الساتين الأسود لتهدئ مزاج العفريت الكبير النافع، الملك بلحمر. مؤخرا، كانت تحس بشر ماكر، بسبب أفعال لالة ميرا. لتوقف الشر، كان لا بد من فستان أصفر كاللهب. كان يجب إرضاء سيدي موسى كذلك، كان لونه المفضل هو الأزرق الملكي، لكن فستان السنة الماضية لازال صالحا للاستعمال. - أعطي النقود لابني."}, {"fr": "Ma mère me poussa dans la direction de la maison. - Je pourrai en effet t’éviter toutes ces courses.", "ar": "دفعتني أمي في اتجاه المنزل. - أستطيع بالفعل أن أجنبك كل هذه المشتريات."}, {"fr": "La chouafa me donna l’argent. Elle ne voulait plus acheter que la satinette noire. Enfin, nous nous trouvâmes bientôt dans la rue.", "ar": "أعطتني الشوافة النقود. لم تعد تريد فقط شراء الساتين الأسود. في الأخير، سرعان ما وصلنا إلى الشارع."}, {"fr": "Près de Sidi Ahmed Tijani, cette mosquée aux portes richement décorées, une femme se précipita sur ma mère. Elle débordait de joie, remerciait Dieu de nous avoir mis sur son chemin. Elle se pencha sur moi et colla son voile rêche sur ma joue pour m’embrasser. C’était une voisine de Lalla Aicha, l’amie de ma mère. Les deux femmes s’appuyèrent au mur de la mosquée et entamèrent une longue conversation sur l’affaire Moulay Larbi qui, grâce au dévouement de Lalla Aicha, s’était si heureusement terminée. Moulay Larbi méritait d’ailleurs un tel sacrifice. Dès que son atelier serait prospère, il ne manquerait pas de racheter à sa femme bijoux, meubles et couvertures. 11 n’était pas homme à oublier les services rendus. Toutefois, avant de nous quitter, la voisine ajouta cette phrase perfide: - Mais qui peut se fier aux hommes? J’ai été mariée trois fois, chaque fois mon époux ne songeait qu’à me dépouiller du peu de bien que je possédais. Espérons que Lalla Aicha n’est pas tombée sur un ingrat et un odieux simulateur.", "ar": "قرب سيدي أحمد التيجاني، هذا المسجد ذي الأبواب المزينة بغنى، اندفعت امرأة نحو أمي، كان الفرح يملأها، كانت تشكر الله لأنها التقت بنا. انحنت علي و ألصقت حجابها الخشن على خدي لتقبيلي. لقد كانت جارة للالة عيشة، صديقة أمي. استندتا على جدار المسجد و استهلتا حديثا طويلا عن قضية مولاي العربي التي انتهت نهاية سعيدة بفضل إخلاص لالة عيشة. على أية حال، كان مولاي العربي يستحق تضحية كهذه. ما إن تزدهر ورشته، لن يفوته أن يشتري لزوجته مجوهرات، عقارات و أغطية. لم يكن رجلا ناكرا للجميل. إلا أن الجارة أضافت هذه الجملة الخادعة قبل أن ترحل: - لكن من يستطيع أن يثق بالرجال؟ لقد تزوجت ثلاثة مرات، في كل مرة، كان زوجي لا يفكر إلا في تجريدي من الممتلكات القليلة التي كنت أملك. فلنأمل بأن لالة عيشة لم تصادف جاحدا و مدعيا بغيضا."}, {"fr": "Ma mère dit sentencieusement :", "ar": "قالت أمي بحكمة:"}, {"fr": "- Dieu seul est juge.", "ar": "- وحده الله يعلم."}, {"fr": "Nous abandonnâmes la voisine bavarde. Les quartiers commerçants avaient un air de fête. Une foule de citadins et de campagnards se pressait dans la rue des épiciers, la place des notaires, le marché des fruits secs. Des âniers poussaient des bêtes chétives lourdement chargées de sacs de sucre, de caisses de bougies, de ballots de cotonnades, de vaisselle de faïence et de bimbeloterie.", "ar": "تركنا الجارة الثرثارة. كانت حشود الحضريين و القرويين تحث الخطى في شارع البقالين، ساحة كتاب العدل، سوق الفواكه الجافة. كان سائقو حمير يدفعون حيوانات نحيفة م ح م لة بكثرة بأكياس من السكر، صناديق الشموع، رزم من النسيج القطني، أوان من الخزف و الألعاب."}, {"fr": "Il se formait à chaque carrefour un embouteillage compliqué. Nous finissions toujours par nous fau- filer à travers les groupes de badauds. Pour circuler plus aisément, j’avais enlevé mes babouches. Je les mis dans mon capuchon. A chaque pas ma mère me recommandait d’y faire très attention. Je pouvais les perdre dans la bousculade ou me les faire voler. Je la rassurais. Je les sentais battre légèrement mon dos.", "ar": "كان ازدحام معقد يتشكل عند كل مفترق طرق. كنا دائما نتمكن من التسلل بين مجموعات المتسكعين. لأمر بسهولة، كنت قد نزعت بلغتي، وضعتها 61 في قلنسوتي. عند كل خطوة، كانت أمي توصيني بتوخي الحذر. كان من الممكن أن أفقدها خلال التدافع أو تسرق مني. كنت أطمئنها. كنت أحس بها تضرب ظهري بشكل خفيف."}, {"fr": "J’aperçus les premières boutiques de tissus. On les reconnaissait de loin. Les marchands, pour attirer les chalands, accrochaient à leurs auvents des banderoles de soie, des tricots de couleur fanée, des mouchoirs brodés au point plat.", "ar": "رأيت أول دكاكين القماش. كانت تلوح من بعيد. كان التجار، ليجذبوا الزبناء، يعلقون على عرشهم رايات من الحرير، كنزات ذات ألوان باهتة، مناديل مطرزة «بالطارة»."}, {"fr": "La Kisaran, rendez-vous de toutes les élégantes de la ville, me parut contenir les fabuleux trésors de Soleiman, fils de David. Des caftans de drap amarante, des gilets précieusement ornementés de passe- menterie et de boutons de soie, des djellabas en voile de laine, des burnous somptueux voisinaient avec des tulles irisés comme des toiles d’araignée sous la rosée, des taffetas, des satins moirés et des cretonnes aux couleurs sauvages .", "ar": "كانت القيسارية، ملتقى كل أنيقات المدينة، تبدو لي و كأنها تحتوي على كنوز سليمان ابن داوود الشهيرة. قفاطين من جوخ أرجواني، صدارات مزينة بعناية بالقيطان و أزرار الحرير، جلابيب من الفوال الصوفي، برانس فاخرة تجاورها أنسجة تل متقزحة مثل نسج العناكب تحت الندى، أنسجة التفتة، الساتان الم مو ج و الكريتون بألوان الطبيعة."}, {"fr": "Le gazouillis des femmes prêtait à ce lieu je ne sais quelle atmosphère d’intimité. Les marchands ne ressemblaient pas à ceux des autres souks. La plupart étaient des jeunes gens, beaux de visage, très soignés dans leur mise, courtois dans leur langage. Ils ne se mettaient jamais en colère, faisaient montre d’une patience sans limite, se dérangeaient pour montrer à une cliente une étoffe posée sur le plus haut rayon, dépliaient la pièce, la repliaient pour la remettre à sa place, la cliente ayant déniché sous une pile de soie- ries, une étoffe qui lui plaisait mieux. Nous fîmes cinq ou six boutiques avant d’acheter trois coudées de cotonnade blanche. Elle devait ser- vir à me faire confectionner une chemise. C’était de la cotonnade de bonne qualité, la qualité « Poisson ». Ma mère ne voulait pas d’autre marque. Le marchand nous montra, imprimé en bleu sur une assez grande longueur de la pièce, un poisson avec toutes ses écailles. Le cérémonial du marchandage dura beaucoup moins que lorsqu’il fallut payer le gilet rouge à soutaches. Nous nous arrêtâmes devant une dizaine de magasins. Les marchands s’empressaient de nous montrer des piles de gilets de ma taille. Toutes les nuances du rouge défilaient sous nos yeux ; aucune ne corres- pondait au ton que désirait ma mère. Finalement elle fixa son choix sur un gilet cerise abondamment orné de serpentins et de fleurons en passementerie, légèrement plus foncée que le tissu.", "ar": "كانت أصوات النساء تعطي لهذا المكان جوا من الألفة. كان التجار لا يشبهون غيرهم في باقي الأسواق. كان أغلبهم شبابا، أبهياء الطلعة، ح س ان الهندام، لبقون في حديثهم. لم يكونوا يغضبون أبدا، كانوا يبدون صبرا بلا حدود، يزعجون أنفسهم لي ر وا لزبونة قماشا معلقا في أعلى الرفوف، يبسطون القطعة، يعيدون طيها لإعادتها إلى مكانها، لكون الزبونة وجدت تحت كومة من الحرير، قماشا أعجبها أكثر. زرنا خمسة أو ستة دكاكين قبل شراء ثلاثة أذرع من القماش القطني الأبيض. كانت ستستعمل لتفصيل قميص لي. كان قماشا قطنيا من نوعية جيدة، نوعية « السمكة ». لم تكن أمي تريد أي ماركة أخرى. أرانا البائع سمكة بكامل حراشفها مطبوعة بالأزرق على طول لا بأس به من القطعة. دامت مراسم المساومة أقل بكثير من وقت شراء الصدار الأحمر بشرائط. توقفنا أمام عشرة دكاكين، كان التجار يسرعون و يعرضون علينا أكواما من الصدارات على مقاسي، كانت جميع درجات اللون الأحمر تتعاقب أمام أعيننا؛ لم تكن أية واحدة تطابق الد رجة التي كانت تريدها أمي. في الأخير ثبت اختيارها على صدار كرزي اللون، مزين بكثرة بشرائط لولبية و زهيرات من القيطان، أغمق قليلا من القماش."}, {"fr": "Elle m’enleva la djellaba, m’essaya le gilet, me le boutonna jusqu’au cou, s’éloigna pour se rendre compte de l’effet, me fit signe de tourner à droite, puis de tourner à gauche, mit un temps infini à le déboutonner, en fit une boule qu’elle fourra brutalement entre les mains du marchand. Le boutiquier s’informa :", "ar": "نزعت عني جلبابي، جعلتني أجرب الصدار، ز ر رته لي حتى العنق، ابتعدت لترى كيف يبدو، أشارت لي بالاستدارة يمينا، ثم يسارا، استغرقت 62 وقتا طويلا لتفك الأزرار، صنعت منه كرة دستها بعنف بين يدي التاجر. استعلم صاحب الدكان:"}, {"fr": "- Cet article te plaît-il ?", "ar": "- هل أعجبتك هذه البضاعة؟"}, {"fr": "- C’est le prix qui en décidera, répondit ma mère.", "ar": "- أجابت أمي: الثمن هو من سيقرر."}, {"fr": "- Alors, je prépare le paquet; aux clients sérieux, je consens toujours un rabais. Ce gilet vendu couram- ment cinq réaux, je te le laisse pour quatre réaux seulement.", "ar": "- إذن، هل أجهز العلبة؛ دائما أقدم تخفيضا لزبنائي الجادين. يباع هذا الصدار بخمسة ريالات بيسر، سأتركه لكي بأربعة فقط."}, {"fr": "- Coupons court à toute discussion, je t’en offre deux réaux.", "ar": "- لنقصر الحديث، سأعطيك ريالين."}, {"fr": "- Tu ne m’en offres pas le prix de revient, j’en fais le serment! Je ne le céderai pas à ce prix, devrais-je mendier ce soir pour nourrir mes enfants. Le marchand avait fini de plier le gilet soigneusement et cherchait un papier pour faire le paquet. - Écoute, dit ma mère, je suis mère de famille, je m’occupe de ma maison, je n’ai guère le temps de marchander. Voudrais-tu me laisser ce gilet à deux réaux un quart? Je fais ce sacrifice pour mon fils qui aimerait tellement porter ce vêtement le jour de l’Achoura.", "ar": "- أنت لا تعطينني ثمنه بالجملة، أقسم بهذا! لن أبيعه بهذا الثمن، هل سأتسول لأطعم أطفالي هذا المساء. كان التاجر قد انتهى من طي الصدار بعناية و يبحث عن ورق ليلفه به. - قالت أمي: ا سمع، أنا أم لأسرة، أتكفل ببيتي، ليس لدي أي وقت للمساومة. هل تريد أن تدع لي هذا الصدار بريالين و ربع؟ أقوم بهذه التضحية من أجل ابني الذي يتمنى بشدة أن يرتدي هذا اللباس في يوم عاشوراء."}, {"fr": "- Ce garçon me plaît, je ferai un effort en sa faveur, donne-m oi trois réaux et demi. Le marchand tendit la main. Il s’attendait à recevoir l’argent. Ma mère lui tourna le dos, me prit par le poignet et m’entraîna quelques pas.", "ar": "هذا الولد يعجبني، سأبذل مجهودا من أجله، أعطيني ثلاثة ريالات و نصف. مد التاجر يده، كان ينتظر استلام النقود. أدارت له أمي ظهرها، أمسكتني من رسغي و مشت بي بضع خطوات."}, {"fr": "- Viens! me dit-elle, les gilets ne manquent pas à la Kissaria. Nous trouverons bien un boutiquier sé- rieux qui sache parler raisonnablement.", "ar": "- قالت لي: تعال! الصدارات تملأ القيسارية. لا بد من أن نجد حانوتيا جادا يعرف كيف يتكلم بشكل معقول."}, {"fr": "Le marchand se mit à nous rappeler d’un ton pressant. - Reviens Lalla! Reviens donc! Le gilet plaît à cet enfant. Je te l’abandonnerais plutôt que de le priver du plaisir de le porter. Certes, les gilets ne manquent pas dans les boutiques de la Kissaria, mais pourras-tu vraiment en trouver de cette qualité ? Admire avec quel soin ont été faites toutes les coutures. Regarde l’exécution des boutons ... Prends ce gilet; paie-moi le prix que tu estimes raisonnable. Tu me parais être une chérifa pleine de baraka, je te demanderai de ne pas m’oublier dans tes prières afin que le Prophète intercède en ma faveur le jour du jugement.", "ar": "بدأ التاجر بندائنا بنبرة مستعجلة. - عودي يا لالة! فلتعودي إذن. إن الصدار يعجب هذا الطفل. سأمنحه لك بدل من أن أحرمه من متعة ارتدائه. صحيح أن الصدارات تملأ القيسارية، لكن هل ستستطيعين حقا إيجاد واحد بهذه الجودة؟ تأملي الإتقان الذي صممت به جميع الدروز. أنظري إلى تنفيذ الأزرار... خذي هذا الصدار؛ إدفعي لي الثمن الذي يبدو لك معقولا. تبدين لي شريفة مليئة بالبركة، سأطلب منك أن لا تنسيني خلال صلواتك لكي يشفع لي الرسول يوم القيامة."}, {"fr": "Ma mère perdait la tête quand, d’aventure, quelqu’un la traitait de chérifa. Elle fouilla dans ses poches, sortit un chiffon noué plusieurs fois, s’acharna un bon moment à le dénouer. Elle tira deux réaux et demi qu’elle allongea au marchand sans rien dire. Elle ne prit pas le temps d’écouter le boutiquier réclamer un supplément. Elle se saisit du paquet et m’entraîna.", "ar": "كانت أمي تفقد صوابها عندما يناديها شخص ما بالشريفة مصادفة. بحثت في جيوبها، أخرجت خرقة معقودة عدة مرات، اجتهدت مدة طويلة لتفك 63 العقد. أخذت ريالين و نصف أعطتها للتاجر دون قول شيء. لم تأخذ وقتا لتستمع للحانوتي الذي كان يطلب إضافة. أخذت الحزمة و سحبتني."}, {"fr": "Nous flânâmes encore un moment dans le souk. Ma mère se documenta sur le prix des tissus, les ten- dances de la mode, la signification de tel ou tel dessin.", "ar": "تسكعنا لمزيد من الوقت في السوق. استعلمت أمي عن ثمن الأقمشة، ميولات الموضة، معنى هذا الرسم أو ذاك."}, {"fr": "Nous quittâmes cette atmosphère de faste pour nous trouver dans le quartier des épices. Nous étions près de la médersa Attarine, cette belle maison où logent les étudiants, quand je rappelai à ma mère la satinette de Lalla Kanza la chouafa. Ma mère me félicita d’avoir une si bonne mémoire. Elle rebroussa chemin. Le long de la rue elle maudissait toutes les chouafas de la terre, ces femmes calamiteuses qui ne manquaient aucune occasion de vous empoisonner la vie. Elle se demandait ce qu’elle avait bien pu faire de l’argent de cette maudite sorcière de Kanza qui pouvait, si elle le voulait, faire ses commissions elle- même. Elle se mit à l’angle d’une boutique, entreprit de minutieuses recherches, s’énerva, s’agita, lança de nouvelles imprécations contre les chouafas et leurs acolytes, finit par retrouver l’argent au fond d’une poche de son caftan.", "ar": "تركنا جو الفخامة هذا لنذهب إلى حي التوابل. كنا قريبين من مدرسة عطارين، هذا المنزل الجميل الذي يسكن فيه الطلاب، عندما ذ ك رت أمي بس اتين لالة كنزة الشوافة. هنأتني أمي لامتلاكي ذاكرة جيدة. عادت أدراجها. طوال الشارع، كانت تلعن كل شوافات الأرض، هؤلاء النساء الفاجعات اللواتي لم يك ن يضيعن أية فرصة لي سممن لك حياتك. كانت تتسائل عما كانت قد فعلته حقا بنقود هذه الساحرة اللعينة كنزة التي كانت تستطيع أن تتسوق بنفسها لو أرادت ذلك. وقفت في زاوية أحد الدكاكين، بدأت تبحث بدقة، انفعلت، تحركت، ألقت بلعنات جديدة على الشوافات وأعوانها، انتهت بإيجاد النقود في قاع أحد جيوب قفطانها."}, {"fr": "Nous ne tardâmes pas à trouver un marchand de satinette. Sans discuter le prix, ma mère demanda un certain nombre de coudées. Elle le paya et nous partîmes enfin. La bonne humeur de ma mère avait disparu. Elle ne cessa pas de me gourmander sans raison jusqu’à l’arrivée chez nous. Elle remit à Lalla Kanza sa satinette noire, lui rendit sa monnaie et monta l’escalier, gémissant et soupirant à chaque marche.", "ar": "سرعان ما وجدنا بائع ساتين. طلبت أمي عددا معينا من الأذرع دون مناقشة الثمن، دفعت ثمنه و رحلنا أخيرا. كان مزاج أمي الجيد قد اختفى. لم تتوقف عن توبيخي بدون سبب حتى وصولنا إلى البيت. أعطت للالة كنزة ساتينها الأسود، أعادت لها باقي المبلغ و صعدت الدرج، متأوهة و متنهدة عند كل درجة."}, {"fr": "Rahma sortit sur le palier. Elle nous invita dans sa chambre. Elle demanda à ma mère de lui montrer ses acquisitions.", "ar": "خرجت رحمة إلى البسطة. دعتنا إلى غرفتها. طلبت من أمي أن ت ريها ما اقتنته."}, {"fr": "La chambre de Rahma était de mêmes dimensions que la nôtre. Une cloison de bois patinée par l’âge, la coupait aux trois quarts. Derrière cette cloison, Rahma entassait ses provisions d’hiver. Elles consistaient surtout en pains de sel d’un rose taché de gris et en grappes d’oignons. La pièce meublée pauvrement de matelas bosselés et d’une natte de jonc, comportait, comme seul luxe, une longue étagère peinturlurée. Cette étagère supportait une dizaine de bols de faïence à fleurs, deux assiettes décorées de coqs superbes et une demi-douzaine de verres en forme de gobelets.", "ar": "كانت غرفة رحمة بنفس أبعاد غرفتنا. كان هناك حاجز خشبي مهترئ بفعل الزمن يقسمها إلى ثلاثة أرباع. وراء هذا الحاجز، كانت رحمة تكدس مؤنها الشتوية. كانت تتمثل بالخصوص في خبز ملح ذي لون وردي ملطخ بالرمادي و عناقيد البصل. كانت الغرفة المؤثثة بفقر بأفرشة محدبة و حصير من الأسل، تحتوي، كترف وحيد، على رف طويل ملطخ بالألوان. كان هذا الرف يحمل عشرة زبديات خزفية بزهور، صحنين مزينين بديكة رائعة و خمسة كؤوس على شكل غراريف."}, {"fr": "Zineb jouait dans un coin avec son chat. Elle lui présentait une minuscule glace. L’animal voyait un œil rond qui le regardait fixement. Inquiet, il allongeait la patte, mais ses griffes grattaient la surface lisse du verre. Il recommença son manège deux ou trois fois, regarda derrière le miroir ; le mystère demeurait entier. Il flaira quelque supercherie, se fâcha, cracha des grossièretés dans son langage, partit en flèche, la queue hérissée. Zineb riait aux éclats.", "ar": "كانت زينب تلعب في ركن مع قطها. كانت تقدم له مرآة صغيرة. كان الحيوان يرى عينا دائرية تنظر إليه بإمعان. كان يمد قائمته قلقا، لكن كانت مخالبه تكشط السطح الأملس للزجاج. كرر مكيدته مرتين أو ثلاثة، نظر 64 خلف المرآة؛ لكنه لم يفهم شيئا. أحس بنوع من الحيلة، غضب، تفوه ببعض البذءات بلغته، رحل كالسهم بذيل منفوش. كانت زينب تقهقه."}, {"fr": "Depuis longtemps, je désirais une petite glace ronde comme la sienne. Je n’osais pas demander à ma- man de m’en acheter une. Elle se serait imaginé que je la désirais pour me regarder et n’aurait pas manqué de me traiter de garçon efféminé.", "ar": "منذ مدة طويلة، كنت أرغب في مرآة صغيرة كخاصتها. لم أكن أجرؤ أن أطلب من أمي شراء واحدة لي. كانت ستتظن بأنني أريدها لأنظر بها إلى نفسي و لن يفوتها أن تنعتني بالصبي المخنث."}, {"fr": "Rahma faisait des compliments à ma mère sur ses achats et admirait mon gilet. Il faisait sombre dans cette chambre. Le rouge du gilet prenait des tons de velours cramoisi. Une belle couleur profonde, dis- crète et royale à la fois qui m’enivrait. Je me sentais gonflé d’un noble orgueil. Ce vêtement était le mien. Le jour de l’Achoura, j’allais éblouir nos amis et connaissances. Les élèves du Msid me parleraient avec déférence. Aux princes de légende, petits et grands s’adressent avec respect.", "ar": "كانت رحمة تمدح أمي على مشترياتها و تتأمل صداري. كانت الغرفة مظلمة. كان اللون الأحمر للصدار الذي يكتسب درجات مخمل قرمزي يسكرني لكونه لونا جميلا و عميقا، رصينا و ملكيا في الوقت نفسه. كنت أشعر بأنني مفعم بفخر نبيل. كان هذا اللباس لي. في يوم عاشوراء، كنت سأبهر أصدقاءنا و معارفنا. كان تلاميذ المسيد سيتحدثون معي بإجلال. يخاطب الصغار و الكبار أمراء الأسطورة باحترام."}, {"fr": "Ne serais-je pas un prince de légende avec ce gilet somptueux, ma future chemise de qualité « poisson » et la paire de babouches que me promettait Moulay Larbi, le meilleur babouchier de toute la ville ?", "ar": "ألن أكون أمير أسطورة بهذا الصدار الفاخر، قميصي المستقبلي من نوعية « السمكة » و زوج البلغات الذي كان مولاي العربي، أفضل صانع بلغات في المدينة كلها، سيصنعها لي؟"}, {"fr": "Ma, mère chuchotait, penchée sur notre voisine à lui frôler la joue. Cela ne me regardait pas. Ce que chuchotent mystérieusement les femmes dans une pièce sombre ne peut intéresser les petits garçons qui rêvent de devenir princes de légende vêtus de drap cramoisi.", "ar": "كانت أمي تهمس لجارتنا و هي منحنية عليها ملامسة خدها. لم يكن ذلك يعنيني. لم يكن ما تهمسه النساء بغموض في غرفة مظلمة يهم الأطفال الصغار الذين يحلمون بأن يصبحوا أمراء أسطورة يلبسون جوخا أرجوانيا."}, {"fr": "Zineb me fit une horrible grimace, je lui en fis une encore plus épouvantable. Elle se mit à hurler, à ameuter tout le quartier:", "ar": "كشرت لي زينب بشكل رهيب، أبديت لها واحدة أكثر فظاعة. بدأت بالصراخ و تحريض الجميع ضدي."}, {"fr": "- Maman! Maman! Sidi Mohammed me fait des grimaces. J’essayai de me défendre.", "ar": "- أمي! أمي! سيدي محمد يكشر لي. حاولت الدفاع عن نفسي."}, {"fr": "- C’est elle qui a commencé ! C’est elle!", "ar": "- إنها من بدأ! إنها هي!"}, {"fr": "Personne ne me croyait. J’éclatai en sanglots. Furieuse, ma mère me saisit brutalement par le bras et m’entraîna jusqu’à notre chambre. Elle se plaignait à haute voix de son mauvais destin, de la cruauté du sort, de la vie d’enfer qu’elle menait à cause de moi.", "ar": "لم يكن أحد يصدقني. أجهشت بالبكاء. أمسكتني أمي من ذراعي و هي غاضبة و ج ر تني إلى غرفتنا. كانت تتذمر بصوت مرتفع من قدرها السيء، من قساوة الحال، من حياة الجحيم التي كانت تعيشها بسببي."}, {"fr": "Je me demandais avec sincérité ce que je faisais de méchant pour la rendre si malheureuse. Elle m’aban- donna dans un coin, me laissa renifler tout à mon aise, le cœur gros, les lèvres boudeuses et s’enferma dans sa cuisine. J’eus faim à force de pleurer silencieusement. D’ailleurs, l’heure du déjeuner était depuis longtemps passée. Je me mis sur le dos et entrepris de composer un menu fastueux pour le jour où, prince reconnu et aimé, j’aurais à recevoir des personnes de mon rang. Je réfléchis un moment et me dis: « Les princes mangent très bien chez eux. Je ne les inviterai pas. Mes hôtes seront tous les affamés, les mendiants, les psalmistes qui font rarement un bon repas. Je leur distribuerai de beaux vêtements : des gilets rouges richement ornementés, des djellabas d’une blancheur de lait, des babouches safran dont le cuir crisse à chaque pas. Je n’oublierai pas de leur offrir des turbans de mousseline. Moi, je serai habillé de blanc. Sur la tête, je mettrai le bonnet conique, d’un rouge amarante, apanage des gens de cour et des derviches. Des esclaves noires nous serviront dans des plats de porcelaine des ... - Voudrais-tu te mettre sur ton séant pour manger.", "ar": "كنت أتساءل بصراحة عن الأمر السيء الذي كنت أفعله لأجعلها تعيسة جدا. تركتني في أحد الأركان، أنخر كما أشاء، بقلب حزين، بشفتين عابستين و أقفلت على نفسها في مطبخها. شعرت بالجوع لكثرة البكاء بصمت. على أية حال، كان وقت الغداء قد مضى منذ وقت طويل. استلقيت على ظهري و بدأت أشكل قائمة طعام 65 فاخرة لليوم الذي سأكون فيه أميرا محترما و محبوبا و سيكون علي استقبال شخصيات من مقامي. فكرت قليلا ثم قلت لنفسي: « يأكل الأمراء بكرم في منازلهم. لن أدع وهم. سيكون ضيوفي هم جميع المساكين، المتسولين و الم جو دين الذين نادرا ما يأكلون وجبة سخية. سأوزع عليهم ملابس جميلة: صدارات حمراء مزينة بكثرة، جلابيب بيضاء كالحليب، بلغات صفراء يصرف جلدها عند كل خطوة. لن أنسى أن أمنحهم عمامات من الموصلين. أنا، سألبس الأبيض. على رأسي، سأضع طرطورا بلون أحمر أرجواني، كان امتياز من ناس الساحة و العبيد السود سيقدمون لنا في أطباق من الخزف الصيني بعض ال... - هلا اعتدلت في جلستك لتأكل."}, {"fr": "Je me redressai. Ma mère avait disposé la table ronde, basse sur pattes. De la viande aux navets! Je n’aimais pas les navets! Je pensai refuser cette pitance. Ma mère était assez malheureuse ainsi. J’aurais déclenché une nouvelle crise, je ne m’en sentis pas le courage. Je fis honneur au repas. La faim qui me dévorait transforma le goût du navet en saveur exquise.", "ar": "اعتدلت. كانت أمي قد وضعت الطاولة المستديرة على قوائمها. لحم باللفت! لم أكن أحب اللفت! كنت أفكر في رفض هذا الطعام. كانت أمي تعيسة بما فيه الكفاية هكذا. كنت سأحدث نوبة جديدة، لم أمتلك الشجاعة. أكلت الطعام بشهية. ح و ل الجوع الذي كان يلتهمني مذاق اللفت إلى نكهة شهية."}, {"fr": "Quelqu’un sur la terrasse se mit à chanter. Des lambeaux d’une cantilène, mollement balancés par le souffle du printemps naissant, parvenaient jusqu’à nous. Ma mère s’arrêta de mastiquer, tendit l’oreille. La voix s’éloigna. Un instant après, elle éclata en jet de lumière, chaude, enivrante et nostalgique comme une bouffée d’encens.", "ar": "بدأ شخص بالغناء على السطح. كانت مقاطع من أغنية شعبية تأرجحها باسترخاء نفحة نسيم الربيع الجديد تصل حتى غرفتنا. توقفت أمي عن المضغ، أرهفت أذنها. ابتعد الصوت، بعد لحظة، انتصبت واقفة مثل شرارة ضوء، ساخنة، م س ك رة و حزينة مثل نفحة لبان."}, {"fr": "Ma mère alla se pencher à la fenêtre. Elle appela", "ar": "ذهبت أمي لتطل من النافذة. نادت:"}, {"fr": "- Fatma Bziouya, sais-tu qui chante ainsi?", "ar": "- فاطمة بزيوية، هل تعرفين من يغني هكذا؟"}, {"fr": "- Lalla Khadija, la femme de l’oncle Othman.", "ar": "- لالة خديجة، زوجة العم عثمان."}, {"fr": "- Je ne comprends pas qu’elle manifeste tant de gaîté alors qu’elle a épousé un vieillard qui pourrait être son père.", "ar": "- لا أفهم لماذا هي سعيدة لهذه الدرجة في حين أنها تزوجت بعجوز في عمر أبيها."}, {"fr": "- Elle n’est pas malheureuse! L’oncle Othman fait ses quatre volontés. Il la traite comme sa fille.", "ar": "- إنها ليت تعيسة! ينفذ العم عثمان كل طلباتها. يعاملها كابنته."}, {"fr": "- Et elle? Comment le traite-t-elle ? Nos voisines partirent d’un grand rire. - Moi, je sais comment elle le traite. La vieille M’Barka, l’ancienne esclave de l’oncle Othman, m’a raconté une histoire fort amusante. Elle est trop longue pour que je vous la répète, répartit Rahma.", "ar": "- و هي؟ كيف تعامله؟ ضحك جيراننا كثيرا. - قالت رحمة: أنا أعرف كيف تعامله، حكت لي العجوز مباركة، العبدة القديمة للعم عثمان، قصة ممتعة جدا. لن أكررها لأنها طويلة للغاية."}, {"fr": "- Raconte-la, raconte-la, demandèrent toutes les femmes d’une seule voix.", "ar": "- قالت جميع النساء بصوت واحد: ا حكيها لنا! ا حكيها لنا!"}, {"fr": "Rahma se fit prier un moment. Puis elle commença :", "ar": "66 تم رجاء رحمة بعض الوقت، ثم بدأت:"}, {"fr": "- Vous connaissez l’oncle Othman, un homme qui a vu des temps meilleurs. Ses parents lui laissèrent à leur mort une grosse fortune. Il eut une jeunesse dissipée et mangea capital et bénéfices. Il ne lui resta que la petite maison qui s’appuie à la nôtre. Fidèle, M’Barka partagea la bonne et la mauvaise fortune. Si Othman s’était marié plusieurs fois, mais aucune de ses épouses successives n’avait su en faire vraiment la conquête. Lalla Khadija seule réussit à le dominer, à le faire manger dans le creux de sa main, comme un agneau. Il est vrai que Khadija, si elle n’a pas de fortune, possède au moins la jeunesse et le charme. Patientez, j’en arrive à mon histoire.", "ar": "- تعرفون العم عثمان، رجل عاش أوقات رائعة. ترك له والداه ثروة كبيرة عند موتهما. عاش شبابا طائشا و خسر الربح و رأس المال. لم يبق لديه سوى البيت الصغير المجاور لخاصتنا. مباركة الوفية تقاسمت الثروة الجيدة و السيئة. سي عثمان تزوج عدة مرات، لكن لا واحدة من زوجاته السابقات استطاعت أن تأسر قلبه إلا لالة عيشة لأنها كانت الوحيدة التي استطاعت ترويضه و جعله يأكل من باطن يدها مثل الح مل. صحيح أن خديجة، إن لم تكن تملك ثروة، تملك على الأقل الشباب و الحسن. ا نتظروا، سأصل إلى قصتي."}, {"fr": "J’allai me pencher à la fenêtre aux côtés de ma mère. Toutes les femmes avaient abandonné leur be- sogne et s’accoudaient aux grilles et balustrades de leurs balcons. Lalla Kanza sortit un vieux tapis de prières, s’installa pour écouter dans le patio.", "ar": "ذهبت لأطل من النافذة إلى جانب أمي. كانت جميع النساء قد تركن أشغالهن و يتكئن على الأسيجة و درابزين شرفاتهن. أخرجت لالة كنزة سجادة قديمة و جلست في الفناء لتستمع."}, {"fr": "Rahma, dont on ne voyait que le buste, reprit le fil de son histoire.", "ar": "تابعت رحمة، التي لم نكن نرى إلا صدرها، تسلسل الأحداث."}, {"fr": "Nous étions tous pressés de connaître la suite.", "ar": "كنا جميعنا متشوقين لمعرفة التتمة."}, {"fr": "- Si Othman sortit vendredi dernier de bonne heure pour faire son marché. II balançait gaiement son cabas, saluait les uns la main sur le cœur, faisait de larges sourires aux autres. Car il connaît tous les gens du quartier. II arriva à Joutyia. Un seul marchand, de viande était ouvert. Inutile de vous dire qu’il y avait foule autour de sa boutique. C’était Salem le nègre. Il brandissait tantôt une hache impressionnante, tantôt un coutelas phénoménal. Il découpait de gros quartiers de mouton qui disparaissaient dans les couffins et les cabas des clients. Il y avait foule, je vous dis. Les gens s’écrasaient les pieds avec bonheur, échangeaient courtoisement des bourrades et des mots venimeux. Si Othman, pour attirer l’attention de Salem le nègre, agit les deux bras, étala sur son visage un large sourire, hurla un ensemble de mots qui pouvait signifier: « Avale ton coutelas » ou bien « tu mérites la bastonnade » ou, plus simplement, « donne-moi un gigot ».Le nègre furieux le menaça de loin de sa hache et continua son travail. Tout le monde riait aux larmes. Rahma savait si bien raconter. Elle reprit, heureuse de son succès :", "ar": "- خرج سي عثمان الجمعة الماضية باكرا ليتسوق. كان يؤرجح جلته بفرح، يحيي البعض واضعا يده على قلبه، و يبدي ابتسامة عريضة لآخرين. لأنه يعرف جميع سكان الحي. وصل إلى الجوطية. كان بائع لحم واحد فقط هو الذي فتح دكانه. لا داعي لأقول لكم بأن الناس كانوا كثيرين حول دكانه. لقد كان سالم الزنجي. كان يحمل تارة فأسا مذهلة و تارة أخرى ساطورا كبيرا. كان يقطع قطعا كبيرة من لحم الغنم كانت تختفي في قفف و جلل الزبائن. أقول لكم بأنه كان هناك حشد. كان الناس يدوسون على أقدامهم بفرح، يتبادلون تربيتات و كلاما ساما. لكي يثير انتباه سالم الزنجي، قام سي عثمان بتحريك ذراعيه، رسم على وجهه ابتسامة عريضة، صرخ بمجموعة من الكلمات التي كان يمكن أن تعني: « ابتلع ساطورك » أو، « تستحق الضرب بالعصا » أو، بكل بساطة، « أعطني فخدا ». هدده الزنجي غاضبا بفأسه من بعيد و تابع عمله. ضحك الجميع حتى خرجت دموعهم. كانت رحمة تحسن السرد. تابعت و هي فرحة بنجاحها:"}, {"fr": "Si Othman recommença son jeu un moment après. Salem montra les dents, leva haut sa hache, hésita entre le désir de l’envoyer à la tête de ce client désagréable et le devoir de continuer à servir son monde. Le devoir l’emporta, au grand soulagement de Si Othman. Un chien, comme il y en a toujours aux abords des boucheries, vint flairer les talons de Si Othman. Ce dernier, impatienté, lui envoya un grand coup de pied. Sa babouche sauta. Le chien s’en empara, la saisit entre ses crocs et se sauva. Si Othman le suivit, clopin-clopant. Nous étions de nouveau pris de fou rire et Rahma dut s’arrêter un instant avant de poursuivre.", "ar": "- عاود سي عثمان فعلته بعد لحظة. أظهر سالم أسنانه، رفع فأسه عاليا، تردد بين أن يضرب بها رأس هذا الزبون البغيض و واجبه في أن يتابع 67 خدمة الناس. من حسن حظ سي عثمان، الواجب هو من ربح. جاء كلب مثل أولئك الذين يكونون دائما بجانب دكاكين الجزارين و بدأ يشت م عقبي سي عثمان. فقد هذا الأخير صبره و ضربه بركلة عنيفة. طارت بلغته. أخذها الكلب، أمسكها بين أنيابه و هرب. تبعه سي عثمان و هو يعرج. أخذتنا من جديد نوبة من الضحك و اضطرت رحمة للتوقف قليلا قبل المتابعة."}, {"fr": "- Il réussit à récupérer sa babouche dans les environs du pont de Bin Lemdoun. De retour à Joutyia, il constata qu’il n’y avait plus personne devant la boucherie. Le nègre somnolait, la chéchia sur l’oreille, le chasse-mouches entre les doigts. Aux crochets de la boutique pendaient de gros morceaux de mou pour les chats. Il s’aperçut aussi que tous les marchands de légumes dormaient au milieu de cageots vides ou derrière leurs étalages où jaunissaient trois bottes de radis. Si Othman n’osait pas rentrer bredouille. Dieu seul sait comment Lalla Khadija l’aurait reçu. Dans un fondouk, il découvrit un bien curieux spectacle. Des gens s’écrasaient les pieds consciencieusement. Des aloses naissaient de ce remous, surnageaient un moment au-dessus des têtes et disparaissaient. Si Othman, plein de bonne volonté, attendit longtemps, espérant un miracle. Comme le miracle tardait, les démangeaisons de son nez devinrent intolérables. Il quitta le marché pour se rendre chez le marchand de tabac le plus proche. Il espérait s’envoyer une bonne prise dans les narines. Peut-être s’était-il un peu attardé chez le marchand de tabac. A son retour, plus de poissons et plus d’acheteurs. Les femmes hurlaient de joie. Moi, je trépignais d’enthousiasme. Je réclamais la suite.", "ar": "- تمكن من استعادة بلغته في نواحي جسر بين لمدون. عند عودته إلى الجوطية، لاحظ بأنه لم يبقى أحد أمام دكان الجزار. كان الزنجي يغفو واضعا شاشيته في أذنه و منشته بين أصابعه. على شناكل الدكان، كان يعلق قطعا كبيرة من رئة الذبيحة للقطط. لاحظ كذلك بأن تجار الخضر كانوا ينامون وسط زنابيل فارغة أو وراء بضاعتهم التي كانت تصفر فيها ثلاثة حزم من الفجل. لم يكن سي أحمد يريد أن يعود خالي الوفاض. وحده الله يعلم كيف كانت لالة خديجة لتستقبله. في أحد الكاروانسرا، رأى مشهدا غريبا. كان أناس يدوسون أقدام بعضهم البعض بصفاء. كان شابل يخرج من هذه الدوامة، يطفو قليلا فوق الرؤوس ثم يختفي. انتظر سي أحمد طويلا، مليئا بحسن الإرادة، أن تحدث معجزة. بما أن المعجزة تأخرت، أصبحت حكة أنفه لا تحتمل. ترك السوق ليذهب إلى أقرب بائع للتبغ. كان يأمل أن يستنشق نفحة جيدة في أنفه. ربما تأخر قليلا لدى بائع التبغ. عند عودته، لم يتبقى سمك و لا مشترون. كانت النساء تصرخن من الفرح. أنا كنت أتململ من الحماسة. كنت أطالب بالتتمة."}, {"fr": "- Continue! Continue! disait ma mère. Rahma continua. - Si Othman se mit en colère; des personnes l’entendirent vociférer des injures. Il brandissait les poings et disait : « Le maudit vieillard! Avais-je besoin d’écouter le récit de son mariage, à ce cocu? Pourquoi m’a-t-il raconté la mort de sa sœur et qu’ai-je à faire avec les fiançailles de sa fille! » Pour finir Si Othman rebroussa chemin. Chez le marchand de menthe du petit carrefour de la rue Sagha, il tomba en arrêt devant une magnifique rose. Il pensa que s’il l’offrait à Lala Khadija, elle lui pardonnerait de ne rien rapporter de comestible. J étais dans la rue quand il entra chez lui, fier de sa belle rose qui embaumait et j’ai assisté de mes yeux au dénouement. Il entra, puis la porte se rouvrit presque immédiatement, la rose s’écrasa sous ses pieds, puis, le turban de Si Othman vint la rejoindre suivi d’un Si Othman pâle et défait. Il ramassa son couvre-chef, prit la rose qu’il respira longuement et, me voyant là qui le dévisageait, Il me gratifia d’un large sourire.", "ar": "- كانت أمي تقول: أكملي! أكملي! تابعت رحمة. - غضب سي عثمان، رآه بعض الأشخاص يصيح شاتما. كان يرفع قبضتيه و يقول: « العجوز اللعين! هل كنت في حاجة لسماع قصة زواجه، هذا الزوج المخدوع؟ لماذا حكى لي عن موت أخته و ما دخلي بخطوبة ابنته! » في النهاية. عاد سي عثمان أدراجه. عند بائع النعناع الذي يقع في مفترق الطرق الصغير لشارع ساغا، نسي نفسه أمام وردة رائعة. ظن بأنه إن أهداها للالة خديجة، كانت ستسامحه لعدم إحضاره لأي شيء يؤكل. كنت في الشارع عندما عاد إلى منزله، فخورا بوردته 68 الجميلة التي كانت تعطر الجو و شاهدت الخاتمة بأم عيني. دخل، ثم ف تح الباب من جديد على الفور تقريبا، سقطت الوردة عند ق دم ي، ثم تبعتها عمامة سي عثمان يليها سي عثمان باهت وشاحب. التقط غطاء رأسه، أخذ الوردة التي شمها مطولا و، عندما رآني هناك و أنا أحدق إليه، أنعم علي بابتسامة عريضة."}, {"fr": "Nous riions à nous tordre. Rahma termina ainsi : - La rose, le turban et l’attitude de Si Othman m’intriguèrent et j’ai demandé à M’Barka ce qui était arrivé, j’ai appris comment Lalla Khadija traitait son vieux mari.", "ar": "ضحكنا حتى تلو ينا. أنهت رحمة قصتها هكذا: - حيرتني الوردة، العمامة و سلوك سي عثمان و سألت مباركة عما حصل، و هكذا عرفت كيف كانت لالة خديجة تعامل زوجها العجوز."}, {"fr": "Tout le monde fit des compliments à Rahma sur sa façon de peindre les événements les plus insigni- fiants. Ces propos avaient « du sel ». Le récit de Rahma m’obséda toute la soirée, la nuit, j’y rêvai encore.", "ar": "مدح الجميع رحمة على طريقتها في تلوين الأحداث الأكثر تفاهة. كان كلامها « به ملح ». تملكتني قصة رحمة طوال السهرة، في الليل، حلمت بها مجددا. 69"}]}, {"fr_title": "Chapitre VII", "ar_title": "الفصل 7", "segs": [{"fr": "Les FEMMES de la maison s’achetèrent toutes des tambourins, des bendirs et des tambours de basque. Chacun de ces instruments avait sa forme, son langage particulier. Il y en avait de longs en céra- mique bleue, la base garnie de parchemin, de ventrus en poterie quasi rustique, de simples cadres en bois circulaire tendus d’une peau de chèvre soigneusement épilée.", "ar": "اشترت كل نساء المنزل « طعارجا »، بناديرا و دفوفا. كانت كل واحدة من هذه الآلات لها شكلها، لغتها الخاصة، كانت منها الطويلة من الخزف الأزرق، بقاعدة مغطاة بالجلد، و المنتفخة من الخزف الشبه ريفي، إطارات دائرية بسيطة و مشدودة بجلد الماعز المسموط بعناية."}, {"fr": "Ma mère fit l’acquisition d’un de ces tambours ou bendirs. Elle l’essaya. Des coups graves et des coups secs combinés avec art parlèrent un dialecte rude, mélange de soleil et de vent de haute montagne.", "ar": "اشترت أمي أحد تلك الطبول أو البنادير. جربته. تكلمت ضربات خفيضة و ضربات جافة منسقة فنيا بلهجة خشنة، خليط من الشمس و الريح من الجبال العالية."}, {"fr": "Encore deux jours avant la Achoura, la grande journée où, de chaque terrasse l’après-midi, s’élèveront rythmes et chansons. Maintenant, chacune de nos voisines faisait ses gammes, jouait pour elle-même un air de danse, ac- compagné de fioritures, de mots murmurés à mi-voix. Zineb tapait comme une sourde sur un minuscule tambourin de pacotille. La veille, mon père m’avait offert une trompette très fruste en fer-blanc bariolée de toutes les couleurs. J’en tirai de temps à autre un gémissement nasillard qui se terminait par un cri rauque de fauve en colère. Je comptais d’ailleurs sur d’autres jouets pour le jour même de l’Achoura. Je désirais un tambour en terre cuite, en forme de sablier et un hochet décoré de fleurs. Je me conten- tais pour le moment de ma trompette. Elle éclatait au milieu de tous les bruits de la maison comme un cri d’alarme, parfois comme un sanglot d’agonisant.", "ar": "بقي يومان فقط على عاشوراء، اليوم العظيم الذي ترتفع فيه إيقاعات و أغان من كل سطح عند كل عصر. الآن، كل واحدة من جاراتنا تقوم بسلم موسيقي، تعزف لنفسها جوا من الرقص، مرفقا بنغمات و كلمات مهموسة بصوت خافت. كانت زينب تضرب كالصماء على « طعريجة » صغيرة تافهة. في اليوم السابق، كان أبي قد أعطاني بوقا خشنا جدا من التنك مطليا بكل الألوان. كنت أطلق منه من حين لآخر أنينا أنفيا ينتهي بصوت أجش مثل وحش غاضب. على أية حال، كنت أنوي اللعب بألعاب أخرى في يوم عاشوراء. كنت أريد « دربوكة مزدوجة » و شخشيخة مزينة بأزهار. كنت أكتفي في الوقت الراهن ببوقي. كان يدوي بين كل أصوات المنزل كصوت الإنذار، أحيانا كبكاء شخص يحتضر."}, {"fr": "Ma mère me pria de monter sur la terrasse braire tout à mon aise.", "ar": "رجتني أمي أن أصعد إلى السطح و أعزف كما أشاء."}, {"fr": "Dans toute la ville, les femmes essayaient leurs tambourins. Un bourdonnement sourd couvrait l’es- pace.", "ar": "في المدينة كلها، كانت النساء تجربن « طعارجهن ». كان طنين مكتوم يغطي المكان."}, {"fr": "Je gonflai mes joues et soufflai de toutes mes forces dans ma longue trompette; le son s’étrangla et j’eus l’impression d’entendre un bébé qui perce Ses premières dents. Le chat de Zineb somnolait au soleil. Il fit un saut d’épouvante, faillit perdre 1’équilibre, tomber du haut du mur, sa demeure favorite. Il m’aban- donna la terrasse et s’engouffra dans une gouttière.", "ar": "نفخت خدي بالهواء ثم نفخت بكامل قواي في بوقي الطويل؛ اختنق الصوت و شعرت كأنني أسمع رضيعا يبرز أسنانه الأولى. كان قط زينب ينام تحت الشمس. قام بقفزة رعب، كاد يفقد توازنه و يسقط من أعلى الجدار، بيته المفضل. ترك لي السطح و اندفع داخل مزراب."}, {"fr": "Une tête inquiète surgit du faîte d’un mur mitoyen et disparut. Ma mère me rappelait déjà. Je descen- dis pour la rejoindre.", "ar": "ظهر وجه قلق من أعلى جدار مجاور ثم اختفى. كانت أمي قد بدأت تناديني. نزلت لألتحق بها."}, {"fr": "- Un de tes camarades, envoyé par le maître d’école t’attend dans le patio, me dit-elle. Prends tes ba- bouches et va le rejoindre ; le fqih a besoin de toi. J’abandonnai ma trompette avec regret et dégringolai l’escalier pour retrouver mon condisciple. C’était Hammoussa, pois chiche, l’élève le plus petit de taille de l’école. Il s’appelait de son vrai nom Azzouz Berrada. Il me recommanda de me dépêcher.", "ar": "70 - قالت لي أمي: لقد أرسل المعلم واحدا من زملائك، إنه ينتظرك في الفناء. خذ بلغتك و اذهب إليه؛ إن الفقيه في حاجة إليك. تركت بوقي بأسف و نزلت الدرج بسرعة لألتحق بصديق دراستي. لقد كان حموصة، حمص، أقصر تلاميذ الكتاب قامة. كان اسمه الحقيقي عزوز برادة. أوصاني بالإسراع."}, {"fr": "L’équipement des lustres pour la nuit de l’Achoura réclamait le concours de toutes les mains. Il fallait venir travailler comme les autres au lieu de jouer de la trompette. Nous arrivâmes au MI/d. J embrassai la main du Maître et m’installai au milieu d’un groupe chargé de découper des mèches minuscules dans un carré de vieille cotonnade blanche, usée à la limite de l’usure .D’autres élèves s’emparaient des mèches roulées avec soin les agrafaient par le milieu à une lamelle de fer-blanc. Le bout libre de la lamelle de métal formait un crochet et devait reposer sur le bord d’un verre rempli moitié eau, moitié huile d’olive.", "ar": "كان تركيب الثريات من أجل ليلة عاشوراء يتطلب تعاون جميع الأيدي. كان من الواجب المجيء و العمل مثل الآخرين بدل اللعب بالبوق. وصلنا إلى المسيد. قب لت يد المعلم و جلست وسط مجموعة مكلفة بقص فتائل صغيرة في مربع من قماش أبيض قديم، رث إلى درجة التآكل. كان تلاميذ آخرون يأخذون الفتائل المفتولة بعناية، يشبكونها من الوسط بشفرة من التنك. كان الطرف الحر من الشفرة ي كو ن شنكلا و كان يجب وضعه على طرف كأس ممتلئ نصفه بالماء و نصفه الآخر بزيت الزيتون."}, {"fr": "Les grands, suspendus à une échelle branlante, accrochaient aux auvents des fenêtres et au plafond de la salle d’école des lustres en fer forgé. De conception très simple ces lustres étaient formés d’un ou de plusieurs cerceaux reliés entre eux par des tiges rigides. A ces cerceaux venaient se coller des cercles étroits où seraient logées les petites veilleuses : des verres ordinaires munis d’une mèche qui nageait dans l’huile.", "ar": "كان الكبار، و هم يقفون على سلم متخلخل، يعلقون ثريات من التنك في عرش النوافذ و سقف قاعة الكتاب. كانت هذه الثريات ذات تصميم بسيط للغاية و تتكون من واحد أو عدة أحواق مرتبطة فيما بينها بسيقان صلبة. كانت أقراص ضيقة، توضع عليها اللمبات الصغيرة، تأتي لتلتصق بهذه الأحواق: زجاجات عادية بها فتيلة تسبح في زيت الزيتون."}, {"fr": "Pour obtenir un bel effet, les élèves mélangeaient à l’eau des veilleuses des poudres de couleurs diverses.", "ar": "للحصول على منظر جيد، كان التلاميذ يخلطون بالماء لمبات مسحوقة بألوان مختلفة."}, {"fr": "Quand j’arrivai, les lustres étaient loin d’être entièrement garnis. Les verres s’entassaient dans un seau, les poudres de couleur en petits paquets reposaient dans les babouches du fqih et les lamelles de fer-blanc traînaient partout sur les nattes. Nous travaillâmes activement. Hammoussa se coupa le pouce avec une lamelle et partit se faire soigner chez lui en pleurnichant doucement. . La plupart des élèves travaillaient avec ardeur ; cinq ou six seulement, parmi les plus turbulents, allaient d’un groupe à l’autre, s’agitaient en tous sens, provoquaient çà et là quelques disputes. .", "ar": "عندما وصلت، كانت الثريات لم تكتمل بعد. كانت الزجاجات مكومة في دلو. كانت مساحيق الألوان موضوعة على شكل حزم صغيرة في ب لغة الفقيه و كانت شفرات التنك تنتشر في كل مكان على الحصير. عم لنا بنشاط. جرح حموصة إبهامه بشفرة و ذهب ليتعالج في بيته و هو يبكي قليلا. كان أغلب التلاميذ يعملون بحيوية؛ كان خمسة أو ستة فقط، من بين أكثر المشاغبين، يذهبون من مجموعة لأخرى، يتحركون في كل الأنحاء، يفتعلون بعض الشجارات هنا و هناك."}, {"fr": "Notre tâche fut terminée avant le coucher du soleil. Avant de quitter l’école, nous chantâmes des can- tiques en l’honneur du Prophète, récitâmes en chœur quelques versets du Coran. Le Maître prononça avec ferveur des invocations pour attirer la bénédiction sur nous, sur nos parents et sur l’ensemble de la communauté musulmane. Il n’a point oublié, dans ses prières, le Sultan prince des Croyants, qu’Allah prolonge son existence et l’aide à supporter le lourd poids du royaume.", "ar": "انتهى عملنا مع غروب الشمس. قبل الخروج من الكتاب، أنشدنا بعض التراتيل التي تمدح الرسول، تلونا بعض آيات القرآن بصوت واحد. ألقى المعلم أدعية بورع لينزل البركة علينا، و على والدينا و على كافة الأمة 71 الإسلامية. لم ينسى، في أدعيته، السلطان الأمير، أطال الله عمره و أعانه على حمل ثقل المملكة."}, {"fr": "Nous restâmes silencieux à attendre que le Maître nous fît signe de partir. Mon tour vint assez rapide- ment. Je baisai la main du Maître, enfilai mes babouches et sortis.", "ar": "بقينا صامتين في انتظار أن يشير لنا المعلم بالرحيل. جاء دوري بسرعة. قب لت يد المعلم، لبست ب لغتي و خرجت."}, {"fr": "A la maison, je trouvai ma mère très ennuyée. Il n’y avait plus de pétrole dans la lampe. Ma mère avait oublié d’en faire acheter. Je lui proposai de faire sa commission. Elle refusa. Driss El Aouad rentra. Ma mère descendit au premier. Je l’entendis chuchoter sur le palier de Rahma. Le pas de Driss El Aouad retentit de nouveau dans l’escalier. Il avait accepté de rendre service à ma mère.", "ar": "في البيت، وجدت أمي منزعجة جدا. كان زيت القنديل قد نفذ. كانت أمي قد نسيت شراءه. اقترحت عليها أن أشتريه. رفضت. عاد إدريس العاود. نزلت أمي إلى الطابق الأول. سمعتها تهمس في بسطة رحمة. سمع صوت خطوات ادريس العاود في الدرج من جديد. كان قد قبل أن يسدي إلى أمي الخدمة."}, {"fr": "De la rue me parvint la voix grêle d’un vendeur de bougies. « Des bougies et des allumettes », criait-il. Nous ne nous servions plus de bougies. C’était bon pour les gens pauvres, sans argent, ceux qui ne peu- vent se payer une belle lampe munie d’une glace pour refléter la lumière, bon aussi pour les personnes arriérées qui craignent les explosions, la fumée et la mauvaise odeur, autant d’inconvénients qui n’existent que dans leur imagination. La nuit tomba brusquement. Nous attendions impatiemment le retour de notre voisin pour éclairer la chambre. Quelqu’un toussa à la porte d’entrée de la maison. Driss El Aouad demanda s’il n’y avait personne sur son passage. Ma mère se précipita chez Rahma, ramena sa bouteille à moitié pleine de pé- trole. A la lumière d’un bout de chandelle, elle dévissa le bec, remplit la lampe, nettoya la mèche de son charbon et alluma.", "ar": "بلغني من الشارع صوت حاد لبائع شموع. كان يصرخ: « شموع و أعواد ثقاب ». كنا قد توقفنا عن استعمال الشموع. كان ذلك يهم الناس الفقراء، بدون نقود، أولئك الذين لم يكونوا قادرين على شراء قنديل جميل مزود بزجاجة تعكس الضوء، كان ذلك يهم أيضا الناس المتخلفين الذين يخشون الانفجارات، الدخان و الرائحة الكريهة، العديد من السلبيات التي لا توجد إلي في مخيلتهم. حل الظلام بشكل مفاجئ. كنا ننتظر عودة جارنا بفارغ الصبر لنضيء الغرفة. سعل أحدهم عند باب دخول المنزل. سأل إدريس العاود إن لم يكون هناك أحد في طريقه. أسرعت أمي إلى بيت رحمة، أعادت قنينتها مليئة بالزيت. بضوء قطعة شمع، فكت الفوهة، ملأت القنديل، نظفت الفتيلة من كربونها و أشعلت."}, {"fr": "- Soirée de bénédiction, lui dis-je.", "ar": "- قلت لها: سهرة مباركة."}, {"fr": "- Que ta soirée soit bénie, me répondit ma mère.", "ar": "- أجابتني أمي: فلتكن سهرتك مباركة."}, {"fr": "- Lalla Zoubida, appela Lalla Kanza du rez-de-chaussée, bénie soit ta soirée, pourrais-tu me donner un brin de menthe?", "ar": "- نادت لالة كنزة من الطابق الأرضي: لالة زبيدة، فلتكن سهرتك مباركة، هلا أعطيتني قليلا من النعناع؟"}, {"fr": "- Sidi Mohammed va te le porter.", "ar": "- سيحضره لك سيدي محمد."}, {"fr": "Ma mère me donna quelques branches de menthe très parfumée. J’allai fièrement les offrir à la chouafa. Je la trouvai dans le patio. Une odeur d’encens, de benjoin et de bien d’autres aromates alourdissait l’at- mosphère. J’étais persuadé qu’une assemblée de démons, attirés par toutes ces odeurs, se tenait dans la pénombre.", "ar": "أعطتني أمي بعض أغصان النعناع المعطرة جدا. ذهبت لأعطيها للشوافة بفخر. وجدتها في الفناء. كانت رائحة البنزوين و اللبان و بخور أخرى تثقل الجو. كنت مقتنعا بأن مجموعة من الشياطين، منجذبة بكل هذه الروائح، كانت في الظليل."}, {"fr": "Lalla Kanza, pour me remercier, me mit dans le creux de la main une poignée de grains de sésame. Je pensai que c’était là une part d’un repas mystérieux offert aux génies par la sorcière. J’y goûtai du bout de la langue. Le goût de sésame n’avait rien de suspect. Je mangeai. Les grains se collaient autour de mes lèvres et sur le bout de mon nez. Ma langue balayait ce qu’elle pouvait atteindre. J’époussetai l’excédent avec les doigts.", "ar": "72 وضعت لالة كنزة في باطن يدي حفنة من حبوب السمسم لشكري. فكرت في أن تلك كانت حصة من طعام غامض يعطى للجن من طرف الساحرة. تذوقته بطرف لساني. لم يكن بمذاق السمسم أي شيء مريب. أكلت. كانت الحبوب تلتصق حول شفتي و على طرف أنفي. كان لساني يزيح ما استطاع بلوغه. نفضت الباقي بأصابعي."}, {"fr": "Il faisait noir dans l’escalier mais l’obscurité ne m’effrayait guère. Le vide qui s’ouvrait devant moi n’était vide qu’en apparence. Des présences muettes s’écartaient pour me laisser passer. Lorsque j’aurai l’âge requis, toutes ces présences se découvriront il mes yeux de voyant. J’entendis ma mère prononcer solennellement : - Dieu est le plus grand.", "ar": "كان الدرج مظلما لكن هذا لم يكن يخيفني. الفراغ الذي كان أمامي لم يكن فارغا إلا ظاهريا. كانت أرواح خرساء تتنحى لتدعني أمر. عندما سأبلغ السن اللازم. ستكشف كل هذه الأرواح نفسها أمام عيني الساحر خاصتي. سمعت أمي تلفظ بوقار: - الله أكبر."}, {"fr": "Quelqu’un demanda:", "ar": "سأل أحدهم:"}, {"fr": "- Est-ce le muezzin annonçant la prière de l’Achaa que j’entends?", "ar": "- هل ما أسمعه هو المؤذن الذي ينادي لصلاة العشاء؟"}, {"fr": "- Oui, répondit ma mère.", "ar": "- أجابت أمي: أجل."}, {"fr": "Dans le noir, je retenais mon souffle, j’écoutais avec attention. Je n’entendais point de muezzin. Les femmes; dit-on, ont l’oreille plus fine que les hommes. Mon père ne tarda pas à arriver. Le dîner se déroula comme à l’ordinaire.", "ar": "في الظلام، كنت أحبس أنفاسي، أرهف السمع. لم أكن أسمع المؤذن. يقال بأن للنساء سمعا حادا أكثر من الرجال. لم يتأخر أبي في الوصول. جرى العشاء كما العادة."}, {"fr": "Avant de nous coucher, mon père me fit part de son intention de m’emmener le lendemain, dans la matinée, me promener dans les souks et choisir mes jouets. Nous irions aussi à Bab Moulay Idriss faire l’acquisition d’un cierge. La nuit de l’Achoura, je l’offrirais au maître d’école. J’étais heureux. Une seule chose m’ennuyait. Je savais qu’il m’était impossible d’échapper à la séance du coiffeur. Mon père ne manquerait pas de me conduire à Chemaïne dans l’étroite boutique de Si Abder- rahman, le barbier. Je n’aimais ni Si Abderrahman, ni sa boutique.", "ar": "قبل أن ننام، أخبرني أبي بأنه ينوي اصطحابي معه في اليوم التالي، في الصباح، للتنزه في الأسواق و اختيار ألعابي. كنا سنذهب كذلك إلى باب مولاي إدريس لشراء شمعة دينية. سأهبها لمعلم الكتاب في ليلة عاشوراء. كنت سعيدا. كان شيء واحد يزعجني. كنت أعلم بأنه من المستحيل لي أن أفلت من حصة الحلاق. لم يكن ليفوت أبي أن يأخذني إلى شماين في الدكان الضيق لسي عبد الرحمان الحلاق. لم أكن أحب لا سي عبد الرحمان، ولا دكانه."}, {"fr": "Je me couchai, mais le sommeil avait fui mes paupières. Je rêvai longtemps à des cierges monumen- taux, décorés de dentelles de papier finement ajourées par une main patiente, de rasoirs étincelants, de tambours en forme de sablier, de lustres en fer forgé chargés de godets de cristal.", "ar": "نمت، لكن النعاس كان قد ترك جفوني. حلمت طويلا بشموع دينية ضخمة، مزينة بتخريمات من الورق المفرغ بدقة من طرف يد صبورة، شفرات براقة، « دربوكات مزدوجة »، ثريات من الحديد المطرق محملة بفناجين بلورية."}, {"fr": "Mon père ne connaissait rien à l’art délicat de vendre et d’acheter. Il ignorait les subtilités du marchan- dage et la volupté d’obtenir un objet, un sou moins cher que ne l’a payé le voisin. Il m’emmena, après le repas du matin, faire le tour des marchands de jouets. Dans chaque rue résonnaient les tambourins, les grelots des hochets de fer-blanc, le chant des flûtiaux. Les marchands de tambourins se démenaient dans leurs échoppes devenues étroites tant il s’y entassait de marchandises. Des tambourins, des bendirs, des tambours de basque, des trompettes et des pipeaux pendaient par grappes, s’amoncelaient en tas multico- lores, envahissaient les étagères. Un peuple de femmes, d’hommes mûrs, de fillettes et de garçons faisaient cercle autour de chaque magasin. Les uns essayaient un instrument, les autres les accompagnaient de battements de mains, jacassaient, réclamaient, discutaient avec le marchand qui ne savait plus où donner de la tête.", "ar": "لم يكن أبي يعرف شيئا عن الفن العظيم للبيع و الشراء. كان يجهل حذاقات المساومة و نشوة الحصول على شيء ما، بفلس أقل مما دفعه الجار. اصطحبني بعد الفطور للقيام بجولة حول بائعي الألعاب. كان صوت « 73 الطعارج » يدوي في كل شارع، جلاجل شخشيخات التنك، لحن الشبابات. كان تجار « الطعارج » يجدون صعوبة في التحرك داخل دكاكينهم الصغيرة التي أصبحت ضيقة لكثرة أكوام البضاعة. كانت « طعارج »، بنادير، دفوف، أبواق و مزامير تتدلى على شكل عناقيد، تتجمع على شكل أكوام متعددة الألوان، تملأ الرفوف. حشد من النساء، الرجال الناضجين، البنات و الأولاد يتحلقون حول كل دكان. كان البعض يجربون آلة و الآخرون يرافقونهم بالتصفيق، يصرخون، يطلبون، يتحدثون مع البائع الذي لم يعد يعرف من أين يبدأ."}, {"fr": "Une foule de campagnards, descendus de leurs lointains villages, s’approvisionnaient en sucre, épices, cotonnades et instruments de musique. Ils encombraient la rue de leurs paquets.", "ar": "كانت مجموعة من القرويين، القادمين من قراهم البعيدة، يشترون مخزونهم من السكر، التوابل، الأقمشة و الآلات الموسيقية. كانوا يسدون الطريق برزمهم."}, {"fr": "Je m’accrochais à la main de mon père, occupé à écarter les passants pour nous frayer un chemin. J’eus mon tambour en forme de sablier, un petit chariot bizarre en bois et une nouvelle trompette.", "ar": "كنت أمسك بيد أبي الذي كان مشغولا بإبعاد الناس ليشق لنا طريقا. حصلت على « دربوكتي المزدوجة »، عربة صغيرة غريبة من الخشب و بوق جديد."}, {"fr": "Mon père me laissait choisir, payait sans discuter. Je lui tenais de longs discours, lui posais mille ques- tions auxquelles il répondait rarement. Il souriait à me voir si excité. Nous terminâmes nos emplettes par l’achat d’un cierge, d’une livre de poids. La rue Bab Moulay Idriss débouche dans le quartier des fabri- cants de ceintures brodées et des marchands de fruits secs.", "ar": "كان أبي يدعني أختار، يدفع دون نقاش. كنت ألقي عليه خطابات طويلة، أطرح عليه آلاف الأسئلة التي نادرا ما كان يجيب عليها. كان يبتسم لرؤيتي سعيدا جدا. أنهينا تسوقنا بشراء شمعة دينية، وزنها رطل. كان شارع باب مولاي إدريس يؤدي إلى حي صانعي الأحزمة المطرزة و بائعي الفواكه الجافة."}, {"fr": "Près d’un pied de vigne séculaire, s’ouvrait la boutique de Si Abderrahman le coiffeur. Le maalem Bnou Achir occupait la boutique qui lui faisait vis-à-vis. Chacun avait sa clientèle. Les deux barbiers ignoraient la concurrence.", "ar": "كان دكان سي عبد الرحمان الحلاق يقع قرب قدم دالية عتيقة. كان المعلم بنو عاشر يشغل الدكان المقابل. كان لكل واحد زبائنه. كان كلا الحلاقان يجهلان المنافسة."}, {"fr": "Mon père venait se faire raser les cheveux depuis son installation à Fès, dans la boutique de Si Abder- rahman. Les barbiers participent à de nombreuses cérémonies familiales. A ma naissance, mon père, monta- gnard transplanté dans la grande ville, désirait néanmoins fêter dignement mon arrivée au monde. Si Ab- derrahman lui fut d’un excellent conseil. Il vint, selon l’usage, accompagné de ses deux apprentis, placer les invités et faire le service pendant le repas. Lors de ma première coupe de cheveux, mon père eut recours à ses soins et fit encore grand cas de ses avis et recommandations.", "ar": "كان أبي يأتي ليحلق شعره في دكان سي عبد الرحمان منذ استقراره في فاس. كان الحلاقون يشاركون في عدة احتفالات عائلية. كان أبي قرويا يسكن في المدينة الكبيرة و مع ذلك عند ولادتي كان يريد الاحتفال بمجيئي إلى العالم كما ينبغي. كان سي عبد الرحمان أفضل عون له. جاء، حسب العادة، و معه اثنان من متعلميه لي جلس المدعوين و يقوم بتقديم الطعام. عند أول حلاقة لي، استعان أبي بخدماته و كانت كذلك فرصة مناسبة ليأخذ برأيه و نصائحه."}, {"fr": "Je n’aimais pas Si Abderrahman. Je savais qu’il serait chargé de me circoncire. Je redoutais ce jour. Je sentais des frissons me parcourir l’épiderme quand je le voyais manier le rasoir ou les ciseaux. Nous le trouvâmes occupé à pratiquer une saignée. Le client présentait sa nuque rasée, Si Abderrahman se penchait sur le cou du patient. Je détournai les yeux de ce spectacle. Si Abderrahman planta deux ventouses en fer-blanc derrière la tête de l’inconnu et nous souhaita en termes courtois une heureuse journée.", "ar": "74 لم أكن أحب سي عبد الرحمان. كنت أعلم بأنه من سيقوم بختاني. كنت أخشى هذا اليوم. كنت أحس بقشعريرة تسري في بدني عندما أراه يستعمل الموسى أو المقص. وجدناه مشغولا بالقيام بحجامة. كان المريض يبدي رقبته الحليقة. كان سي عبد الرحمان ينحني على عنق المريض. صرفت عيني عن هذا المشهد. أدخل سي عبد الرحمان محجمين من التنك خلف رأس الغريب و تمنى لنا نهارا سعيدا بعبارات مؤدبة."}, {"fr": "- Je vois, dit-il, que ce jeune homme a été gâté: un tambour, une trompette, un magnifique chariot et un cierge. Il est vrai que le cierge est destiné au fqih. Il faut toujours être très bien avec son maître, sinon, gare à la baguette de cognassier.", "ar": "- قال: أرى بأن هذا الشاب دلل كثيرا: طبل، بوق، عربة مذهلة و شمعة دينية. صحيح بأن الشمعة الدينية ستعطى للفقيه. يجب التعامل جيدا مع المعلم، و إلا فاحترس من عصا السفرجل."}, {"fr": "Tout le monde se mit à rire. Je rougissais d’indignation. La baguette de cognassier n’a rien de risible. Ces messieurs n’en avaient jamais reçu sur la plante des pieds, au point de ne pouvoir se tenir debout. Ils pouvaient rire. La baguette de cognassier inspire à ceux qui la connaissent un sentiment de crainte et de respect.", "ar": "بدأ الجميع بالضحك. كنت أحمر من الغضب. لا يوجد ما يضحك في عصا السفرجل. لم يسبق لهؤلاء آلسادة أن تلقوها على أخمص قدمهم إلى حد العجز عن الوقوف. كانوا يستطيعون الضحك. تثير عصا السفرجل في أولئك الذين يعرفونها إحساسا بالخشية و الاحترام."}, {"fr": "Un homme sec, avec une barbe de bouc et un turban monumental, souleva le rideau d’entrée. Il gei- gnait tant qu’il pouvait. Pour tout salut, il se contenta de hocher la tête d’un mouvement affirmatif. Il s’écroula entre les accoudoirs d’une chaise rigide et continua à geindre. - Tu me parais encore bien fatigué, oncle Hammad ! Puis-je t’être utile?", "ar": "رفع رجل نحيف، ذو لحية صغيرة و عمامة ضخمة، ستار المدخل. كان يتأوه كثيرا. ليسلم على الجميع، اكتفى بهز رأسه بحركة إيجابية. انهار بين مساند كرسي صلب و تبع تأوهه. - تبدو لي متعبا جدا ثانية، أيها العم حماد! هل أستطيع مساعدتك؟ - سوف أموت يا سي عبد الرحمان."}, {"fr": "- Si Abderrahman, je vais mourir. - Ne prononce pas de telles paroles indignes d’un musulman. Allah seul connaît les secrets de la vie et de la mort. De quoi souffres-tu ?", "ar": "- لا تنطق بمثل هذه الكلمات التي لا تليق بالمسلم. إن الله وحده من يعلم أسرار الحياة و الموت. مما تشكو؟"}, {"fr": "- Je ne souffre pas. Seulement, la nuit, ma respiration devient courte, j’étouffe et mon cœur se gonfle d’angoisse.", "ar": "- أنا لا أشكو من شيء. فقط، في الليل، يصبح تنفسي قصيرا، أختنق و يمتلئ قلبي بالخوف."}, {"fr": "- Il te faut un fortifiant, oncle Hammad. Je connais une recette très efficace. Pourras-tu t’en souvenir? - Ma mémoire est intacte; c’est le cœur, te dis-je, qui faiblit. Donne-moi vite cette recette.", "ar": "- يلزمك مقو ، يا عم حماد. أعرف وصفة فعالة جدا. هل ستستطيع تذكرها. - إن ذاكرتي سليمة؛ أقول لك بأن القلب هو الذي يضعف. أعطني هذه الوصفة بسرعة."}, {"fr": "- Elle est simple. Demande aux gens de ta maison de faire frire dans du beurre un oignon blanc fine- ment haché. Mélange à cet oignon frit deux cuillérées de miel, de l’anis et des grains de sésame, ajoute du gingembre et de la cannelle, parfume l’ensemble avec trois clous de girofle. Si tu absorbes une bouchée chaque matin de ce remède, tes malaises disparaîtront.", "ar": "- إنها بسيطة. أطلب من أهلك أن يقلو بصلة مفرومة جيدا في الزيت. إخلط مع هذه البصلة المقلية ملء ملعقتين من العسل، اليانسون و حبوب 75 السمسم، أضف الزنجبيل و القرفة، عطر الكل بثلاثة مسامير من القرنفل. إذا تناولت لقمة من هذا العلاج كل صباح، ستختفي توعكاتك."}, {"fr": "- Si Abderrahman, Dieu te récompensera, le jour du jugement; je savais que ta sagesse me serait d’un grand secours. Je m’en vais acheter les ingrédients, à l’heure et à l’instant.", "ar": "- سي عبد الرحمان، فليكافئك الله، يوم الحساب؛ كنت أعلم بأن حكمتك ستساعدني كثيرا. سأذهب لشراء المكونات حالا."}, {"fr": "L’oncle Hammad soupira, s’agita, finit par s’extraire de son siège et partit, poussant de sourds gémis- sements.", "ar": "تنهد العم حماد، تحرك، ثم انتهى بالنهوض من على كرسيه و رحل، و هو يطلق أنينا صامتا."}, {"fr": "Si Abderrahman vérifia l’adhérence des ventouses qu’il avait posées sur la nuque de son mystérieux client.", "ar": "تحقق سي عبد الرحمان من التصاق المحاجم التي كان قد وضعها على رقبة زبونه الغامض."}, {"fr": "- Aujourd’hui, mon aide est absent et l’apprenti en prison, pour je ne sais quel méfait; je suis seul à travailler, expliqua Si Abderrahman.", "ar": "- شرح سي عبد الرحمان: إن مساعدي غائب اليوم و المتعلم في السجن لجنحة لا أعرفها؛ أنا أعمل لوحدي."}, {"fr": "Il continua, s’adressant à mon père : - J’espère, Maalem Abdeslem, que tu n’as rien de bien important à faire, j’en ai pour un moment à pratiquer cette saignée. J’en ai fait une hier à l’un de tes amis, Moulay Larbi Alaoui, le babouchier. Cet homme me plaît. Toujours digne, sobre de paroles et de gestes. Ce qui m’étonne, c’est qu’il n’ait point d’enfants. Peut-être a-t-il une femme trop âgée ? Les gens de ta maison doivent connaître la femme de Moulay Larbi. On raconte que c’est une Chérifa au cœur généreux. Grâce à son aide, Moulay Larbi a pu payer ses dettes et remonter son atelier. Je sais que ses affaires sont maintenant très prospères.", "ar": "تابع مخاطبا أبي: - أتمنى، أيها المعلم عبد السلام، أنه ليس لديك شيء مهم لفعله، سأستغرق مدة لأكمل هذه الحجامة. لقد قمت بواحدة لأحد أصدقائك البارحة. مولاي العربي العلوي، صانع البلغات. يعجبني هذا الرجل. إنه وقور دائما. رصين الكلام و الأفعال. ما أستغربه، هو أنه ليس لديه أطفال. ربما لديه زوجة كبيرة في السن؟ لا بد من أن أهلك يعرفون زوجة مولاي العربي. يقال بأنها شريفة بقلب كبير. بفضل مساعدتها، استطاع مولاي العربي أن يسدد ديونه و يعيد تجهيز ورشته. أعلم بأن أعماله مزدهرة جدا الآن."}, {"fr": "Mon père écoutait, indifférent. Si Abderrahman repassait un rasoir, se penchait sur la nuque du patient aux ventouses, rangeait de menus objets dans un tiroir.", "ar": "كان أبي يسمع بلا مبالاة. كان سي عبد الرحمان يكوي شفرة، ينحني على رقبة المريض ذي المحاجم، يضع أشياء صغيرة داخل درج."}, {"fr": "Installé sur la banquette entre deux accoudoirs en bois tourné, les pieds dans le vide, je regardais la natte usée qui tapissait le mur, les panoplies de rasoirs et de miroirs à main, j’admirais la majestueuse cathèdre de marie peinte de couleurs fanées.", "ar": "جالسا على مقعد بين مسندين من الخشب الدائري، بقدمين في الفراغ، كنت أنظر إلى الحصير الرث الذي كان يغلف الجدار، عدة الشفرات و المرايا اليدوية، أعجب بعرش الأسقف المرسوم بألوان باهتة."}, {"fr": "Déjà Si Abderrahman reprenait son monologue.", "ar": "كان سي عبد الرحمان قد استأنف مونولوجه:"}, {"fr": "- Ne crois-tu pas qu’il devrait songer à prendre une nouvelle épouse? Le moment n’est peut-être pas en- core venu, mais je suis sûr que les affaires de Moulay Larbi iront en s’améliorant. Il fabrique d’excellentes babouches de femmes, d’une richesse de matière, de décor et de couleur vraiment étonnantes. Ces articles jouissent toujours d’une grande faveur auprès de la clientèle féminine. Il n’y a que les femmes pour faire la fortune des uns ou la ruine des autres. Il paraît que dans certains pays, les femmes vont même se faire arranger les cheveux chez le coiffeur. Que ne suis-je né dans l’un de ces pays fabuleux!", "ar": "- ألا تظن بأنه يجب عليه أن يتزوج امرأة أخرى؟ ربما لم يئن الأوان البعد، لكنني متأكد من أن أعمال مولاي العربي ستمشي من حسن إلى أحسن. إنه يصنع بلغات نساء ممتازة، تتسم بجودة مدهشة حقا، سواء على مستوى المادة، الزينة أو الألوان. تلقى منتجاته دائما إقبالا كبيرا من طرف النساء. النساء فقط هن من يصنعن ثروة البعض أو دمار الآخرين. في 76 بعض البلدان، تذهب النساء حتى إلى الحلاق لتصفيف شعرهن. لماذا لم أولد في أحد تلك البلدان المذهلة!"}, {"fr": "Si Abderrahman exhala un long soupir de regret et reprit :", "ar": "أطلق سي عبد الرحمان تنهد أسف طويل ثم استأنف:"}, {"fr": "- Je n’ai point le droit de me plaindre, je suis le coiffeur attitré de plusieurs familles, de notre haute société. Elles sont généreuses. Dieu saura les récompenser. Louange à Dieu. Un nouveau visiteur fit son entrée.", "ar": "- ليس لدي أي حق في التذمر، أنا الحلاق الذي يحظى باهتمام العديد من العائلات من المجتمع الراقي. إنهم كرماء. سيعرف الله كيف يكافئهم. الحمد لله! دخل زائر جديد."}, {"fr": "- Le salut sur vous! dit-il.", "ar": "- قال: السلام عليكم!"}, {"fr": "- Sur vous le salut, la miséricorde et la bénédiction d’Allah! répondit Si Abderrahman. Mon père remua les lèvres, le client aux ventouses toussa à trois reprises, cracha quelque part et se figea dans sa pose rigide: Il nous tournait le dos. J’apercevais les franges de sa barbe qui dépassaient sur le côté. Ses oreilles d’un rouge cerise ressemblaient à des fleurs étranges. Il devait être assez âgé et travaillait, à voir la couleur de sa nuque, aux champs ou dans un des multiples jardins qui entourent Fès. Il cessa de m’intéresser. Je re- gardais le nouveau venu. Jeune, la peau d’une blancheur de cire, les sourcils bien fournis et la barbe plus noire que l’aile du corbeau, son visage rayonnait de douceur.", "ar": "- أجاب سي عبد الرحمان: و عليكم السلام و رحمة الله تعالى و بركاته. حرك أبي شفتيه، سعل الزبون ذو المحاجم ثلاث مرات، بصق في مكان ما و تسمر في وضعيته الصلبة. كان يدير ظهره لنا. كنت أرى أهداب لحيته التي كانت خارجة من الجانب. كانت أذناه الحمراوان كالكرز تشبهان وردتين غريبتين. انطلاقا من لون رقبته، من المرجح أن يكون عجوزا و يعمل في الحقول أو في العديد من الحدائق التي تحيط بفاس. لم يعد يثير اهتمامي. كنت أنظر إلى القادم الجديد، كانت بشرته بيضاء كالشمع، حواجبه كثيفة و لحيته أكثر سوادا من جناح الغراب، كان وجهه يشع لطفا."}, {"fr": "Il prit place sur une sorte d’estrade assez élevée qui faisait face à la porte de la boutique. Si Abder- rahman, tout en vaquant à de mystérieuses besognes, ne cessa de lui prodiguer les sourires et les mots aimables. Lorsque le jeune homme se fut installé, le coiffeur poussa un ou deux hennissements pour manifester sa joie et entama la conversation.", "ar": "جلس على ما يشبه منبرا مرتفعا جدا كان يقابل باب الدكان. لم يتوقف سي عبد الرحمان عن تملقه بالابتسامات و الكلام الطيب. عندما جلس الشاب، أطلق الحلاق حمحمة أو اثنتين ليعبر عن فرحه ثم شرع في الحديث."}, {"fr": "- Comment va ton vénéré père, Sidi Ahmed ? (Dieu le conserve en parfaite santé et multiplie ses biens !) Souffre-t-il toujours de son genou ? Cela va mieux ! J’en suis fort heureux ! J’en suis très heureux, très heureux ! Mon onguent a dû agir. Il a même agi au delà de mes espérances. Et toi, mon fils ? Laisse-moi te féliciter, te souhaiter bonheur et joie. Oui, je sais déjà. Je sais peu de chose en vérité. Ton père m’entre- tient parfois à ton sujet, il m’a annoncé l’heureux événement. Tu épouses la fille de Si Omar le notaire.", "ar": "- كيف حال والدك المحترم، يا سي أحمد؟ ( فليحفظه الله في صحة ممتازة و يكثر خيره! ) ألازالت ركبته تؤلمه؟ لقد تحسنت! أنا سعيد جدا لذلك! لقد أتى مرهمي بنتيجة. لقد تجاوز توقعاتي حتى. و أنت، يا بني؟ دعني أهنئك، أتمنى لك السعادة و الفرح. أجل، أنا أعلم مسبقا. أعرف القليل في الحقيقة، يحدثني والدك عنك أحيانا، لقد أخبرني بالحدث السعيد. ستتزوج ابنة سي عمر كاتب العدل."}, {"fr": "Pendant tout ce monologue, le nommé Si Ahmed ouvrit la bouche plusieurs fois, tenta de placer un mot mais Si Abderrahman devinait ses réponses et lui épargnait la fatigue de les formuler. Le barbier poursuivait : - Si Omar est un homme de Dieu. Dans une époque où s’étale la corruption, l’injustice, l’avidité, c’est un bienfait d’Allah de rencontrer un homme comme Si Omar, ou comme ton vénéré père Haj Ali.", "ar": "خلال كل هذا المونولوج، فتح المدعو سي أحمد فمه عدة مرات، حاول أن يتفوه بكلمة لكن كان سي عبد الرحمان يخمن أجوبته و يوفر عليه عناء النطق بها. كان الحلاق يتابع: 77 - إن سي عمر رجل تقي. إن لقاء شخص مثل سي عمر أو والدك المحترم الحاج علي في زمن تكثر فيه الرشوة، الظلم و الطمع هو نعمة من الله."}, {"fr": "Il se tourna vers mon père pour le renseigner : - Sidi Ahmed est le fils de El Haj Ali Lamrani, le marchand de thé du quartier Sagha. Tu dois le connaître.", "ar": "استدار نحو أبي ليخبره: - إن سيدي أحمد هو ابن الحاج علي العمراني، بائع الشاي في حي ساغا. لا بد من إنك تعرفه."}, {"fr": "- Si ! Si ! Tu dois le connaître, il a fait trois fois le pèlerinage aux Lieux Saints. Par trois fois, il toucha la Pierre Noire. Je prie Dieu de m’accorder la faveur d’être au Paradis le voisin d’un homme aussi pieux ! Sidi Ahmed va épouser la fille de Si Omar le notaire. Si Omar possède, outre la science, la sagesse et la courtoisie, des biens matériels; Dieu augmentera sa fortune.", "ar": "- بلى! بلى! لا بد من أنك تعرفه، لقد حج ثلاث مرات في الأراضي المقدسة. لقد لمس الحجر الأسود ثلاث مرات. أنا أدعو الله أن ينعم علي بأن أكون جارا لرجل تقي مثله في الجنة! سيتزوج سي أحمد ابنة سي عمر كاتب العدل. يملك سي عمر، إضافة إلى العلم، الحكمة و اللباقة، ثروات مادية؛ سيزيد الله من ثروته."}, {"fr": "Il s’adressa à Sidi Ahmed. - Que deviennent tes études? Je t’ai connu bébé, te voilà maintenant un savant! - Je ne suis qu’un mendiant de la science, dit enfin Sidi Ahmed.", "ar": "خاطب سي أحمد: - كيف حال دراستك؟ عرفتك منذ أن كنت رضيعا، و ها أنت الآن عالم! - قال سي أحمد أخيرا: لست سوى طالب للعلم."}, {"fr": "Il plaça cette phrase par surprise. Si Abderrahman suçait l’embouchure d’une de ses ventouses. Il ajouta, profitant toujours du silence forcé du barbier : - Si Abderrahman, tu en sais certainement plus long que moi sur mon manage. Mes parents s’occupent de cette affaire. Je n’ai pas mon mot à dire. - Depuis quand, répartit le coiffeur, les jeunes gens ont-ils leur mot à dire quand il s’agit de ces graves problèmes? Ils ont parfois de l’instruction, mais une instruction glanée dans les livres et sur les lèvres de leurs maîtres. Il leur manque l’expérience des gens murs, des points de comparaison, la connaissance des hommes. Se marier ne consiste pas à passer de charmantes soirées avec une jeune et jolie femme, se marier veut dire créer de nouveaux liens de parenté avec une autre famille, avoir de beaux enfants capables de vous venir en aide dans notre vieillesse. J’ai une fille en âge d’être mariée. Mon futur gendre sera un peu mon fils, moi qui ai toujours désiré un fils.", "ar": "قال هذه الجملة بشكل مفاجئ. كان سي عبد الرحمان يمص « سدادة » واحد من محاجمه. أضاف مستغلا دائما سكوت الحلاق الاضطراري: - سي عبد الرحمان، لا شك في أنك تعلم أكثر مني عن زفافي. إن والدي هما من يتكلفان بهذا الأمر. ليس القرار بيدي. - قال الحلاق: و منذ متى كان الشباب هم من يقررون عندما يتعلق الأمر بمثل هذه المشاكل الخطيرة؟ أحيانا تكون لديهم بعض التعليمات، لكن تعليمات مجمعة في الكتب و على شفاه معلميهم. تنقصهم تجربة الناس الناضجين، أوجه المقارنة، معرفة الرجال. إن الزواج لا يعني قضاء سهرات لطيفة مع فتاة شابة و جميلة، بل يعني خلق صلات قرابة جديدة مع عائلة أخرى، إنجاب أطفال جيدين قادرين على مساعدتك في الكبر. لدي بنت في سن الزواج. سيكون صهري المستقبلي مثل ابني تقريبا، أنا الذي كنت دائما أتمنى أن يكون لدي إبن."}, {"fr": "Si Abderrahman retira les ventouses, alla les vider derrière un rideau. Sur la nuque du client parais- saient deux boursouflures sanguinolentes. Le barbier s’empressa de les garnir de coton et vint vers moi. - Je vais commencer par cet enfant qui doit s’ennuyer. Il préférerait sans doute être dans la rue.", "ar": "سحب سي عبد الرحمان المحاجم، ذهب لإفراغها وراء ستار. كان انتفاخان داميان يظهران على رقبة الزبون. أسرع الحلاق بتغطيتهما بالقطن و أقبل نحوي. 78 - سأبدأ بهذا الطفل الذي لا بد من أنه يشعر بالملل. كان سيفضل أن يكون في الشارع بدون شك."}, {"fr": "Tout en m’enveloppant dans une large serviette rayée rouge et jaune, il continuait en ces termes : - Je le comprends! La rue! La rue, avec la foule et ses odeurs, la foule et ses appels, la foule et ses mur- mures, ses chants, ses lamentations, ses disputes et ses cris d’enfants, la rue avec ses places qu’ombragent la vigne et le platane, la rue qui rêve, qui chante et qui boude ... Maintenant, il me savonnait la tête et la frottait du plat de ses deux mains. Son regard était vague. Il reprit son hymne à la rue.", "ar": "بينما كان يغلفني بمنشفة كبيرة مخططة بالأحمر و الأصفر، كان يتابع بهذه الكلمات: - أنا أفهمه! الشارع! الشارع، بالناس و روائحه، الناس و نداءاته، الناس و همساته، غنائه، نواحه، شجاراته و أصوات أطفاله، الشارع بأماكنه التي تظلها الدالية و الدلب، الشارع الذي يحلم، الذي يغني و الذي يحرد... الآن، كان يصبن رأسي و يفركه بيديه المبسوطتين. كانت نظرته ملتبسة. تابع نشيد الشارع خاصته."}, {"fr": "- La rue où trottine le petit âne gris, où vagabondent les chats efflanqués, où tourbillonnent des vols de moineaux, la rue que traverse dignement un couple de pigeon au plumage irisé, cette rue avec ses cortèges de fête et ses cortèges d’enterrements réserve à ses amoureux ses sourires les plus tendres, les enveloppe d’une tiédeur de sein maternel, se pare pour eux seuls de couleurs délicates et de lumières rares.", "ar": "- الشارع الذي يكردح فيه الحمار الرمادي الصغير، الذي تتجول فيه القطط الهزيلة، الذي تدور فيه أسراب طيور الدوري، الشارع الذي يعبره زوج من الحمام بريش متقزح، يخصص هذا الشارع، بمواكب حفلاته و مواكب أدفانه، ابتساماته الأكثر لطفا للعشاق، يحيطهم بدفء حنان الأم، يتزين لهم فقط بالألوان اللطيفة و الأضواء النادرة."}, {"fr": "- Tu es un poète, Si Abderrahman! s’écria Sidi Ahmed. Par Allah! Je n’ai jamais rien lu d’aussi beau sur la rue. - Comment puis-je être poète alors que je sais à peine lire et écrire? Non, j’aime simplement notre bonne ville de Fès. La rue pour moi est un perpétuel spectacle. - Tu sais joliment en parier, dit mon père.", "ar": "- هتف سيدي أحمد: إنك شاعر يا سي عبد الرحمان! و الله! لم يسبق لي أن قرأت شيء بهذا الجمال عن الشارع. - كيف لي بأن أكون شاعرا و أنا بالكاد أعرف القراءة و الكتابة؟ لا، أنا فقط أحب مدينتنا الجميلة فاس. إن الشارع بالنسبة لي هو احتفال مستمر. - قال أبي: أنت تعرف كيف تتكلم عنه بشكل جيد."}, {"fr": "- Si Abdeslem, on parie toujours bien des choses qu’on aime. Une vulgaire gargoulette de terre cuite peut provoquer l’enthousiasme d’un amateur de gargoulettes et le transformer en ce que Sidi Ahmed appelle un poète. Si Abderrahman choisit un rasoir avec un manche d’ébène, le passa, le repassa sur une pierre gluante d’huile, l’essuya avec soin, réessaya sur son ongle avant d’entreprendre de me raser la tête.", "ar": "- سي عبد السلام، نتكلم دائما عن الأشياء التي نحب بشكل جيد. إن نعارة سوقية من الطين يمكنها أن تثير حماسة هاو للنعارات و تحوله إلى ما يسميه سيدي أحمد شاعرا. اختار سي عبد الرحمان موسى ذات مقبض من الآبنوس، مررها،
