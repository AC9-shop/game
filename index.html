لماء و انصرفت. مسح العراف فمه بمنشفة إسفنجية صغيرة لفها بعد ذلك بشكل كروي و وضعها تحت إحدى ركبتيه. في الأخير، خاطب المرأتين:"}, {"fr": "- Dieu vous a envoyées vers moi parce que vous avez le cœur blessé. Je ne suis qu’un humble esclave mais le Seigneur m’a choisi pour aider mes frères et soulager leurs maux. Que l’une de vous répète le geste de cet enfant béni et plonge la main dans le panier.", "ar": "- لقد أرسلكما الله إلي لأن قلبكما الجريح. لست سوى عبد متواضع لكن الله اختارني لأساعد إخوتي و أسكن أوجاعهم. فلتكرر إحداكما ما فعله هذا الطفل المبارك ولتدخل يدها في السلة."}, {"fr": "Lalla Aïcha soupira, tout en allongeant le bras vers le panier. Elle saisit un minuscule coquillage. Elle le remit à Sidi El Arafi et soupira de nouveau.", "ar": "121 تنهدت لالة عيشة، وهي تمد ذراعها إلى السلة. تناولت محارة صغيرة. أعطتها لسيدي العارافي و تنهدت من جديد."}, {"fr": "Le petit coquillage paraissait d’un blanc miraculeux entre les doigts bruns de Sidi El Arafi. Il se trans- formait en un bibelot de fine porcelaine, une création gratuite d’un céramiste génial dans un moment de béatitude. Sidi El Arafi le passa d’une main dans l’autre, le caressa, l’approcha de ses lèvres avec dévotion. Il parla: - Comment t’appelles-tu, femme au cœur généreux ? - Aïcha, ô cheikh.", "ar": "كانت المحارة تبدو ذات بياض خارق بين اليدين البنيتين لسيدي العارافي. كانت تتحول إلى تحفة من خزف صيني ناعم، صناعة مجانية من خزاف رائع في لحظة فرحة عارمة. مررها سيدي العارافي من يد إلى أخرى ، لمسها، قربها من شفتيه بتقوى. تكلم: - ما اسمك أيتها المرأة الكريمة القلب؟"}, {"fr": "- La femme préférée du Prophète se nommait ainsi. Je peux te conseiller de bannir toute tristesse de ton visage; mais tu as tant souffert et tu souffres encore beaucoup, alors tu ne prêteras qu’une oreille distraite à mes propos. La blessure semble profonde, pourtant la guérison est proche. Sais-tu, femme, que toute peine annonce une joie, que toute mort précède une résurrection, que toute solitude fait place à des flots de tendresse? Nous n’avons pas à nous révolter, nous n’avons pas à demander des comptes au destin. Sur cette terre, nous subissons des lois que nous ne sommes pas en mesure de comprendre. Acceptons ce que Dieu nous envoie. La tempête emporta le pauvre nid dans ses tourbillons mais, avec l’aide de Dieu, le nid sera de nouveau reconstruit. Il y aura de nouveau un printemps et des fleurs sur les branches des amandiers. Lalla Aicha poussa un gémissement et se mit à pleurer. Ma mère sortit son mouchoir pour s’essuyer les yeux. Moi, je me sentais heureux et délivré. Les paroles de Sidi El Arafi avaient trouvé un terrain fertile. Leurs racines plongeaient dans le sang de mes veines. J’entendis murmurer Sidi El Arafi pour lui-m ême cette étrange chanson: Au rythme nonchalant des jours,", "ar": "- عيشة، أيها الشيخ. - كانت المرأة المفضلة عند النبي تدعى هكذا. أستطيع أن أنصحك بمسح كل حزن وجهك؛ لكنك عانيت كثيرا و ما تزالين تعانين بشكل كبير، لذلك فستستمعين إلى كلامي من دون إصغاء. يبدو الجرح عميقا، إلا أن الشفاء قريب. هل تعلمين، يا امرأة، بأن كل ألم يعلن عن فرح، بأن كل موت يسبق قيامة، بأن كل وحدة تفسح المجال لسيول من الحنان؟ لا يجب علينا السخط، لا يجب علينا أن نطلب من القدر تفسيرا. على هذه الأرض، نخضع لقوانين لسنا قادرين على فهمها. فلنقبل ما يرسله الله لنا. ستجرف العاصفة العش المسكين في دواماتها لكن، بعون الله، سيبنى العش من جديد. سيكون هناك ربيع و أزهار على أغصان أشجار اللوز من جديد. أطلقت لالة عيشة تأوها و بدأت بالبكاء. أخرجت أمي منديلا لتمسح عينيها. أنا كنت أشعر بالفرح و التحرر. كانت كلمات سيدي العارافي قد وجدت أرضا خصبة. كانت جذورها مغروسة في دم أوردتي. سمعت سيدي العارافي يهمس لنفسه بهذه الأغنية الغريبة:"}, {"fr": "Au rythme lent des nuits, Le chapelet des lunes neuves Dénombre les saisons.", "ar": "بإيقاع الأيام اللا مبالي، بإيقاع الليالي البطيء، تسبيح الأقمار الجديدة يحصي الفصول."}, {"fr": "Il s’adressa de nouveau aux deux femmes:", "ar": "خاطب المرأتين من جديد:"}, {"fr": "- Les larmes produisent l’effet d’une rosée bienfaisante. Si la rosée est trop abondante, les fleurs se flé- trissent et meurent. Cessez vos pleurs et récitons ensemble la fatiha. En chœur, nous répétâmes dans un bourdonnement : Au nom du Dieu clément et miséricordieux", "ar": "- تحدث الدموع أثر ندى نافع. إن كان الندى غزيرا جدا، تذبل الأزهار و تموت، أوقفا بكاءكما ولنتلو الفاتحة سويا."}, {"fr": "Louange à Dieu, Maître de l’Univers. Le clément, le miséricordieux. Souverain au jour de la rétribution", "ar": "رددنا معا بطنين:"}, {"fr": "C’est toi que nous adorons, c’est toi dont nous implorons le secours. Dirige-nous dans le sentier droit Dans le sentier de ceux que tu as comblés de tes bienfaits", "ar": "بسم الله الرحمان الرحيم 122 الحمد لله رب العالمين الرحمان الرحيم ملك يوم الدين إياك نعبد و إياك نستعين إهدنا الصراط المستقيم صراط الذين أنعمت عليهم، غير المغضوب عليهم ولا الضالين."}, {"fr": "Non pas de ceux qui ont encouru ta colère, ni de ceux qui s’égarent. Amine! Après un moment de silence, ma mère tendit son bras dans un geste timide vers le panier. Elle remit à Sidi El Arafi le produit de sa pêche. C’était une perle noire à dessins multicolores.", "ar": "آمين! بعد لحظة صمت، مدت أمي يدها إلى السلة بحركة خجولة. أعطت لسيدي العرفي حصيلة صيدها. كانت لؤلؤة سوداء برسوم متعددة الألوان."}, {"fr": "Le voyant sourit et demanda à ma mère son nom.", "ar": "ابتسم العراف و سأل أمي عن اسمها."}, {"fr": "- Zoubida, répondit-elle,", "ar": "- أجابت: زبيدة."}, {"fr": "- Il y a longtemps, ô ma sœur, j’ai perdu mes yeux. Ma douleur s’était répandue en nappes tièdes sur mes joues. Je n’étais plus que cendre. Il n’y avait plus de place pour reposer mon corps. Il n y’ avait pas as- sez d’eau sur la terre pour étancher ma soif. Le soleil avait disparu et sur le monde régnait un éternel hiver. Du soleil et de l’eau Seigneur ! Du soleil et de l’eau Seigneur !", "ar": "- لقد فقدت بصري منذ وقت طويل يا أختي. كان ألمي قد انتشر على شكل طبقات دافئة على خدي. لم يبقى مني سوى الرماد. لم يعد هناك مكان لراحة جسمي. لم يكن هناك ما يكفي من الماء ليروي عطشي. كانت الشمس قد اختفت و كان فصل شتاء دائم يسود العالم."}, {"fr": "Le Seigneur a écouté ma plainte. La terre est redevenue cendre et maternelle. Je suis allé sur la colline réchauffer mes os. J’ai trempé mes membres dans les sources claires. Mon gosier rafraîchi a retrouvé les accents oubliés. 0 ma sœur, garde-toi de ne voir que malheur là où s’exprime la volonté de Dieu. Les Saints de Dieu qui veillent sur cette ville t’accordent leur protection. Visite leurs sanctuaires. Souviens- toi que lorsque quelqu’un fait des vœux pour un absent, l’ange gardien lui répond : Que Dieu te rende la pareille. Si El Arafi termina par cette sourate: Dis: «Dieu est un", "ar": "ماء و شمس يا إلهي ماء و شمس يا إلهي سمع الله شكواي. عادت الأرض حنونة و خصبة من جديد. ذهبت إلى التل لأدفئ عظامي. أدخلت أطرافي في الينابيع الصافية. استعاد حلقي المنتعش نبراتي المفقودة. يا أختي، امتنعي عن رؤية الجانب المظلم فقط من الإرادة الإلهية. إن أولياء الله الذين يسهرون على هذه المدينة يهبونك حمايتهم. زوري مزاراتهم. تذكري بأنه عندما يقوم شخص بأمنية من أجل غائب، يجيبه الملاك الحارس: فليرد الله عليك بالمثل."}, {"fr": "C’est le Dieu à qui tous les êtres s’adressent dans leurs besoins Il n’a point enfanté et n’a point été enfanté II n’a point d’égal en qui que ce soit.»", "ar": "انتهى سي العارافي بهذه السورة: قل: « هو الله أحد الله الصمد لم يلد و لم يولد و لم يكن له كفؤا أحد. »"}, {"fr": "Tout le monde se replongea de nouveau dans un silence méditatif. Mû par je ne sais quel sentiment, je me précipitai brusquement sur la main de Sidi El Arafi et je l’embrassai. Ce fut la fin de la séance. Les deux femmes ajustèrent leurs voiles. Elles se levèrent péniblement, arrangèrent leurs haïks. A tour de rôle, elles se penchèrent sur Sidi El Arafi pour lui baiser l’épaule et lui glisser discrètement dans le creux de la main une modeste pièce d’argent. Nous quittâmes la chambre, accompagnés jusqu’à la porte par les vœux de Sidi El Arafi. Dans la rue, je me sentis allégé d’un grand poids. Le monde s’offrait à mon regard dans sa propreté originelle. Le soleil jouait sur les vieux murs, sur les étalages des boutiques, sur les turbans et les djellabas avec allégresse.", "ar": "غرق الجميع في صمت تأملي من جديد. محركا بإحساس لا أعرفه، أسرعت بشكل مفاجئ إلى يد سيدي العارافي و قبلتها. كانت نهاية الزيارة. 123 أصلحت المرأتان حجابيهما. نهضتا بصعوبة، رتبتا حايكيهما. انحنيتا بالدور على سيدي العارافي لتقبيل كتفه و دس قطعة نقدية متواضعة في باطن يده خلسة. غادرنا الغرفة و دعوات سيدي العارافي ترافقنا إلى غاية الباب. في الشارع، أحسست بأنني تخلصت من عبء كبير. كان العالم يتمثل أمام عيني بنقائه الأصلي. كانت الشمس تلعب على الجدران القديمة، على عروض بضاعة الدكاكين و على العمامات و الجلابيب بمرح."}, {"fr": "Les prédictions de Sidi El Arafi, me disais-je, se réaliseront. Mais quelles prédictions ? Il a parlé en termes si voilés! Ai-je bien saisi le sens des mots? Je comprenais tout, en présence de cet homme. Il n’était plus là, mais il me restait une sensation de liberté que je ne connaissais pas jusqu’alors. Ses paroles que j’avais bues avec avidité, s’étaient transformées dans mes entrailles en pure musique. La fatigue ne pesait plus sur mes épaules. Je me mis à danser. Ma mère et Lalla Aicha ne me voyaient plus. Elles marchaient côte à côte plongées dans leurs réflexions.", "ar": "كنت أقول لنفسي: ستتحقق تنبؤات سيدي العارافي. لكن أية تنبؤات؟ لقد تكلم بمفاهيم غامضة جدا! هل فهمت معنى الكلمات بشكل جيد؟ كنت أفهم كل شيء، بحضور هذا الرجل. لم يعد هنا، لكن بقي لدي إحساس بالحرية لم أكن أعرفه حتى الآن. كانت كلماته التي ابتلعتها بشراهة قد تحولت داخل أحشائي إلى موسيقى خالصة. لم يعد التعب يثقل كتفي. بدأت بالرقص. لم تعد أمي و لالة عيشة تريانني. كانتا تمشيان جنبا إلى جنب و هما غارقتان في أفكارهما."}, {"fr": "Brusquement, je cessai de gambader pour courir me cacher dans les plis du haïk de ma mère. Ce mou- vement réveilla son attention.", "ar": "بشكل مفاجئ، توقفت عن النط لأجري و أختبئ في ثنايا حايك أمي. أيقظت هذه الحركة انتباهها."}, {"fr": "- Qu’as-tu? Tu es blanc comme un linge. Qu’est-ce qui peut t’effrayer? Parle donc! Je persistai dans mon mutisme et me serrai davantage contre ma mère.", "ar": "- ما بك؟ أنت أبيض مثل الغسيل. ما الذي يمكن أن يخيفك؟ فلتتكلم! أصريت على صمتي و التصقت أكثر بأمي."}, {"fr": "Lalla Aïcha intervint :", "ar": "تدخلت لالة عيشة:"}, {"fr": "- Qu’a-t-il donc? Peut-être souffre-t-il de maux de ventre?", "ar": "- ما به إذن؟ هل من الممكن أنه يعاني من أوجاع في البطن؟"}, {"fr": "- Il ne veut rien me dire. Il tremble comme une feuille. Parle, tête de mule!", "ar": "- إنه لا يريد إخباري. إنه يرتعش خوفا. تكلم، أيها العنيد!"}, {"fr": "Je quittai les plis du haïk et je respirai profondément. Je dis enfin:", "ar": "غادرت ثنايا الحايك و تنفست بعمق. قلت في الأخير:"}, {"fr": "- J’ai eu peur.", "ar": "- لقد كنت خائفا."}, {"fr": "- De qui as-tu eu peur ?", "ar": "- ممن كنت خائفا؟"}, {"fr": "- J’ai vu passer le fqih, mon maître. Il a tourné à gauche, il est parti par la petite rue. Il aurait pu me voir. - Qu’est-ce que cela pouvait faire s’il t’avait vu. N’es-tu pas malade? N’es-tu pas accompagné de ta mère? Un enfant qu’accompagne sa mère ne peut pas être accusé de vagabondage.", "ar": "- لقد رأيت الفقيه، معلمي، مارا. لقد انعطف إلى اليسار، لقد ذهب من الشارع الصغير. كان من الممكن أن يراني. - ماذا كان سيحدث لك لو رآك. ألست مريضا؟ ألا ترافقك أمك؟ لا يمكن اتهام طفل ترافقه أمه بالتسكع."}, {"fr": "- Oui, répondis-je, mais un enfant malade ne se promène pas dans la rue, même accompagné de sa mère.", "ar": "- أجبت: أجل، لكن الطفل المريض لا يتجول في الشارع حتى و لو كانت أمه ترافقه."}, {"fr": "- Si nous avions rencontré le fqih je lui aurais expliqué que je t’avais amené voir un médecin.", "ar": "- لو التقينا بالفقيه كنت سأقول له بأنني اصطحبتك لترى طبيبا."}, {"fr": "- Simple excuse, aurait-il pensé et à mon retour au Msid, il m’aurait fait payer cher ma promenade.", "ar": "124 - كان سيظن بأنه عذر بسيط و عندما أعود للمسيد، كان سيجعلني أدفع ثمن نزهتي."}, {"fr": "Ma mère soupira et dit à l’adresse de Lalla Aïcha:", "ar": "تنهدت أمي و قالت و هي تخاطب لالة عيشة:"}, {"fr": "- On ne peut plus faire entendre raison à cet enfant, il discute comme un homme.", "ar": "- لم يعد من الممكن إقناع هذا الطفل، إنه يناقش كالرجل."}, {"fr": "- Dieu le bénisse! répondit notre amie.", "ar": "- أجابت صديقتنا: باركه الله!"}, {"fr": "Nous cheminâmes en silence. Au pont de Bin Lamdoun, un marchand de grenades s’était installé pur terre et avait ouvert son couffin. Les grenades ne devaient pas être mûres. L’écorce en était encore verte. Je me plantai devant lui. Ma mère comprit vite mon attitude. Elle me cria d’assez loin: - Tu peux prendre racine à cet endroit, tu n’auras pus de grenades. Elles sont encore vertes. Je ne tiens l’as à te soigner si tu attrapes des maux d’yeux. - J’en veux une seule pour goûter.", "ar": "مشينا في صمت. في جسر بين المدون، كان هناك بائع رمان قد جلس على الأرض و فتح قفته. لم يكن الرمان ناضجا بعد. كانت قشرته ما تزال خضراء. وقفت أمامه. فهمت أمي موقفي بسرعة. صاحت بي من بعيد: - تستطيع البقاء هناك، لن تحصل على رمان. إنه ما يزال أخضرا. أنا لا أريد علاجك إذا أصبت بأوجاع العيون. - أريد واحدة فقط لأتذوقها."}, {"fr": "- Tu n’en auras pas un grain. Allons viens!", "ar": "- لن تحصل على حبة واحدة. هيا تعال!"}, {"fr": "Elle me saisit par le bras et m’entraîna malgré ma résistance. Je me mis à pleurnicher. Mes reniflements durèrent un assez long moment. Sans raison mon chagrin s’évanouit. Je m’essuyai les yeux dans les manches de ma djellaba. Le spectacle de la rue m’absorba. Ce que je voyais suscitait en moi des réflexions que j’exprimais à haute voix. Je jacassai sans interruption jusqu’à la maison.", "ar": "أمسكتني من ذراعي و جذبتني رغم مقاومتي. بدأت بالتباكي. دام نخيري مدة طويلة. اختفت كآبتي دون سبب. مسحت عيني بأكمام جلبابي. شغلني منظر الشارع. كان ما كنت أراه يثير في ملاحظات كنت أعبر عنها بصوت مرتفع. بقيت أثرثر بدون انقطاع إلى غاية البيت."}, {"fr": "Ma mère ne souffla mot à nos voisines de la visite que nous avions faite à Sidi El Arafi. Nous habitions avec une chouafa. Normalement, ma mère aurait du la consulter en premier lieu. Mais elle n’avait aucune confiance en ses talents. J’étais tacitement de son avis. Les pratiques de Kanza, la principale locataire, relevaient du domaine démoniaque. Elles étaient compliquées, exigeaient une mise en scène, entraînaient à de multiples dépenses. Nous n’étions pas assez riches pour nous permettre de gaspiller de l’argent à nous procurer des parfums agréables aux narines des djinns. Ajoutez à toutes ces considérations la méfiance de ma mère, la peur de voir ses pauvres secrets divulgués. Personne dans la maison n’ignorait notre situation, ma mère, pourtant, s’imaginait le contraire. Elle raconta que nous nous étions rendus avec Lalla Aïcha dans un quartier éloigné de la ville (elle ne pouvait pas ne rien raconter) mais elle évita toute indiscrétion en prétendant que nous étions partis faire un pèlerinage aux sanctuaires de la ville. Ma santé l’exigeait. Les remèdes humains restent inefficaces s’ils ne sont pas sanctifiés par les effluves spirituels des hommes de Dieu. Le lendemain de notre sortie avec Lalla Aicha, ma mère me fit part de son intention de me garder à la maison durant toute l’absence de mon père. Elle invoqua deux solides raisons. La première: je n’étais plus qu’un paquet d’os et mon teint rappelait l’écorce de grenade; la seconde: ma mère se sentait de plus en plus seule, ma présence lui faisait oublier ses malheurs.", "ar": "لم تقل أمي لجاراتنا أية كلمة عن الزيارة التي قمنا بها لسيدي العارافي. كنا نسكن مع شوافة. عادة كان على أمي أن تستشيرها في المقام الأول. لكن لم تكن لديها أية ثقة بقدراتها. كنت أتفق معها بشكل ضمني. كانت أفعال كنزة، المستأجرة الرئيسية، تنبع من المجال الشيطاني. كانت معقدة، تتطلب تحضيرات، ترتبط بعدة مصاريف. لم نكن أثرياء بما فيه الكفاية لنسمح لأنفسنا بتضييع النقود في شراء بخور عطرة لأنوف الجن. أضيفوا لكل هذه الاعتبارات حذر أمي، الخوف من فضح جميع أسرارها. لم يكن هناك من يجهل وضعيتنا في البيت، و مع ذلك كان يخيل إلى أمي عكس ذلك. حكت بأننا ذهبنا برفقة لالة عيشة إلى حي بعيد عن المدينة ( لم تكن تستطيع أن لا تحكي شيئا ) لكنها تجنبت كل فضول بادعائها أننا ذهبنا لنتبرك في مزارات المدينة. كانت صحتي تستدعي ذلك. إن العلاجات البشرية تبقى بلا فائدة إن لم يتم تقديسها بالنفوح الروحية لرجال الله. 125 في اليوم التالي لخرجتنا مع لالة عيشة، أخبرتني أمي بنيتها في أن تدعني في البيت خلال فترة غياب أبي بأكملها. ذكرت سببين مقنعين: الأول: أنني لم أعد سوى كومة من العظام و صارت بشرتي تشبه لون قشور الرمان؛ الثاني: أصبحت أمي تحس بالوحدة أكثر فأكثر، كان وجودي يجعلها تنسى همومها."}, {"fr": "Autant pour se distraire que pour attendrir les saints de la ville sur notre sort, ma mère décida de m’emmener chaque semaine prier sous la coupole d’un Saint. Notre ville foisonne de tombes qui abri- tent les restes de chorfas, de chefs de confréries, de pieux législateurs auxquels la foi populaire reconnaît des pouvoirs. Chaque santon a son jour de visite particulier : le lundi pour Sidi Ahmed ben Yahia, le mardi pour Sidi Ali Diab, le mercredi pour Sidi Ali Boughaleb, etc. Tout cela, je le savais, tout le monde le savait. Nous trouvions simple, naturel, harmonieux, parfaitement sage ce que nos ancêtres avaient établi. Personne ne se serait avisé d’en rire. Les jours avaient un sens. Pour moi, ils possédaient même une couleur. Le lundi s’associait dans mon imagination au gris clair, le mardi, au gris foncé, un peu fu- meux, le mercredi brillait d’un éclat doré comme un soir d’automne, le jeudi froid et bleu contrastait avec le jaune rutilant du vendredi, la pâleur du samedi annonçait le vert triomphant du dimanche. Je n’avais jamais entretenu personne de ces découvertes. Si j’avais été femme, si j’avais été riche, j’aurais porté chaque jour une robe de la couleur qui convenait. Ma vie en aurait été plus belle, plus équilibrée, plus heureuse. Mais je n’étais pas femme et nous n’étions guère riches, surtout depuis le départ de mon père. Ma mère faisait une cuisine maigre, mêlai de la farine d’orge au pain de froment. Elle riait moins, ne racontait plus d’histoires. Il nous restait les longues promenades que nous faisions pour nous rendre aux divers sanctuaires deux ou trois fois par semaine. Nous formulions les mêmes plaintes, demandions la réalisation des mêmes vœux. Nous versions toujours les mêmes larmes indigentes et nous repartions vers notre demeure. Ces visites me fatiguaient. Je ne pouvais pas refuser d’y participer. La présence d’un enfant rendait les hommes de Dieu plus attentifs et plus favorables. Un matin, nous nous préparions pour sortir, quand quelqu’un frappa à la porte de la maison. Il de- manda si c’était bien là qu’habitait le maalem Abdeslem, le tisserand. Les voisines lui répondirent par l’affirmative. Kanza, la chouafa, appela ma mère. - Zoubida ! Zoubida ! Quelqu’un « vous » demande.", "ar": "بقدر ما كانت تفعل ذلك من أجل الترفيه كانت تفعله لتجعل أولياء المدينة يشفقون على حالنا، قررت أمي أن تأخذني كل أسبوع لنصلي تحت قبة ولي. كانت مدينتنا تعج بالقبور التي تحتوي على بقايا الشرفاء، زعماء أخويات، تقاة مشرعون كانت ثقة الشعب تعترف بقدراتهم. كان كل قديس يملك يوم زيارته الخاص: الإثنين لسيدي أحمد بن يحيى، الثلاثاء لسيدي علي دياب، الأربعاء لسيدي علي بوغالب، إلخ... كل هذا، كنت أعرفه، كان الجميع يعرفه. كان ما قام به أسلافنا يبدو لنا بسيطا، طبيعيا، متناسقا و حكيما بشكل مثالي. لم يكن أحد ليجرؤ على الضحك على ذلك. كان للأيام معنى. بالنسبة لي، كان لها لون حتى. كان الإثنين يرتبط في خيالي بالرمادي الفاتح، الثلاثاء بالرمادي الداكن، داخن قليلا، كان الأربعاء يلمع ببريق ذهبي كمساء خريف، الخميس بارد و أزرق يتباين مع الأصفر البراق ليوم الجمعة، كان امتقاع السبت يعلن انتصار أخضر الأحد. لم يسبق لي أن أخبرت أحدا بهذه الاكتشافات. لو كنت امرأة، لو كنت غنيا، كنت سألبس كل يوم كسوة باللون المناسب. كانت حياتي ستكون أكثر جمالا، أكثر توازنا، أكثر سعادة. لكنني لم أكن امرأة و قلما كنا أغنياء، بالأخص بعد رحيل أبي. كانت أمي تطبخ طبخا قليل الدسم، تخلط دقيق الشعير بخبز الحنطة. قل ضحكها، لم تعد تحكي القصص. كانت تبقى لنا النزه الطويلة التي كنا نقوم بها للذهاب إلى مزارات متعددة مرتين أو ثلاث مرات في الأسبوع. كنا نعبر عن نفس الشكاوى، نطلب تحقق نفس الأمنيات. نذرف دائما نفس الدموع الضعيفة و نعود إلى بيتنا. كانت هذه الزيارات تتعبني. لم أكن أستطيع رفض المشاركة فيها. كان وجود طفل يجعل رجال الله أكثر انتباها و أكثر تأييدا. ذات صباح، كنا نستعد للخروج، عندما طرق أحدهم باب البيت. سأل إن كان المعلم عبد السلام، الحائك، يعيش هنا حقا. أجابته الجارات بالإثبات. نادت كنزة، الشوافة، أمي."}, {"fr": "Ma mère avait naturellement tout entendu déjà.", "ar": "126 - زبيدة! زبيدة! هناك من يطلبك."}, {"fr": "Elle avait pâli. Elle restait au centre de la pièce, une main sur la poitrine, sans prononcer un mot. Qui pouvait bien nous demander? Était-ce un messager de bon augure ou le porteur d’une mauvaise nou- velle? Peut-être un créancier que mon père avait oublié de nous signaler! La petite somme d’argent que mon père nous avait laissée avant son départ, avait fondu. Les quelques francs qui nous restaient étaient destinés à l’achat de charbon.", "ar": "بطبيعة الحال، كانت أمي قد سمعت كل شيء بقيت في وسط الغرفة، بيد على الصدر، دون أن تنطق بكلمة. من الذي كان من الممكن أن يأتي ليسأل عنا؟ هل كان رسولا يبشر بالخير أو ناقل خبر سيئ؟ ربما كان دائنا نسي أبي أن يخبرنا عنه! كان المبلغ المالي الصغير الذي تركه لنا أبي قبل رحيله قد ذاب. كانت الفرنكات القليلة المتبقية تخص شراء الفحم."}, {"fr": "Enfin, ma mère répondit d’une voix qui tremblait légèrement :", "ar": "أجابت أمي أخيرا بصوت يرتجف بشكل خفيف:"}, {"fr": "- Si quelqu’un désire voir mon mari, dis-lui, je te prie, qu’il est absent.", "ar": "- إن كان هناك من يريد مقابلة زوجي فقولي له بأنه غير موجود من فضلك."}, {"fr": "Kanza fit la commission à haute voix à l’inconnu qui attendait derrière la porte de la maison. Un vague murmure lui fit écho. Kanza, pleine de bonne volonté, nous le traduisit en ces termes:", "ar": "نقلت كنزة الكلام بصوت عال إلى الغريب الذي كان ينتظر خلف باب البيت. تردد خلفها همس غير واضح. ترجمته كنزة، مفعمة بحسن النية، بهذه الكلمات:"}, {"fr": "Zoubida ! Cet homme vient de la campagne, il t’apporte des nouvelles du maalem Abdeslem. Il dit qu’il a quelque chose à te remettre.", "ar": "- زبيدة! إن هذا الرجل قادم من البادية، يريد أن ينقل لك أخبار المعلم عبد السلام. يقول بأن لديه شيئا ليعطيه لك."}, {"fr": "Ma mère reprit courage. Un sourire illumina sa face.", "ar": "تشجعت أمي. أضاءت ابتسامة وجهها."}, {"fr": "- C’est exactement ce que je pensais, dit-elle en se précipitant vers l’escalier.", "ar": "- قالت و هي تسرع إلى الدرج: هذا ما كنت أظنه بالضبط."}, {"fr": "Elle descendit les marches à toute allure. Pour la première fois de ma vie, je la voyais courir. Je la suivis. Je ne pouvais pas espérer la gagner de vitesse. Quand j’arrivai dans le couloir d’entrée ma mère discutait déjà par l’entrebâillement de la porte avec un personnage invisible. L’ombre disait d’une voix rude:", "ar": "نزلت الدرجات بأقصى سرعة. لأول مرة في حياتي، كنت أراها تجري. لحقت بها. لم أكن آمل أن أسبقها في السرعة. عندما وصلت إلى ممر الدخول كانت أمي قد بدأت بالحديث عبر شق الباب مع شخص مجهول. كان الظل يقول بصوت خشن:"}, {"fr": "- Il va bien, il travaille beaucoup et met tout son argent de côté. Il vous dit de ne pas vous inquiéter à son sujet. Il m’a donné ceci pour vous.", "ar": "- إنه بخير، إنه يعمل كثيرا و يضع كل ماله جانبا. يقول لكم بألا تقلقوا بشأنه. لقد أرسل معي هذا من أجلكم."}, {"fr": "Je ne voyais pas ce qu’il remettait à ma mère par la fente de la porte. Ma mère retroussa le bas de sa robe et serra précieusement dans ses plis le trésor que lui remettait l’inconnu. - Il y a encore ceci, dit la voix. C’est tout. Je quitte la ville demain matin, je verrai le maalem Abdeslem dès mon arrivée au douar. Que dois-je lui dire de ta part ?", "ar": "لم أكن أرى ما كان يسلمه لها عبر شق الباب. طوت أمي أسفل كسوتها و ضمت بعناية الكنز الذي سلمه لها الغريب. - قال الصوت: هناك أيضا هذا، هذا كل شيء. سأغادر المدينة غدا صباحا، سأرى المعلم عبد السلام بمجرد وصولي إلى الدوار. بماذا أخبره من طرفك؟"}, {"fr": "- Dis-lui que Sidi Mohammed va beaucoup mieux.", "ar": "- قل له بأن سيدي محمد قد تحسن كثيرا."}, {"fr": "- Louange à Dieu! Sa santé l’inquiétait beaucoup. Je m’en vais; restez en paix.", "ar": "- الحمد لله! كانت صحته تشغل باله كثيرا. سأرحل؛ السلام عليكم."}, {"fr": "- La paix t’accompagne, messager de bon augure.", "ar": "- رافقتك السلامة، أيها الرسول الميمون."}, {"fr": "La porte se ferma. Ma mère traversa le patio et monta précipitamment l’escalier.", "ar": "127 أغلق الباب، عبرت أمي الفناء و صعدت الدرج بسرعة."}, {"fr": "Déjà, les questions fusaient de toutes les chambres. Rahma se pencha à la fenêtre, Kanza qui lavait près du puits lâcha ses seaux et son savon, Fatma Bziouya abandonna son rouet, toutes interrogeaient à la fois ma mère sur la santé de mon père, sur son nouveau travail, sur l’endroit où il se trouvait. Mais ma mère répondait par des mots vagues suivis d’un cortège de formules de politesse. La curiosité de nos voisines se montrait tenace. Elles désiraient toutes savoir ce que mon père nous avait envoyé. Je sentais que ma mère tenait à les faire languir. Quand j’arrivai dans notre chambre, je trouvai, posés sur la petite table ronde, une douzaine d’œufs, un pot de terre ébréché plein de beurre et une bouteille d’huile d’un brun sombre. Je regardai ma mère, elle rayonnait de joie. Ses yeux étaient remplis de larmes.", "ar": "كانت الأسئلة تنهمر مسبقا من كل النوافذ. انحنت رحمة خارج النافذة، أفلتت كنزة ،التي كانت تغسل قرب البئر، دلاءها و صابونها، تركت فاطمة بزيوية مغزلها، كن كلهن يسألن أمي في الوقت نفسه عن صحة أبي، عن عمله الجديد، عن المكان الذي يوجد فيه. لكن أمي كانت تجيب بكلمات ملتبسة متبوعة بكم من عبارات المجاملة. بدا بأن فضول جاراتنا عنيد. كن كلهن يردن أن يعرفن ما أرسله لنا أبي. كنت أشعر بأن أمي تريد أن تجعلهن ينتظرن بفارغ الصبر. عندما وصلت إلى غرفتنا، وجدت على الطاولة المستديرة الصغيرة اثني عشرة بيضة، أصيصا طينيا مشقوقا مليئا بالزبدة و قنينة زيت بلون بني داكن. نظرت إلى أمي، كانت تشع من الفرح. كانت عيناها مليئتين بالدموع."}, {"fr": "- Regarde, me dit-elle, ce que ton père nous a envoyé! Il ne nous a pas oubliés. Il est loin, mais il veille sur nous. Il nous a même fait parvenir de l’argent. Regarde! regarde!", "ar": "- قالت لي: أنظر إلى ما أرسله لنا أبوك! إنه لم ينسنا. إنه بعيد، لكنه يسهر علينا. لقد أرسل لنا حتى النقود. أنظر! أنظر!"}, {"fr": "Elle ouvrit la main. Je vis trois pièces d’argent jeter leurs reflets de clair de lune.", "ar": "فتحت يدها. رأيت ثلاثة قطع نقدية تعكس بريقها بلون القمر الواضح."}, {"fr": "Ce monologue fut murmuré à mi-voix, mais les oreilles qui guettaient cet instant surprirent le mot argent. Le mot magique voyagea d’une bouche à l’autre. Nos voisines à demi satisfaites reprirent leur ouvrage. Elles savaient fort bien que ma mère ne leur cacherait pas longtemps sa bonne fortune. Moi, je pensais surtout à notre promenade qui paraissait très compromise. Je ne la regrettais pas. La gaîté de ma mère me gagna. Tout se mit à chanter en moi et autour de moi. « Nous sommes riches ! Nous sommes riches «, répétais-je pour moi-même. Une semaine auparavant, je n’osais même pas penser à l’étendue de notre pauvreté. La misère habitait nos murs, suintait du plafond, imprégnait de son odeur jusqu’à notre linge. Le messager invisible a surgi ce matin dans notre existence, il a balayé nos craintes, nos appréhensions, nos inquiétudes. Nous pouvions, ma mère et moi, faire confiance à notre bonne étoile et patienter. - Sidi Mohammed, va jouer sur la terrasse si cela te fait plaisir, me dit ma mère; aujourd’hui, j’ai trop à faire pour te conduire sur la tombe de Sidi Ali M’zali, Nous irons, s’il plaît à Dieu, la semaine prochaine ou l’une des semaines à venir.", "ar": "تم همس هذا المونولوج بصوت خافت، لكن الآذان التي كانت تترقب هذه اللحظة سمعت كلمة نقود. انتقلت هذه الكلمة السحرية من فم إلى آخر. عادت جاراتنا النصف راضيات إلى أعمالهن. كن يعلمن بأن أمي لن تخفي ثروتها عنهن لمدة طويلة. أنا، كنت أفكر بالخصوص في نزهتنا التي كانت تبدو مشبوهة جدا. لم أكن أتأسف عليها. غمرتني بهجة أمي. كل شيء في و حولي بدأ بالغناء. كنت أردد في نفسي: « نحن أثرياء! نحن أثرياء! ». قبل أسبوع، لم أكن أجرؤ حتى على التفكير في مدى فقرنا. كان البؤس يسكن جدران بيتنا، كان يشبع برائحته حتى الغسيل. ظهر الرسول الخفي هذا الصباح في حياتنا، بدد فزعنا، تخوفنا، قلقنا. كان علينا، أنا و أمي، أن نثق بحسن طالعنا و ننتظر. - قالت لي أمي: سيدي محمد، ا ذهب للعب على السطح إن كان ذلك يسرك، لدي الكثير لأفعله اليوم لكي أصطحبك إلى قبر سيدي علي مزالي، سنذهب، إن شاء الله، الأسبوع المقبل أو في أحد الأسابيع القادمة."}, {"fr": "Je n’avais nulle envie de monter sur la terrasse. Le soleil, d’un blanc métallique, la transformait en géhenne. Je me penchai à notre fenêtre. Kanza lavait toujours près du puits. Le chat de Zineb, terrassé par la chaleur, dormait dans un coin du patio étendu de tout son long. J’entendis ma mère parler à Fatma Bziouya sur le palier. Fatma la remerciait, faisait des vœux pour notre prospérité. Le dialogue avec Rahma que ma mère alla trouver dans sa chambre, dura plus longtemps. Ce fut enfin le tour de la chouafa. Elle s’enferma avec ma mère dans la grande pièce de réception. Leur conversation se termina tard dans la matinée. Sur la table ronde, il ne restait plus que six œufs. Ma mère avait partagé équitablement avec nos voisines. J’adorais les œufs, leur vue me faisait saliver abondamment. Avant de préparer le repas, ma mère monta sur la terrasse. Je l’entendis bavarder avec la négresse qui habitait une maison mitoyenne. Le soir, tout le quartier savait qu’un messager était venu d’une lointaine campagne, chargé de richesses diverses qui nous étaient destinées.", "ar": "لم تكن لدي أدنى رغبة في الصعود إلى السطح. كانت الشمس، بلون أبيض معدني، تحوله إلى جهنم. أطللت من نافذتنا. كانت كنزة ما تزال تغسل قرب البئر. كان قط زينب الذي أنهكته الحرارة ينام في زاوية من 128 الفناء ممددا بكامل طوله. سمعت أمي تتحدث إلى فاطمة بزيوية في البسطة. كانت فاطمة تشكرها، تقوم بدعوات لازدهارنا. دام الحوار مع رحمة التي ذهبت أمي لتزورها في غرفتها مدة أطول. كان دور الشوافة هو الأخير. انزوت مع أمي في غرفة الاستقبال الكبيرة. انتهى حديثهما عند نهاية من الصباح. على الطاولة المستديرة، لم يبقى إلا ست بيضات. كانت أمي قد تقاسمت مع جاراتنا بشكل عادل. كنت أحب البيض، كانت رؤيته تجعل لعابي يسيل بغزارة. قبل تحضير الطعام، صعدت أمي إلى السطح. سمعتها تتكلم مع الزنجية التي كانت تسكن في منزل مجاور. في المساء، كان الحي كله يعرف بأن رسولا قد جاء من بادية بعيدة، محملا بثروات عديدة كانت مرسلة إلينا."}, {"fr": "Lalla Aïcha arriva à l’improviste. Je ne m’en étonnai pas. Sa présence était pour moi liée à toutes les manifestations familiales. Notre joie, surtout celle de ma mère, ne serait pas complète si elle ne la parta- geait pas avec sa vieille amie. Ma mère se hâta de mettre la table. Elle sacrifia les six œufs. Nous les mangeâmes brouillés. Durant le repas, elle raconta en détail l’événement du jour. Elle décrivit le physique de l’envoyé de mon père (elle l’avait à peine aperçu dans l’ombre), parla de sa surprise, de ses appréhensions, remercia Dieu de ses dons et le pria avec ferveur de veiller sur ses humbles serviteurs dont nous étions les plus humbles.", "ar": "جاءت لالة عيشة بشكل مفاجئ. لم يفاجئني ذلك. كان حضورها بالنسبة لي مرتبطا بكل الاحتفالات العائلية. لم يكن فرحنا، على وجه الخصوص، فرح أمي، ليكتمل لو لم تتقاسمه مع صديقتها القديمة. أسرعت أمي بوضع الطاولة. ضحت بالست بيضات. أكلناها مقلية. خلال الطعام، حكت حدث اليوم بتفاصيله. وصفت شكل مرسول أبي ( كانت بالكاد قد رأته في الظل )، تحدثت عن مفاجئتها و تخوفاتها، شكرت الله على نعمه و رجته بورع أن يسهر على عبيده المتواضعين الذين كنا من أكثرهم تواضعا."}, {"fr": "- Et toi ! demanda-t-elle à Lalla Aicha, comment vont tes affaires ?", "ar": "- سألت أمي لالة عيشة: و أنت! كيف تجري أمورك؟"}, {"fr": "- Louange à Dieu ! Louange à Dieu ! Viens demain me voir, je te réserve une surprise.", "ar": "- الحمد لله! الحمد لله! تعالي غدا لزيارتي، أنا أحضر لك مفاجأة."}, {"fr": "- Se peut-il que ton mari soit revenu à la raison?", "ar": "- هل من الممكن أن يكون زوجك قد عاد إلى البيت؟"}, {"fr": "- Il en prend le chemin et paie cher les souffrances qu’il m’a infligées. Mais viens demain matin, tu en sauras bien plus long. Maintenant, il faut que je te quitte. Je suis passée, juste pour te demander de venir demain. Lalla Aïcha se leva, s’enveloppa dans son haïk et se dirigea vers l’escalier.", "ar": "- إنه يأخذ وقته و يدفع الثمن غاليا للمعاناة التي سببها لي. لكن تعالي غدا صباحا، ستعرفين المزيد. يجب أن أتركك الآن. لقد مررت فقط لأطلب منك أن تأتي في الغد. نهضت لالة عيشة، لفت نفسها بحايكها و توجهت إلى الدرج. 129"}]}, {"fr_title": "Chapitre XI", "ar_title": "الفصل 11", "segs": [{"fr": "A grands coups de torchons, Lalla Aïcha chassait les mouches. Elle les gourmandait comme des enfants terribles.", "ar": "كانت لالة عيشة تطرد الذباب بالعديد من ضربات الفوطة، كانت توبخهم مثل أطفال فظيعين."}, {"fr": "- Allez, sortez, misérables bestioles; vous salissez tout ce que vous touchez ; lorsque je tente de me re- poser, vous m’importunez par votre agitation et vos bourdonnements.", "ar": "- هيا، أخرجي، أيتها الدويبات البائسة؛ أنت توسخين كل ما تلمسينه؛ عندما أحاول أن أستريح، تزعجينني بحركتك و أزيزك."}, {"fr": "Elle s’aperçut de notre présence au seuil de la chambre. Son bras resta suspendu ; un sourire éclaira son visage.", "ar": "لاحظت وجودنا عند عتبة الباب. بقيت ذراعها متدلية؛ أنارت ابتسامة وجهها."}, {"fr": "- Soyez les bienvenus. Entrez, asseyez-vous, pour vous détendre. Ces mouches deviennent insuppor- tables. La chaleur et les mouches, autant de calamités qu’Allah envoie à ses fidèles pour éprouver leur patience. Parle un peu, Zoubida, ne reste pas muette.", "ar": "- مرحبا بكما. أدخلا، اجلسا، لتستريحا. يصبح هذا الذباب لا يحتمل. الحرارة و الذباب، العديد من البلايا التي يرسلها الله إلى عباده ليختبر صبرهم. تكلمي قليلا، زبيدة، لا تبقي صامتة."}, {"fr": "Ma mère aurait bien voulu satisfaire le désir de notre hôtesse, mais comment placer un mot ? Com- ment engager une conversation avec une personne prise d’une fièvre d’extermination qui court d’un coin de la place à l’autre, agitant un immense chiffon en guise d’étendard? Les mouches, il est vrai, la narguaient un peu. Elles s’abattaient en paquets sur un coussin, l’attendaient en faisant semblant de pro- céder à de minutieuses ablutions, mais dès qu’elles la voyaient approcher, elles entonnaient un chant de guerre, prenaient leur vol, tournoyaient un moment aux environs du plafond et piquaient droit sur le lit ou sur un matelas.", "ar": "كانت أمي لترغب في الاستجابة لطلب مضيفتنا عن طيب خاطر، لكن كيف تقول كلمة؟ كيف تستهل حديثا مع شخص أصابته حمى الإبادة يجري من ركن غرفة إلى آخر، ملوحا بفوطة كبيرة عوضا عن علم؟ صحيح أن الذباب كان يسخر منها قليلا. كان يحط بمجموعات على وسادة، ينتظرها متظاهرا بالقيام بوضوء دقيق، لكن ما إن كان يراها تقترب حتى كان يصدر لحن حرب، يطير، يحوم للحظة في نواحي السقف و ينزل مباشرة على السرير أو الفراش."}, {"fr": "Lalla Aicha abandonna la lutte. Elle s’éclipsa une seconde pour aller dans sa cuisine chercher la bouilloire de cuivre et le brasero. Le plateau déjà préparé trônait au centre de la pièce. Un voile brodé d’or le re- couvrait. Là-dessous, par transparence, j’apercevais la théière d’étain et les verres. Enfin, Lalla et ma mère entamèrent une vraie conversation, je veux dire un dialogue. Il commença, comme tous les dialogues de femmes, par des questions sur leur santé mutuelle. Elles s’étaient vues la veille. Elles l’avaient échangé les mêmes questions et les mêmes réponses. Pas tout à fait pour être exact: Lalla Aïcha avait eu du mal à dormir au début de la nuit, mais elle s’était vite aperçue que cela provenait seulement de la dureté du matelas. Elle changea de lit, dormit comme une pierre.", "ar": "تخلت لالة عيشة عن الكفاح. غابت للحظة لتذهب إلى مطبخها لإحضار مرجلها النحاسي و الموقد. كانت الصينية المعدة مسبقا تتصدر وسط الغرفة. كانت مغطاة بحجاب مطرز بالذهب. كنت أرى أسفله، بفعل الشفافية، البراد القصديري و الكؤوس. أخيرا، بدأت أمي و لالة حديثا حقيقيا، أعني حوارا. بدأ ،مثل كل حوارات النساء، بأسئلة عن صحتيهما. لقد رأتا بعضهما في اليوم السابق. كانتا قد تبادلتا نفس الأسئلة و نفس الأجوبة. بصراحة، ليس تماما: لقد واجهت لالة عيشة صعوبة في النوم عند بداية الليل، لكنها لاحظت سريعا بأن ذلك كان راجعا لقساوة الفراش. غيرت السرير، نامت كالحجر."}, {"fr": "- Est-ce que les pierres dorment ?> demandais-je d’un air faussement innocent.", "ar": "- سألت متظاهرا بالبراءة: هل الصخور تنام؟"}, {"fr": "- Tais-toi, me dit ma mère, ou bien pose des questions raisonnables.", "ar": "- قالت لي أمي: أصمت أو اطرح أسئلة معقولة."}, {"fr": "Cet incident rappela à ma mère l’histoire de Zineb, la fille de notre voisine. Elle avait laissé tomber une pierre sur son gros doigt de pied, le pied droit, précisa ma mère.", "ar": "130 ذكر هذا الحدث أمي بقصة زينب، ابنة جارتنا. كانت قد تركت حجرا كبيرا يسقط على الإصبع الكبير لقدمها، القدم اليمنى، وضحت أمي."}, {"fr": "- Allah! Cela s’est-il passé longtemps après mon départ? demanda Lalla Aïcha manifestant des signes d’inquiétude.", "ar": "- سألت لالة عيشة مبدية علامات قلق: الله، هل حدث هذا بعد مدة طويلة من انصرافي؟"}, {"fr": "- Non, répondit ma mère, cela s’est passé il y a deux ans; je me souviens de ce jour comme si c’étaie hier. Je hachais de la mauve sur la terrasse quand je l’entendis crier ...", "ar": "- أجابت أمي: كلا، لقد حدث هذا منذ سنتين؛ أتذكر ذلك اليوم كما لو كان البارحة. كنت أفرم الخبازى على السطح عندما سمعتها تصرخ..."}, {"fr": "Juste à ce moment, un cri de bébé remplit la maison. Ma mère écarquilla les yeux, interloquée. Nous nous regardâmes tout surpris et éclatâmes d’un grand rire. Moi, je riais tellement que les larmes m’inon- dèrent les joues.", "ar": "في هذه اللحظة تماما، سمع صوت طفل في البيت كله. حملقت أمي، محرجة. نظرنا إلى بعضنا و نحن متفاجؤون كليا و قهقهنا كثيرا. أنا كنت أضحك كثيرا لدرجة أن دموعي غمرت خدي."}, {"fr": "- Louange à Dieu ! Louange à Dieu ! Le rire est un bienfait de Dieu, prononça une voix d’homme.", "ar": "- نطق صوت رجل: الحمد لله! الحمد لله! إن الضحك نعمة من الله."}, {"fr": "Je me retournai pour voir le visiteur qui osait entrer ainsi dans une pièce où bavardaient deux femmes qui n’étaient ni ses épouses ni ses parentes. Une femme se tenait dans l’encadrement de la porte.", "ar": "التفت لأرى الزائر الذي كان يتجرأ على الدخول هكذا إلى غرفة تثرثر فيها امرأتان لم تكونا لا زوجتيه و لا قريبتيه. كانت امرأة تقف في إطار الباب."}, {"fr": "Avais- je bien entendu ? Je regardai tour à tour ma mère et Lalla Aïcha, mais aucune ne partageait mon étonnement. - Sois la bienvenue, Salama, dit Lalla Aïcha. Ma mère posait déjà des questions à la nouvelle venue sur sa santé, la santé de ses amis et de ses enfants. Elle n’avait pas d’enfants comme je l’appris plus tard. Salama était marieuse professionnelle. Lalla Aïcha se tourna vers ma mère.", "ar": "هل سمعت جيدا؟ نظرت إلى أمي و لالة عيشة على التوالي، لكن لم تكن أي واحدة متفاجئة مثلي. - قالت لالة عيشة: مرحبا بك، يا سلامة، كانت أمي قد بدأت بطرح أسئلة على القادمة الجديدة عن صحتها، صحة أصدقائها و أطفالها. حسب ما علمته فيما بعد، لم يكن لديها أطفال. كانت سلامة مزوجة محترفة. التفتت لالة عيشة إلى أمي."}, {"fr": "- C’est la surprise que je t’avais réservée, lui dit-elle", "ar": "- قالت لها: إنها المفاجأة التي أعددتها لك."}, {"fr": "- Mais, quelle agréable surprise ! Il y a si longtemps que je n’ai pas eu la joie de rencontrer Salama. La dernière fois que nous nous sommes vues, c’était au mariage de la cousine d’Aïcha, la femme du mar- chand de nattes. Ce fut un très beau mariage ! -Aujourd’hui, Salama a des choses à nous raconter ; as-tu deviné de quoi il s’agit?", "ar": "- لكن، يالها من مفاجأة رائعة! لقد مر زمن طويل لم أحظى فيه بفرحة لقاء سلامة. كانت آخر مرة التقينا فيها هي حفل زفاف قريبة عيشة، زوجة بائع الحصائر. كان زفافا جميلا جدا! - اليوم، لدى سلامة أشياء لتحكيها لنا؛ هل عرفت ما هي؟ - لا فعلا، لا أعرف."}, {"fr": "- Non vraiment, je ne sais pas. Je connaissais bien ma mère. Ses yeux ne disaient pas entièrement la vérité. Salama ne daigna pas jeter un regard sur ma modeste personne. Je devais lui paraître ridiculement petit, ridiculement chétif. Salama appartenait à cette race disparue qui a donné naissance à la légende des géants. Elle avança d’un pas majestueux vers le grand divan, s’installa à la place d’honneur. Le buste droit, les mains à plat sur ses genoux, elle resta muette, statique comme un bloc de granit.", "ar": "كنت أعرف أمي. لم تكن عيناها تقولان الحقيقة كلها. لم تتكرم سلامة بإلقاء نظرة على شخصيتي المتواضعة. لا بد من أنني كنت أبدو لها صغيرا بشكل مضحك، هزيلا بشكل مضحك. كانت سلامة تنتمي إلى ذلك العرق المنقرض الذي أنجب أسطورة العمالقة. تقدمت بخطوة عظيمة نحو الأريكة الكبيرة، جلست في مرتبة الشرف. بصدر 131 مستقيم، يدين منبسطتين على الركبتين، بقيت صامتة، ساكنة مثل كتلة من الجرانيت."}, {"fr": "Pas un muscle de son visage ne bougeait; ses yeux seuls se posaient avec lenteur sur chaque objet. J’en avais vaguement peur. Elle m’attirait à la fois et me mettait mal à l’aise. Pelotonné contre un coussin, j’attendais qu’elle parlât. Ses grosses lèvres que surmontait une légère moustache bougèrent impercepti- blement. Aucun son n’en sortit. Le désir de l’entendre parler me faisait trembler. Je ne me rendais même plus compte si ma mère et Lalla Aicha se taisaient ou bavardaient comme de coutume. Elle ferma les yeux, les rouvrit et de sa voix d’homme déclara qu’après le thé, elle aurait tout le temps d’entretenir ses petites sœurs des événements qui se préparaient. Elle ajouta:", "ar": "لم تكن أية عضلة من جسمها تتحرك، كانت عيناها فقط التي تحط ببطء على كل شيء. كنت خائفا منها بشكل ملتبس. كانت تجذبني و تضايقني في الوقت نفسه. كنت أنتظر منها أن تتكلم و أنا مكور على وسادة، تحركت شفتاها الغليظتان اللذان كان يعلوهما شارب خفيف بشكل لا يلاحظ. لم يخرج أي صوت. كانت الرغبة في سماعها تتحدث تجعلني أرتجف. لم أعد أدرك حتى إن كانت أمي و لالة عيشة صامتتين أو تثرثران كالعادة. أغلقت عينيها، أعادت فتحهما و أعلنت بأنه بعد الشاي، سيكون لديها الوقت الكافي لتخبر أخواتها الصغيرات عن الأحداث التي تتحضر. أضافت:"}, {"fr": "- Je peux vous affirmer que de grands événements se préparent.", "ar": "- أستطيع أن أؤكد لكما بأن هناك أحداثا مهمة تتحضر."}, {"fr": "Un petit rire drôle, d’une folle gaîté, échappa à Lalla Aicha. Ce rire était si jeune, si frais, si printanier que Lalla Aïcha rougit de confusion. Elle se leva en hâte, alla chercher le sucre et la menthe. Ma mère se lança dans le récit de ses souvenirs sur les mariages auxquels elle avait assisté. Le thé fut préparé en un temps record. Lalla Aïcha servit tout le monde. Elle me tendit mon verre avec, au fond, deux doigts de thé. Je protestai. Je réclamai un verre bien rempli comme j’en avais chez nous. Ma mère fronça les sourcils, se mordit la lèvre inférieure pour me signifier sa désapprobation. Salama remarqua enfin ma présence. Elle sourit. De larges dents jaunes, mais solidement plantées, illuminèrent son visage.", "ar": "أفلتت ضحكة صغيرة طريفة، ذات بهجة عارمة، من لالة عيشة. كانت هذه الضحكة فتية جدا، باردة جدا، ربيعية جدا لدرجة أن لالة عيشة احمرت من التشويش. نهضت سريعا، ذهبت لإحضار السكر و النعناع. بدأت أمي بسرد قصة الأعراس التي حضرتها. حضر الشاي في وقت قياسي. خدمت لالة عيشة الجميع مدت لي كأسي بأصبعين من الشاي في الحقيقة. احتججت. طالبت بكأس مليء بالكامل مثل الذي أحصل عليه في بيتنا. قطبت أمي، عضت شفتها السفلى لتعني لي استنكارها. لاحظت سلامة وجودي أخيرا. ابتسمت. أنارت أسنان صفراء عريضة، لكن مغروزة بمتانة وجهها."}, {"fr": "- Donnez du thé à ce jeune homme, moi, je vais lui offrir un gâteau.", "ar": "- أعط شايا لهذا الصبي، أنا سأعطيه حلوى."}, {"fr": "Elle fouilla dans la poche de son caftan, en tira un mouchoir brodé. Il contenait deux sablés et une corne de gazelle. J’eus la corne de gazelle et les femmes se partagèrent les sablés. Après un nouveau silence, Lalla Aïcha et ma mère, dévorées de curiosité, demandèrent d’une seule voix: - Raconte, Salama, ne nous fais pas languir.", "ar": "بحثت في جيب قفطانها، أخرجت منديلا مطرزا. كان يحتوي على سابليين و كعب غزالة. حصلت على كعب الغزالة و تقاسمت المرأتان السابليين. بعد صمت جديد، طلبت أمي و لالة عيشة، و الفضول يلتهمهما، بصوت واحد: - إحكي، يا سلامة، لا تجعلينا ننتظر طويلا. إحكي."}, {"fr": "Raconte. - Oui, je ferais bien de commencer. Aurez-vous la patience de m’écouter jusqu’au bout? - Raconte, Salam a ! Raconte! réclamèrent avec avidité les deux femmes.", "ar": "- أجل، من الأفضل لي أن أبدأ. هلا اتصفتم بالصبر لسماعي حتى النهاية؟ 132 - طالبت المرأتان بشراهة: إحكي، يا سلامة! إحكي!"}, {"fr": "- Je connais vos deux cœurs, ils sont nobles et ouverts à la compassion. Lalla Aïcha, j’ai été très fautive envers toi, pourras-tu jamais me pardonner?", "ar": "- أعرف قلبيكما، إنهما نبيلان و مفتوحان للتعاطف. لالة عيشة، لقد كنت مخطئة جدا في حقك، هل يمكن أن تسامحيني في يوم من الأيام؟"}, {"fr": "Lalla Aïcha fit de la main un geste de protestation. Elle poussa un long soupir. Ma mère, à son tour poussa un profond soupir. Avant de reprendre son récit, Salama soupira aussi. Je ne pouvais pas ne pas faire comme tout le monde, une plainte expira sur mes lèvres. Personne ne le remarqua. Salama parlait déjà.", "ar": "قامت لالة عيشة بحركة اعتراض. أطلقت تنهدا طويلا. أطلقت أمي بدورها تنهدا عميقا. تنهدت سلامة كذلك قبل استئناف قصتها. لم أكن أستطيع ألا أفعل مثل الجميع، خرج تأوه على شفتي. لم يلاحظه أحد. كانت سلامة قد بدأت بالكلام."}, {"fr": "- Dieu a voulu (et toute chose est voulue par Lui) que je fusse l’intermédiaire dans ce mariage qui nous a tous rendus malheureux. Toi, Lalla Aicha, parce que tu as perdu momentanément l’affection de ton époux, Lalla Zoubida a souffert parce qu’une longue amitié vous lie, Sidi Larbi s’est aperçu assez vite qu’il s’était inutilement compliqué l’existence, quant à la fille du coiffeur, de jeune fille elle sera bientôt femme divorcée. Elle aura toutes les difficultés à trouver un mari. Ainsi s’exprime la volonté de notre Créateur. Il nous a mis sur cette terre pour souffrir et pour adorer. Tout le monde soupira de nouveau et Salama poursuivit : - Tout commença le jour où Kebira, la fille de mon vénéré maître Moulay Abdeslem, me chargea de lui acheter du henné. J’étais à peine arrivée au souk des épices que quelqu’un me toucha discrètement l’épaule. Je me retournai, Moulay Larbi se tenait devant moi, souriant et affable comme à l’ordinaire. Nous échangeâmes les salutations d’usage. Nous parlâmes longuement du mauvais temps qui avait sévi, si vous vous en souvenez bien, un mois durant. Je lui demandai de tes nouvelles, Lalla Aïcha !", "ar": "- لقد قدر الله ( و كل شيء مقدر من طرفه ) أن أكون الوسيطة في هذا الزواج الذي جعلنا جميعنا تعساء. أنت، يا لالة عيشة، لأنك فقدت مودة زوجك مؤقتا، عانت لالة زبيدة لأن صداقة طويلة تجمعكما، لاحظ سيدي العربي سريعا بأنه عقد عيشته هدرا، أما فيما يخص ابنة الحلاق فستتحول عما قريب من فتاة شابة إلى امرأة مطلقة. ستجد كل الصعوبات في إيجاد زوج. هكذا تنفذ إرادة خالقنا. وضعنا على هذه الأرض لنعاني و نمجد. تنهد الجميع من جديد و تابعت سلامة: - بدأ كل شيء في اليوم الذي كلفتني فيه كبيرة، ابنة معلمي المحترم مولاي عبد السلام ، بشراء الحناء لها. كنت قد وصلت إلى سوق التوابل لتوي عندما لمس أحدهم كتفي خلسة. التفت، كان مولاي العربي واقفا أمامي، مبتسما و لطيفا مثل العادة. تبادلنا التحايا المعتادة. تكلمنا مطولا عن الجو السيئ الذي كان قد عاث فسادا، إن كنتما تتذكران ذلك جيدا، كان ذلك منذ شهر. سألته عن أحوالك، يا لالة عيشة!"}, {"fr": "- Elle va bien, me dit-il. Il baissa ensuite les yeux et prit une attitude résignée. - Qu’as-tu, Moulay Larbi ? Me cacherais-tu quelque chose de grave sur les gens de ta maison? - Non, répondit Moulay Larbi, je ne te cache rien, mais tu l’as deviné, je suis bien tourmenté. Si tu le voulais, tu pourrais m’aider à calmer mon âme.", "ar": "- قال لي: إنها بخير. أخفض عينيه بعد ذلك و اتخذ وضعية مستسلمة. - ما بك، يا مولاي العربي؟ هل يمكن أنك تخفي عني شيئا خطيرا عن أهلك؟ - أجاب مولاي العربي: كلا، لا أخفي عنك شيئا، لكنك خمنت الأمر، هنالك ما يضايقني. إن أردت، يمكنك مساعدتي لأريح بالي."}, {"fr": "Comme vous le pensez, j’étais de plus en plus intriguée. Un âne chargé de sacs de sucre passa entre nous deux, nous sépara. Je me plaquai contre le mur et fis signe à Moulay Larbi de me rejoindre. Il échangea quelques insultes avec un passant qui l’avait bousculé et vint finalement tout près de moi pour m’entretenir de ce qui le préoccupait. - Oui, me dit-il, tu pourrais m’aider. Ma situation prospère de jour en jour. Je gagne largement de quoi faire vivre une famille et même plusieurs ménages. La grande douleur de ma vie, c’est de n’avoir pas d’enfant. Bien sûr, j’estime et je respecte Lalla Aicha, mon épouse actuelle; cette estime et ce respect, je les crois partagés, mais je ne peux envisager avec sérénité l’avenir tant que je n’ai pas d’héritier.", "ar": "كما تظنون، كانت حيرتي تزيد شيئا فشيئا. مر حمار محمل بأكياس السكر بيننا نحن الاثنين، فرقنا. التصقت بالجدار و أشرت لمولاي العربي باللحاق بي. تبادل بعض الشتائم مع مار كان قد دفعه و جاء في الأخير إلى جانبي ليخبرني عما كان يقلقه. 133 - قال لي: أجل، تستطيعين مساعدتي. إن حالتي تزدهر من يوم إلى آخر. أربح أكثر بكثير مما يلزم لإعالة أسرة و عدة أسر حتى. أكبر ألم في حياتي هو أنه ليس لدي أطفال. بالطبع، أنا أقدر و أحترم لالة عيشة، زوجتي الحالية؛ أعتقد بأن هذا التقدير و الاحترام متبادلان، لكنني لا أستطيع أن أتخيل مستقبلي بسكينة ما دمت لا أملك وريثا."}, {"fr": "Je l’interrompis pour lui conseiller de voir un médecin.", "ar": "قاطعته لأنصحه بأن يذهب و يستشير طبيبا."}, {"fr": "- Ne m’interromps pas, Salama, me dit-il, je ne crois ni aux médecins, ni aux remèdes. Dans mon cas, il n’y a qu’un seul remède, et si tu voulais, tu pourrais m’aider à me le procurer.", "ar": "- قال لي: لا تقاطعيني، سلامة، لا أؤمن لا بالأطباء و لا بالعلاجات. في حالتي، لا يوجد سوى حل واحد، و إن أردت، يمكنك أن تساعديني في الحصول عليه."}, {"fr": "J’ouvris de grands yeux et fis celle qui ne comprenait pas.", "ar": "فتحت عيني جيدا و تظاهرت بأنني لم أفهم."}, {"fr": "- Le remède, poursuivit Moulay Larbi, consiste à me trouver une seconde épouse.", "ar": "- تابع مولاي العربي: العلاج هو إيجاد زوجة ثانية لي."}, {"fr": "- Je ne peux faire cela, Moulay Larbi, j’aime trop Lalla Aïcha pour être à l’origine de son chagrin. - Lalla Aicha n’aura pas de chagrin, elle souhaite me voir père d’un enfant. Pourtant, je te demanderais de tenir secrète notre conversation. Il ne serait pas convenable de la mettre au courant d’un événement dont les conséquences pourraient blesser son amour-propre.", "ar": "- لا أستطيع فعل هذا، يا مولاي العربي، أنا أحب كثيرا لالة عيشة لكي أكون سببا في كآبتها. - لن تعاني لالة عيشة، إنها تتمنى أن تراني أبا لطفل. و مع ذلك، سأطلب منك أن تكتمي سر حديثنا. لن يكون من اللائق إطلاعها على حدث يمكن لنتائجه أن تؤذي حبها الخاص."}, {"fr": "Avant que j’aie pu répondre à son argument, il me glissa entre les doigts une pièce d’argent toute neuve. Il s’en alla en nie recommandant de bien réfléchir à cette affaire et de passer le voir à son atelier dans le courant de la semaine. Quelques jours plus tard, je passai près de l’atelier ...", "ar": "قبل أن أتمكن من الإجابة على حجته، دس بين يدي قطعة نقدية جديدة. ذهب و هو يوصيني بالتفكير جيدا في هذا العرض و بأن أمر لزيارته في ورشته خلال الأسبوع. بعد عدة أيام، مررت قرب الورشة..."}, {"fr": "Le récit de Salama me passionnait, mais un pressant besoin m’obligea à l’interrompre pour demander à ma mère si je pouvais descendre au rez-de-chaussée me soulager.", "ar": "كانت قصة سلامة تستهويني، لكن حاجة ملحة أجبرتني على مقاطعتها لأسأل أمي إن كنت أستطيع النزول للطابق الأرضي لأقضي حاجتي."}, {"fr": "Mon interruption fut accueillie avec colère. Ma mère me cria d’aller où je voudrais et de ne plus en- nuyer la société par des mots incongrus. Je partis à regret Je dégringolai les escaliers. La porte des cabi- nets se trouvait dans un angle du rez-de-chaussée. Elle était fermée. Je me jetai dessus pour la défoncer. Quelqu’un toussa à l’intérieur. Il fallait patienter. Je me mis à pleurer à haute voix. Je dansais d’un pied sur l’autre, tout en clamant mon mal. La porte s’ouvrit brusquement. Je ne pris même pas le temps de regarder le visage de l’occupant et je m’enfermai dans le petit réduit. Je ne tardai pas à le quitter, le visage réjoui, heureux à la pensée d’aller écouter la suite de l’histoire passionnante de Moulay Larbi.", "ar": "تم استقبال مقاطعتي بغضب. صاحت بي أمي لتخبرني بالذهاب إلى حيث أشاء و ألا أعود لإزعاج الناس بكلمات غير لائقة. ذهبت على مضض. نزلت الدرج بسرعة. كان باب المرحاض يوجد في زاوية من الطابق الأرضي. كان مقفلا. انقضضت عليه لأقتحمه. سعل أحدهم في الداخل. كان يجب الانتظار. بدأت بالبكاء بصوت مرتفع. كنت أرقص بقدم على أخرى بينما أصيح بألمي. فتح الباب بشكل مفاجئ. لم آخذ وقتا لرؤية وجه الساكن و انزويت داخل المقصورة الصغيرة. لم أتأخر في الخروج منه، بوجه فرح، سعيدا بالذهاب للاستماع إلى تتمة قصة مولاي العربي المشوقة."}, {"fr": "Je mettais le pied sur la première marche de l’escalier quand une femme m’interpella d’une voix pleine de colère:", "ar": "134 كنت أضع قدمي على أول درجات السلالم عندما نادتني امرأة بصوت مليء بالغضب:"}, {"fr": "- Enfant mal élevé, ne peux-tu fermer la porte des cabinets après usage ? Va la fermer ! Ici tu n’es pas chez toi, tu es un invité. Les invités doivent être polis et se tenir convenablement dans une maison étran- gère. Je baissai le nez. J’allai d’un air guindé fermer la porte. Ce fut avec un air tout aussi guindé que je me permis de répondre à cette femme calamiteuse. - Ici, je ne suis pas un invité, je suis le fils de Lalla Zoubida, l’amie de Lalla Aïcha. Lalla Aïcha ne serait pas contente si je lui disais que tu m’as appelé « enfant mal élevé ».", "ar": "- أيها الطفل قليل التهذيب، ألا تستطيع أن تقفل باب المرحاض بعد استعماله؟ اذهب لإقفاله! أنت لست في بيتك هنا، أنت ضيف. يجب على الضيوف أن يكونوا مؤدبين و يتصرفوا بشكل لائق في منزل غريب. أخفضت أنفي. ذهبت بمظهر متصنع لإقفال الباب. كان مظهرا متصنعا تماما مثل ذاك الذي سمحت لنفسي بإظهاره لأجيب هذه المرأة المشؤومة. - هنا، أنا لست ضيفا، أنا ابن لالة زبيدة، صديقة لالة عيشة. لن تكون لالة عيشة سعيدة إن أخبرتها بأنك نعتني ب « الطفل قليل التهذيب »."}, {"fr": "- Tu es un enfant mal élevé, va le lui dire, garçon impoli ! Chétif morveux ! Crois-tu que ta Lalla Aicha va me faire trancher la tête? Si tu continues à me regarder de cette façon, je vais prendre mes ciseaux et je te couperai les oreilles.", "ar": "- أنت طفل قليل التهذيب، إذهب و أخبرها بذلك، أيها الولد الوقح! هزيل قذر! هل تظن بأن لالة عيشة خاصتك ستقطع رأسي؟ إن بقيت تنظر إلي بهذه الطريقة فسأتناول مقصي و أقطع أذنيك."}, {"fr": "Je poussai un hurlement. - Maman ! Lalla Aïcha ! Cette femme veut me couper les oreilles! Oh ! mes oreilles ! mes oreilles ! Lalla Aicha s’était penchée à la fenêtre.", "ar": "أطلقت صراخا. - أمي! لالة عيشة! إن هذه المرأة تريد أن تقطع أذني! أوه! أذناي! أذناي! كانت لالة عيشة قد أطلت من النافذة."}, {"fr": "- Qu’y a-t-il? Qu’y a-t-il?", "ar": "- ما الأمر؟ ما الأمر؟"}, {"fr": "La femme du rez-de-chaussée essaya de lui expliquer la situation, mais je criais si fort que sa phrase ne parvenait pas jusqu’à l’étage. Elle me faisait des signes de la main pour m’inviter à me taire. Je continuai à brailler, à trépigner. La tête de ma mère surgit à côté de celle de Lalla Aicha. Toutes les deux demandaient des explications. Des voisines étaient sorties de leur pièce pour venir en aide à mon ennemie.", "ar": "حاولت امرأة الطابق الأرضي أن تشرح لها الموقف، لكنني كنت أصرخ عاليا لدرجة أن جملتها لم تكن تبلغ الطابق. كانت تقوم بإشارات بيدها لتدعوني للسكوت. بقيت أصيح، أتململ. ظهر رأس أمي إلى جانب الخاص بلالة عيشة. كانت كلاهما تطلبان تفسيرا. كانت بعض الجارات قد خرجن من غرفهن ليدعمن عدوتي."}, {"fr": "La voix de Salama calma tout le monde.", "ar": "هدأ صوت سلامة الجميع."}, {"fr": "- Ce n’est qu’un enfant, dit-elle, personne ne doit lui tenir rigueur d’un oubli ou d’une maladresse. Il ne serait pas raisonnable qu’une dispute éclatât à cause d’une gaminerie. Sidi Mohammed, finis de pleurer et monte vite, j’ai trouvé encore dans ma poche une corne de gazelle qui te fera sûrement plaisir.", "ar": "- قالت: إنه مجرد طفل، لا يمكن لأحد أن يضمر له ضغينة لنسيان أو حماقة. لن يكون من المعقول أن ينشب شجار بسبب شقاوة. سيدي محمد، توقف عن البكاء و اصعد بسرعة، لقد وجدت كعب غزال آخر في جيبي سيفرحك بالتأكيد."}, {"fr": "Je m’essuyai le visage dans le bas de ma djellaba. Je montai fièrement l’escalier. Les femmes avaient repris leurs besognes. La maison retrouva son silence. A mon entrée dans la chambre de Lalla Aïcha, ma mère ne put se retenir de me lancer un regard qui en disait long. Je redoutais ce regard plus que tour au monde. Il me foudroyait, me réduisait à néant.", "ar": "مسحت وجهي بأسفل جلبابي. صعدت الدرج بفخر. كانت النساء قد عادت إلى أشغالها. عاد للمنزل هدوءه. عند دخولي إلى غرفة لالة عيشة، لم تستطع أمي أن تتمالك نفسها عن أن تبدي لي نظرة 135 كانت تقول الكثير. كنت أخشى هذه النظرة أكثر من أي شيء في العالم. كانت تصعقني، تحطمني."}, {"fr": "Salama m’offrit sa protection. Elle étendit son bras vers moi, me sourit de toutes ses dents. Sur le pla- teau, la corne de gazelle m’attendait. Je m’en emparai, mais je fus incapable de la porter à ma bouche.", "ar": "أمنت سلامة حمايتي. مدت ذراعها نحوي، ابتسمت لي بجميع أسنانها. كان كعب الغزال ينتظرني على الصينية. أخذته، لكنني لم أستطع حمله إلى فمي."}, {"fr": "Lalla Aïcha s’activait à préparer de nouveau du thé. Niché entre deux coussins, je tâchais de me faire oublier. Je me tenais les yeux baissés. J’entendis ma mère qui disait, s’adressant à Salama :", "ar": "كانت لالة عيشة تنشغل بتحضير الشاي من جديد. جالسا بين وسادتين، كنت أحاول الاختباء. كنت أخفض عيني. سمعت أمي تقول، مخاطبة سلامة:"}, {"fr": "- Qu’avait-elle, cette viande ? Était-elle réellement trop maigre ou bien pas assez fraîche ?", "ar": "- كيف كان ذلك اللحم؟ هل كان حقا قليل الدسم أو لم يكن جديدا؟"}, {"fr": "- Au dire de tous les gens du quartier, elle était d’excellente qualité. Seulement, la fille de Si Abderrah- man cherchait un prétexte. Moulay Larbi a l’âge de son père. D’autre part, ses moyens ne lui permettent pas de satisfaire toutes ses fantaisies ; puis, je vous liai déjà dit, cette fille est folle. Depuis quand a-t-on vu la fille d’un coiffeur exiger de son mari l’achat d’une paire de bracelets d’or? Réclamer de l’argent, en espèces, pour se payer des futilités? Organiser des thés pour ses soi-disant amies? Jouer du tam-tam à tout propos ?", "ar": "- حسب أقوال الحي كله، كان ذا جودة ممتازة. إلا أن ابنة سي عبد الرحمان كانت تبحث عن ذريعة. إن مولاي العربي في عمر أبيها. من جهة أخرى، لم تكن إمكانياته تسمح بإرضاء جميع نزواتها؛ ثم، كما قلت لكما، إن هذه الفتاة مجنونة. منذ متى كانت هناك ابنة حلاق تطلب من زوجها أن يشتري لها زوجا من الأساور الذهبية. تطلب المال نقدا لتشتري تفاهات؟ لتنظم حفلات شاي لصديقاتها المزعومات؟ لتعزف الصنج في كل وقت؟"}, {"fr": "Lalla Aïcha risqua une question.", "ar": "طرحت لالة عيشة سؤالا."}, {"fr": "- Mais, ne travaillait-elle pas? N’a-t-elle jamais appris un métier? « Elle brode des empeignes de babouches. Moulay Larbi lui confia un travail ou deux, mais son ouvrage traînait longtemps sur le métier, il était mal exécuté et elle en voulait toujours le double du prix normal pratiqué par les autres brodeuses. Moulay Larbi cessa de la faire travailler. Elle l’accusa alors d’avoir des relations incorrectes avec des femmes dans des quartiers éloignés. Sous prétexte sans doute de leur confier des empeignes, il en profitait pour avoir avec elles des conversations indignes d’un Croyant.", "ar": "- لكن، ألم تكن تعمل؟ ألم يسبق لها أن تعلمت مهنة ما؟ « - إنها تطرز أوجه الأحذية. كلفها مولاي العربي بعمل أو اثنين، لكن كان عملها يؤخر المهنة كثيرا، لم يكن منجزا بشكل جيد و كانت دائما تطلب ضعف الثمن العادي الذي تقبضه الطرازات الأخريات. توقف مولاي العربي عن توظيفها. لذلك اتهمته بأنه على علاقة غير شرعية مع نساء في أحياء نائية. بدون شك تحت ذريعة تكليفهن بتطريز أوجه الأحذية، كان يستغل ذلك ليتحدث معهن بطريقة لا تليق بمؤمن."}, {"fr": "« Nous savons que Moulay Larbi ne se livrerait jamais à de telles pratiques. Ce sont là les paroles men- songères d’une fille stupide et jalouse.", "ar": "« نحن نعلم بأن مولاي العربي لن يقوم أبدا بأفعال مشابهة. إن هذه مجرد كلمات كاذبة لفتاة غبية و غيورة."}, {"fr": "« Tout ceci serait sans conséquence si sa mère ne se mêlait pas à chaque instant des affaires du ménage. Elle vient trois ou quatre fois par semaine renifler chaque objet, donner des conseils, manifester son mé- contentement à propos de ceci ou de cela, inciter sa fille à se montrer plus exigeante, flatter son orgueil en lui répétant qu’elle est bien trop jolie pour un vieux barbon qui sent la sueur et le cuir et qui se montre incapable de gâter sa jeune épouse comme elle le mérite.", "ar": "« لم يكن كل هذا ليخلف عواقبا لو لم تكن أمها تتدخل كل لحظة في شؤون الأسرة. إنها تأتي ثلاث أو أربع مرات في الأسبوع لشم كل شيء، إعطاء نصائح، إبداء استيائها حول هذا أو ذاك، تحريض ابنتها على أن تكون متطلبة أكثر، تتملق كبرياءها و هي تردد لها بأنها جميلة جدا بالنسبة لمسن 136 عجوز تفوح منه رائحة العرق و الجلد و الذي يظهر عاجزا عن تدليل زوجته الشابة كما تستحق."}, {"fr": "« Le pauvre Moulay Larbi subit naturellement les répercussions de ces mauvais conseils. Ah ! Il est bien à plaindre, Moulay Larbi ! Il n’a rencontré dans ce mariage que tristesse et peine. Il vient rarement te voir, Lalla Aïcha, parce qu’il a conscience d’avoir commis une faute grave à ton égard. Il n’a pas oublié ce que tu as fait pour lui. Ni sa mère, ni sa sœur ne lui auraient porté secours dans l’adversité comme toi tu l’as fait si généreusement. Mais les hommes sont des êtres faibles!", "ar": "« بطبيعة الحال، يتحمل مولاي العربي المسكين آثار هذه النصائح السيئة. آه! إنه يستحق الشفقة حقا، مولاي العربي! لم يجد في هذا الزواج سوى الحزن و الألم. نادرا ما يأتي ليراك، يا لالة عيشة، لأنه يعتقد بأنه ارتكب خطأ فادحا في حقك. لم ينسى ما فعلته من أجله. لم تكن لا أمه و لا أخته لتنقذه في الضيق كما فعلت بكرم. لكن الرجال كائنات ضعيفة!"}, {"fr": "« Depuis que sa situation s’était trouvée améliorée, il n’avait plus qu’un rêve, celui d’avoir une jeune épouse pour égayer sa vie de travail et de lutte. Notre époque devient de plus en plus étrange. Les jeunes filles d’aujourd’hui ne sont plus celles d’hier. Elles manquent de réserve, ignorent la pudeur, font fi de leur dignité pour obtenir une satisfaction passagère. Elles préfèrent épouser des jeunes gens sans cervelle qu’elles gouvernent à leur guise. « Moulay Larbi est un homme, il lui faut donc une femme à sa mesure. Cette femme, c’est toi, Lalla Aicha. Son erreur a été de l’oublier momentanément. »", "ar": "« منذ أن تحسنت وضعيته، لم يعد لديه سوى حلم واحد، إيجاد زوجة شابة ليسلي حياة العمل و الكفاح خاصته. إن زمننا يصبح غريبا أكثر فأكثر. إن شابات اليوم لسن مثل شابات الأمس. ينقصهن الحياء، يجهلن الاحتشام، يحتقرن كرامتهن للحصول على رضى عابر. يفضلن الزواج بشباب أبله يتحكمن به على هواهن. « إن مولاي العربي رجل، يلزمه إذن امرأة على مقاسه. إن هذه المرأة هي أنت يا لالة عيشة. كان خطؤه هو نسيانه لهذا مؤقتا. »"}, {"fr": "Tous les regards se dirigèrent vers la porte. Nous venions d’entendre un toussotement discret. - Qui est là ? dit Lalla Aicha. - Un proche.", "ar": "اتجهت كل الأنظار نحو الباب. كنا قد سمعنا صوت تنحنح خافت للتو. - قالت لالة عيشة: من هناك؟ - قريب."}, {"fr": "- C’est toi, Zhor ? Entre donc!", "ar": "- أهذه أنت يا زهور؟ فلتدخلي!"}, {"fr": "Zhor montra son petit visage très maquillé.", "ar": "أظهرت زهور وجهها الصغير الكثير التبرج."}, {"fr": "- Puis-je avoir un brin de menthe?", "ar": "- هل يمكنني الحصول على غصن نعناع؟"}, {"fr": "- Voici de la menthe, mais prends le temps de boire avec nous une gorgée de thé.", "ar": "- هاهو النعناع، لكن خذي بعض الوقت لتشربي معنا رشفة شاي."}, {"fr": "- Merci, je vais en faire, mon mari ne va pas tarder à arriver.", "ar": "- شكرا، سأفعل، لن يتأخر زوجي في الوصول."}, {"fr": "- Il n’est pas encore là, alors, reste avec nous jusqu’à son arrivée.", "ar": "- لم يعد بعد، إذن إبقي معنا حتى عودته."}, {"fr": "Zhor se décida à franchir la porte.", "ar": "قررت زهور الدخول."}, {"fr": "Elle éclatait de jeunesse et de fraîcheur. Elle portait des vêtements de couleurs voyantes. Elle avança à petits pas, tendit la main à ma mère, porta son index à ses lèvres, retendit la main à Salama, refit le même geste. Je désirais qu’elle s’assît près de moi. Mon vœu fut comblé. Elle s’assit à mon côté. Sa petite main me caressa la joue.", "ar": "كانت تشع شبابا و نضارة. كانت ترتدي ملابس بألوان ملفتة للنظر. تقدمت بخطوات صغيرة، مدت يدها لأمي، حملت سبابتها إلى شفتيها، أعطت يدها لسلامة، أعادت نفس الحركة. كنت أرغب في أن تجلس بجانبي. تحققت أمنيتي. جلست بجانبي. لمست يدها الصغيرة خدي."}, {"fr": "Après les questions et les réponses habituelles relatives à la santé des unes et des autres, Zhor entra dans le vif du sujet. Elle voulait savoir si le divorce entre Moulay Larbi et la fille du coiffeur avait été pro- noncé. Comme toutes les femmes manifestaient leur ignorance par des mimiques diverses, Zhor sourit largement. Fière de devenir le point de mire de tous les regards, elle se lança dans un brillant monologue.", "ar": "بعد الأسئلة و الأجوبة المعتادة و المرتبطة بصحة هذه أو تلك، دخلت زهور في صلب الموضوع. أرادت أن تعرف إن كان حكم طلاق مولاي 137 العربي و ابنة الحلاق قد صدر. نظرا لأن جميع النساء كن يظهرن جهلهن بإيماءات متعددة، ابتسمت زهور بشكل عريض. فخورة لأنها أصبحت محط أنظار الجميع، بدأت مونولوجا لامعا."}, {"fr": "- Mère Salama ne doit pas ignorer ce qui se passe dans ce ménage, mais tout le monde connaît sa dis- crétion. Pourtant, tous les habitants du quartier El Adoua sont au courant des difficultés que rencontre quotidiennement Moulay Larbi auprès de sa jeune épouse. D’ailleurs cette fille est folle ou possédée. Pour un rien, elle menace son entourage de tout casser dans la maison, monte sur la terrasse dans l’intention de se jeter dans la rue par-dessus le mur. Je tiens mes renseignements de source sûre.", "ar": "- لا بد من أن أمي سلامة تعرف ما يحصل في هذه الأسرة، لكن الجميع يعرف كتمانها. و مع ذلك، كل سكان حي العدوة على علم بالصعوبات التي يواجهها يوميا مولاي العربي مع زوجته، على أية حال، إن هذه الفتاة مجنونة أو ممسوسة. تهدد محيطها بكسر كل شيء في المنزل لأتفه الأسباب، تصعد إلى السطح بنية القفز إلى الشارع من فوق الجدار. حصلت على معلوماتي من مصادر موثوقة."}, {"fr": "Ainsi, mardi dernier, elle demanda à son mari de lui acheter pour le soir même, un foulard brodé à longues franges. Moulay Larbi revint deux heures plus tard avec un splendide foulard grenat à dessins multicolores. La fille du coiffeur le regarda à peine, le prit entre le pouce et l’index, le jeta dans la cour de la maison avec une grimace de dégoût. - Pour qui me prends-tu? dit-elle à son mari. Pour une fille de la campagne? Comment as-tu osé m’offrir un foulard de couleurs aussi vulgaires ? Certes, tu ne dois pas l’avoir payé bien cher! Sache que lorsqu’un vieux barbu comme toi prend comme épouse une fille qui pourrait être sa fille, il doit céder à tous ses caprices et ne lui offrir que ce qui coûte le plus cher. Je te fais don de ma jeunesse et de ma beauté, et en échange, tu m’apportes un foulard tout juste assez joli pour coiffer une tête de négresse.", "ar": "وهكذا، في يوم الثلاثاء الماضي، طلبت من زوجها أن يشتري لها في نفس الليلة، منديلا مطرزا بأهداب طويلة. عاد مولاي العربي بعد ساعتين بمنديل كستنائي براق برسوم متعددة الألوان. بالكاد نظرت إليه ابنة الحلاق، أمسكته بين الإبهام و السبابة، رمته في ساحة البيت بتكشيرة اشمئزاز. - قالت لزوجها: من تحسبني؟ فتاة من البادية؟ كيف تجرأت على أن تهديني منديلا بألوان سوقية كهذا؟ صحيح أنك لم تدفع ثمنا باهظا مقابلا له! إعلم أنه عندما يتخذ ملتح عجوز مثلك كزوجة له فتاة كان يمكن أن تكون ابنته، يجب أن ينفذ كل طلباتها و ألا يشتري لها إلا أغلى الأشياء. أنا أهبك شبابي و جمالي، في المقابل، تحضر لي منديلا بالكاد يبدو جميلا على رأس زنجية."}, {"fr": "Moulay Larbi, très en colère, se mit à l’insulter très violemment. La fille du coiffeur se saisit d’un verre, le cassa sur le rebord de la fenêtre et, avec le morceau aigu qui lui restait dans la main, elle tenta de se couper la gorge. Moulay Larbi se précipita pour arrêter son geste. Elle se mit à pousser des hurlements, à prendre à témoins les voisins, prétendant que son mari la battait, que sa situation devenait intolérable, qu’elle n’avait jamais assez à manger et qu’elle devait se contenter de vêtements rapiécés, tant l’avarice de son mari était grande.", "ar": "غضب مولاي العربي و بدأ بشتمها بعنف. تناولت ابنة الحلاق كأسا، كسرته على حافة النافذة و، بالقطعة الحادة التي كانت ما تزال في يدها، حاولت أن تقطع عنقها. أسرع مولاي العربي ليوقف حركتها. بدأت بالصراخ، بإشهاد الجيران، مدعية بأن زوجها كان يضربها، بأن وضعيتها لم تعد تحتمل، بأنها لم تكن تحصل أبدا على طعام كاف و بأنه كان عليها الاكتفاء بملابس مرقعة، لشدة بخل زوجها."}, {"fr": "Salama avoua qu’elle n’était pas au courant de cette scène.", "ar": "اعترفت سلامة بأنها لم تكن على علم بهذا الشجار."}, {"fr": "- Qui t’a raconté cela, ma petite sœur?", "ar": "- من حكى لك هذا، يا أختي الصغيرة؟"}, {"fr": "- Des gens! A Fès, personne n’ignore rien sur personne. Je sais aussi que la fille du coiffeur est particuliè- rement paresseuse. Elle ne quitte pas ses couvertures avant la prière de Louli. Lorsque Moulay Larbi passe la nuit auprès d’elle, le matin, il part sans déjeuner, sans même boire un verre de thé. Souvent viande et légumes attendent jusqu’au soir que Lalla, fille du coiffeur se décide à les faire cuire. Moulay Larbi ne supportera pas longtemps une telle vie. Déjà, il lui arrive de dormir dans son atelier plutôt que de rejoindre sa jeune femme. Il a trop de pudeur pour parler de tout cela à Lalla Aicha qui le reçoit, comme il convient, très froidement depuis son mariage.", "ar": "- ناس! في فاس، لا أحد يجهل شيئا عن الآخر. أعرف كذلك بأن ابنة الحلاق كسولة للغاية. لا تترك غطائها إلا بعد صلاة الولي. عندما ينام 138 مولاي العربي إلى جانبها، في الصباح، يذهب من دون غداء، دون أن يشرب كأس شاي حتى. غالبا ما ينتظر اللحم و الخضر حتى المساء عندما لالة، ابنة الحلاق تقرر أن تطبخها. لن يتحمل مولاي العربي حياة كهذه مدة طويلة. لقد بدأ ينام في الورشة بدل الالتحاق بزوجته الشابة. إنه يستحيي كثيرا من أن يحكي كل هذا للالة عيشة التي تستقبله، كما ينبغي، بفتور شديد منذ زواجه."}, {"fr": "Un murmure s’éleva parmi les auditrices. Ma mère tenta de dire quelque chose puis se ravisa, soupira, se replongea dans son silence. Tout le monde soupira avec conviction. Zhor n’avait plus rien à dire.", "ar": "انتشر همس بين المستمعات. حاولت أمي قول شيء لكنها غيرت رأيها، تنهدت، غرقت من جديد في صمتها. تنهد الجميع بقناعة. لم يعد لدى زهور شيء لتقوله."}, {"fr": "Soudain, toutes se mirent à parler à la fois. Elles parlaient de la fille du coiffeur, du coiffeur lui-même, de sa femme, de feue sa mère (que ses os aillent entretenir les flammes de l’Enfer). Elles se rappelèrent maintes histoires arrivées dans cette famille, qui ne s’étaient pas toujours terminées à l’avantage de ses membres. A les entendre, le coiffeur, sa mère, sa femme et sa fille représentaient le rebut de la société; à leur mort, les chiens même ne voudraient pas de leurs charognes. C’étaient à peine des êtres humains et presque pas des Musulmans.", "ar": "فجأة، بدأ الجميع بالكلام في الوقت نفسه. كن يتكلمن عن ابنة الحلاق، عن الحلاق نفسه، عن زوجته، عن أمه المتوفاة ( التي ذهبت عظامها لتشعل نيران الجحيم). تذكرن عدة قصص حصلت في هذه العائلة، لم تكن تنتهي دائما في صالح أفرادها. من يسمعهن يصدق بأن الحلاق، أمه، زوجته و ابنته كانوا يمثلون حثالة المجتمع؛ عند موتهم، حتى الكلاب ما كانت لترغب في جيفهم. كانوا بالكاد كائنات بشرية و ليسوا مسلمين تقريبا."}, {"fr": "Sur toute la surface de la terre, il n’y avait pas de peuple plus généreux, plus franc, plus pudique que le peuple du Prophète (que le salut et les bénédictions les plus choisies soient sur lui). Des individus pareils n’avaient pas de place dans une aussi noble communauté. D’autre part, ni les Chrétiens ni les Juifs n’en voudraient.", "ar": "على وجه الأرض كله، لم تكن هناك أمة أكثر كرما، أكثر صراحة أو أكثر عفة من أمة محمد ( عليه أفضل الصلاة و أزكى السلام ). لم يكن لأشخاص مثلهم مكان بين طائفة نبيلة كهذه. من جهة أخرى، لم يكن لا النصارى و لا اليهود ليرغبوا فيهم."}, {"fr": "Le ton de cette diatribe s’était fort élevé. La voix de Salama roulait comme le tonnerre, celles des autres femmes imitaient tantôt le bruit d’une chute d’eau, tantôt le déplacement des feuilles sèches par un vent de fin d’automne. Ce qu’elles disaient glissait sans laisser de trace dans mon esprit. Je ne comprenais pas le sens de tous les mots. Il m’importait peu de comprendre. J’étais attentif à la seule musique des syllabes. J’écoutais si intensément que j’oubliai le verre de thé que je tenais à la main. Mes doigts se relâchèrent. Le thé se ré- pandit sur mes genoux. L’ivresse verbale prit fin brusquement. Tout le monde me regarda dans un silence terrifiant. La surprise et la fureur brillaient dans tous les yeux braqués sur moi. En vain, je cherchai dans mon cerveau désemparé l’ombre d’une excuse. Aucune explication ne pouvait me sauver. Pleurer ne ser- virait à rien. Je regardai chaque femme, levai les yeux au plafond et poussai un profond soupir.", "ar": "كانت نبرة هذا النقد اللاذع عالية جدا. كان صوت سلامة يهزم مثل الرعد، كان صوت النساء الأخريات يقلد تارة صوت الشلال و تارة صوت تحريك أوراق الشجر الجافة بفعل ريح نهاية الخريف. كان ما يقلنه ينزلق دون أن يترك أثرا في عقلي. لم أكن أفهم معنى جميع الكلمات. لم يكن يهمني أن أفهم. كنت منتبها فقط إلى موسيقى المقاطع اللفظية. كنت أنصت بإمعان شديد لدرجة أنني نسيت كأس الشاي الذي كنت أمسكه في يدي. ارتخت أصابعي. انسكب الشاي على ركبتي. انتهى السكر الشفوي بشكل مفاجئ. نظر الجميع إلي بصمت مرعب. كانت المفاجأة و الرعب تلمعان في كل العيون الموجهة نحوي. بحثت عن أي عذر في عقلي المرتبك لكن دون جدوى. لم يكن أي تفسير يستطيع إنقاذي. 139 لم يكن البكاء ليجدي نفعا. نظرت إلى كل امرأة، رفعت عيني إلى السقف و أطلقت تنهدا عميقا. 140"}]}, {"fr_title": "Chapitre XII", "ar_title": "الفصل 12", "segs": [{"fr": "Ce jour-là, dès le matin, flottait dans l’air un élément nouveau qui chavirait les cœurs. Même Lalla Kanza, la chouafa, personne austère s’il en fût, chantait un couplet à la mode. Je l’écoutais de notre fe- nêtre. Sa voix chevrotait un peu mais les mots : cœur, œil de gazelle, lèvres de rose parvenaient jusqu’a mes oreilles. Ces mots me rappelaient des objets neufs et précieux qui auraient sommeillé longtemps sous un matelas de poussière. Ils s’élevaient, libres, dans le ciel blanc de l’été, secouant allégrement des ailes où s’attachaient encore de minuscules et persistantes toiles d’araignées. Longtemps, je répétai dans une sorte de béatitude: œil de gazelle, lèvre de rose! Je trouvais jolis ces mots qui, pour moi, n’avaient aucun sens. Je ne savais pas comment était fait un œil de gazelle ni même une gazelle tout entière. Lèvre de rose évoquait une image plus accessible à mon imagination. D’ailleurs, je finis vite par admettre qu’une chanson n’avait pas besoin d’avoir un sens. Je me promis de composer plus tard des chansons. Cela ne me paraissait pas difficile. Le vocabulaire m’en était déjà familier. Je parlerais de la nuit, de fronts couleur de lune, de dents pareilles à des perles enfilées sur un brin de soie, de lèvres de rose ou de corail. Il était toujours question aussi d’un nom de femme. Lequel choisirais-je ? Je cherchai un long moment. Aïcha se concrétisait vite en une femme grosse et babillarde : Lalla Aïcha, l’amie de ma mère. Rahma habitait avec nous. Son prénom ne pouvait m’inspirer. Zoubida, c’est ma mère. Il n’était peut-être pas très correct de mettre le nom de sa propre mère dans une chanson, Zineb me faisait trop de misères, Fatma ! Je la voyais de ma place pétrir son pain au milieu de sa chambre. Personne ne peur chanter le nom d’une femme qui, à genoux, à même le sol, pétrit la pâte dans un plat de poterie! Peut-être choisirais-je Zhor ou Khadija. Plutôt Zhor.", "ar": "في ذلك اليوم، منذ الصباح، كان هناك عنصر جديد يطفو في الجو و يحرك القلوب. حتى لالة كنزة، الشوافة، شخص صارم أكثر من الجميع، كانت تغني مقطعا موسيقيا رائجا. كنت أسمعها من نافذتنا. كان صوتها يتهدج قليلا لكن كانت الكلمات: قلب، عين الغزالة، شفتا الوردة تصل إلى مسامعي. كانت هذه الكلمات تذكرني بأشياء جديدة و قيمة كانت قد نامت طويلا تحت فراش من الغبار. كانت ترتفع، حرة، في سماء الصيف البيضاء، مرفرفة بسعادة بأجنحة كانت ما تزال تلتصق بها نسج عناكب صغيرة و ثابتة. كررت طويلا في ما يشبه لحظة فرحة عارمة: عين الغزالة، شفة الوردة! كانت هذه الكلمات التي، بالنسبة لي، لم يكن لها معنى جميلة جدا. لم أكن أعرف كيف كان شكل عين الغزالة و لا الغزالة بأكملها. كانت شفة الوردة توحي لي بصورة أكثر سهولة في التصور لخيالي. على أية حال، تمكنت بسرعة من الاعتراف بأن الأغنية ليست بحاجة إلى أن يكون لها معنى. وعدت نفسي بأن أؤلف أغاني فيما بعد. لم يكن ذلك يبدو لي صعبا. كان المعجم معتادا بالنسبة لي مسبقا. سأتكلم عن الليل، عن جباه بلون القمر، عن أسنان تشبه لآلئ منظومة في خيط حريري، عن شفاه ورد أو مرجان. كان دائما الأمر يتعلق باسم امرأة. أي واحد كنت سأختار؟ بحثت طويلا. كان اسم عيشة دائما يتجسد في امرأة بدينة و ثرثارة: لالة عيشة صديقة أمي. كانت رحمة تسكن معنا؟ لم يكن اسمها يلهمني. زبيدة، إنها أمي. ربما لم يكن من اللائق كثيرا وضع اسم الأم الخاصة في أغنية، كانت زينب تسبب لي الكثير من المشاكل، فاطمة! كنت أراها من مكاني تعجن خبزها وسط غرفتها. لا أحد يستطيع أن يغني اسم امرأة كانت تجثو على الأرض و تعجن العجين في قصعة! ربما كنت سأختار زهور أو خديجة. بالأحرى زهور."}, {"fr": "Doux souvenir!", "ar": "ذكرى لطيفة!"}, {"fr": "Visage fardé, bouche souriante!", "ar": "وجه مخضب، فم مبتسم!"}, {"fr": "Mes joues s’enflamment au souvenir de la caresse de ta main! Zhor, qui en savait si long sur le mariage de la fille du coiffeur Si Abderrahman, occupait encore mon esprit. Je lui avais ménagé dans mon être un nid douillet.", "ar": "يشتعل خداي بذكرى لمسة يدك! 141 زهور، التي كانت تعرف الكثير عن زواج ابنة الحلاق سي عبد الرحمان، كانت ما تزال تشغل بالي. كنت قد هيأت لها عشا ناعما في كياني."}, {"fr": "Rahma entama à son tour une cantilène. Sur un air mélancolique elle appela tous les saints à son se- cours. Elle se plaignit de sa maigreur et de ses insomnies. Point maigre du tout, elle ronflait, au dire de sa fille, à faire trembler les bols de faïence sur leur étagère.", "ar": "بدأت رحمة بدورها أغنية شعبية. نادت بمظهر كئيب جميع الأولياء لنجدتها. كانت تشتكي من نحافتها و أرقها. لم تكن نحيفة إطلاقا، حسب قول ابنتها، كانت تشخر حتى تجعل زبديات الخزف الصيني ترتج فوق رفوفها."}, {"fr": "Je ne compris pas la suite du poème consacrée aux yeux de je ne sais quel jouvenceau, des yeux pareils à des étoiles surmontées de sourcils comme des sabres recourbés. Kanza, la chouafa, et Rahma la femme du fabricant de charrues avaient donné le ton. Fatma Bziouya suivit leur exemple. Ma mère, timidement, puis d’une voix de plus en plus ferme, remplit la maison de ses roucoulements. Je décidai d’apporter ma modeste contribution à ce concert. Pour y participer, on n’était contraint à aucune règle, on ne devait remplir aucune condition spéciale. Chacun se laissait sim- plement aller à son inspiration.", "ar": "لم أفهم بقية القصيدة التي تتحدث عن عيون شاب لا أعرفه، عيون تشبه النجوم تعلوها حواجب مثل السيوف المقوسة. كانت كنزة، الشوافة، و رحمة زوجة صانع المحاريث قد أعطيتا المثال. ملأت أمي، بخجل، ثم بصوت أكثر حزما، البيت بشدوها. قررت الاشتراك بشكل متواضع في هذه الحفلة الموسيقية. للمشاركة، لم يكن من اللازم اتباع أية قاعدة، لم يكن من الواجب استوفاء أية شروط خاصة. كان كل واحد يستسلم لإلهامه. كان فهرسي يتألف فقط من كلمتين:"}, {"fr": "Mon répertoire se réduisait à deux mots : O nuit ! O lune !", "ar": "يا ليل! يا قمر! انطلقت: يا ليل! يا قمر!"}, {"fr": "Je me lançai: O nuit ! O lune ! Si le poème pouvait paraître maigre, je jure par le Tout-Puissant que les combinaisons musicales qu’il m’inspira mériteraient de rester gravées dans les mémoires. Toutefois, un cerveau humain aurait eu une peine infinie à enregistrer la somme des variations, des fantaisies audacieuses, des rythmes imprévus que, dans ce moment de liberté totale, enfanta mon délire lyrique.", "ar": "إذا كانت القصيدة تبدو فقيرة، أقسم بالله بأن التوزيعات الموسيقية التي ألهمتني إياها كانت تستحق البقاء منقوشة في الذاكرات. إلا أن العقل البشري كان سيجد صعوبة لا محدودة في تسجيل مجموع التغيرات، النزوات الجريئة، الإيقاعات الغير متوقعة، التي، في لحظة الحرية التامة هذه، ولدت هذياني الغنائي."}, {"fr": "Au milieu de cette ivresse, éclata comme le tonnerre par un beau soleil d’avril, un coup de marteau à la porte d’entrée. Un silence de mort obscurcit la maison. Au deuxième coup, Rahma cria: - Qui est là ?", "ar": "وسط هذا السكر، عصف مثل الرعد في شمس أبريل الجميلة، سمع صوت مقرعة الباب عند مدخل البيت. أظلم البيت بصمت مطبق. عند القرع الثاني، صاحت رحمة:"}, {"fr": "Une voix fragile d’enfant miaula une phrase incompréhensible. Le sang déserta mes joues. Je me penchai à la fenêtre. Tante Kanza invita l’enfant à pénétrer dans le patio. Après deux minutes d’attente intolérable, parut la silhouette souffreteuse d’un petit garçon d’une dizaine d’années. Je le reconnus, c’était Allal El Yacoubi, un élève de notre école coranique. Pris de panique, je me précipitai derrière le lit, cherchant une cachette. Mes membres tremblaient, mes dents claquaient dans ma bouche, le froid s’insinuait dans ma poitrine, s’y établissait pour jamais. Ma mère parlait. Elle disait:", "ar": "- من هناك؟ صاح صوت ضعيف لطفل بجملة مبهمة. امتقع وجهي. أطللت من النافذة. دعت خالتي كنزة الطفل للولوج إلى الفناء. بعد دقيقتين لا تحتملان من الانتظار، ظهر الخيال الممراض لولد صغير ذي عشر سنوات. عرفته. لقد كان علال اليعقوبي، تلميذ من كتابنا القرآني. أسرعت م
