<style>
:root{--bg:#f6efe0;--fg:#2a2118;--mut:#8b7d68;--card:#fffaf0;--acc:#0f6b74;--gold:#c8962e;--bd:#e5d8bc;--sv:#ffe08a;--glass:rgba(246,239,224,.82);--sh:0 8px 30px rgba(60,40,10,.12);--pat:rgba(15,107,116,.07)}
@media(prefers-color-scheme:dark){:root:not([data-t=light]){--bg:#0d1b2a;--fg:#ece4d0;--mut:#8f9bab;--card:#14263a;--acc:#3fb8c4;--gold:#e5b94e;--bd:#233a52;--sv:#6b5413;--glass:rgba(13,27,42,.82);--sh:0 8px 30px rgba(0,0,0,.4);--pat:rgba(229,185,78,.06)}}
:root[data-t=dark]{--bg:#0d1b2a;--fg:#ece4d0;--mut:#8f9bab;--card:#14263a;--acc:#3fb8c4;--gold:#e5b94e;--bd:#233a52;--sv:#6b5413;--glass:rgba(13,27,42,.82);--sh:0 8px 30px rgba(0,0,0,.4);--pat:rgba(229,185,78,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;color:var(--fg);font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-weight:500;line-height:1.7;background-color:var(--bg);
 background-image:conic-gradient(from 45deg at 50% 50%,var(--pat) 0 25%,transparent 0 50%,var(--pat) 0 75%,transparent 0);background-size:56px 56px;animation:drift 60s linear infinite}
@keyframes drift{to{background-position:560px 560px}}
header{position:sticky;top:0;z-index:5;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;animation:down .7s cubic-bezier(.2,.9,.3,1) both}
@keyframes down{from{transform:translateY(-100%);opacity:0}}
select,button,input{font:inherit;font-size:15px;padding:6px 12px;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:999px;cursor:pointer;transition:transform .18s,box-shadow .18s,background .2s,color .2s}
button:hover,select:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.15)}
button:active{transform:scale(.93)}
input{cursor:text;width:100%;border-radius:12px;padding:10px 14px}
input:focus,select:focus{outline:2px solid var(--gold);outline-offset:2px}
button.on,button.pri{background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 60%,var(--gold)));color:#fff;border-color:transparent;box-shadow:0 3px 10px color-mix(in srgb,var(--acc) 40%,transparent)}
main{max-width:780px;margin:0 auto;padding:16px 14px 90px}
h1{text-align:center;font-size:2em;margin:22px 0 6px;color:var(--acc);letter-spacing:.02em;animation:rise .9s cubic-bezier(.2,.9,.3,1) both}
h1::after{content:"";display:block;width:90px;height:3px;margin:10px auto 0;border-radius:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:grow 1.2s .3s both}
@keyframes grow{from{width:0;opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
.seg{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:6px 20px;margin:0 0 20px;scroll-margin-top:90px;box-shadow:var(--sh);opacity:0;transform:translateY(34px) scale(.98);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.9,.3,1),border-color .3s,box-shadow .3s}
.seg.in{opacity:1;transform:none}
.seg.cur{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),var(--sh)}
.fr{font-size:var(--fs);margin:12px 0}
.fr2{font-size:var(--fs);margin:12px 0;color:var(--mut);font-style:italic}
.ar{font-size:calc(var(--fs)*1.25);direction:rtl;text-align:right;font-family:"Amiri","Noto Naskh Arabic","Traditional Arabic","Geeza Pro",Tahoma,serif;font-weight:400;line-height:2.1;margin:12px 0;padding:10px 16px;border-right:4px solid var(--gold);background:linear-gradient(270deg,color-mix(in srgb,var(--gold) 14%,transparent),transparent);border-radius:10px}
.w{cursor:pointer;border-radius:5px;padding:0 1px;transition:background .2s,transform .2s,color .2s;display:inline-block}
.w:hover{background:var(--sv);transform:translateY(-2px) scale(1.06)}
.w.sv{background:var(--sv);box-shadow:inset 0 -2px var(--gold)}
.ph{background:var(--sv);box-shadow:inset 0 -2px var(--gold);border-radius:5px;padding:0 1px;cursor:pointer;transition:background .2s;-webkit-box-decoration-break:clone;box-decoration-break:clone}.ph:hover{filter:brightness(1.1)}.ph.pop{animation:pop .7s;display:inline-block}.w.pop{animation:pop .7s}
@keyframes pop{30%{transform:scale(1.5) rotate(-3deg);background:var(--gold);color:#000}}
.hide-fr .fr,.hide-ar .ar,.hide-fr2 .fr2{display:none}
nav.b{display:flex;justify-content:space-between;gap:8px;margin-top:24px;flex-wrap:wrap}
#prog{position:fixed;left:0;top:0;height:4px;background:linear-gradient(90deg,var(--acc),var(--gold));width:0;z-index:99;transition:width .15s;box-shadow:0 0 10px var(--gold)}
.fin{text-align:center;padding:26px;border:2px dashed var(--gold);border-radius:22px;margin-top:24px;background:var(--card);animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 28px color-mix(in srgb,var(--gold) 45%,transparent)}}
.fin button{font-size:19px;padding:12px 24px}
.ov{position:fixed;inset:0;background:rgba(5,10,18,.55);backdrop-filter:blur(4px);z-index:50;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:660px;max-height:88vh;overflow:auto;border-radius:26px 26px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));border-top:3px solid var(--gold);animation:up .4s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}}
.sheet h2{margin:0 0 6px;font-size:1.7em;color:var(--acc)}
.sheet .sent{color:var(--mut);margin:6px 0 12px;font-size:17px}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.row>*{flex:1}
.lx{border-bottom:1px solid var(--bd);padding:8px 0;display:flex;gap:8px;justify-content:space-between;animation:rise .5s both}
.lx b{font-size:1.2em}.lx small{display:block;color:var(--mut)}
.card{font-size:calc(var(--fs) + 3px);text-align:center;padding:30px 10px;min-height:150px;animation:flip .55s cubic-bezier(.2,.9,.3,1);transform-origin:center}
@keyframes flip{from{opacity:0;transform:perspective(600px) rotateX(-70deg)}}
.card.ar{direction:rtl;font-family:"Amiri","Noto Naskh Arabic",Tahoma,serif;border:0;background:none}
.bl{color:var(--gold);font-weight:700;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.5}}
.tl{font-size:13px;color:var(--mut);margin:4px 0}
body:has(.fbar) main{padding-bottom:110px}
.fbar{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--gold);border-radius:999px;padding:6px 12px;box-shadow:var(--sh);z-index:6;font-size:15px}
.fbar button{font-size:22px;padding:2px 16px;line-height:1.2}
.seg.fsR{animation:inR .45s cubic-bezier(.2,.9,.3,1)}.seg.fsL{animation:inL .45s cubic-bezier(.2,.9,.3,1)}
@keyframes inR{from{opacity:0;transform:translateX(60px)}}@keyframes inL{from{opacity:0;transform:translateX(-60px)}}
.seg.fs,.seg.fsR,.seg.fsL{margin-top:8px}
#selbar{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;pointer-events:none;z-index:40;font-size:16px;padding:10px 18px;max-width:92vw;transition:all .3s cubic-bezier(.2,.9,.3,1)}#selbar.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.sp{font-size:13px;padding:0 7px;margin:0 6px;border-radius:999px;opacity:.55;user-select:none;-webkit-user-select:none;vertical-align:middle}.sp:hover{opacity:1}#toast{position:fixed;top:70px;left:50%;transform:translate(-50%,-20px);background:var(--card);border:1px solid var(--gold);border-radius:12px;padding:10px 16px;z-index:99;opacity:0;pointer-events:none;transition:all .3s;max-width:90vw;text-align:center;box-shadow:var(--sh)}#toast.show{opacity:1;transform:translate(-50%,0)}
.pbar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin:0 0 8px}.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--gold));transition:width .5s}
.chb{display:block;width:100%;margin:8px 0;border-radius:14px;padding:12px 16px;font-size:calc(var(--fs) + 1px);text-align:center}.chb.ok{background:#2e9e5b;color:#fff;border-color:transparent;animation:pop .6s}.chb.ko{background:#c0392b;color:#fff;border-color:transparent;animation:shake .4s}.chb:disabled{opacity:1;transform:none}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{text-align:center;font-size:1.3em;font-weight:700;margin:10px 0;animation:pop .6s}.fb.ok{color:#2e9e5b}.fb.ko{color:#c0392b}
.score{text-align:center;margin:10px 0}.score b{display:block;font-size:2.6em;color:var(--acc);animation:pop .8s}.score span{color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 8px}.chip{padding:3px 12px;font-size:15px}#st{margin:-6px 0 10px;font-size:15px}
.stg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.stg div{background:var(--card);border:1px solid var(--bd);border-radius:12px;text-align:center;padding:8px}.stg b{display:block;font-size:1.6em;color:var(--acc)}.stg span{font-size:12px;color:var(--mut)}.bars{display:flex;align-items:flex-end;gap:4px;height:104px}.bc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}.bc i{width:100%;background:linear-gradient(0deg,var(--acc),var(--gold));border-radius:4px 4px 0 0;min-height:2px}.bc small{font-size:10px;color:var(--mut)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:18px;margin-top:20px}
.book{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:18px;overflow:hidden;cursor:pointer;box-shadow:var(--sh);transition:transform .3s,box-shadow .3s;animation:rise .7s cubic-bezier(.2,.9,.3,1) both}
.book:hover{transform:translateY(-8px) rotate(-.6deg);box-shadow:0 16px 38px rgba(0,0,0,.25)}
.cv{height:190px;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;background:linear-gradient(160deg,var(--c1),var(--c2));position:relative}
.cv::before{content:"";position:absolute;inset:0;background:conic-gradient(from 45deg,rgba(255,255,255,.07) 0 25%,transparent 0 50%,rgba(255,255,255,.07) 0 75%,transparent 0);background-size:26px 26px}
.cv b,.cv small{position:relative}.cv b{font-size:1.4em;line-height:1.15}.cv small{opacity:.9;margin-top:4px}
.bi{padding:10px 14px 12px;font-size:14px;color:var(--mut)}.bi em{color:var(--acc);font-style:normal;font-weight:700;display:block}
.book.add{border:2px dashed var(--gold);background:transparent;box-shadow:none}.book.add .cv{background:none;color:var(--acc);align-items:center;justify-content:center;text-align:center;height:100%;min-height:250px}.book.add .cv::before{display:none}.book.add .cv b{font-size:3em}
.book .x{position:absolute;top:8px;right:8px;padding:0 9px;border-radius:99px;background:rgba(0,0,0,.45);color:#fff;border:0;z-index:2}
body.home #ch,body.home #bfr,body.home #bar,body.home #bfr2,body.home #sm,body.home #bg,body.home #bfo,body.home #bhome,body.home .fbar,body.home #selbar{display:none!important}
textarea{font:inherit;font-size:14px;width:100%;padding:8px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);margin:4px 0}
.tin{flex:1.3;width:auto;min-width:0;padding:4px 10px;border-radius:10px;font-family:"Amiri","Noto Naskh Arabic",Tahoma,serif;font-size:1.1em;color:var(--acc)}.lx{align-items:center}.ar2{font-family:"Amiri","Noto Naskh Arabic",Tahoma,serif;font-size:1.15em;color:var(--acc)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.seg{opacity:1;transform:none}}
</style>

<script>

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDGC1QX_cPg9Z3zRFrIIbyCIvlXwDDVt8o",
  authDomain: "anassvision-8574d.firebaseapp.com",

  messagingSenderId: "757274765640",
  appId: "1:757274765640:web:e546ea0ea057ce1436eb7d"
};
// =====================================================================================
const BUILTIN=[{id:'boite',title:'La Boîte à merveilles',author:'Ahmed Sefrioui',c1:'#0f6b74',c2:'#c8962e',chapters:[{"fr_title": "Chapitre I", "ar_title": "الفصل 1", "segs": [{"fr": "Le soir, quand tous dorment, les riches dans leurs chaudes couvertures, les pauvres sur les marches des boutiques ou sous les porches des palais, moi je ne dors pas. Je songe à ma solitude et j’en sens tout le poids. Ma solitude ne date pas d’hier.", "ar": "في المساء، عندما ينام الجميع، الأغنياء في بطانياتهم الدافئة، الفقراء على درجات المحلات التجارية أو تحت سقائف القصور، أنا لم أكن أنام، كنت أفكر في وحدتي و أشعر بكامل وزنها. إن وحدتي قديمة جدا."}, {"fr": "Je vois, au fond d’une impasse que le soleil ne visite jamais, un petit garçon de six ans, dresser un piège pour attraper un moineau mais le moineau ne vient jamais. Il désire tant ce petit moineau ! Il ne le mangera pas, il ne le martyrisera pas. Il veut en faire son compagnon. Les pieds nus, sur la terre humide, il court jusqu’au bout de la ruelle pour voir passer les ânes et revient s’asseoir sur le pas de la maison et attendre l’arrivée du moineau qui ne vient pas. Le soir, il rentre le cœur gros et les yeux rougis, balançant au bout de son petit bras, un piège en fil de cuivre. Nous habitions Dar Chouafa, la maison de la voyante. Effectivement, au rez-de-chaussée, habitait une voyante de grande réputation. Des quartiers les plus éloignés, des femmes de toutes les conditions venaient la consulter. Elle était voyante et quelque peu sorcière. Adepte de la confrérie des Gnaouas (gens de Guinée) elle s’offrait, une fois par mois, une séance de musique et de danses nègres. Des nuages de benjoin emplissaient la maison et les crotales et les guimbris nous empêchaient de dormir, toute la nuit.", "ar": "في نهاية زقاق لا تبلغه الشمس مطلقا، كنت أرى طفلا صغيرا ذا ست سنوات، ينصب فخا ليمسك بدوري لكن هذا الدوري كان لا يأتي أبدا. كان يرغب بشدة في الإمساك بهذا الدوري الصغير، ليس لأكله و لا لتعذيبه، كان يريد فقط أن يجعل منه رفيقا له، بقدمين حافيتين و على أرض مبللة، كان يجري حتى نهاية الزقاق ليرى مرور الحمير ثم يعود للجلوس على درجة المنزل و انتظار قدوم الدوري الذي لا يأتي. في المساء، يعود بقلب منكسر و عينين حمراوين، مأرجحا في طرف ذراعه الصغيرة فخا مصنوعا من سلك نحاسي. كنا نسكن دار الشوافة، بيت العرافة. بالفعل، كانت تعيش عرافة ذات شهرة كبيرة في الطابق الأرضي. كانت نساء من كل الأنواع يأتين لاستشارتها من أبعد الأحياء. لقد كانت عرافة و ساحرة نوعا ما. تابعة لأخوية ڭناوة (ناس غينيا)، مرة كل شهر، كانت تقيم جلسة موسيقى ورقصات زنجية. كانت سحب البنزوين تملأ المنزل و كانت المجلجلات و الڭمبريات تمنعنا من النوم طوال الليل."}, {"fr": "Je ne comprenais rien au rituel compliqué qui se déroulait au rez-de-chaussée. De notre fenêtre du deuxième étage, je distinguais à travers la fumée des aromates les silhouettes gesticuler. Elles faisaient tinter leurs instruments bizarres. J’entendais des you-you. Les robes étaient tantôt bleu-ciel, tantôt rouge sang, parfois d’un jaune flamboyant. Les lendemains de ces fêtes étaient des jours mornes, plus tristes et plus gris que les jours ordinaires. Je me levais de bonne heure pour aller au Msid, école Coranique située à deux pas de la maison. Les bruits de la nuit roulaient encore dans ma tête, l’odeur du benjoin et de l’encens m’enivrait. Autour de moi, rôdaient les jnouns, les démons noirs évoqués par la sorcière et ses amis avec une frénésie qui touchait au délire. Je sentais les jnouns me frôler de leurs doigts brûlants ; j’entendais leurs rires comme par les nuits d’orage. Mes index dans les oreilles, je criais les versets tracés sur ma planchette avec un accent de désespoir. Les deux pièces du rez-de-chaussée étaient occupées par la Chouafa principale locataire. Au premier étage habitaient Driss El Aouad, sa femme Rahma et leur fille d’un an plus âgée que moi. Elle s’appelait Zineb et je ne l’aimais pas. Toute cette famille disposait d’une seule pièce, Rahma faisait la cuisine sur le palier. Nous partagions avec Fatma Bziouya le deuxième étage. Nos deux fenêtres faisaient vis-à-vis et donnaient sur le patio, un vieux patio dont les carreaux avaient depuis longtemps perdu leurs émaux de couleur et qui paraissait pavé de briques. Il était tous les jours lavé à grande eau et frotté au balai de doum. Les jnouns aimaient la propreté. Les clientes de la Chouafa avaient dès l’entrée une bonne impres- sion, impression de netteté et de paix qui invitait à l’abandon, aux confidences - autant d’éléments qui aidaient la voyante à dévoiler plus sûrement l’avenir. Il n’y avait pas de clientes tous les jours. Aussi inexplicable que cela puisse paraître, il y avait la morte- saison. On ne pouvait en prévoir l’époque. Brusquement, les femmes cessaient d’avoir recours à des philtres d’amour, se préoccupaient moins de leur avenir, ne se plaignaient plus de leurs douleurs des reins, des omoplates ou du ventre, aucun démon ne les tourmentait.", "ar": "لم أكن أفهم شيئا من الطقوس المعقدة التي كانت تحدث في الطابق الأرضي. من نافذتنا في الطابق الثاني، كنت أميز بين دخان البخور الأطياف و هي تلوح. كانت تجلجل بآلاتها الغريبة. كنت أسمع زغاريدا. كانت الألبسة تكون تارة زرقاء سماوية و تارة حمراء قانية، و في بعض الأحيان صفراء لامعة. كانت الأيام التي تلي تلك الحفلات كئيبة، أكثر حزنا و أكثر مللا من الأيام العادية. كنت أستيقظ باكرا للذهاب إلى المسيد، ك تاب قرآني يقع على بعد خطوات من المنزل. كانت أصوات الليل لا تزال تدور في رأسي، كانت رائحة البنزوين و اللبان تسكرني، كان الجنون يحومون حولي، الشياطين السوداء المستدعاة من طرف الساحرة و أصدقائها بحماسة تبلغ حد الهذيان. كنت أحس بالجنون تلمسني 1 بأصابعها الحارقة؛ كنت أسمع ضحكاتها كما في الليالي العاصفة. واضعا سبابتاي في أذناي، كنت أتلو الآيات المنقوشة على لوحي بنبرة من اليأس. كانت غرفتا الطابق الأرضي مسكونتين من طرف الشوافة المستأجرة الرئيسية. في الطابق الأول، كان يسكن إدريس العاود، زوجته رحمة و ابنتهما الأكبر مني بسنة واحدة. كان اسمها زينب و لم أكن أحبها. كانت هذه الأسرة بأكملها تقيم في غرفة واحدة، كانت رحمة تطبخ في البسطة. كنا نتشارك الطابق الثاني مع فاطمة بزيوية. كانت نافذتانا متقابلتين و تطلان على الفناء، فناء قديم كانت بلاطاته قد فقدت مينا ألوانها منذ وقت طويل كما كان يبدو مبلطا بالآجر. لقد كان يغسل و يفرك كل يوم بالكثير من الماء و بمكنسة الدوم. كان الجنون يحبون النظافة. كانت زبونات الشوافة تحظين بانطباع جيد منذ البداية. انطباع الصفاء و السلام الذي كان يحث على البوح بالعديد من العناصر التي كانت تساعد العرافة على كشف المستقبل بثقة أكبر. لم تكن هناك زبونات كل يوم. رغم غرابة الأمر، لقد كانت هناك فترة كساد. لم يكن من الممكن التنبؤ بوقتها. بشكل مفاجئ، كانت النساء تتوقفن عن اللجوء لجرع الحب، تصبحن أقل اهتماما بالمستقبل، لا تشتكين من آلام الكلى، الكتف أو البطن، لم يكن أي عفريت يضايقهن."}, {"fr": "La Chouafa choisissait ces quelques mois de trêve pour s’occuper de sa santé propre. Elle se découvrait des maux que sa science ne pouvait réduire. Les diables l’hallucinaient, se montraient exigeants quant à la couleur des caftans, l’heure de les porter, les aromates qu’il fallait brûler dans telle ou telle circonstance. Et dans la pénombre de sa grande pièce tendue de cretonne, la chouafa gémissait, se plaignait, conjurait, se desséchait dans des nuages d’encens et de benjoin.", "ar": "كانت الشوافة تختار هذه الشهور القليلة لتهتم بصحتها الخاصة، كانت تكشف الشرور التي لم يستطع علمها التقليل منها. كانت الشياطين تسبب لها الهلوسة، تصبح متطلبة بخصوص لون القفاطين، ساعة ارتدائها، البخور التي يجب حرقها في هذه المناسبة أو تلك. في ظليل حجرتها الكبيرة و المغلفة بقماش الكريتون، كانت الشوافة تنتحب، تشتكي، تتعوذ و تختفي وسط سحب البنزوين و اللبان."}, {"fr": "J’avais peut-être six ans. Ma mémoire était une cire fraîche et les moindres événements s’y gravaient en images ineffaçables. Il me reste cet album pour égayer ma solitude, pour me prouver à moi-même que je ne suis pas encore mort.", "ar": "ربما كنت في السادسة، كانت ذاكرتي لا تزال شمعا طريا و كانت أصغر الأحداث تنقش فيها على شكل صور لا تمحى. يبقى لدي هذا الألبوم لأسلي به وحدتي، لأثبت لنفسي بأنني لم أمت بعد."}, {"fr": "A six ans j’étais seul, peut-être malheureux, mais je n’avais aucun point de repère qui me permît d’ap- peler mon existence : solitude ou malheur.", "ar": "في عمر ست سنوات، كنت وحيدا، ربما تعيسا، لكن لم تكن لدي أية نقطة رجوع تسمح لي بالاتصال بوجودي: الوحدة أو التعاسة."}, {"fr": "Je n’étais ni heureux, ni malheureux. J’étais un enfant seul. Cela, je le savais. Point farouche de nature, j’ébauchai de timides amitiés avec les bambins de l’école coranique, mais leur durée fut brève. Nous habitions des univers différents. J’avais un penchant pour le rêve. Le monde me paraissait un domaine fabuleux, une féerie grandiose où les sorcières entretenaient un commerce familier avec des puissances invisibles. Je désirais que l’Invisible m’admît à participer à ses mystères. Mes petits camarades de l’école se contentaient du visible, surtout quand ce visible se concrétisait en sucreries d’un bleu céleste ou d’un rose de soleil couchant. Ils aimaient grignoter, sucer, mordre à pleines dents. Ils aimaient aussi jouer à la bataille, se prendre à la gorge avec des airs d’assassins, crier pour imiter la voix de leur père, s’insulter pour imiter les voisins, commander pour imiter le maître d’école.", "ar": "2 لم أكن سعيدا و لا تعيسا. كنت طفلا وحيدا. هذا كنت أعرفه. حلقة مفقودة منذ البداية.كونت صداقات محتشمة مع أطفال الكتاب القرآني، لكنها كانت قصيرة الأمد. نسكن عوالم مختلفة. كان لدي ميول للحلم. كان العالم يبدو لي مكانا رائعا. مهرجانا كبيرا كانت الساحرات تمارسن فيه تجارة مستمرة مع قوى خفية. كنت أرغب في أن يقبلني اللامرئي. لأشارك في أسراره. كان رفاقي الصغار في الكتاب يكتفون بالمرئي. بالأخص عندما كان هذا المرئي يتجلى في سكاكر زرقاء سماوية أو وردية بلون غروب الشمس. كانوا يحبون القضم، المص، العض بكامل أسنانهم. كانوا يحبون كذلك ألعاب القتال. مهاجمة الحلق كما كان يفعل القتلة، الصراخ لتقليد أصوات آبائهم، التشاتم لتقليد الجيران، القيادة لتقليد معلم الكتاب."}, {"fr": "Moi, je ne voulais rien imiter, je voulais connaître.", "ar": "أنا لم أكن أريد تقليد أي شيء، كنت أريد أن أعرف."}, {"fr": "Abdallah, l’épicier, me raconta les exploits d’un roi magnifique qui vivait dans un pays de lumière, de fleurs et de parfums, par delà les Mers des Ténèbres, par delà la Grande Muraille. Et je désirais faire un pacte avec les puissances invisibles qui obéissaient aux sorcières afin qu’elles m’emmènent par delà les Mers des Ténèbres et par delà la Grande Muraille, vivre dans ce pays de lumière, de parfums et de fleurs.", "ar": "حكى لي عبد الله البقال عن إنجازات ملك مدهش كان يعيش في بلد من النور، من الأزهار و من العطور، أبعد من بحور الظلمات، أبعد من سور الصين العظيم، و كنت أريد أن أعقد صفقة مع القوى الخفية التي كانت تطيع الساحرات لكي تأخذني إلى أبعد من بحور الظلمات و أبعد من سور الصين العظيم. للعيش في بلد النور ذاك، بلد العطور و الأزهار."}, {"fr": "Mon père me parlait du Paradis. Mais, pour y renaître, il fallait d’abord mourir. Mon père ajoutait que se tuer était un grand péché, un péché qui interdisait l’accès à ce royaume. Alors, je n’avais qu’une solution : attendre ! Attendre de devenir un homme, attendre de mourir pour renaître au bord du fleuve Salsabil. Attendre ! C’est cela exister. A cette idée, je n’éprouvais certainement aucune frayeur. Je me réveillais le matin, je faisais ce qu’on me disait de faire. Le soir, le soleil disparaissait et je revenais m’en- dormir pour recommencer le lendemain. Je savais qu’une journée s’ajoutait à une autre, je savais que les jours faisaient des mois, que les mois devenaient des saisons, et les saisons l’année. J’ai six ans, l’année prochaine j’en aurai sept et puis huit, neuf et dix. A dix ans, on est presque un homme. A dix ans, on parcourt seul tout le quartier, on discute avec les marchands, on sait écrire, au moins son nom, on peut consulter une voyante sur son avenir, apprendre des mots magiques, composer des talismans.", "ar": "كان أبي يحدثني عن الجنة، لكن عن البعث فيها، كان لابد من الموت أولا، كان أبي يقول بأن الانتحار إثم كبير، كان إثما يمنع من الدخول إلى تلك المملكة. إذن، لم يكن لدي سوى حل واحد: أن أنتظر! أنتظر حتى أصير رجلا، أنتظر حتى أموت و أبعث بجانب عين سلسبيل. أنتظر! هذا ما يعنيه الوجود. لم أكن أشعر بأي خوف تجاه هذه الفكرة. كنت أستيقظ صباحا. أفعل ما كان يطلب مني. في المساء، كانت الشمس تختفي و أعود للنوم لأبدأ الغد من جديد. كنت أعلم بأن كل يوم ينضاف إلى الآخر، أعلم بأن الأيام تكون شهورا، أن الشهور تصبح فصولا، و الفصول تكون السنة. لدي ست سنوات، في السنة القادمة سيكون لدي سبعة ثم ثمانية، تسعة و عشرة. في سن العاشرة، يصبح المرء رجلا تقريبا. في سن العاشرة، نطوف بمفردنا الحي كله، نتكلم مع التجار، نعرف الكتابة، على الأقل اسمنا، نستطيع استشارة عرافة حول المستقبل، تعلم كلمات سحرية، تركيب تعاويذ."}, {"fr": "En attendant, j’étais seul au milieu d’un grouillement de têtes rasées, de nez humides, dans un vertige de vociférations de versets sacrés.", "ar": "3 في انتظار ذلك، كنت وحيدا وسط حشد من رؤوس صلعاء، أنوف مبللة، في دوار من تراتيل الآيات الكريمة."}, {"fr": "L’école était à la porte de Derb Noualla. Le fqih, un grand maigre à barbe noire, dont les yeux lançaient constamment des flammes de colère, habitait la rue Jiaf. Je connaissais cette rue. Je savais qu’au fond d’un boyau noir et humide, s’ouvrait une porte basse d’où s’échappait, toute la journée, un brouhaha continu de voix de femmes et de pleurs d’enfants. La première fois que j’avais entendu ce bruit, j’avais éclaté en sanglots parce que j’avais reconnu les voix de l’Enfer telles que mon père les évoqua un soir.", "ar": "كان الكتاب يقع في مدخل درب النوالة. الفقيه، الشخص الطويل و النحيف ذو اللحية السوداء، الذي كانت عيناه تقذفان بنيران غضب باستمرار. كان يسكن شارع جياف. كنت أعرف هذا الشارع. كنت أعلم أنه يقع في آخر زنقة سوداء و مبللة، كان هناك باب منخفض يفتح طوال اليوم ليخرج منه صخب متواصل من أصوات النساء و بكاء الأطفال. في أول مرة سمعت فيها هذا الصوت، أجهشت بالبكاء لأنني سمعت أصوات الجحيم كما وصفها لي أبي ذات مساء."}, {"fr": "Ma mère me calma :", "ar": "هدأتني أمي:"}, {"fr": "- Je t’emmène prendre un bain, je te promets un orange et un œuf dur et tu trouves le moyen de braire comme un âne !", "ar": "- سأصطحبك لتأخذ حماما، أعدك ببرتقالة و بيضة مسلوقة و ستستطيع النهيق كالحمار!"}, {"fr": "Toujours hoquetant, je répondis :", "ar": "أجبت و أنا لا أزال أفوق:"}, {"fr": "- Je ne veux pas aller en Enfer.", "ar": "- لا أريد الذهاب للجحيم."}, {"fr": "Elle leva les yeux au ciel et se tut, confondue par tant de niaiserie.", "ar": "رفعت عينيها للسماء و صمتت، مشوشة من هذا القدر من الحماقة."}, {"fr": "Je crois n’avoir jamais mis les pieds dans un bain maure depuis mon enfance. Une va- gue appréhension et un sentiment de malaise m’ont toujours empêché d’en franchir la porte. A bien réfléchir je n’aime pas les bains maures. La promiscuité, l’espèce d’impu- deur et de laisser-aller que les gens se croient obligés d’affecter en de tels lieux m’en écartent. Même enfant, je sentais sur tout ce grouillement de corps humides, dans ce demi-jour inquiétant, une odeur de péché. Sentiment très vague, surtout à l’âge où je pouvais encore accompagner ma mère au bain maure, mais qui provoquait en moi un certain trouble. Dès notre arrivée nous grimpâmes sur une vaste estrade couverte de nattes. Après avoir payé soixante quinze centimes à la caissière nous commençâmes notre déshabillage dans un tumulte de voix aiguës, un va-et-vient continu de femmes à moitié habillées, déballant de leurs énormes baluchons des caftans et des mansourias, des chemises et des pantalons, des haïks à glands de soie d’une éblouissante blancheur. Toutes ces femmes parlaient fort, gesticulaient avec passion, poussaient des hurlements inexplicables et injustifiés.", "ar": "أظن بأنه لم يسبق لي أن ذهبت لحمام عمومي منذ طفولتي. كان هناك دائما تخوف غامض و إحساس بعدم الارتياح يمنعانني من دخوله. بعد التفكير جيدا، لا أحب الحمامات العمومية. كان الاختلاط، ذلك المجون و التهاون الذ ي ن يعتقد الناس بأنهم مضطرون لتصنعها تجعلني أنفر منها. حتى و لو كنت طفلا، كنت أشم في هذا الحشد من الأجسام المبللة، في نصف اليوم المقلق هذا، رائحة الإثم، إحساس غامض جدا، خصوصا في السن الذي كنت فيه لا أزال أستطيع مرافقة أمي إلى الحمام العمومي، الذي كان يثير في نوعا من الاضطراب. ما إن وصلنا، تسلقنا سدة عريضة مفروشة بحصير. بعد دفع خمس و سبعين سنتيما للصرافة بدأنا تعرينا وسط صخب من الأصوات الحادة، حركة مرور مستمرة لنساء نصف لابسات، مخرجات من صرر ثيابهن الضخمة قفاطينا و منصوريات، قمصانا و سراويلا، حوائك بشرابات ذوات بياض براق. جميع هاته النساء كن يتكلمن بصوت عال، يلوحن بشغف، يطلقن صرخات يصعب شرحها و لا مبرر لها."}, {"fr": "Je retirai mes vêtements et je restai tout bête, les mains sur le ventre, devant ma mère lancée dans une explication avec une amie de rencontre. Il y avait bien d’autres enfants, mais ils paraissaient à leur aise, couraient entre les cuisses humides, les mamelles pendantes, les montagnes de baluchons, fiers de mon- trer leurs ventres ballonnés et leurs fesses grises. Je me sentais plus seul que jamais. J’étais de plus en plus persuadé que c’était bel et bien l’Enfer. Dans les salles chaudes, l’atmosphère de vapeur, les personnages de cauchemar qui s’y agitaient, la température, finirent par m’anéantir. Je m’assis dans un coin, tremblant de fièvre et de peur. Je me demandais ce que pouvaient bien faire toutes ces femmes qui tournoyaient partout, couraient dans tous les sens, traînant de grands seaux de bois débordants d’eau bouillante qui m’éclaboussait au passage. Ne venaient-elles donc pas pour se laver? Il y en avait bien une ou deux qui tiraient sur leurs cheveux, assises, les jambes allon- gées, protestant d’une voix haute, mais les autres ne semblaient même pas s’apercevoir de leur présence et continuaient leurs éternels voyages avec leurs éternels seaux de bois. Ma mère, prise dans le tourbillon, émergeait de temps en temps d’une masse de jambes et de bras, me lançait une recommandation ou une injure que je n’arrivais pas à saisir et disparaissait. Devant moi, dans un seau vide, il y avait un peigne en corne, un gobelet de cuivre bien astiqué, des oranges et des œufs durs. Je pris timidement une orange, je l’épluchai, je la suçai pendant longtemps, le regard vague. Je sentais moins l’indécence de mon corps dans cette pénombre, je le regardais se couvrir de grosses gouttes de sueur et je finis par oublier les femmes qui s’agitaient, leurs seaux de bois et leurs voyages inexplicables autour de la pièce. Ma mère fondit sur moi. Elle me plongea dans un seau d’eau, me couvrit la tête d’une glaise odorante et malgré mes cris et mes larmes me noya sous un flot d’injures et de feu. Elle me sortit du seau, me jeta dans un coin comme un paquet, disparut de nouveau dans le tourbillon. Mon désespoir dura peu, je plongeai la main dans le seau à provisions et je pris un œuf dur, gourmandise dont j’étais particulièrement friand. Je n’avais pas encore fini d’en grignoter le jaune que ma mère réapparut de nouveau, m’aspergea alternativement d’eau bouillante et d’eau glacée, me couvrit d’une serviette et m’emporta à moitié mort à l’air frais sur l’estrade aux baluchons. Je l’entendis dire à la caissière : - Lalla Fattoum, je te laisse mon fils, je n’ai pas eu encore une goutte d’eau pour me laver.", "ar": "4 خلعت ملابسي وبقيت جالسا ببلاهة، يداي على بطني، أمام أمي التي انخرطت في حديث مع صديقة تعرفها. كان هناك أطفال آخرون، و لكن كانوا يبدون مرتاحين، كانوا يجرون بين الأفخاد المبللة و النهود المتدلية، جبال الصرر، فخورين بإظهار بطونهم المنتفخة و مؤخراتهم الصغيرة. كنت أحس بالوحدة أكثر من أي وقت مضى. كنت أقتنع شيئا فشيئا بأن هذا هو الجحيم. في القاعات الحارة، أهلكني أخيرا جو البخار، شخصيات الكوابيس التي كانت تتحرك فيه و درجة الحرارة، جلست في إحدى الزوايا، مرتجفا من الحمى و الخوف. كنت أتساءل ما الذي كانت تفعله تلك النساء اللواتي كن يتجولن في كل مكان، يجرين في كل الأنحاء، جارات دلاء كبيرة من الماء الفوار. الذي كان يرشني عند مرورهن. ألم يأتين للاستحمام؟ لقد كان هناك بالفعل واحدة أو اثنتان ممن يمشطن شعرهن، جالسات بسيقان ممدودة، محتجات بصوت عال، لكن لم يكن يبدو على الأخريات حتى بأنهن قد انتبهن لوجودهن و كن يتابعن رحلاتهن الأبدية بدلائهن الخشبية التي لا تنتهي. كانت أمي، التي ابتلعتها الدوامة، تظهر من حين لآخر بين كتلة من السيقان و الأذرع، ترمي لي بتوصية أو شتيمة لم أكن أستطيع فهمها ثم تختفي من جديد. كان أمامي، في دلو فارغ، مشط من القرن، غراف نحاسي مصقول جيدا، برتقالات و بيض مسلوق. أخذت برتقالة بخجل، قشرتها، مصصتها لمدة طويلة، بنظرة غير ثابتة، كان شعوري بقلة حياء جسمي قد قل وسط هذا الظليل، كنت أراقبه و هو يتغطى بقطرات كبيرة من العرق و انتهى بي الأمر بنسيان النساء اللواتي كن يتجولن، دلائهن الخشبية و رحلاتهن الغير مفهومة حول الحجرة. انقضت علي أمي، وضعتني داخل دلو ماء، وسكبت على رأسي صلصالا طيب الرائحة و رغم صرخاتي و دموعي أمطرتني بسيل من الشتائم و النار. أخرجتني من الدلو، رمتني في ركن مثل حزمة، اختفت من جديد داخل الدوامة. دام يأسي قليلا، أدخلت يدي في دلو العدة و أخذت بيضة مسلوقة، كنت أحب هذه الوجبة كثيرا. لم أكن قد انتهيت من قضم المح عندما عادت أمي من جديد، سكبت علي ماء فوارا و باردا بشكل متعاقب، غطتني بمنشفة و أخذتني نصف ميت إلى الهواء البارد على الصرر. سمعتها تقول للصرافة: - لالة فطوم، سأترك لك ابني، لم أحظى بعد بأي قطرة ماء لأستحم."}, {"fr": "Et à moi :", "ar": "5 ولي:"}, {"fr": "- Habille-toi, tête d’oignon ! Voici une orange pour t’occuper.", "ar": "- ا رتدي ملابسك، يا رأس البصلة! هذه برتقالة لتنشغل بها."}, {"fr": "Je me trouvai seul, les mains croisées sur mon ventre en flammes, plus bête que jamais au milieu de toutes ces inconnues et de leurs fastueux baluchons. Je m’habillai. Ma mère vint un moment m’entourer étroitement la tête dans une serviette qu’elle me noua sous le menton, me munit de toutes sortes de re- commandations et s’engouffra dans les salles chaudes par cette porte qui me faisait face et d’où s’échap- paient toutes sortes de rumeurs.", "ar": "وجدت نفسي وحيدا، يداي متقاطعتان على بطني الملتهب، أكثر بلاهة من أي وقت مضى، وسط كل هؤلاء الغريبات و صررهن الباذخة. ارتديت ملابسي. أتت أمي لبرهة لكي تلف رأسي بإحكام بمنشفة عقدتها تحت الذقن، زودتني بكل أنواع التوصيات ثم تم ابتلاعها إلى داخل القاعات الحارة من طرف ذلك الباب الأسود الذي كان أمامي و الذي كانت تخرج منه جميع أنواع الإشاعات."}, {"fr": "J’attendis sur l’estrade jusqu’au soir. Ma mère finit par venir me rejoindre, l’air épuisé, se plaignant de violents maux de tête. Heureusement pour moi, ces séances de bain étaient assez rares. Ma mère ne voulait point s’embarras- ser de l’enfant empoté et maladroit que j’étais. Pendant son absence, j’étais livré à mes timides fantaisies. Je courais pieds nus dans le derb, imitant le pas cadencé des chevaux, je hennissais fièrement, envoyais des ruades. Parfois, je vidais simplement ma Boîte à Merveilles par terre et j’inventoriais mes trésors. Un simple bouton de porcelaine me mettait les sens en extase. Quand je l’avais longtemps regardé, j’en cares- sais des doigts la matière avec respect. Mais il y avait dans cet objet un élément qui ne pouvait être saisi ni par les yeux, ni par les doigts, une mystérieuse beauté intraduisible. Elle me fascinait. Je sentais toute mon impuissance à en jouir pleinement. Je pleurais presque de sentir autour de moi cette étrange chose invisible, impalpable, que je ne pouvais goûter de la langue, mais qui avait un goût et le pouvoir d’enivrer. Et cela s’incarnait dans un bouton de porcelaine et lui donnait ainsi une âme et une vertu de talisman.", "ar": "انتظرت على السدة حتى المساء. أتت أمي في الأخير، كان يبدو عليها التعب و تشكو من صداع عنيف. من حسن حظي، كانت حصص الحمام هذه نادرة جدا. لم تكن أمي تريد أن تزعج نفسها بالطفل الأخرق و الأرعن الذي كنت عليه. خلال غيابها، كنت أستسلم لنزواتي. كنت أجري في الدرب حافي القدمين، مقلدا خطوات الأحصنة الإيقاعية، أصهل بفخر و أقوم برفسات. أحيانا، أفرغ ببساطة علبة العجائب خاصتي أرضا و أحصي كنوزي. كان زر بسيط من الخزف الصيني يجعل حواسي ترقص. عندما نظرت إليه مطولا، كنت ألمس المادة بأصابعي باحترام. لكن كان في هذا الشيء عنصر لا يمكن إدراكه لا بالعينين ولا بالأصابع، جمال غامض لا يمكن وصفه. كان يفتنني، كنت أحس بكامل عجزي و أنا أتمتع به بلا تحفظ. كنت أبكي تقريبا من الإحساس حولي بذلك الشيء الغريب الخفي، الغير ملموس، الذي لم أكن أستطيع تذوقه بلساني، و لكن الذي كان له مذاق و قدرة الإسكار. و كان ذلك يتجسد في زر من الخزف الصيني و يعطيه بهذا روح و فضيلة تعويذة."}, {"fr": "Dans la Boîte à Merveilles il y avait une foule d’objets hétéroclites qui, pour moi seul, avaient un sens: des boules de verre, des anneaux de cuivre, un minuscule cadenas sans clef, des clous à tête dorée, des en- criers vides, des boutons décorés, des boutons sans décor. Il y en avait en matière transparente, en métal, en nacre. Chacun de ces objets me parlait son langage. C’étaient là mes seuls amis. Bien sûr, j’avais des relations dans le monde de la légende avec des princes très vaillants et des géants au cœur tendre, mais ils habitaient les recoins cachés de mon imagination. Quant à mes boules de verre, mes boutons et mes clous, ils étaient là, à chaque instant, dans leur boîte rectangulaire, prête à me porter secours dans mes heures de chagrin. Le lendemain du bain, ma mère ne manquait pas de raconter la séance à toute la maison, avec des commentaires détaillés où abondaient les traits pittoresques et les anecdotes. Elle mimait les gestes de telle chérifa connue dans le quartier, la démarche de telle voisine qu’elle n’aimait pas, parlait avec éloge de la caissière ou se révoltait contre les masseuses, ces entremetteuses, mères des calamités, qui escroquaient les clientes sans leur apporter la moindre goutte d’eau. Le bain maure était naturellement le lieu des potins et des commérages. On y faisait connaissance avec des femmes qui n’habitaient pas le quartier. On y allait autant pour se purifier que pour se tenir au courant de ce qui se faisait, de ce qui se disait. Il arrivait qu’une femme chantât un couplet et le couplet faisait ainsi son entrée dans le quartier. Deux ou trois fois, ma mère assista à de vrais crêpages de chignons. De telles scènes donnaient matière à des galas de comédie. Pendant une semaine, ma mère mimait devant les femmes de la maison, les amies de passage et les voisines la dispute et ses phases multiples. On avait droit à un prologue suivi de la présentation des personnages, chacun avec sa silhouette particulière, ses difformités physiques, les caractéristiques de sa voix, de ses gestes et de son regard. On voyait naître le drame, on le voyait se développer, atteindre son paroxysme et finir dans les embrassades ou dans les larmes.", "ar": "في علبة العجائب، كان هناك مجموعة من الأشياء متعددة العناصر التي، بالنسبة لي وحدي، كان لها معنى: كرات زجاجية، أزرار مزينة، حلقات نحاسية، قفل صغير بدون مفتاح، مسامير ذات رأس مذهب، محبرات فارغة، أزرار مزينة، أزرار بدون زينة. كانت هناك من هي مصنوعة من مادة شفافة، من معدن أو من صدف. كل واحد من هذه الأشياء كان يحدثني بلغته. كان أولئك هم أصدقائي الوحيدون. بالطبع، كانت لدي علاقات في عالم الأسطورة مع أمراء شجعان جدا و عمالقة بقلب حنون، 6 لكن كانوا يسكنون في الزوايا المخفية من مخيلتي. بالنسبة لكراتي الزجاجية، أزراري و مساميري، كانوا هناك، في كل لحظة، في علبتهم المستطيلة، جاهزين لإنقاذي في ساعات الحزن. في اليوم التالي للحمام، لم يكن يفوت أمي أن تحكي الحصة لجميع من في المنزل، بتعاليق مفصلة تكثر فيها المواقف و النوادر التي تستحق الإعجاب. كانت تقلد حركات شريفة تلك المعروفة في الحي و تصرفات تلك الجارة التي لم تكن تعجبها، كانت تصف ثناء الصرافة أو غضب المدلكات، أولئك السمسارات، أمهات المصائب، اللواتي كن يخدعن الزبونات دون أن يحضرن لهن قطرة ماء واحدة. بطبيعة الحال، كان الحمام العمومي مكانا للغيبة و النميمة. كنا نتعرف على نساء لا يسكن في الحي، بقدر ما كنا نذهب كثيرا لنستحم كنا نذهب للبقاء على اطلاع بما يجري، بما يقال، كان يحدث أحيانا بأن تغني امرأة مقطعا موسيقيا و هكذا ينتشر هذا المقطع في حينا. لقد شهدت أمي مرتين أو ثلاثا معركات نساء حقيقية. كانت مثل تلك المواقف تعطي مجالا لاحتفالات كوميدية. طوال أسبوع،كانت أمي تظل تمثل أمام نساء المنزل، صديقات الطريق و الجارات، الشجار بمراحله المتعددة. لقد كنا نحظى بتمهيد متبوع بتقديم للشخصيات، كل واحدة بقوامها الخاص، تشوهات جسمها، خصائص صوتها، حركاتها و نظرتها. كنا نرى ولادة الشجار، نشهد تطوره، بلوغه مرحلة الذروة و انتهاءه بالأحضان أو الدموع."}, {"fr": "Ma mère remportait auprès des voisines un gros succès. Je n’aimais pas beaucoup ces sortes d’exhibi- tions. L’excès de gaîté de ma mère était pour moi lié à de fâcheuses conséquences. Le matin, débordante d’enthousiasme, elle ne manquait jamais, le soir, de trouver quelque motif de querelle ou de pleurs. Mon père rentrait toujours tard; il nous trouvait rarement de bonne humeur. Il subissait presque toujours le récit d’un événement que ma mère se plaisait à peindre avec les couleurs les plus sombres. Quelquefois un incident de mince importance prenait des proportions de catastrophe. Ainsi en fut-il quand Rahma eut l’idée néfaste de faire sa lessive un lundi. Il était établi que ce jour-là ap- partenait exc1usivement à ma mère. De bonne heure, elle occupait le patio, 1’encombrait d’auges de bois, de bidons qui servaient de lessiveuses, de seaux pour le rinçage et de paquets de linge sale. A peine vêtue d’un séroual et d’un vieux caftan déchiré, elle s’affairait autour d’un feu improvisé, remuait le contenu du bidon à l’aide d’une longue canne, pestait contre le bois qui donnait plus de fumée que de chaleur, accusait les marchands de savon noir de l’avoir escroquée et appelait sur leurs têtes toutes sortes de malédictions. Le patio ne suffisait pas à son activité. Elle grimpait jusque sur la terrasse, tendait ses cordes, les soutenait à l’aide de perches de mûrier, redescendait brasser des nuages de mousse.", "ar": "كانت أمي تلقى نجاحا كبيرا لدى الجارات، لم يكن يعجبني كثيرا هذا النوع من العروض. كان إفراط أمي في البهجة بالنسبة لي مرتبطا بعواقب مؤسفة. في الصباح، مفعمة بالنشاط، لم يكن يفوتها، في المساء، أن تجد سببا للخصام أو البكاء. كان أبي يعود دائما متأخرا، كان نادرا ما يجدنا في مزاج جيد. كان في معظم الأحيان يتحمل قصة حدث كانت أمي تستمتع بطلائه بأدكن الألوان. في بعض الأحيان، كان حدث تافه يتحول إلى كارثة. هذا ما حدث عندما خطرت لرحمة فكرة الغسيل المشؤومة في يوم الإثنين. لقد كان من المتفق عليه أن هذا اليوم مخصص لأمي وحدها. في الصباح الباكر، كانت تحتل الفناء، تملؤه بمعالف خشبية، بأسقية كانت تستعملها 7 كطشوت، بدلاء للشطف و بحزم من الغسيل المتسخ. بالكاد تلبس سروال وقفطانا قديما و ممزقا، كانت تنشغل حول نار مرتجلة، تحرك محتوى السقاء بقصبة طويلة، تثور على الخشب الذي كان يعطي دخانا أكثر من الحرارة، تتهم بائعي الصابون الأسود بغشها و تلقي عليهم كل أنواع اللعنات."}, {"fr": "Ce jour-là ma mère m’expédiait à l’école avec, pour vêtement, une simple chemise sous ma djellaba. Le déjeuner était sacrifié. Je devais me contenter d’un quartier de pain enduit de beurre rance, accompagné de trois olives. Notre chambre même perdait son visage habituel. Les matelas gisaient là, sans couver- tures, les coussins n’avaient plus d’enveloppes et la fenêtre semblait nue sans son rideau semé de fleurettes rouges. La soirée était consacrée au pliage des vêtements. Ma mère prenait une chemise toute froissée et sentant le soleil, la déployait sur ses genoux, la regardait par transparence, la pliait, les manches à l’intérieur, avec application, presque avec gravité. Parfois, elle faisait une reprise. Elle n’aimait guère la couture et moi- même, je préférais la voir tirer sur ses cardes ou tourner son rouet. L’aiguille, instrument particulièrement citadin, représentait à mes yeux un symbole de mollesse. Il était de tradition dans notre famille que le métier féminin noble par excellence consistât à travailler la laine. Manier l’aiguille équivalait presque à un reniement. Nous étions Fassis par accident, mais nous restions fidèles à nos origines montagnardes de seigneurs paysans. Ma mère ne manquait jamais d’évoquer ces origines lors des querelles avec les voisines. Elle osa même soutenir devant Rahma que nous étions d’authentiques descendants du Prophète.", "ar": "لم يكن الفناء يكفي لنشاطها. كانت تصعد حتى السطح، تمد حبالها، تثبتها بالاستعانة بقصب التوت، تنزل ثانية لتمزج سحبا من الرغوة. في ذلك اليوم، كانت أمي ترسلني إلى الكتاب بقميص عادي تحت جلبابي كلباس. كان الغداء بسيطا. كان يجب علي أن أكتفي بربع من الخبز مدهون بزبدة زنخة، مرفوق بثلاثة زيتونات. حتى غرفتنا كانت تفقد مظهرها المعتاد. ترقد الأفرشة هناك بدون أغطية، لم يعد للوسائد أغلفة و كانت النافذة تبدو عارية بدون ستارتها المزينة بزهيرات صغيرة حمراء. كان المساء مخصصا لطي الملابس. كانت أمي تأخذ قميصا منكمشا جدا و تفوح منه رائحة الشمس، تبسطه على ركبتيها، تنظر إليه بإمعان، تطويه، الأكمام في الداخل، بإطباق، بضغط تقريبا. أحيانا، كانت تقوم بالغز ل. لم تكن تحب الخياطة كثيرا و حتى أنا كنت أفضل مشاهدتها تجر منادفها أو تدير مغزلها. الإبرة، آلة حضرية بشكل خاص، كانت تمثل في عيني رمزا للمهارة. لقد كان تقليدا في عائلتنا أن المهنة النسائية النبيلة بامتياز كانت تتجلى في غزل الصوف. كان استعمال الإبرة يعادل الإلحاد تقريبا. كنا فاسيين عن طريق حادث، لكن كنا نبقى أوفياء لأصولنا الجبلية للأسياد الفلاحين."}, {"fr": "- Il existe, dit-elle, des papiers pour le prouver, des papiers gardés précieusement par l’imam de la mosquée de notre petite ville. Qui es-tu, toi, femme d’un fabricant de charrues, sans extraction, pour oser mettre ton linge, plein de poux, près du mien fraîchement lavé ? Je sais ce que tu es, une mendiante d’entre les mendiantes, une domestique d’entre les domestiques, une va-nu-pieds, crottée et pouilleuse, une lécheuse de plats qui ne mange jamais à sa faim. Et ton mari ! Parle-moi de cet être difforme, à la barbe rongée de mites, qui sent l’écurie et brait comme un âne ! Que dis-tu ? En parler à ton mari ? Est- ce que moi, je crains ton mari ? Qu’il vienne ! Je lui montrerai de quoi peut être capable une femme de noble origine. Quant à toi, arrête tes piaillements et ramasse tes hardes. Toutes les voisines témoigneront en ma faveur. Tu m’as provoquée. Je ne suis pas une petite fille pour me laisser insulter par une femme de ton espèce. De notre fenêtre du deuxième étage, pâle d’angoisse et de peur, je suivais la scène, alors que ma mémoire d’enfant enregistrait les phrases violentes.", "ar": "لم يكن يفوت أمي أبدا أن تذكر أصولها عند الشجار مع الجارات. لقد كانت تتجرأ حتى على أن تؤكد أمام رحمة أننا من أحفاد الرسول الأصليين. - كانت تقول: توجد أوراق لإثبات ذلك، أوراق محفوظة بعناية من طرف إمام مسجد مدينتنا الصغيرة. من تكونين أنتي، زوجة صانع محاريث، بدون حسب، لتجرئي على نشر غسيلك، المليء بالقمل، بجانب غسيلي الحديث التنظيف؟ أعرف من أنت، متسولة من المتسولات، خادمة من الخادمات، بائسة، مجرد متغوطة و مقملة، لاحسة أطباق لا تأكل حتى الشبع أبدا. و زوجك! حدثيني عن هذا الكائن الممسوخ، ذو اللحية التي نخرها العث، الذي تفوح منه رائحة الزريبة و ينهق كالحمار! ماذا تقولين؟ 8 سأخبر زوجي؟ هل أنا أخشى زوجك؟ فليأتي! سأريه ما تستطيع امرأة نبيلة الأصول فعله. أما بالنسبة لك، كفي عن الصراخ و اجمعي حبالك. ستشهد جميع الجارات لصالحي. لقد استفزيتني. لست فتاة صغيرة لأتعرض للإهانة من طرف امرأة مثلك. من نافذتنا في الطابق الثاني، كنت أتابع المشهد و أنا شاحب من الفزع و الخوف، بينما كانت ذاكرتي الطفولية تسجل الجمل العنيفة."}, {"fr": "Le soir, tout abruti de sommeil, j’entendis mon père monter l’escalier. Il entra selon son habitude, se dirigea vers son matelas posé à même le sol. Ma mère prépara le souper, posa la table ronde, le plat de ragoût et le pain. On sentait qu’elle boudait. Mon père se mit à manger sans poser de questions. Ma mère boudait toujours. Puis elle éleva brusque- ment la voix et dit :", "ar": "في المساء، و النعاس يثقلني، سمعت أبي يصعد الدرج. دخل كما هي عادته، اتجه نحو فراشه الموضوع مباشرة على الأرض. حضرت أمي العشاء، وضعت الطاولة المستديرة، طبق اليخنة و الخبز. كنا نحس بأنها تحرد. بدأ أبي بالأكل دون طرح أسئلة. كانت أمي لا تزال تحرد. ثم رفعت صوتها بشكل مفاجئ و قالت:"}, {"fr": "- Cela ne te fait rien à toi, qu’on nous traîne dans boue, qu’on nous insulte, qu’on in- sulte nos nobles origines, nos ancêtres qui faisaient trembler les tribus ! Cela ne te fait rien que les gens de basse extraction tentent de souiller, par des paroles inconvenantes, notre fa- mille qui compte parmi ses morts des hommes courageux, des chefs, des saints et des savants ! Toujours silencieux, mon père continuait à manger.", "ar": "- ألا يزعجك هذا، عندما يتم اغتيابنا، شتمنا، شتم أصولنا الشريفة، أجدادنا الذين كانوا يجعلون القبائل ترتجف! ألا يزعجك أن يحاول أناس من طبقة منح طة تلطيخ، بكلام غير لائق، عائلتنا التي تشمل بين أمواتها رجالا شجعنا، زعماء، قديسين و علماء! كان أبي يتابع الأكل دون أن ينطق بكلمة واحدة. أعادت أمي:"}, {"fr": "Ma mère recommença : - Oui, tout cela ne te fait rien. Que ta femme subisse tous les affronts, ton appétit n’en est pas affecté et tu manges comme à l’ordinaire. Moi, j’ai tellement de peine sur le cœur que je ne mangerai plus jamais de ma vie. Ma mère, se cachant le visage dans ses deux mains, poussa un long sanglot et se mit à pleurer à chaudes larmes. Elle gémissait, se lamentait, se donnait de grandes claques sur les cuisses, chan- tait sur un air monotone et combien triste tous les malheurs qui l’avaient frappée. Elle énumé- rait les insultes qu’elle avait reçues, les épithètes dont on l’avait gratifiée, recommençait inta- rissablement le panégyrique de ses ancêtres qui, par la même occasion, se trouvaient offensés. Mon père, rassasié, but une gorgée d’eau, s’essuya la bouche, tira à lui un coussin pour s’accouder et demanda : - Avec qui t’es-tu encore disputée ?", "ar": "- أجل، كل هذا لا يزعجك. أن تتعرض زوجتك لكل الشتائم، لم تتأثر شهيتك و تأكل كما هي عادتك. أنا، أشعر بالكثير من وجع القلب حتى أنني لن آكل مجددا في حياتي. أطلقت أمي عويلا طويلا و هي تخفي وجهها بيديها ثم أجهشت بالبكاء بدموع حارة. كانت تنتحب، تتأسف، تضرب فخديها بشدة، تغني بإيقاع رتيب و حزين جدا كل المآسي التي أصابتها. كانت تحصي كل الشتائم التي تلقتها، النعوت التي تم وصفها بها. تكرر بدون توقف الثناء على أسلافها الذين تمت الإساءة لهم بنفس المناسبة. بعد أن شبع أبي، شرب رشفة ماء، مسح فمه، سحب وسادة ليتكئ عليها و سأل:"}, {"fr": "La phrase eut sur ma mère un effet magique. Elle cessa de pleurer, releva la tête et, avec une explosion de fureur, s’adressa à mon père :", "ar": "- مع من تشاجرتي ثانية؟ 9 كان للجملة أثر سحري على أمي. توقفت عن البكاء، رفعت رأسها و خاطبت أبي بموجة من السخط:"}, {"fr": "- Mais avec la gueuse du premier étage, la femme du fabricant de charrues ! Cette dégoû- tante créature a souillé mon linge propre avec ses guenilles qui sentent l’étable. Elle ne se lave ja- mais d’ordinaire, elle garde ses vêtements trois mois, mais pour provoquer une querelle, elle choisit le lundi, mon jour de lessive, pour sortir ses haillons. Tu connais ma patience, je cherche toujours à aplanir les difficultés, je ne me départis jamais de ma courtoisie coutumière ; je tiens cela de ma fa- mille, nous sommes tous polis. Les gens qui nous provoquent par des paroles grossières perdent leur temps. Nous savons conserver notre calme et garder notre dignité. Il a fallu cette pouilleuse ... La voix de Rahma troua la nuit.", "ar": "- لكن مع ساقطة الطابق الأول، زوجة صانع المحاريث! لطخت هذه المخلوقة المقرفة غسيلي بخرقها التي تفوح منها رائحة الزريبة. إنها لا تستحم عادة، ترتدي ملابسها لمدة ثلاثة أشهر، لكن لتفتعل شجارا، اختارت الإثنين، يوم غسيلي، لتخرج خرقها. أنت تعرف صبري، دائما أحاول تبسيط المشاكل، لا أفقد أدبي التقليدي أبدا؛ لقد ورثت هذا عن عائلتي، كلنا مؤدبون، إن الناس الذين يستفزوننا بكلماتهم الفظة يضيعون وقتهم فقط. نعرف كيف نحافظ على هدوئنا و نصون كرامتنا. كان لا بد لهذه المقملة ... انبثق صوت رحمة في الظلام. - مقملة! أنا! هل تسمعون، يا أمة المسلمين؟"}, {"fr": "- Pouilleuse ! Moi ! Entendez-vous, peuple des Musulmans ?", "ar": "لم يكفها النهار، إن الرجال موجودون الآن في البيت ويستطيعون أن يشهدوا أمام الله من منا تعدى حسن الجوار."}, {"fr": "La journée ne lui a pas suffi, les hommes sont maintenant dans la maison et pour- ront témoigner devant Dieu qui de nous deux a dépassé les limites des convenances. Ce qui se passa après ne peut être décrit par des mots. Ce furent d’abord des cris aigus et prolon- gés, des vociférations, des sons sans suite et sans signification. Chacune des antagonistes, penchée hors de sa fenêtre, gesticulait dans le vide, crachait des injures que personne ne comprenait, s’arra- chait les cheveux. Possédées du démon de la danse, elles faisaient d’étranges contorsions. Voisins et voisines sortirent de leurs chambres et mêlèrent leurs cris aux cris des furies. Les hommes, de leurs voix graves, les exhortaient au calme, insistaient pour qu’elles maudissent solennellement Sa- tan, mais ces sages conseils les excitaient davantage. Le bruit devint intolérable. C’était une tem- pête, un tremblement de terre, le déchaînement des forces obscures, l’écroulement du monde. Je n’en pouvais plus. Mes oreilles étaient au supplice, mon cœur dans ma poitrine heurtait avec force les parois de sa cage. Les sanglots m’étouffèrent et j’écroulai aux pieds de ma mère, sans connaissance.", "ar": "ما حدث بعد ذلك لا يمكن وصفه بالكلمات، في البدء كانت هناك صرخات حادة و مطولة، صياحات، أصوات متقطعة. كانت كل واحدة من الغريمتين، تطل من نافذتها، تلوح في الفراغ، تقول شتائم لا يفهمها أحد و تنتف شعرها. مسكونتين بشيطان الرقص، كانتا تقومان بالتوائات غريبة. خرج الجيران و الجارات من غرفهم و ضموا أصواتهم إلى أصوات الجنيتين. الرجال، بأصواتهم الخشنة، كانوا يحثونهما على الهدوء، كانوا يصرون على أن تلعنا الشيطان بشدة، لكن هاته النصائح الحكيمة كانت تزيد من غضبهن. أصبح الضجيج لا يحتمل. لقد كانت عاصفة، زلزالا، ثورانا للقوى الخفية، انهيارا للعالم. لم أكن أستطيع التحمل أكثر. كانت أذناي في عذاب، كان قلبي داخل صدري يلطم بقوة جدران قفصه. خنقني النحيب و انهرت على قدمي أمي، بدون وعي. 10"}]}, {"fr_title": "Chapitre II", "ar_title": "الفصل 2", "segs": [{"fr": "Le MARDI, jour néfaste pour les élèves du Msid, me laisse dans la bouche un goût d’amertume. Tous les mardis sont pour moi couleur de cendre. Il faisait froid, ma nuit avait été peuplée de cauchemars. Des femmes échevelées menaçaient de me cre- ver les yeux, m’envoyaient au visage les pires injures. Parfois, l’une d’elles me balançait à travers la fenêtre et je m’enfonçais lourdement dans le vide. Je criai. Une main, combien douce, se posa sur mon front. Le matin, je me rendis au Msid selon mon habitude. Le fqih avait son regard de tous les mardis. Se yeux n’étaient perméables à aucune pitié. Je décrochai ma planchette et me mis à ânonner les deux ou trois versets qui y étaient écrits.", "ar": "الثلاثاء، يوم مشئوم بالنسبة لتلاميذ المسيد، يترك في فمي مذاقا من المرارة، كانت كل أيام الثلاثاء لها لون الرماد بالنسبة لي. كان الجو باردا، كانت ليلتي قد امتلأت بالكوابيس. كانت نساء شعثاوات تهددنني بفقء عيني، كن يمطرنني بأبشع الشتائم. أحيانا، كانت واحدة تلقي بي من النافذة و أسقط في الفراغ ببطء. كنت أصرخ، حطت يد ناعمة جدا على جبيني. في الصباح، ذهبت إلى المسيد كما هي عادتي، كانت للفقيه نظرته المألوفة ككل أيام الثلاثاء. لم تكن عيناه نفيذتين لأية شفقة. تناولت لوحي و بدأت بتلاوة الآيتين أو الثلاثة التي كانت مكتوبة فيه."}, {"fr": "A six ans, j’avais déjà conscience de l’hostilité du monde et de ma fragilité. Je connaissais la peur, je connaissais la souffrance de la chair au contact de la baguette de cognassier. Mon petit corps tremblait dans ses vêtements trop minces. J’appréhendais le soir consacré aux révisions. Je devais, selon la coutume, réciter les quelques chapitres du Coran que j’avais appris depuis mon entrée à l’école. A l’heure du déjeuner, le maître me fit signe de partir. J’accrochai ma planchette. J’enfilai mes babouches qui m’attendaient à la porte du Msid et je traversai la rue. Ma mère me reçut assez froidement. Elle souffrait d’une terrible migraine. Pour enrayer le mal, elle avait les tempes garnies de rondelles de papier copieusement enduites de colle de farine. Le déjeuner fut improvisé et la bouilloire sur son brasero entama timidement sa chanson. Lalla Aïcha, une ancienne voisine, vint nous rendre visite. Ma mère la reçut en se plaignant de ses maux tant physiques que moraux. Elle affectait une voix faible de convalescente, s’étendait sur les souffrances de telle partie de son corps, serrait violemment des deux mains sa tête empaquetée dans un foulard. Lalla Aïcha lui prodigua toutes sortes de conseils, lui indiqua un fqih dans un quartier éloigné, dont les talismans faisaient miracle. Je me tenais timide et silencieux dans mon coin. La visiteuse remar- qua la pâleur de mon visage.", "ar": "في سن السادسة، كان لدي وعي مسبق بقساوة العالم و بضعفي، كنت أعرف الخوف، كنت أعرف الألم البدني الذي تسببه عصا السفرجل. كان جسمي الصغير يرتجف داخل ملابسي الخفيفة جدا. كنت أعتبر مسبقا المساء كوقت مخصص للمراجعة. كان يجب علي حسب العادة، أن أتلو بعض الأحزاب من القرآن التي حفظتها منذ بداية الموسم الدراسي. في وقت الغداء، أشار المعلم إلي بالرحيل. علقت لوحي، لبست بلغتي التي كانت تنتظرني عند باب المسيد و عبرت الشارع. استقبلتني أمي ببرودة. كانت تعاني من شقيقة فظيعة. لتسكين الألم، كان صدغاها مغطيين بدوائر من ورق أزرق مطلي بوفرة بصمغ الدقيق. كان الغداء مرتجلا، و بدأ المرجل يصفر بصوت ضعيف على الموقد. أتت لزيارتنا لالة عيشة، جارة قديمة، استقبلتها أمي و هي تشتكي من آلامها المادية و المعنوية. كانت تتكلم بصوت النقاهة الضعيف، تطيل في وصف ذلك الجزء من الجسم، تمسك بعنف رأسها المحزوم بمنديل بكلتا يديها. تملقتها لالة عيشة بمختلف أنواع النصائح، وصفت لها فقيها كانت تعويذاته تحدث المعجزات لكنه كان يقع في منطقة نائية. كنت أجلس في ركني بخجل و صمت.لاحظت الزائرة امتقاع وجهي."}, {"fr": "- Qu’a-t-il ton fils ? demanda-t-elle.", "ar": "- سألت: ما به ابنك؟"}, {"fr": "Et ma mère de répondre :", "ar": "و أجابت أمي:"}, {"fr": "- Les yeux du monde sont si mauvais, le regard des envieux a éteint l’éclat de ce visage qui évoquait un bouquet de roses. Te souviens-tu de ses joues qui suaient le carmin ? et de ses yeux aux longs cils, noirs comme les ailes du corbeau ? Dieu est mon mandataire, sa vengeance sera terrible. - Je peux te donner un conseil; dit Lalla Aïcha : montons tous les trois cet après-midi à Sidi Ali Boughaleb. Cet enfant ne pourra pas supporter le Msid; si tu lui faisais boire de l’eau du sanctuaire, il retrouverait sa gaîté et sa force. Ma mère hésitait encore. Pour la convaincre Lalla Aïcha parla longuement de ses douleurs de jointures, de ses jambes qui ne lui obéissaient plus, de ses mains lourdes comme du plomb, des difficultés qu’elle éprouvait à se retourner dans son lit et des nuits blanches qu’elle avait passées à gémir comme Job sur son grabat. Grâce à Sidi Ali Boughaleb, patron des médecins et des barbiers, ses douleurs ont disparu.", "ar": "11 - إن عيون الناس سيئة جدا، أطفأت نظرة الحساد بريق هذا الوجه الذي كان يشبه باقة الورود. هل تذكرين خديه اللذين كانا بلون القرمز؟ و عينيه ذوات الرموش الطويلة السوداء كأجنحة الغراب؟ حسبي الله، سيكون انتقامه رهيبا. - قالت لالة عيشة: أستطيع أن أعطيك نصيحة، لنذهب ثلاثتنا إلى سيدي علي بوغالب هذا العصر. لن يستطيع هذا الطفل الذهاب إلى المسيد؛ إن جعلته يشرب ماء المزار، سيستعيد بهجته و قوته. كانت أمي لا تزال مترددة، لإقناعها، تكلمت لالة عيشة مطولا عن آلام مفاصلها، عن ساقيها اللتين لم تعودا تستجيبان لها، عن يديها الثقيلتين كالرصاص، عن الصعوبات التي تواجهها عندما تتقلب في فراشها و عن ليالي الأرق التي قضتها و هي تئن مثل أيوب على فراشه. بفضل سيدي علي بوغالب، سيد الأطباء و الفقهاء. اختفت أوجاعها."}, {"fr": "- Lalla Zoubida, c’est Dieu qui m’envoie pour te secourir, t’indiquer la voie de la guéri- son, je vous aime, toi et ton fils, je ne retrouverai jamais le goût ni de la nourriture, ni de la boisson si je vous abandonne à vos souffrances. Ma mère promit de visiter Sidi Ali Bou- ghaleb et de m’emmener cet après-midi même. Lalla Aïcha soupira de satisfaction. Les deux femmes restèrent à bavarder encore longtemps. Ma mère monta sur la terrasse, redescendit avec une brassée de plantes aromatiques qu’elle cultivait dans des pots ébréchés et de vieilles marmites d’émail. Elle parfuma son thé de verveine et de sauge, proposa à Lalla Aïcha une petite branche d’absinthe à mettre dans son verre. Elle refusa poliment, déclara que ce thé était déjà un véritable printemps. Je mis dans mon verre toutes sortes de plantes aromatiques. Je les laissai longtemps macérer. Mon thé devint amer, mais je savais que cette boisson soulageait mes fréquentes coliques. Ma mère se leva pour se préparer. Elle changea de chemise et de mansouria, chercha au fond du coffre une vieille ceinture brodée d’un vert passé, trouva un morceau de cotonnade blanche qui lui servait de voile, se drapa dignement dans son haïk fraîchement lavé.", "ar": "- لالة زبيدة، إن الله هو الذي أرسلني لأنجدك، لأدلك على طريق الشفاء. أنا أحبك، أنت و ابنك، لن أجد لذة في الطعام، و لا في الشراب، إن أنا تخليت عنك في عذابك. وعدت أمي بزيارة سيدي علي بوغالب و باصطحابي إليه عصر ذلك اليوم نفسه. تنفست لالة عيشة الصعداء. بقيت المرأتان تتحدثان لمدة طويلة بعد ذلك. صعدت أمي إلى السطح، عادت و معها باقة من النباتات العطرة التي كانت تزرعها في أصص مشقوقة و طناجر من المينا. عطرت شايها بعشبة رعي الحمام و القصعين. اقترحت على لالة عيشة غصنا صغيرا من الأفسنتين لتضعه في كأسها. رفضت بأدب، قالت بأن هذا الشاي كان لذيذا بما فيه الكفاية، وضعت في كأسي كل أنواع الأعشاب العطرة. تركته يتشبع بها لمدة طويلة. أصبح شايي مرا، و لكن كنت أعلم أن هذا المشروب يريح إسهالاتي المتكررة. نهضت أمي لتستعد. غيرت قميصها و منصوريتها، بحثت في قاع الصندوق عن حزام قديم مطرز بلون أخضر باهت، وجدت قطعة قماش بيضاء تستعملها كحجاب، لفت نفسها بشكل لائق بحايكها الحديث الغسيل. لقد كان يوما عظيما في الحقيقة، لبست جلبابي الأبيض بدل القديم الذي أرتديه كل يوم، جلباب رمادي صعب الوصف، ملطخ ببقع الحبر و دوائر الدسم."}, {"fr": "C’était, en vérité, un grand jour. J’eus droit à ma djellaba blanche et je dus quitter celle de tous les jours, une djellaba grise, d’un gris indéfinissable, constellée de taches d’encre et de ronds de graisse. Lalla Aïcha éprouva toutes sortes de difficultés à s’arracher du matelas où elle gisait. J’ai gardé un vif souvenir de cette femme, plus large que haute, avec une tête qui reposait directement sur le tronc, des bras courts qui s’agitaient constamment. Son visage lisse et rond m’inspirait un certain dégoût. Je n’aimais pas qu’elle m’embrassât. Quand elle venait chez nous, ma mère m’obligeait à lui baiser la main parce qu’elle était chérifa, fille du Prophète, parce qu’elle avait connu la fortune et qu’elle était restée digne malgré les revers du sort. Une relation comme Lalla Aïcha flattait l’orgueil de ma mère.", "ar": "12 عانت لالة عيشة الأم ر ين في النهوض من الفراش الذي كانت ترقد عليه. بقيت لدي ذكرى حية عن هذه المرأة التي كان لها عرض يفوق طولها، رأس لصيق بجذعها، ذراعان قصيرتان تتحركان باستمرار. كان وجهها الأملس و الدائري يبعث في نوعا من الاشمئزاز. لم أكن أحب أن ت ق ب لني. عندما كانت تأتي لزيارتنا، كانت أمي تجبرني على تقبيل يدها لأنها كانت شريفة، ابنة الرسول، لأنها امتلكت الثروة و حافظت على وقارها رغم تقلبات القدر. كانت أمي تتشرف بمعرفة لالة عيشة. أخيرا، توجه الجميع إلى الدرج، ثم بلغنا الشارع بعد قليل."}, {"fr": "Enfin, tout le monde s’engagea dans l’escalier. Nous nous trouvâmes bientôt dans la rue. Les deux femmes marchaient à tout petits pas, se penchant parfois l’une sur l’autre pour se communiquer leurs impressions dans un chuchotement. A la maison, elles fai- saient trembler les murs en racontant les moindres futilités, tellement leurs cordes vocales étaient à toute épreuve ; elles devenaient, dans la rue, aphones et gentiment minaudières. Parfois je les devançais, mais elles me rattrapaient tous les trois pas pour me prodiguer des conseils de prudence et des recommandations. Je ne devais pas me frotter aux murs : les murs étaient si sales et j’avais ma superbe djellaba blanche, je devais me moucher souvent avec le beau mouchoir brodé pendu à mon cou, je devais de même m’écarter des ânes, ne jamais être derrière eux car ils pouvaient ruer et jamais devant car ils prenaient un malin plaisir à mordre les petits enfants. - Donne-moi la main, me disait ma mère.", "ar": "كانت المرأتان تمشيان بخطى صغيرة، تقتربان من بعضهما أحيانا لتتهامسا حول انطباعيهما. في المنزل، كانتا تزلزلان الجدران بقول أدنى التفاهات. بقدر ما كانت حبالهما الصوتية تعاني الأمرين في البيت كانتا تصبحان في الشارع صامتتين و لبقتين بلطف. أحيانا، كنت أتجاوزهما، لكنهما كانتا تلحقان بي كل ثلاثة خطوات لتزوداني بنصائح عن الحذر و توصيات. لم يكن يجب علي أن أحتك بالجدران: كانت الجدران متسخة جدا و كنت أرتدي جلبابي الأبيض الرائع، كان يجب علي أن أمسح أنفي دائما بمنديلي الجميل المطرز الذي كان معلقا في عنقي، كان يجب علي الابتعاد عن الحمير كذلك، لا يجب أن أتواجد وراءهم لأنهم يمكن أن يرفسوا ولا أمامهم لأنهم يستمتعون بأكل الأطفال الصغار. - كانت أمي تقول لي: أعطني يدك."}, {"fr": "Et cinq pas après : - Va devant, tu as la main toute moite. Je reprenais ma liberté mais pour un temps très court. Lalla Aïcha se proposait de me guider dans la cohue. Elle marchait lentement et tenait beaucoup de volume. Un embouteillage ne tardait pas à se former. Les passants nous lançaient toutes sortes de remarques dé- plaisantes mais finissaient par se porter à notre secours. Des bras inconnus me soulevaient du sol, me faisaient passer par-dessus les têtes et je me trouvais finalement dans un espace libre. J’attendais un bon moment avant de voir surgir de la foule les deux haïks immaculés. La scène se renouvela plusieurs fois durant ce voyage. Nous traversâmes des rues sans nom ni visage particuliers. J’étais attentif aux conseils de mes deux guides, je m’appliquais à me garer des ânes, butais inévitablement dans les genoux des pas- sants. Chaque fois que j’évitais un obstacle, il s’en présentait un autre. Nous arrivâmes enfin au cimetière qui s’étend aux abords de Sidi Ali Boughaleb. J’esquissai un timide pas d’allégresse.", "ar": "و بعد خمسة خطوات: - إمشي أمامي، إن يدك متعرقة جدا. كنت أستعيد حريتي و لكن لوقت قصير. اقترحت لالة عيشة أن ترشدني في الازدحام. كانت تمشي ببطء و تتخذ مساحة كبيرة. كان الازدحام يتكون سريعا. كان المارة يلقون علينا كل أنواع الملاحظات البغيضة و لكن سرعان ما يهبون لنجدتنا. كانت أذرع مجهولة ترفعني من الأرض، تمررني من فوق الرؤوس و كنت أجد نفسي أخيرا في مساحة فارغة. كنت أنتظر مدة لا بأس بها قبل أن أرى الحايكين الناصعين و هما يظهران من بين الحشد. كان هذا المشهد يتكرر عدة مرات خلال هذه الرحلة. عبرنا شوارع بلا اسم ولا شكل خاص. كنت منتبها لنصائح مرشدتي ، 13 كنت أجتهد لأبتعد عن الحمير، كنت أتعثر بركب المارة باستمرار. كلما كنت أجتنب حاجزا كان يظهر آخر. وصلنا أخيرا إلى المقبرة التي تمتد على مدخل سيدي علي بوغالب. بادرت بخطوة مرح خجولة."}, {"fr": "Les tombes couvertes de soucis rougeoyaient au soleil. Ça et là des marchands trônaient derrière leurs pyramides d’oranges. On entendait les coups de tambourin d’un chanteur populaire et la clochette du marchand d’eau. Sur la petite place, des campagnards vendaient du bois pour la lessive, des braseros de terre cuite, des plats pour cuire les galettes. Les éventaires des marchands de sucreries attiraient mon re- gard. On y voyait exposés des coqs et des poussins en sucre jaune ornementé de filets roses, des théières transparentes, de minuscules babouches et des soufflets. Ces objets magnifiques me rappelaient ma Boîte à Merveilles. Mon père m’en avait bien offert quelquefois, mais, avant d’arriver à la maison, s’émiettaient ou devenaient simplement gris et poussiéreux, indignes de figurer parmi mes trésors. Ils étaient beaux, là, au soleil, dans le bourdonnement de la foule. Le toit de tuiles vertes qui couvre le mausolée se dressait dans un tendre azur où batifolaient de nuages blancs et roses aux formes capricieuses. Sur les marches de l’entrée principale, des femmes, assises à même le sol, devisaient entre elles, mâchaient sous leur voile de la gomme parfumée, interpellaient leurs enfants qui jouaient dans la poussière. Elles se serrèrent pour nous laisser un étroit passage. Nous nous trouvâmes bientôt dans une cour qui me parut immense. Au centre trônaient quatre vais- seaux en terre cuite remplis d’eau. Ma mère trouva un gobelet et me fit boire. Elle se versa un peu de liquide dans le creux de la main, me passa les doigts sur le visage, les yeux, les jointures des mains et sur les chevilles. Tout en procédant à ce rituel, elle marmonnait de vagues prières, des invocations, me recommandait de rester tranquille, rappelait à Lalla Aïcha telle ou telle péripétie de notre promenade. Je subissais tout cela avec ma patience coutumière. Je me tortillais le cou pour regarder une armée de chats qui se livraient à une folle sarabande à l’intérieur de ce temple étrange. Au delà de cette cour s’ouvrait la Zaouia. De chaque côté d’une pièce carrée où se dressait le catafalque du Saint, deux portes conduisaient aux chambres des pèlerins. Des gens venus de loin, pour se débarrasser de leurs maux, vivaient là avec leurs enfants, attendant la guérison.", "ar": "كانت القبور المغطاة بالأذريون تحمر تحت ضوء الشمس. كان الباعة يقفون وراء أهرام البرتقال خاصتهم. كان يسمع صوت دف مغن شعبي و جرس بائع الماء. في مكان ضيق، كان قرويون يبيعون خشبا للغسيل، مجامر من الطين و أطباقا لطهي الحلويات، كانت صينيات بائعي السكاكر تجذب انتباهي. كانت تعرض ديكة و كتاكيت من سكر أصفر مزينة بخطوط وردية، أباريق شاي شفافة، بلاغي صغيرة و منافيخ. كانت هاته الأشياء الرائعة تذكرني بعلبة العجائب خاصتي. لقد أهداني أبي مثلها في بعض الأحيان، لكنها كانت تتفتت قبل الوصول إلى المنزل و تصبح ببساطة رمادية و مغبرة، لا تستحق أن توضع مع كنوزي. كانت تبدو جميلة، هناك، تحت أشعة الشمس، في ضجة الحشد. كان سقف القرميد الأخضر الذي يغطي الضريح ينبسط في سماء زرقاء كانت تلهو فيها سحب بيضاء و وردية بأشكال متغيرة. على درجات المدخل الرئيسي، كانت هناك نساء تجلسن على الأرض و تتحدثن مع بعضهن البعض، كن يمضغن علكة معطرة وراء حجابهن، ينادين على أطفالهن الذين يلعبون في التراب. كن يتزاحمن ليتركن لنا ممرا ضيقا. سرعان ما وجدنا أنفسنا في ساحة بدت لي واسعة جدا. كانت توجد في الوسط أربعة خوابي مليئة بالماء. وجدت أمي غرافا و سقتني، سكبت قليلا من السائل في قعر يدها، مررت يدها على وجهي، عيني، مفاصل يداي و كاحلاي. أثناء قيامها بهذا الطقس، كانت تتمتم بصلوات و دعوات غريبة، كانت توصيني بأن أبقى هادئا، كانت تذكر لالة عيشة بهذا الانقلاب أو ذاك خلال رحلتنا. كنت أتحمل كل ذلك بصبري المعتاد، كنت ألوي عنقي لأشاهد حشدا من القطط الذين كانوا يصدرون ضجيجا مزعجا داخل هذا المعبد الغريب. كانت توجد الزاوية في آخر تلك الساحة. من كل جانب في غرفة مربعة كان نعش الولي موضوعا فيها، كان هناك بابان يقودان إلى غرف الحجاج ، أناس قدموا من بعيد، ليتخلصوا من شرورهم، كانوا يعيشون هناك مع أطفالهم، منتظرين الشفاء."}, {"fr": "En arrivant devant le catafalque, Lalla Aïcha et mère se mirent à appeler à grands cris le saint à leur secours. L’une ignorant les paroles de l’autre, chacune lui exposait ses petites misères, frappait du plat de la main le bois du catafalque, gémissait, suppliait, vitupérait contre ses ennemis. Les voix mon- taient, les mains frappaient le bois du catafalque avec plus d’énergie et de passion. Un délire sacré, s’était emparé des deux femmes. Elles énuméraient leurs maux, exposaient leurs faiblesses, demandaient protection, réclamaient vengeance, avouaient impuretés, proclamaient la miséricorde de Dieu et la puis- sance de Sidi Ali Boughaleb, en appelaient à sa pitié. Épuisées par leur ferveur, elles s’arrêtèrent en- fin. La gardienne du mausolée vint les complimenter sur leur piété et joindre ses prières aux leurs. - Vos vœux seront exaucés et vos désirs comblés, dit-elle pour conclure. Dieu est généreux, il soulage les souffrances et panse toutes les blessures. Sa bonté s’étend à toutes les créatures. N’est-ce pas un signe de Sa Bonté de nous avoir envoyé des Prophètes pour détourner de la voie du mal et nous indiquer le che- min du Paradis ? C’est un effet de sa générosité nous avoir révélé par l’intermédiaire de Notre- Seigneur Mohammed (le salut et la paix soient sur lui) sa Parole très vénérée qui nous enseigne les vertus capitales : la charité, l’amour des parents, le bienfait envers toutes les créatures. Ceux qui ont pratiqué ces vertus dans toute leur intégrité deviennent les Amis de Dieu et intercèdent en notre faveur. Sidi Ali Bougha- leb figure parmi les plus dignes. Il aimait tous les êtres et affectionnait en particulier les chats. Nous en avons actuellement plus de cinquante. On nous les amène malades, galeux et efflanqués. Peu de temps suffit pour qu’ils retrouvent la santé et la joie. Pour plaire au Saint, nous devons les nourrir et les soigner. Ma mère fouillait dans ses vêtements. Elle ne tarda pas à sortir un mouchoir avec un gros nœud. Len- tement, elle le dénoua en s’aidant plusieurs fois de ses incisives. Lalla Aicha lui chuchota à l’oreille une phrase mystérieuse, ma mère hocha la tête et offrit à la Moqadma deux pièces d’un franc accompagnées de cette explication : - Voici pour moi et pour la chérifa qui m’accompagne.", "ar": "14 عند وقوفهما أمام النعش، بدأت أمي و لالة عيشة بالاستنجاد بالولي بأصوات مرتفعة. كانت كل واحدة تتجاهل كلام الأخرى. كانت كل واحدة تحكي له عن مآسيها الصغيرة، تضرب بيد مبسوطة خشب النعش، تئن، تتوسل، تؤنب أعداءها. كانت الأصوات ترتفع و الأيدي تضرب النعش بطاقة و شغف أكبرين، كان هذيان مقدس قد تمكن من المرأتين. كانتا تحصيان كل شرورهما، تظهران ضعفهما، تطلبان الحماية، تطالبان بالانتقام، تعترفان بذنوبهما، تقران برحمة الله و بقوة سيدي علي بوغالب و تلتمسان شفقته. توقفتا أخيرا بعد أن أنهكهما ورعهما. أتت حارسة الضريح لتثني على تقواهما و تضم صلواتها إلى خاصتهما. - قالت في الختام: أمنياتكما ستتحقق و رغباتكما ستنفذ. إن الله كريم، يسكن الآلام و يضمد جميع الإصابات. تبلغ طيبته جميع المخلوقات. أليست علامة على طيبته إرساله لنا رسلا ليصرفونا عن طريق الشر و يهدونا إلى طريق الجنة؟ إنه نتيجة لكرمه إرساله لنا بوساطة سيدنا محمد (صلى الله عليه و سلم) كلامه الجليل الذي يعلمنا الفضائل الأساسية: الصدقة، بر الوالدين، الإحسان إلى جميع المخلوقات. أولئك الذين قاموا بهذه الفضائل على أكمل وجه يصبحون أولياء الله و يشفعون لنا. يعتبر سيدي علي بوغالب من الوقر. لقد كان يحب جميع الكائنات و بالخصوص القطط. لدينا حاليا أكثر من خمسين واحدة منها. نحضرها مريضة، جرباء و هزيلة. يكفي قليل من الوقت لتستعيد صحتها و فرحها. يجب علينا إطعامها و معالجتها لنسعد الولي. كانت أمي تبحث في ملابسها. ثم ما لبثت أن أخرجت منديلا به عقدة كبيرة. فكته ببطء بالاستعانة بثنياتها عدة مرات. همست لالة عيشة بجملة غامضة في أذنها، هزت أمي رأسها و أعطت للمقدمة قطعتين من فئة فرنك واحد مصحوبتين بهذا التفسير:"}, {"fr": "La gardienne ouvrit ses deux mains, reçut le don et entama une longue oraison. Des femmes arrivèrent de l’extérieur et se joignirent à notre petit groupe pour bénéficier de ce moment de grâce, pour profiter de cette rosée spirituelle qui rafraîchit les cœurs. Lentement, je me glissai hors de cet essaim de femmes pour aller caresser un gros matou étalé de tout son long contre le mur. Il me regarda de ses yeux jaunes, ronronna et m’envoya un magistral coup de griffe. Le sang gicla. Ma main se mit à me cuire atrocement. Je poussai un cri. Ma mère se précipita, folle d’inquiétude, bousculant ses voisines, buttant dans son haïk qui traînait sur le sol.", "ar": "- هذا من أجلي و من أجل الشريفة التي ترافقني. فتحت الحارسة كلتا يديها، استلمت الهبة و باشرت ابتهالا طويلا. جاءت نساء لكي تنعمن بهذا السدى الروحي الذي يثلج القلوب. تسللت خارج حشد النساء هذا ببطء لكي أذهب و أداعب قطا كبيرا ممددا بشكل كلي أمام الحائط. نظر إلي بعينيه الصفراوتين، خرخر ثم أعطاني ضربة مخلب صارمة. تدفق الدم، بدأت يدي تؤلمني بشكل فظيع. أطلقت 15 صرخة. أسرعت أمي، شديدة القلق، دافعة جاراتها، متعثرة بحايكها الذي كان يجر في الأرض."}, {"fr": "La blessure me faisait mal et je hurlais sans discontinuer. Les femmes posaient des questions, s’api- toyaient, m’offraient une orange pour me consoler, m’appelaient leur petite rose, leur bouquet de jasmin, leur petit fromage blanc. Loin de me calmer, ce tourbillon de visages me donnait le vertige. Je sanglotais à fendre l’âme. Une main mouillée se posa sur ma figure, un torchon sécha mes larmes et l’écoulement de mon nez. Le froid de cette main calma mes pleurs, mais je ne cessai pas de hoqueter le long du chemin de retour.", "ar": "كانت الإصابة تؤلمني و كنت أصرخ باستمرار. كانت النساء تطرحن أسئلة، تتأسفن، تمنحنني برتقالة لمواساتي، تنادينني بوردتهن الصغيرة، باقة الياسمين خاصتهن، جبنتهن الصغيرة البيضاء. دون أن تهدئنني إطلاقا، كانت تلك الدوامة من الوجوه تشعرني بالدوار. كنت أنتحب لتشقق روحي، وضعت يد مبللة على وجهي، جففت فوطة دموعي و سيلان أنفي. أوقفت برودة هذه اليد دموعي. لكن لم أتوقف عن الفواق طوال طريق العودة."}, {"fr": "Ma mère me coucha dès l’arrivée à la maison.", "ar": "أنامتني أمي إبان وصولنا إلى البيت."}, {"fr": "Mon père se levait toujours le premier. Je voyais vaguement sa silhouette dans le demi-jour danser len- tement. Il s’enroulait autour des reins une corde de plusieurs coudées en poil de chèvre, qui lui servait de ceinture. Pour cela, il tournait sur lui-même, soulevait une jambe pour laisser passer la corde, soulevait l’autre alternativement, faisait des gestes larges de ses bras. Il procédait ensuite à l’arrangement de son turban, mettait sa djellaba et sortait en silence. Ma mère dormait.", "ar": "كان أبي دائما أول المستيقظين. لم أكن أرى بوضوح خياله مع أول خيوط الفجر و هو يتحرك ببطء. كان يلف حول الكلى خاصته حبلا من شعر الماعز، طوله عدة أذرع، كان يستعمله كحزام. لهذا كان يدور حول نفسه، يرفع ساقا ليمرر الحبل و يرفع الأخرى بالتناوب، يقوم بحركات واسعة بذراعيه. ثم ينتقل بعد ذلك لتنسيق عمامته، يلبس جلبابه و يخرج في هدوء. كانت أمي ما تزال نائمة."}, {"fr": "Ce matin, j’entendis mon père lui chuchoter :", "ar": "هذا الصباح، سمعت أبي يهمس لها:"}, {"fr": "- Ne l’envoie pas au Msid, il semble bien fatigué. Ma mère acquiesça et se replongea dans ses couvertures. Toute la maison dormait encore. Deux moineaux vinrent se poser sur le mur du patio, je les entendais sautiller d’un endroit à l’autre, frappant l’air de leurs courtes ailes. Ils discutaient avec passion et je comprenais leur langage. Ce fut un dialogue passionné : ils affirmèrent ceci avec conviction :", "ar": "- لا ترسليه إلى المسيد، يبدو متعبا جدا. وافقت أمي و غطست تحت أغطيتها مجددا. كان جميع من في المنزل ما يزالون نائمين. جاء دوريان و حطا على جدار الفناء، كنت أسمعهما يقفزان من مكان لآخر، ضاربين الهواء بأجنحتهما القصيرة، كانا يتكلمان بشغف و كنت أفهم لغتهما. كان حوارا محتدما: قالا هذا بثقة :"}, {"fr": "- J’aime les figues sèches.", "ar": "- أحب التين المجفف."}, {"fr": "- Pourquoi aimes-tu les figues sèches ?", "ar": "- لماذا تحب التين المجفف؟"}, {"fr": "- Tout le monde aime les figues sèches.", "ar": "- يحب الجميع التين المجفف."}, {"fr": "- Oui ! Oui ! Oui !", "ar": "- أجل! أجل! أجل!"}, {"fr": "- Tout le monde aime les figues sèches. Les figues sèches ! Les figues sèches ! Les figues sèches !", "ar": "- يحب الجميع التين المجفف. 16 - التين المجفف! - التين المجفف!"}, {"fr": "Les ailes froufroutèrent, les deux moineaux partirent continuer leur conversation sur d’autres toits. Je comprenais le langage des oiseaux et de bien d’autres bêtes encore, mais ils ne le savaient pas et s’en- fuyaient à mon approche. J’en éprouvais beaucoup de peine.", "ar": "- التين المجفف! حفت الأجنحة، رحل الدوريان ليكملا حديثهما على سطوح أخرى. كنت أفهم لغة الطيور و حيوانات أخرى أيضا، و لكنها لم تكن تعلم بذلك و كانت تفر عند اقترابي منها. كنت أحزن كثيرا لذلك."}, {"fr": "Des seaux entrechoqués cliquetèrent dans le patio. La chouafa se levait la première et c’était tant mieux ! Les ombres de la nuit s’attardaient encore à cette heure autour de la fontaine et du puits, dans les lieux d’aisances et dans l’immense débarras où chaque locataire à tour de rôle procédait à sa toilette. La chouafa connaissait les paroles efficaces qui rendaient ces ombres inoffensives. Chaque jeudi soir, elle brûlait des aromates, asp
