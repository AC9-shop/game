ذعورا خلف 142 السرير لأختبئ. كانت أطرافي ترتجف، أسناني تصطك داخل فمي، يتسلل البرد إلى صدري، يستقر فيه إلى الأبد. كانت أمي تتكلم. كانت تقول:"}, {"fr": "- Il va mieux. Tu remercieras le fqih de t’avoir envoyé prendre de ses nouvelles, tu lui diras qu’il n’est pas encore assez bien portant pour retourner au Msid. Va, mon fils, qu’Allah t’ouvre les portes de la connaissance.", "ar": "- لقد تحسنت حالته. أشكر الفقيه لأنه أرسلك لتطلع على أحواله، قل له بأنه لم يستعد كامل عافيته بعد للعودة إلى المسيد. إذهب، يا بني، فليفتح الله أبواب المعرفة في وجهك."}, {"fr": "La maison se replongea dans un silence épais. Ma mère appela: - Sidi Mohammed! Ya, Sidi Mohammed! Où es-tu?", "ar": "غرق البيت من جديد في صمت مدقع. نادت أمي: - سيدي محمد! يا، سيدي محمد! أين أنت؟"}, {"fr": "Je ne répondis pas.", "ar": "لم أجب. اغتاظت."}, {"fr": "Elle s’énerva. - Où es-tu, fils de chien ? Ne peux-tu plus répondre? Incapable d’ouvrir la bouche, j’opposai à ces insultes un mutisme offensant.", "ar": "- أين أنت، يا ابن الكلب؟ ألم تعد تستطيع الرد؟ عاجزا عن فتح فمي، واجهت هذه الشتائم بصمت مهين."}, {"fr": "Elle se lamenta, prit à témoin de son infortune le ciel, la maison, la noble communauté islamique.", "ar": "ناحت، أشهدت الله، البيت و الأمة الإسلامية على مصيبتها."}, {"fr": "- Malheur ! Malheur ! Être abandonnée de son mari et vivre avec un fils affublé d’une tête de mule est un si triste sort qu’on n’oserait pas le souhaiter à son ennemi, fût-il un Juif ou un Nazaréen! Dieu! Écoute mes pleurs! Exauce mes prières.", "ar": "- يا ويلتاه! يا ويلتاه! إن ترك المرء من طرف زوجه و العيش مع طفل عنيد جدا لقدر تعيس لدرجة أنه لا يمكن تمنيه حتى للعدو، سواء كان يهوديا أو نصرانيا! يا رب! إسمع بكائي! حقق رجائي."}, {"fr": "La porte du ciel devait être grande ouverte. Zineb, partie faire une commission, revint toue essoufflée. Tout le monde l’entendit crier de la ruelle. - Mère Zoubida ! Mère Zoubida ! Je t’apporte une bonne nouvelle, une bonne nouvelle!", "ar": "لابد من أن باب السماء كان مفتوحا على مصراعيه. عادت زينب، التي كانت قد ذهبت للتسوق، و هي تلهث. سمعها الجميع و هي تصرخ من الزقاق. - أمي زبيدة! أمي زبيدة! أحمل لك خبرا سارا، خبرا سارا!"}, {"fr": "Une bonne nouvelle?", "ar": "خبرا سارا؟"}, {"fr": "Ma mère s’arrêta de vitupérer contre moi. Zineb, suffoquée par l’émotion, se planta au milieu du pa- tio, tenta sans y parvenir d’expliquer ce dont il s’agissait. Personne ne comprit le motif de son excitation. Les femmes avaient abandonné leur ouvrage. Elles regardaient qui par une lucarne, qui par une fenêtre, Zineb gesticuler au milieu de la cour. Je quittai ma cachette. Zineb s’immobilisa épuisée. Toutes les femmes se mirent à l’interroger. Elle releva la tête en direction de notre chambre et parvint Il dire enfin:", "ar": "توقفت أمي عن تأنيبي. وقفت زينب، التي كانت تختنق من الانفعال، وسط الفناء، حاولت أن تفسر الموضوع لكنها لم تتمكن من ذلك. لم يكن أحد يفهم سبب إثارتها. كانت النساء قد تركن أعمالهن. كن ينظرن، واحدة من كوة و أخرى من نافذة، إلى زينب و هي تلوح وسط البهو. خرجت من مخبئي. توقفت زينب عن الحركة منهكة. بدأت كل النساء بسؤالها. رفعت رأسها في اتجاه غرفتنا و تمكنت أخيرا من قول:"}, {"fr": "- J’ai vu dans la rue ... le Maâlem ... Abdeslem ! Un silence incrédule accueillit cette déclaration. Rahma le rompit:", "ar": "- لقد رأيت في الشارع... المعلم... عبد السلام! استقبل صمت مشكك هذا الاعتراف. 143 كسرته رحمة:"}, {"fr": "- Que racontes-tu, petite menteuse? -J’ai vu Ba Abdeslem non loin du marchand de farine, près de la mosquée du bigaradier. Il tient deux poulets à la main. Je l’ai laissé en train de bavarder avec un campagnard qui a une figure longue comme une gargoulette.", "ar": "- ما الذي تتفوهين به أيتها الكاذبة الشقية؟ - لقد رأيت با عبد السلام على مقربة من بائع الدقيق، قرب مسجد النارنج. يحمل دجاجتين في يده. لقد تركته و هو يتحدث مع ريفي وجهه طويل مثل النعارة."}, {"fr": "Kanza de sa chambre dit:", "ar": "قالت كنزة من غرفتها:"}, {"fr": "- Si ce que raconte Zineb est vrai, nous en sommes toutes très heureuses et nous souhaitons au Maâlem Abdeslem bon retour.", "ar": "- إذا كان ما تقوله زينب صحيحا، فنحن جميعنا سعيدات جدا لذلك و نتمنى للمعلم عبد السلام عودا حميدا."}, {"fr": "Ma mère ne disait rien. Elle me rejoignit dans notre chambre et restait au milieu de la pièce les bras ballants. Elle avait quitté la terre, elle nageait dans la joie au point de perdre l’usage de sa langue.", "ar": "لم تكن أمي تقول شيئا. التحقت بي في غرفتنا و بقيت في وسط الحجرة بذراعين متدليتين. كانت قد غادرت الأرض، كانت تسبح في الفرح لدرجة أنها لم تعد تعرف كيف تستخدم لسانها."}, {"fr": "Je me précipitai vers l’escalier. Je ne savais pas au juste où je me dirigeais. J’avais parcouru une dizaine de marches lorsque la voix de mon père monta du rez-de-chaussée. - N’y a-t-il personne, puis-je passer? Le timbre n’en avait pas changé.", "ar": "أسرعت إلى الدرج. لم أكن أعرف إلى أين كنت ذاهبا بالتحديد. كنت قد نزلت عشرة درجات عندما سمع صوت أبي في الطابق الأرضي. - ألا يوجد أحد؟ هل أستطيع الدخول؟ لم يكن صوته قد تغير."}, {"fr": "- Passe, Maâlem Abdeslem. Aujourd’hui est un jour béni. Dieu t’a rendu aux tiens, qu’il en soit loué, répondit Kanza la voyante.", "ar": "- أجابت كنزة العرافة: أدخل، أيها المعلم عبد السلام. إنه يوم مبارك. لقد أعادك الله إلى أهلك، الحمد له."}, {"fr": "- Dieu te comble de ses bénédictions, dit mon père", "ar": "- قال أبي: فليغمرك الله ببركاته."}, {"fr": "Je rebroussai chemin. Je voulais le voir entrer dans la chambre. L’escalier me paraissait un lieu sombre, il n’était nullement indiqué pour revoir mon père au retour d’un aussi long voyage. Ma mère n’avait pas bougé. Elle me parut un peu souffrante. Moi-même, je ne me sentais plus très bien. Mon front se couvrit de gouttelettes froides et mes mains tremblaient légèrement. Le pas pesant de mon père résonnait tou- jours dans l’escalier. Une ombre obscurcit la porte de notre chambre. Mon père entra.", "ar": "عدت أدراجي. كنت أود رؤيته يدخل إلى الغرفة. كان الدرج يبدو لي مكانا مظلما، لم يكن مناسبا إطلاقا للقاء أبي بعد سفر طويل كهذا. لم تكن أمي قد تحركت. بدت لي متوعكة قليلا. حتى أنا، لم أعد أحس بحال جيد. تغطى جبيني بقطيرات باردة و كانت يداي ترتجفان بشكل خفيف. كان وقع أقدام أبي الثقيل ما يزال يسمع في الدرج. أظلم ظل باب غرفتنا. دخل أبي."}, {"fr": "- Le salut sur vous.", "ar": "- السلام عليكم."}, {"fr": "- Sur toi le salut, murmura ma mère. As-tu fait bon voyage?", "ar": "- همست أمي: و عليكم السلام، هل كانت سفرتك مريحة؟"}, {"fr": "- Louange à Dieu, je n’ai eu aucun ennui, mais je suis un peu fatigué ... Sidi Mohammed, viens que je te regarde de plus près.", "ar": "- الحمد لله، لم أواجه أية متاعب، لكنني متعب قليلا... سيدي محمد، تعال لأراك عن قرب."}, {"fr": "Je m’approchai de mon père. Il se débarrassa des deux poulets. Il les posa à même le sol. Ils avaient les pattes liées par un brin de palmier. Ils se mirent à battre des ailes, à pousser des gloussements de terreur. Mon père m’intimidait. Je le trouvais changé. Son visage avait pris une couleur terre cuite qui me dé- concertait. Sa djellaba sentait la terre, la sueur et le crottin. Lorsqu’il passa ses mains sous mes aisselles et me souleva à la hauteur de son turban, je repris entièrement confiance et j’éclatai de rire. Ma mère sortit de sa torpeur. Elle rit comme une petite fille, s’empara des poulets pour les emporter à la cuisine, revint aider mon père à vider son capuchon qui contenait des œufs, sortit d’un sac de doum un pot de beurre, une bouteille d’huile, un paquet d’olives, un morceau de galette paysanne en grosse semoule. Prise d’une fièvre d’activité, elle rangeait nos richesses, soufflait sur le feu, allait, venait d’un pas pressé sans s’arrêter de parler, de poser des questions, de me gourmander gentiment.", "ar": "اقتربت من أبي. تخلص من الدجاجتين. وضعهما على الأرض مباشرة. كانت قوائمها مربوطة بخوص نخل. بدأتا ترفرفان بأجنحتهما، تطلقان نقنقات رعب. كان أبي يخيفني. كان يبدو لي متغيرا. كان وجهه قد اكتسب 144 لونا يشبه الفخار كان يربكني. كانت تفوح من جلبابه رائحة التراب، العرق و الروث. عندما مرر يده من تحت إبطي و رفعني إلى علو عمامته، استعدت ثقتي بأكملها و قهقهت. أفاقت أمي من خبوها. ضحكت مثل بنت صغيرة، أخذت الدجاجتين لتحملهما إلى المطبخ، عادت لتساعد أبي على إفراغ قلنسوته التي كانت تحتوي على بيض، أخرجت من كيس من الدوم أصيص زبدة، قنينة زيت، علبة زيتون، قطعة حلوى ريفية من السميد الخشن. مصابة بحمى النشاط، كانت ترتب ثرواتنا، تنفخ على النار، تذهب، تأتي بخطو مستعجل دون التوقف عن الكلام، عن طرح الأسئلة و عن توبيخي بلطف."}, {"fr": "Installé sur les genoux de mon père, je lui racontais les événements qui avaient meublé notre vie pendant son absence. Je les racontais à ma façon, sans ordre, sans cette obéissance aveugle à la stricte vérité des faits qui rend les récits des grandes personnes dépourvus de saveur et de poésie. Je sautais d’une scène à une autre, je déformais les détails, j’en inventais au besoin. A chaque instant, ma mère essayait de rectifier ce que j’avançais; mon père la priait de nous laisser en paix.", "ar": "جالسا على ركبتي أبي، كنت أحكي له الأحداث التي شغلت حياتنا خلال غيابه. كنت أحكيها على طريقتي، بدون ترتيب، دون هذا الخضوع الأعمى للحقيقة المجردة للوقائع التي تجعل قصص الأشخاص البالغين خالية من المذاق و الإبداع. كنت أقفز من موقف إلى آخر، كنت أحرف التفاصيل، أخترعها عند الحاجة. في كل لحظة، كانت أمي تحاول أن تصحح ما كنت أؤكده؛ كان أبي يرجوها أن تدعنا بسلام."}, {"fr": "Les voisines faisaient à haute voix des vœux pour que notre bonheur soit durable et notre santé pros- père.", "ar": "كانت الجارات يتمنين بصوت مرتفع أن تكون سعادتنا دائمة و صحتنا ممتازة."}, {"fr": "Des you-you éclatèrent sur la terrasse. Des femmes venues des maisons mitoyennes manifestaient ainsi, bruyamment, la part qu’elles prenaient à notre joie. Ma mère ne cessait de remercier les unes et les autres.", "ar": "كانت زغاريد تطلق على السطح. كانت نساء قادمات من المنازل المجاورة تعبرن بصخب عن مشاركتهن لنا في فرحتنا. لم تتوقف أمي عن شكر البعض أو الأخريات."}, {"fr": "Driss El Aouad arriva de son atelier. Sa femme le mit au courant du retour de mon père. Il appela:", "ar": "عاد إدريس العاود من ورشته. أخبرته زوجته عن عودة أبي. نادى:"}, {"fr": "- Maâlem Abdeslem ! Nous sommes très heureux de te voir de retour parmi les tiens.", "ar": "- يا معلم عبد السلام! نحن سعداء جدا بعودتك من جديد إلى أسرتك."}, {"fr": "- Monte un instant, Driss.", "ar": "- إصعد للحظة، يا إدريس."}, {"fr": "Driss, le fabricant de charrues, avait le même âge que mon père. Tous les deux frisaient la quaran- taine. Ils se connaissaient depuis longtemps et s’estimaient beaucoup. Driss El Aouad monta chez-nous.", "ar": "كان إدريس، صانع المحاريث، في مثل سن أبي. كان عمر كليهما يناهز الأربعين. كانا يعرفان بعضهما منذ أمد بعيد. صعد إدريس العاود إلى بيتنا."}, {"fr": "Les deux hommes, après les salutations d’usage, discutèrent familièrement. Ils parlèrent de la qualité des récoltes, des prix des denrées, des amis communs.", "ar": "تحدث الرجلان، بعد التحايا المألوفة، بشكل عفوي. تكلما عن جودة المحاصيل، أثمنة السلع و الأصدقاء المشتركين."}, {"fr": "Driss dit à mon père:", "ar": "قال إدريس لأبي:"}, {"fr": "- Tu viens d’arriver et peut-être même les gens de ta maison ne le savent-ils pas encore. Le divorce entre Moulay Larbi et la fille du coiffeur a été prononcé hier devant notaire.", "ar": "145 - لقد وصلت للتو و ربما حتى أناس بيتك لا يعرفون بالأمر بعد. لقد صدر حكم طلاق مولاي العربي و ابنة الحلاق بالأمس أمام كاتب عدل."}, {"fr": "- Louange à Dieu ! Moulay Larbi va pouvoir enfin retrouver la tranquillité de l’âme, la paix des hommes bénis. Je savais que la folie de Moulay Larbi serait passagère. N’est-ce pas folie de vouloir, conduire plu- sieurs attelages à la fois ? Il est déjà si difficile de s’entendre avec une seule femme, de vivre en harmonie avec les enfants de sa chair. Moulay Larbi a goûté au fruit amer de l’expérience, le voici de nouveau parmi les hommes normaux, il convient d’en louer le Seigneur.", "ar": "- الحمد لله! سيستطيع مولاي العربي أخيرا أن ينعم براحة البال، سلام الرجال المباركين. كنت أعلم بأن جنون مولاي العربي سيكون عابرا. أليس من الجنون محاولة جر عدة أنشوطات في الوقت نفسه؟ إنه لمن الصعب مسبقا التفاهم مع امرأة واحدة، العيش في وئام مع أطفال من صلبك. لقد تذوق مولاي العربي الثمرة المرة للتجربة، ها هو من جديد بين الناس الطب function parseText(txt){

 let bl=txt.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean);
 if(bl.length<4)bl=txt.split('\n').map(b=>b.trim()).filter(Boolean);

  const ls=b.split('\n');

function alignDP(P,Q){

 const cost=(i0,i1,j0,j1)=>{const x=ss(lp,i0,i1)*c,y=ss(lq,j0,j1);if(!x||!y)return 40;return Math.abs(Math.log((y+1)/(x+1)))*Math.max(1,Math.sqrt(x+y)/6)*3+((i1-i0===1&&j1-j0===1)?0:1.2)};

 const mv=[[1,1],[1,2],[2,1],[2,2],[1,0],[0,1],[1,3],[3,1],[2,3],[3,2]];
 for(let i=0;i<=n;i++)for(let j=0;j<=m;j++){if(D[i][j]>=INF)continue;for(const[di,dj]of mv){const ni=i+di,nj=j+dj;if(ni>n||nj>m)continue;const v=D[i][j]+cost(i,ni,j,nj);if(v<D[ni][nj]){D[ni][nj]=v;B[ni][nj]=[i,j]}}}

// --- Google login + sync (Firebase)
function ld(src){return new Promise((r,j)=>{const s=document.createElement('script');s.src=src;s.onload=r;s.onerror=j;document.head.appendChild(s)})}
async function initFB(){
 if(!FIREBASE_CONFIG||location.protocol==='file:')return;
 try{
  const b='https://www.gstatic.com/firebasejs/10.12.2/';
  await ld(b+'firebase-app-compat.js');await ld(b+'firebase-auth-compat.js');await ld(b+'firebase-firestore-compat.js');
  firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();
  firebase.auth().onAuthStateChanged(async u=>{user=u;if(u)await pull();$('bacc').textContent=u?'👤 ✓':'👤'});
 }catch(e){console.error(e)}
}
function merge(a,b){
 const m={};[...a.lex,...(b.lex||[])].forEach(x=>{if(!m[x.k]||(x.t||0)>(m[x.k].t||0))m[x.k]=x});
 const newer=(b.ts||0)>(a.ts||0)?b:a;
 return Object.assign({},a,{fs:newer.fs||a.fs,t:newer.t,pos:Object.assign({},a.pos,newer.pos),done:Object.assign({},b.done||{},a.done),sp:(b.ts||0)>(a.ts||0)?Object.assign({},a.sp,b.sp):Object.assign({},b.sp,a.sp),lex:normLex(Object.values(m))});
}
async function pull(){
 try{const d=await db.collection('users').doc(user.uid).get();
  if(d.exists){S=merge(S,d.data().state?JSON.parse(d.data().state):{})}
  try{localStorage.setItem('boite2',JSON.stringify(S))}catch(e){}
  await db.collection('users').doc(user.uid).set({state:JSON.stringify(S)});render();
 }catch(e){console.error(e)}
}
function push(){
 if(!user||!db)return;clearTimeout(pushT);
 pushT=setTimeout(()=>db.collection('users').doc(user.uid).set({state:JSON.stringify(S)}).catch(console.error),1500);
}
$('bacc').onclick=()=>{
 if(!FIREBASE_CONFIG){show('<h2>👤 Compte Google</h2><p class="sent">Pour l’instant tout est sauvegardé <b>dans ce navigateur</b> (lexique, position, réglages). La connexion Google n’est pas encore configurée : voir les instructions dans le message de Claude (Firebase + hébergement).</p>');return}
 if(location.protocol==='file:'){show('<h2>👤 Compte Google</h2><p class="sent">La connexion Google ne marche pas en ouvrant le fichier directement. Héberge-le (Firebase Hosting / GitHub Pages / Netlify) puis ouvre le lien.</p>');return}
 if(user){show('<h2>👤 '+esc(user.displayName||user.email)+'</h2><p class="sent">Synchronisé ✓</p><div class="row"><button onclick="firebase.auth().signOut();hide()">Se déconnecter</button></div>')}
 else show('<h2>👤 Compte Google</h2><p class="sent">Connecte-toi pour retrouver ton lexique sur tous tes appareils.</p><div class="row"><button class="pri" onclick="firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider());hide()">Se connecter avec Google</button></div>');
};
render();initFB();
dbAll().then(a=>{STORIES=BUILTIN.concat(a);if(!STORY)renderHome()}).catch(()=>{});
backfill();
