ergeait les coins de lait ou d’eaux odoriférantes, prononçait de longues incantations. Une porte claqua. Zineb, la fille de Rahma, se mit à geindre. Sa mère la gratifia d’une gifle sonore et la noya sous un flot d’injures.", "ar": "خشخشت دلاء مصطدمة في الفناء. كانت الشوافة أول من يستيقظ و كان ذلك أفضل! كانت ظلمة الليل لا تزال موجودة في مثل هذا الوقت حول النافورة و البئر، في المراحيض و في المشتل الكبير الذي كان يتناوب عليه الجميع من أجل الاغتسال. كانت الشوافة تعرف الكلمات الفعالة التي تجعل هذه الظلال وديعة. مساء كل خميس، كانت تحرق بخورا، ترش الزوايا بمياه زكية الرائحة و تنطق بتعاويذ طويلة. صفق باب. زينب، ابنة رحمة، بدأت تئن، كافأتها أمها بصفعة مدوية و أمطرتها بوابل من الشتائم."}, {"fr": "- A ton âge ! N’as-tu pas honte de mouiller ton lit presque chaque nuit ? Je devrais te lâcher dans une étable, au lieu de te préparer chaque soir, ton matelas.", "ar": "- في سنك! ألا تخجلين من تبليل فراشك كل ليلة تقريبا؟ يجب أن أرمي بك في زريبة بدل أن أحضر لكي بطانيتك كل يوم."}, {"fr": "La chouafa l’interrompit :", "ar": "قاطعتها الشوافة:"}, {"fr": "- Que ta matinée soit heureuse, Rahma !", "ar": "- فليكن صباحك سعيدا يا رحمة!"}, {"fr": "- Que ta journée soit ensoleillée, Lalla!", "ar": "- فليكن يومك مشمسا، لالة."}, {"fr": "- Comment te sens-tu ce matin ?", "ar": "- كيف حالك هذا الصباح؟"}, {"fr": "- Je remercie le Seigneur, il m’a infligé une terrible punition le jour où il m’a donné cette pisseuse de mauvais augure. Je le remercie pour ses dons innombrables, je le remercie dans la joie comme dans l’af- fliction.", "ar": "- أشكر الله، لقد فرض علي عقوبة رهيبة في اليوم الذي أعطاني فيه هذه البوالة المشؤومة، أشكره على نعمه التي لا تحصى، أشكره في السراء و الضراء."}, {"fr": "- Éloigné soit de toi tout sujet de chagrin. Prends patience ! Cette enfant guérira, elle sera ta consola- tion dans ce monde de misères,", "ar": "- فليبعد عنك جميع الأحزان. كوني صبورة! ستتعافى هاته الفتاة، ستكون سلواك في عالم الشقاء هذا."}, {"fr": "- Dieu t’entende, Lalla ! Qu’il répande sans mesure ses bénédictions sur toi, sur ceux qui te sont chers. Ma mère remua dans son lit, toussa, soupira, finit par se mettre sur son séant. Elle se leva et ouvrit la fenêtre. La lumière m’éclaboussa les yeux et me fit mal. J’entendis s’ouvrir les volets de Fatma Bziouya. D’une voix ensommeillée, ma mère déroula son chapelet de salutations d’usage qu’elle adressait chaque matin à sa voisine d’en face. Celle-ci lui souhaita une heureuse journée avec les formules habituelles. Aucune n’écoutait les propos de l’autre. Chacun récitait son boniment sur un air monotone sans ardeur et sans enthousiasme. Elles posaient des questions mais connaissaient d’avance les réponses. Depuis trois ans que nous habitions ensemble, elles avaient répété les mêmes phrases chaque matin. Parfois elles mo- difiaient un mot, faisaient allusion à quelque récent événement, mais de telles circonstances étaient fort rares. Invariablement, ma mère demandait :", "ar": "- فليسمع منك الله، لالة! فليدر بركاته عليك و على من تعزين بدون حساب. تقلبت أمي في فراشها، سعلت، تنهدت، ثم جلست في الأخير، نهضت و فتحت النافذة. أصابت الشمس عيناي و آلمتني. سمعت صوت فتح 17 مصراعي نافذة فاطمة بزيوية. بصوت ناعس، بدأت أمي سلسلة تحياتها المألوفة التي تخاطب بها جارتها المقابلة كل صباح. تمنت لها هذه نهارا سعيدا بالطريقة المعتادة. لم تكن أي واحدة تسمع كلام الأخرى، كل واحدة كانت تتلو كلامها المنمق بشكل رتيب يخلو من الحيوية أو الحماسة. كانتا تطرحان أسئلة و لكن تعرفان الأجوبة مسبقا. منذ ثلاثة سنوات و نحن نسكن معا، لقد رددتا نفس الجمل كل صباح. أحيانا كانتا تغيران كلمة واحدة، تلمحان إلى بعض الأحداث الأخيرة، لكن مثل هذه الحالات كانت نادرة جدا. سألت أمي بلامبالاة:"}, {"fr": "- Comment te sens-tu ce matin ? Ta tête ne te fait-elle pas trop souffrir ? Ton sommeil a-t-il été paisible ? Elle concluait : - La santé est chose capitale, ma sœur ! Rien ne peut la remplacer.", "ar": "- كيف حالك هذا الصباح؟ ألا يؤلمك رأسك كثيرا؟ هل نمت جيدا؟ ختمت ب: - إن الصحة شيء أساسي، يا أختي! لا يمكن لشيء تعويضها."}, {"fr": "Ce jour-là elle ajouta :", "ar": "أضافت في ذلك اليوم:"}, {"fr": "- Mon garçon n’est pas bien aujourd’hui. Dieu éloigne de toi et de ceux qui te sont chers le mal, et crève les yeux à ceux qui nous envient.", "ar": "- إن ابني ليس على ما يرام اليوم. فليبعد الله عنك و عن من تعزين كل سوء، و يفقأ عين كل من يحسدوننا."}, {"fr": "La voix de la chouafa monta du rez-de-chaussée : - Lalla Zoubida ! Que ta matinée soit bénie ! Dieu éloigne de toi tout motif de peine et te conserve, toi et les tiens, en excellente santé ! Ma mère répondit :", "ar": "سمع صوت الشوافة و هو يرتفع من الطابق السفلي: - لالة زبيدة! فليكن صباحك مباركا! و فليبعد الله عنك كل سوء و ليحفظك أنت و أحبابك في صحة ممتازة!"}, {"fr": "- Que ta journée soit lumineuse et pleine de bénédictions ! Comment te sens-tu ce matin ? Dieu veillera sur ton bonheur et sur celui de tous ceux qui te sont proches. La chouafa enchaîna :", "ar": "أجابت أمي: - فليكن يومك منيرا و مليئا بالبركات! كيف حالك هذا الصباح؟ فليسهر الله على سعادتك أنت و كل من تحبين. تابعت الشوافة:"}, {"fr": "- Ne t’inquiète pas pour ton fils, les amis de Dieu veillent sur sa santé. Il a des protecteurs dans le monde visible et dans le monde invisible. Je sais qu’il est chéri des puissances bénéfiques. Quand il sera homme, il sera un sabre parmi les sabres, un guerrier invulnérable, une ruche au miel recherché pour sa saveur et son parfum.", "ar": "- لا تقلقي على ابنك، يسهر أولياء الله على صحته. لديه حماة في العالم المرئي و في العالم اللامرئي. أعلم أنه عزيز على القوى المباركة. عندما يصبح رجلا، سيكون سيفا بين السيوف، محاربا لا يقهر، خلية نحل مطلوبة لمذاقها و لعبيرها."}, {"fr": "- Lalla, dit ma mère toute remuée, le miel et le beurre coulent de ta bouche et l’odeur du Paradis par- fume ton haleine.", "ar": "- قالت أمي و هي متحمسة: لالة، يقطر من فمك السمن و العسل و تعطر رائحة الجنة نفسك."}, {"fr": "Et ma mère, extatique, les yeux au ciel, ajouta : - Seigneur, qui m’écoutes du haut des cieux, répands tes trésors inépuisables, ô toi maître de tous les trésors, sur cette femme de bien; qu’elle soit vénérée comme elle le mérite dans ce monde et qu’elle bé- néficie de tes largesses dans l’Autre. Que sa vie soit couronnée par l’accomplissement du pèlerinage aux Lieux qui nous sont chers, à nous tes esclaves auxquels tu as révélé la Vérité par l’intermédiaire de ton Prophète (le salut soit sur lui, sur ses compagnons et ses proches, le salut et la Paix !) Amine ! O Dieu de l’Univers !", "ar": "و أضافت أمي تغمرها البهجة و هي تنظر إلى السماء: 18 - يا إلاهي، يا من يسمعني من أعلى السماوات، أنشر كنوزك التي لا تنضب، يا سيد كل الكنوز، على هذه المرأة الطيبة؛ فلتكن مهابة كما تستحق في هذا العالم و لتنعم بجودك في الآخر. فلتتوج حياتها بأداء فريضة الحج في الأماكن العزيزة علينا، لنا نحن، عبادك، الذين هديتنا إلى الحق بوساطة رسولك (صلى الله عليه، و على آله و صحبه الصلاة و السلام!) آمين، يا رب العالمين! - أجابت النساء في وقت واحد: آمين!"}, {"fr": "- Amine ! Répondirent en écho toutes les femmes. Pendant ce cérémonial, je m’étais levé et mis en djellaba. Mes oreilles bourdonnaient un peu, mais je ne me sentais nullement plus fatigué que d’habitude. La pers- pective de rester à la maison toute la journée, loin du fqih et de sa baguette de cognassier, me rendait tout heu- reux. Nous étions mercredi, le jour suivant était ordinairement jour de congé et le vendredi l’école n’ouvrait qu’après la prière de midi. J’avais devant moi deux jours et demi, deux jours et demi à vivre comme un prince. Ma mère m’aida à faire mes ablutions et s’affaira, dans le réduit qui lui servait de cuisine, à activer son feu. Toute la maison retentissait du bruit des soufflets. Il faisait un éclatant soleil. Bientôt la table fut mise. Il y avait des œufs frits à l’huile d’olive et du pain frais. Nous nous mîmes à manger. Allal, le mari de Fatma Bziouya, jardinier de son état, fit entendre sa voix à l’entrée de la maison.", "ar": "خلال هذه المراسيم، كنت قد نهضت و لبست جلبابي. كانت أذناي تطنان قليلا، لكن لم أكن أشعر بتاتا بتعب أكثر من المألوف. كانت فكرة البقاء في المنزل طوال اليوم، بعيدا عن الفقيه و عن عصا السفرجل، تجعلني سعيدا للغاية. كان يوم أربعاء، كان اليوم التالي يوم عطلة في العادة و في يوم الجمعة كان الكتاب لا يفتح إلا بعد صلاة الجمعة. كان لدي يومان و نصف، يومان و نصف لأعيش كالأمير. ساعدتني أمي لأتوضأ و انشغلت بإشعال النار في الركن الذي كانت تستعمله كمطبخ. كان المنزل كله يدوي بصوت المنافيخ. كانت الشمس ساطعة. وضعت الطاولة عما قريب. كان هناك بيض مقلي بزيت الزيتون و خبز طازج. بدأنا نأكل. علال، زوج فاطمة بزيوية، حرفته البستنة، صاح في مدخل المنزل."}, {"fr": "- N’y a-t-il personne ? Puis-je passer ? Rahma répondit :", "ar": "- ألا يوجد أحد؟ هل أستطيع الدخول؟ أجابت رحمة:"}, {"fr": "- Il n’y a personne. Passe !", "ar": "- لا يوجد أحد. أدخل!"}, {"fr": "Son pas retentit dans l’escalier. Nous finissions de manger quand sa femme entra dans notre chambre. Elle tenait une assiette de faïence où reposaient deux beignets sfenj. J’en étais particulièrement friand. Ma mère se leva pour recevoir la visiteuse. Le visage ennuyé, la bouche pincée, elle débita les formules qu’exige la politesse en de telles occasions. - Fatma ! Pourquoi t’es-tu dérangée ? Je ne peux accepter ! Nous avons, louange à Dieu, ample- ment de quoi nous rassasier ! Deux beignets ! C’est beaucoup trop ! Par Dieu je ne puis accepter. Notre voisine essayait de vaincre cette résistance. Elle prenait la main de ma mère et protestait avec cha- leur.", "ar": "دوى صوت خطواته في الدرج. كنا ننتهي من الأكل عندما دخلت زوجته غرفتنا. كانت تحمل طبقا به فطيرتا سفنج. كنت أحبه كثيرا. نهضت أمي لتستقبل الزائرة، بوجه منزعج، و فم مقروص، بدأت التعابير التي يتطلبها الاحترام في مثل هذه المناسبات. - فاطمة! لماذا أزعجت نفسك؟ لا أستطيع أن أقبل! لدينا، و الحمد لله، ما يشبعنا بشكل كاف! فطيرتان! هذا كثير جدا! بالله عليك لا أستطيع أن أقبل. حاولت جارتنا أن تربح هذه المقاومة. أمسكت بيد أمي و اعترضت بحرارة."}, {"fr": "- Tu ne peux pas me faire un tel affront. Donne à Sidi Mohammed; qu’Allah lui donne la santé! Tu ne peux pas refuser, c’est si peu de chose !", "ar": "19 - لا تستطيعين أن تخجليني هكذا. أعطيها لسيدي محمد؛ فليعطه الله الصحة! لا تستطيعين الرفض؛ إن هذا شيء بسيط!"}, {"fr": "Enfin, ma mère remercia.", "ar": "أخيرا شكرتها أمي."}, {"fr": "- Dieu te comblera de ses bienfaits, et te fera goûter des nourritures du Paradis qu’il réserve à ses élus.", "ar": "- فليغمرك الله بأفضاله، و ليذقك من أطعمة الجنة التي يخصصها للمختارين خاصته."}, {"fr": "- Dieu ouvrira pour nous toutes les portes de ses trésors.", "ar": "- سيفتح الله لنا جميع أبواب كنوزه."}, {"fr": "Fatma alla rejoindre son mari et ma mère poussa de mon côté l’assiette avec les deux beignets.", "ar": "ذهبت فاطمة لتلتحق بزوجها و دفعت أمي الصحن إلى جانبي بكلتا الفطيرتين."}, {"fr": "- Mange-les, toi qui les aimes, me dit-elle; mon estomac ne supporte pas les beignets.", "ar": "- قالت لي: كلها، أنت الذي تحبها، لا تحتمل معدتي الفطائر."}, {"fr": "Je me régalai.", "ar": "تلذذت."}, {"fr": "Un apprenti de mon père, que tout le monde appelait Driss le teigneux, frappa à la porte d’en- trée. Il demanda un couffin pour faire notre marché. Ma mère lui recommanda à haute voix de choi- sir une viande sans trop d’os, et des fèves vertes bien tendres. La situation de mon père était assez prospère. Nous pouvions nous permettre de manger de la viande trois à quatre fois par semaine. Papa, d’origine montagnarde comme ma mère, après avoir quitté son village situé à une cinquantaine de kilo- mètres de la grande ville, avait au début éprouvé des difficultés à gagner sa vie et celle de sa jeune épouse. Dans son pays, on était pillard et paysan. A Fès, il fallait pour vivre exercer quelque industrie citadine ou monter un petit commerce. Dans notre famille, vendre et acheter a toujours été considéré comme le métier le plus vil. Mon père se souvint avoir été à un moment de sa jeunesse dans l’atelier de l’un de ses oncles mater- nels, tisserand de couvertures. Il s’acheta donc un minimum de matériel, loua un coin dans un ate- lier et s’installa tisserand. II faisait honnêtement son travail, améliorait de jour en jour sa production. Bientôt, ses articles furent très disputés et le ménage jouit d’un certain confort. Mon père avait un vieil ouvrier avec lui sur le métier; Driss le teigneux garnissait les canettes et faisait les commissions. Driss venait deux fois par jour à la maison : le matin acheter les provisions et au milieu du jour cher- cher le déjeuner de son patron. Mon père mangeait à l’atelier. Il venait seulement le soir après la der- nière prière. Le vendredi faisait exception. Ce jour-là mon père était à son métier jusqu’à midi envi- ron ; il payait ses employés, allait à la Mosquée pour la grande prière et nous déjeunions en famille. Driss revint chargé de son lourd panier. Ma mère en fit l’inventaire. Le teigneux n’avait rien oublié. La viande avait bon aspect et le vert des cosses de fèves faisait saliver abondamment. Le couffin contenait outre de l’ail, du persil et quantité de petits paquets d’épices. Nous avions de l’huile, du charbon et de la farine pour tout le mois. Quand ma mère parlait de « l’œil des envieux », elle pensait sûrement à ces richesses. Les voisines moins fortunées nous jalousaient un peu. Elles n’ignoraient d’ailleurs aucun détail de notre vie do- mestique. Ma mère, de son côté, connaissait les difficultés de tout le monde, l’état des finances de chaque ménage, les dettes qu’il contractait, ses dépenses de chaque jour et la qualité de son ordinaire. Les fèves furent versées dans un large panier en sparterie en forme de plat.", "ar": "طرق أحد متعلمي أبي، الذي كان الجميع ينادونه بادريس الفظ، باب الدخول. طلب قفة ليقوم بالتسوق لنا. أوصته أمي بصوت مرتفع أن يختار لحما ليس فيه الكثير من العظام، و فولا أخضر لينا. كانت وضعية أبي مزدهرة جدا. كنا نستطيع تناول اللحم من ثلاثة إلى أربعة مرات في الأسبوع. أبي، من أصل جبلي مثل أمي، بعد تركه لقريته التي تقع على بعد خمسين كيلومتر من المدينة الكبيرة، عانى في البداية من صعوبات في كسب رزقه هو و زوجته الشابة. في بلاده، كان الناس نهابين و فلاحين. في فاس، كان لا بد من القيام بصناعة حضرية أو إنشاء تجارة صغيرة. في عائلتنا، لطالما اعتبر البيع و الشراء من أحقر الأعمال. كان أبي يتذكر بأنه كان يعمل كحائك للأغطية في فترة من شبابه داخل ورشة لأحد أخواله، كان يقوم بعمله بشرف، يحسن إنتاجه من يوم لآخر. عما قريب، انتشرت صناعته بشكل جيد و تمتعت الأسرة ببعض الرفاهية، كان هناك عامل قديم يمارس نفس المهنة مع أبي؛ كان إدريس الفظ يلف البكرات و يقوم بالتسوق."}, {"fr": "- Tu m’aideras à les écosser, me dit maman. J’acquiesçai et me mis aussitôt à l’ouvrage. Je fus vite dégoûté de ce travail. J’allai risquer un œil dans chambre de Bziouya. Elle roulait du couscous. Dans un coin, s’amoncelaient divers légumes : navets, carottes, courge rouge et oignons. Notre voisine m’aimait beaucoup. Elle laissa un moment son couscous pour fouiller dans un panier. Elle me ten- dit, avec un large sourire, un radis d’un rouge de rubis long d’un empan. Je lui fis un sourire pour la remercier et plantai mes dents dans la chair rose de cette friandise. Le goût en était si fort que les larmes me sortirent des yeux. Je ne dis rien, je partis à reculons, grimpai les marches qui condui- saient sur la terrasse et jetai par-dessus le mur qui nous séparait d’une autre maison, le beau radis. Le soleil était clair et chaud. Un chat blanc et noir reposait sur le mur et suivait mes mou- vements de ses yeux à demi fermés. Je ne m’en approchai point. Le coup de griffe du matou pen- sionnaire de Sidi Ali Boughaleb m’avait appris à me méfier des chats qui ronronnent au soleil. Ma mère s’inquiétait déjà de mon absence, elle m’appelait à la cantonade. Je m’engageai dans l’escalier pour redescendre. Quelqu’un montait pieds nus. Les pas mous et le froufrou des vêtements se rappro- chaient. Apparut Rahma. Ma mère ne lui parlait plus depuis leur dispute. Les deux femmes évitaient de se rencontrer, moi, je ne savais pas s’il fallait lui sourire ou me sauver. Je me plaquai contre le mur et attendis que les événements décidassent pour moi. En arrivant à ma hauteur, Rahma s’arrêta, me caressa la joue et me glissa un objet dans la main un objet lisse et froid, mais dont le toucher me plongea dans un bain de délice.", "ar": "كان إدريس يأتي مرتين إلى المنزل: في الصباح لشراء المخزون و في منتصف النهار ليحضر غداء رئيسه. كان أبي يأكل في الورشة. كان لا يعود حتى المساء بعد صلاة العشاء. باستثناء يوم الجمعة. كان يبقى أبي في العمل حتى قرابة الظهر؛ كان يدفع لموظفيه، يذهب إلى المسجد ليؤدي صلاة الجمعة و نتغدى كعائلة. 20 عاد إدريس و هو يحمل سلته الثقيلة. قامت أمي بالجرد. لم يكن الفظ قد نسي شيئا. كان للحم مظهر جيد و كانت خضرة قشور الفول تسيل لعابنا بكثرة. كانت القفة تحتوي كذلك على ثوم، بقدونس و كمية من رزم البهارات. كان لدينا زيت، فحم و دقيق للشهر كله. عندما كانت أمي تتكلم عن \"عين الحساد\"، كانت تفكر في هذه الثروات حتما. كانت الجارات الأقل حظا تغرن منا قليلا. لم تكن تتجاهلن أي تفصيل من حياتنا المنزلية. كانت أمي بدورها تعرف صعوبات الجميع، الحالة المالية لكل أسرة، الديون التي كانت تأخذها، مصاريفها اليومية و مستواها الاعتيادي."}, {"fr": "- C’est pour toi, me murmura notre voisine.", "ar": "تم إفراغ الفول في سلة كبيرة من الحلفاء على شكل طبق."}, {"fr": "Je ne répondis rien et courus rejoindre ma mère qui s’impatientait. L’objet était toujours dans le creux de ma main et dégageait une fraîcheur d’eau de source. Installé dans un coin de la pièce, j’osai enfin le regarder. C’était un gros cabo- chon de verre à facettes taillé en diamant, un bijou fabuleux et barbare, provenant à n’en pas douter de quelque palais souterrain où demeurent les puissances de l’Invisible. Était-ce un message de ces lointains royaumes ? Était-ce un talisman ? Était-ce une pierre maudite qui m’était remise par notre ennemie pour attirer sur la colère des démons ? Que m’importait la colère de tous les démons de la terre !", "ar": "- قالت لي أمي: ستساعدني على تقشيرها، وافقت و شرعت في العمل فورا، مللت من هذا العمل سريعا، ذهبت لألقي نظرة على غرفة بزيوية. كانت تفتل الكسكس. في إحدى الزوايا، كانت هناك كومة من الخضر: لفت، جزر، يقطين و بصل. كانت جارتنا تحبني كثيرا. توقفت للحظة عن فتل الكسكس و طفقت تبحث في سلة. مدت لي، بابتسامة عريضة، فجلة حمراء كالياقوت طولها شبر. ابتسمت لها لأشكرها و غرزت أسناني في الجسم الوردي لهذه الوجبة. كان طعمها قويا لدرجة أن دموعي خرجت من عيناي. لم أقل شيئا، رحلت متراجعا إلى الخلف، صعدت الدرجات التي تؤدي إلى السطح و رميت الفجلة الجميلة من فوق الجدار الذي كان يفصلنا عن المنزل الآخر. كانت الشمس مشرقة و حارة. كان هناك قط أبيض و أسود يرتاح على الحائط و يراقب حركاتي بعينيه النصف مغلقتين. لم أقترب منه. لقد علمتني ضربة مخالب القط المقيم في سيدي علي بوغالب أن أحترس من القطط التي تخرخر تحت أشعة الشمس. كانت أمي قد بدأت تقلق من غيابي، نادت علي بصوت مرتفع، توجهت للدرج لأنزل ثانية. كان هناك شخص يصعد الدرج بأقدام حافية. كانت الخطوات المتراخية و خشخشة الثياب تقترب. ظهرت رحمة. لم تعد أمي تحدثها منذ شجارهما. كانت المرأتان تتجنبان اللقاء، أما أنا فكنت لا أعلم إن كان يجب أن أبتسم لها أو أهرب. تراجعت للحائط و تركت الأحداث تتخذ القرار بدلا مني، بوصولها إلى ارتفاعي، توقفت رحمة، داعبت خدي 21 و دست شيئا ما في يدي، كان شيئا ناعما و باردا، لكن ملمسه أغرقني في حمام من السرور."}, {"fr": "Je tenais dans mes mains un objet d’une richesse insoupçonnable.", "ar": "- همست لي جارتنا: هذا من أجلك."}, {"fr": "Il prendra place dans ma Boîte à Merveilles et je saurai découvrir toutes ses vertus. Ma mère me trouva dans mon coin. Elle me jeta un regard négligent et dit :", "ar": "لم أرد بشيء، و جريت لألتحق بأمي التي كان صبرها ينفذ، كان الشيء لا يزال في باطن يدي و كان يطلق برودة ماء العين. جالسا في ركن من الغرفة، تجرأت أخيرا على رؤيته، لقد كان حجرا كريما من الزجاج متعدد الأوجه مرصع بالماس، حلية مذهلة و بربرية، قادمة بدون شك من بعض القصور الموجودة تحت الأرض و التي تسكن فيها قوى الخفاء. هل كان رسالة من هذه الممالك البعيدة؟ هل كان تعويذة؟ هل كان حجرا ملعونا أعطي لي من طرف عدوتنا ليثير علينا غضب الشياطين؟ ليجلب لي غضب جميع شياطين الأرض! كنت أمسك في يدي شيئا ذا قيمة لا توصف. سيكون له مكان في علبة العجائب خاصتي و سأطلع على كل خواصه."}, {"fr": "- Encore un bout de verre ! Fais attention de ne pas te blesser.", "ar": "وجدتني أمي في زاويتي، ألقت علي نظرة خاطفة و قالت: قطعة زجاج أخرى! احذر من أن تؤذي نفسك. 22"}]}, {"fr_title": "Chapitre III", "ar_title": "الفصل 3", "segs": [{"fr": "Ces deux jours et demi de repos passèrent très vite. Le vendredi après déjeuner, je me retrouvai à l’école, hurlant les versets coraniques et scandant les mots sur ma planchette à coups de poings.", "ar": "مر هذان اليومان و نصف من الراحة بسرعة، في يوم الجمعة بعد الغداء، وجدت نفسي في الكتاب صائحا بالآيات القرآنية و مجودا كلمات لوحي باللكمات."}, {"fr": "Une mèche de cheveux ornait le côté droit de ma tête. Elle tournoyait aux quatre vents pendant que j’apprenais frénétiquement ma leçon. Mes doigts me faisaient mal à force de cogner sur ma planchette de bois. Chaque élève se livrait à ce jeu avec passion. Le maître somnolait, sa longue baguette à la main. Le bruit, les coups répétés sur les planchettes m’enivraient. J’avais chaud aux joues. Mes tempes bourdon- naient. Une tache de soleil d’un jaune anémique traînait encore sur le mur d’en face. Le maître se réveilla, distribua quelques coups de baguette et se rendormit. La tache de soleil diminuait. Les cris des enfants s’étaient transformés en torrent, en cataracte de rafale.", "ar": "كانت هناك خصلة شعر تزين الجانب الأيمن من رأسي. كانت تدور في جميع الاتجاهات بينما كنت أتعلم درسي بانفعال. كانت أصابعي تؤلمني من فرط ضربي للوحي الخشبي. كان كل تلميذ يمارس هذه اللعبة بشغف. كان المعلم يوسن، ممسكا عصاه الطويلة في يده. كان الضجيج و الضربات المتكررة على الألواح تسكرني. كنت أشعر بالحر في خدي. كان صدغاي يئزان. كانت لا تزال هناك بقعة شمس ذات صفرة باهتة على الجدار المقابل. استيقظ المعلم، وزع بعض ضربات العصا بشكل عشوائي ثم عاد إلى النوم. كانت بقعة الشمس تتضاءل."}, {"fr": "La tache de soleil disparut. Le maître ouvrit les yeux, bâilla, distingua au milieu de toutes ces voix, celle qui déformait une phrase vénérée, rectifia le mot défectueux et chercha une position confortable pour reprendre son somme. Mais il remarqua que le soleil avait disparu. Il se frotta les yeux, son visage s’éclaira et la baguette nous fit signe de nous rapprocher. Le bruit cessa brusquement. Installés tous contre l’estrade du fqih, nous chantâmes la première sourate du Coran. Les plus petits comme les plus grands la connaissaient. Nous ne quittions jamais l’école le soir sans la chanter. Le vendredi nous la faisions suivre de quelques vers de Bnou Achir consacrés au rituel des ablutions et d’une ou deux prières pour implorer la miséricorde de Dieu en faveur de nos parents et de nos maîtres morts et vivants.", "ar": "كانت أصوات الأطفال قد تحولت إلى سيل، إلى شلال و إلى صوت رشق. اختفت بقعة الشمس. فتح المعلم عينيه، تثاءب، ميز من بين كل تلك الأصوات، تلك التي كانت تحرف آية كريمة، صحح الكلمة الخاطئة و بحث عن وضعية مريحة ليستأنف قيلولته. لكنه لاحظ بأن الشمس كانت قد اختفت. دعك عينيه، أشرق وجهه و أشارت العصا إلينا بالاقتراب. توقف الضجيج بشكل مباغت. و نحن جالسون كلنا قبالة منبر الفقيه، رتلنا أول سور القرآن. كان يعرفها الصغار كما الكبار. لم نكن نخرج من الكتاب قبل ترتيلها. في أيام الجمعة كنا نتبعها ببعض أبيات ابن عاشر المخصصة لفرائض الوضوء و دعاء أو اثنين لمناشدة رحمة الله لصالح والدينا و أوليائنا الموتى و الأحياء."}, {"fr": "Nous étions heureux quand commençaient ces litanies. Elles signifiaient la fin de nos souffrances, le retour à la maison, la course dans les ruelles humides. Enfin, le maître nous libéra un par un. Avant de partir nous nous dirigions vers l’estrade pour le saluer une dernière fois et lui baiser la main.", "ar": "كنا نفرح عندما تبدأ تلك الابتهالات. كانت تعني نهاية معاناتنا، العودة إلى المنزل، الركض في الأزقة المبللة. أخيرا، أخرجنا المعلم واحدا تلو الآخر. قبل الرحيل، كنا نتوجه إلى المنبر لتحيته مرة أخيرة و تقبيل يده."}, {"fr": "Chacun prit ses babouches de dessus une étagère placée à l’entrée de la salle d’école et s’en alla. Il faisait déjà sombre quand j’arrivai à la maison.", "ar": "أخذ كل واحد بلغته من على رف موجود في مدخل قاعة الكتاب و رحل. عندما وصلت إلى المنزل كان الظلام قد حل."}, {"fr": "En attendant le retour de mon père, je mangeai un morceau de pain sec, sortis ma Boîte à Merveilles et me plongeai dans la contemplation de mes richesses. Le cabochon de verre me fascinait toujours; je ne cessais de le toucher, de le regarder par transparence, de le serrer avec tendresse contre ma joue.", "ar": "23 في انتظار عودة أبي، أكلت قطعة خبز حاف. أخرجت علبة العجائب خاصتي و غرقت في تأمل كنوزي. كان الحجر الزجاجي لا يزال يفتنني: لم أتوقف عن لمسه و ضمه بحنان إلى خدي."}, {"fr": "Ma mère alluma une énorme bougie fichée dans un chandelier de cuivre.", "ar": "أشعلت أمي شمعة كبيرة مغروزة في شمعدان نحاسي."}, {"fr": "Ce soir, la chambre de Fatma Bziouya brillait d’un éclat inaccoutumé. Ma mère s’en aperçut. Sans quitter sa place, elle interpella notre voisine :", "ar": "هذا المساء، كانت غرفة فاطمة بزيوية تلمع بشكل غير مألوف. لاحظت أمي ذلك. دون أن تترك مكانها، نادت جارتنا:"}, {"fr": "- Fatma ! Tu célèbres un mariage ? Pourquoi fais-tu brûler plusieurs bougies ? …Que dis-tu ? Une lampe ! Attends, j’arrive.", "ar": "- فاطمة، أ تقيمين زفافا؟ لماذا أشعلت عدة شموع؟ ... ماذا تقولين؟ قنديل! انتظري أنا قادمة."}, {"fr": "Ma mère se leva, se dirigea vers la pièce d’en face. Je la suivis.", "ar": "نهضت أمي، اتجهت إلى الغرفة المقابلة. لحقت بها."}, {"fr": "Oh ! Merveille ! Au centre du mur, une lampe à pétrole était accrochée. Une flamme blanche et paisible dansait imperceptiblement dans un verre en forme de clarinette. Une glace, placée derrière, intensifiait la lumière. Nous étions, ma mère et moi, complètement éblouis. Ma mère dit enfin :", "ar": "أوه! يال الروعة! كان هناك قنديل زيت معلق في وسط الحائط. كانت شعلة بيضاء و هادئة ترقص بشكل خفيف داخل زجاج على شكل يراعة. كانت هناك نافذة في الخلف تزيد شدة الضوء. لقد كنت أنا و أمي مبهورين بالكامل. قالت أمي في الأخير:"}, {"fr": "- Ta lampe éclaire bien. Mais n’y a-t-il pas de danger d’explosion ? Des risques d’incendie ? On dit aussi que le pétrole sent très mauvais.", "ar": "- يضيء قنديلك جيدا. لكن ألا يوجد خطر انفجار؟ مخاطر حريق؟ يقال أيضا بأن رائحة الزيت كريهة."}, {"fr": "Bziouya risqua timidement :", "ar": "أجابت بزيوية بخجل:"}, {"fr": "- Je ne crois pas qu’il y ait de danger. Plusieurs personnes du quartier se servent maintenant de ces lampes. Elles en paraissent très satisfaites. Vous devriez en acheter une, la chambre paraît plus accueillante et plus gaie. - Oui, répondit ma mère en allongeant les lèvres, une lampe, certes, éclaire mieux qu’une bougie mais elle est moins jolie qu’un chandelier de cuivre. Ma curiosité tomba. Elle me prit la main, me ramena chez nous. Elle ne dit plus rien jusqu’à l’arrivée de papa. Elle prépara le dîner comme à l’ordinaire, disposa la petite table ronde, rassembla à portée de sa main les accessoires pour le thé.", "ar": "- لا أظن بأن هناك أي خطر. يستعمل العديد من الناس هذه القناديل حاليا. إنها تبدو جيدة جدا. يجب أن تشتري واحدة، إنها تجعل الغرفة أكثر إشراقا و بهجة. - أجابت أمي و هي تمدد شفتيها: أجل، بالطبع، القنديل يضيء أفضل من الشمعة لكنه أقل جمالا من شمعدان نحاسي. اختفى فضولها، أمسكت يدي، أعادتني إلى غرفتنا. لم تقل شيئا حتى عودة أبي. حضرت العشاء كما هي العادة، وضعت الطاولة المستديرة الصغيرة، وضعت طقم الشاي في متناول يدها."}, {"fr": "Lorsque mon père franchit le seuil de la chambre, je me précipitai pour l’accueillir. Sa face devint rayonnante. Il se baissa, me saisit sous les aisselles et me souleva à la hauteur de son visage. - II devient lourd, cet infidèle! C’est bientôt un homme!", "ar": "عندما عبر أبي عتبة الغرفة، أسرعت لأستقبله، أشرق وجهه، انحنى، أمسكني من تحت إبطي و رفعني إلى علو وجهه. - لقد أصبح ثقيلا، هذا الخائن! قريبا سيصير رجلا!"}, {"fr": "- Non, lui dis-je, je serai un homme quand j’aurai une belle barbe. A la saison des pastèques, j’ai u me frotter les joues avec leur jus, aucun poil ne me pousse.", "ar": "- قلت له: لا، سأصبح رجلا عندما تصير لدي لحية جميلة. في موسم البطيخ، عبثا فركت خدي بعصيرها، لا تنمو لي أية زغبة."}, {"fr": "- Essaie encore la saison prochaine, me dit mon père, peut- être obtiendras-tu quelque résultat? Tu auras alors une belle barbe noire.", "ar": "24 - قال لي أبي: حاول الموسم القادم، ربما تحصل على نتيجة ما؟ ستكون لديك إذن لحية سوداء جميلة."}, {"fr": "- Toi, papa, tu as deux poils blancs à ta barbe. Je vois que tu vieillis.", "ar": "- أنت يا أبي لديك زغبتان بيضاوان في لحيتك. أرى بأنك تشيخ."}, {"fr": "- Non, me dit mon père, non, c’est une simple envie. Il vaut mieux avoir une goutte de lait dans ses poils de barbe qu’une figue ou une grappe de raisin le bout du nez.", "ar": "- قال لي أبي: لا، لا، إنه مجرد حسد. من الأفضل الحصول على نقطة حليب في زغب اللحية بدل تينة أو عنقود عنب في طرف الأنف."}, {"fr": "Cette remarque provoqua chez moi de grands éclats de rire.", "ar": "أغرقتني هذه الملاحظة في موجة من الضحك."}, {"fr": "Le dîner était délicieux, un mets que je préférais entre tous : des pieds de mouton aux pois chiches. Nous mangeâmes copieusement. La table débarrassée, ma mère nous servit du thé à la menthe et parla des menus événements de la journée. Mon père sirotait son thé et répondait rarement. La lumière baissa une seconde, ma mère moucha la bougie avec une paire de ciseaux rouillés. Elle en profita pour déclarer que les bougies devenaient de moindre qualité, qu’il en fallait une tous les trois jours et que la pièce pa- raissait lugubre avec toutes ces ombres qui s’amassaient dans les angles.", "ar": "كان العشاء لذيذا، وجبة أفضلها على الجميع: أرجل خروف بالحمص. أكلنا كثيرا. أخليت الطاولة، قدمت لنا أمي الشاي بالنعناع و تحدثت عن أحداث النهار التافهة. كان أبي يرتشف شايه و نادرا ما يجيب، قل الضوء للحظة، قلمت أمي الشمعة بمقص صدئ، استغلت ذلك لتعلن بأن الشموع أصبحت قليلة الجودة، بأنه لا بد من شراء واحدة كل ثلاثة أيام و بأن الحجرة كانت تبدو مغمة بكل هذه الظلال التي تتراكم في الزوايا."}, {"fr": "- Tous les gens « bien» s’éclairent au pétrole, dit-elle pour conclure. Ces propos laissaient mon père dans une indifférence totale. Mes yeux brillaient de curiosité. J’attendais son verdict. J’admirais intérieurement l’habileté de ma mère. Je fus déçu. Sans com- mentaire, mon père se prépara pour dormir. Je gagnai mon lit. Je rêvai cette nuit d’une belle flamme blanche que je réussis à tenir prisonnière dans mon cabochon de verre taillé en diamant. Le lendemain, à mon retour du Msid, pour le déjeuner, je sautai de joie et de surprise lorsque je décou- vris, accrochée au mur de notre chambre, bien au centre, une lampe à pétrole identique à celle de notre voisine.", "ar": "- قالت في الختام: كل الناس \"الجيدين\" يستضيئون بالزيت. تركت هذه العبارات أبي في لا مبالاة تامة، كانت عيناي تلمعان من الفضول. كنت أنتظر قراره و أعجب في داخلي بمهارة أمي. لكن خاب ظني، استعد أبي للنوم دون أي تعليق. ذهبت لفراشي. حلمت في تلك الليلة بشعلة بيضاء جميلة استطعت أن أحبسها في الحجر الزجاجي المرصع بالماس. في اليوم الموالي، بعد عودتي من المسيد من أجل الغداء، قفزت فرحا من هول المفاجئة عندما رأيت قنديل زيت معلقا في وسط حائط غرفتنا يشبه الخاص بجارتنا."}, {"fr": "Le matin, Driss le teigneux, en venant chercher 1e couffin pour les provisions, l’avait tendue à ma mère. Il avait fait emplette en outre d’une bouteille de pétrole et d’un entonnoir.", "ar": "في الصباح، عندما قدم إدريس الفظ لأخذ قفة المخزون، مدها لأمي. كان قد اشترى قمعا و قنينة زيت بالإضافة إلى مخزون الشهر الاعتيادي."}, {"fr": "La chouafa qu’on appelait « tante Kanza » monta admirer notre nouvelle acquisition, nous souhaita toutes sortes de prospérités. Ma mère rayonnait de bonheur. Elle devait trou- ver la vie digne d’être vécue et le monde peuplé d’êtres d’une infinie bonté. Elle chanton- nait, gourmandait avec tendresse un chat efflanqué, étranger à la maison, riait pour un rien. Chez ma mère, de telles joies étaient souvent très proches des larmes. L’occasion ne tarda pas ce jour-là à se présenter ; elle put comme elle le disait « soulager son cœur ». Rahma, la femme du fabricant de charrues, qui était sortie ce matin accompagnée de sa fille Zineb, dans l’intention de se rendre au quartier Kalklyine pour assister à un baptême, revint tout en pleurs. Elle se mit à se lamenter depuis l’entrée de la maison, à s’administrer des claques sonores sur les joues.", "ar": "صعدت الشوافة التي كانت تنادى ب \"خالتي كنزة\" لترى مشترانا الجديد. تمنت لنا جميع أنواع الرفاهية. كانت أمي تشرق من السعادة. لعلها كانت ترى بأن الحياة تستحق العيش و بأن العالم تسكنه كائنات ذات طيبة لا نهاية لها. كانت تدندن، توبخ بحنان قطا أعجفا غريبا عن المنزل، تضحك بدون سبب. 25 بالنسبة لأمي، كانت مثل تلك الأفراح قريبة جدا من الدموع. في ذلك اليوم، لم يمضي وقت طويل حتى حانت الفرصة؛ كما كانت تقول: استطاعت أن تشفي غليلها. رحمة، زوجة صانع المحاريث، التي كانت قد خرجت هذا الصباح برفقة ابنتها زينب، بنية الذهاب إلى حي كالكليين لحضور سبوع، عادت و هي تبكي. بدأت تنتحب منذ مدخل المنزل، تصفع خديها بشكل مدو."}, {"fr": "- Malheur! Malheur à moi! Je suis la plus misérable des mères ; je ne pourrai jamais survivre à cette douleur. Personne ne pourra soulager ma peine. Les questions fusaient de toutes les fenêtres. Les femmes avaient interrompu leur besogne. Elles la suppliaient de les mettre au courant de la nature de cette catastrophe qui l’avait frappée. Ma mère oublia que Rahma n’était qu’une pouilleuse, une mendiante d’entre les mendiantes.T out émue, elle se précipita au premier étage en criant : - Ma sœur! Ma pauvre sœur! Que t’est-il arrivé?", "ar": "- مصيبة! أصابتني مصيبة! أنا أتعس الأمهات؛ لن أنجو من هذا الوجع. لا أحد سيخفف ألمي. انهمرت الأسئلة من كل النوافذ. كانت النساء قد أوقفن أعمالهن ، كن يتوسلن إليها لتخبرهن عن الكارثة التي أصابتها. نسيت أمي بأن رحمة كانت مجرد مقملة، متسولة من بين المتسولات. متأثرة جدا، أسرعت للطابق الأول و هي تصرخ: - أختي! أختي المسكينة! ماذا أصابك؟ ربما نستطيع مساعدتك.كفي عن البكاء، أنت تكسرين قلوبنا."}, {"fr": "- Nous pouvons peut-être te venir-en aide. Cesse de pleurer, tu nous déchires le cœur. Toutes les femmes entourèrent Rahma la malheureuse. Elle réussit enfin à les renseigner: Zi- neb avait disparu, perdue dans la foule. En vain, sa mère avait essayé de la retrouver dans les petites rues latérales, Zineb s’était volatilisée, le sol l’avait engloutie et il n’en restait pas la moindre trace. La nouvelle de cette disparition se propagea instantanément dans le quartier. Des femmes incon- nues traversèrent les terrasses pour venir prendre part à la douleur de Rahma et l’exhorter à la pa- tience. Tout le monde se mit à pleurer bruyamment. Chacune des assistantes gémissait, se lamen- tait, se rappelait les moments particulièrement pénibles de sa vie, s’attendrissait sur son propre sort. Je m’étais mêlé au groupe des pleureuses et j’éclatai en sanglots. Personne ne s’occupait de moi. Je n’aimais pas Zineb, sa disparition me réjouissait plutôt, je pleurais pour bien d’autres raisons. D’abord, je pleurais pour faire comme tout le monde, il me semblait que la bienséance l’exigeait; je pleurais aussi parce que ma mère pleurait et parce que Rahma, qui m’avait fait cadeau d’un beau cabochon de verre, avait du cha- grin ; mais la raison profonde peut-être, c’était celle que je donnai à ma mère lorsqu’elle s’arrêta, épuisée. Toutes les femmes s’arrêtèrent, s’essuyèrent le visage, qui avec un mouchoir, qui avec le bas de sa chemise. Je continuais à pousser des cris prolongés. Elles essayèrent de me consoler. Ma mère me dit: - Arrête! Sidi Mohammed, on retrouvera Zineb, arrête ! Tu vas te faire mal aux yeux avec toutes ces larmes. Hoquetant, je lui répondis:", "ar": "أحاطت جميع النساء برحمة المسكينة. تمكنت أخيرا من إخبارهم: كانت زينب قد اختفت، تائهة وسط الحشد. حاولت أمها البحث عنها في الشوارع الصغيرة الجانبية لكن دون جدوى، كانت زينب قد تبخرت، ابتلعتها الأرض و لم يبقى لها أي أثر. انتشر خبر هذا الاختفاء في الحي على الفور. عبرت نساء غريبات السطح ليأخذن جزء من ألم رحمة و يحثثنها على الصبر. بدأ الجميع بالبكاء بصخب. كانت كل واحدة من الحاضرات تئن، تنتحب، تتذكر لحظات حياتها الأكثر حزنا، تشفق على حالها الخاص. التحقت بمجموعة الباكيات و أجهشت بالبكاء. لم يهتم بي أحد. لم أكن أحب زينب، كان اختفاؤها يسرني بالأحرى، كنت أبكي لأسباب أخرى. أولا، كنت أبكي لأفعل كما يفعل الجميع، كان يبدو لي بأن حسن السلوك يتطلب ذلك؛ كنت أبكي كذلك لأن أمي كانت تبكي و رحمة، التي أهدتني حجرا زجاجيا جميلا، كانت تشعر بالكآبة؛ لكن ربما كان السبب العميق هو ذاك الذي أجبت به أمي لما تعبت و كفت عن البكاء. توقفت جميع النساء، مسحن وجوههن، منهن من فعلت ذلك بمنديل و منهن من استعملت أسفل 26 قميصها. تابعت إصدار صراخ مطول. حاولن مواساتي. قالت لي أمي: - توقف! سيدي محمد، سنجد زينب، توقف! ستؤذي عينيك بكل هذه الدموع."}, {"fr": "- Cela m’est égal qu’on ne retrouve pas Zineb, je pleure parce que j’ai faim! Ma mère me saisit par le poignet et m’entraîna, courroucée.", "ar": "أجبتها و أنا أفوق: - لا يهمني إن لم نجد زينب، أنا أبكي لأنني جائع! أمسكتني أمي من معصمي و جرتني، مغتاظة."}, {"fr": "Je déjeunai tout seul et je partis à l’école. L’après-midi se passa pour moi comme les autres après- midi: je vociférai les versets sacrés, tapai sur ma planchette. Le soir, après avoir récité ma le- çon, je repris le chemin de la maison. Je m’attendais à la trouver sens dessus dessous. Il n’en était rien. Silencieuses, les femmes soufflaient leur feu, remuaient leurs ragoûts, écrasaient dans des mortiers de cuivre leurs épices. Je n’osai pas interroger ma mère sur les aventures de Zineb. Mon père arriva, comme de coutume, après la prière de l’Aacha. Le repas se déroula simplement, mais à l’heure du thé, maman parla des événements de la journée. Elle commença:", "ar": "تغديت وحيدا و ذهبت إلى الكتاب. مر العصر بالنسبة لي مثل العصور الأخرى: رتلت الآيات الكريمة، ضربت لوحي. في المساء، بعد تلاوة درسي، أعدت سلوك طريق المنزل، كنت أتوقع أن أجده رأسا على عقب. لم يكن الأمر كذلك. كانت النساء تنفخن على نيرانهن و هن ساكتات، تحركن يخناتهن، تسحقن توابلهن داخل مهاريس نحاسية. لم أتجرأ على سؤال أمي عن مغامرات زينب. كما هي العادة، عاد أبي بعد صلاة العشاء. مر العشاء ببساطة، لكن عند وقت الشاي تكلمت أمي عن أحداث النهار بدأت قائلة:"}, {"fr": "- Cette pauvre Rahma a passé une journée dans les affres de l’angoisse. Nous avons toutes été boule- versées. - Que s’est-il passé? demanda mon père.", "ar": "- لقد قضت رحمة المسكينة يوما مليئا بالرعب. لقد شعرنا كلنا بالضيق. - سأل أبي: ماذا حدث؟ استأنفت أمي:"}, {"fr": "Ma mère reprit: - Tu connais Allal le fournier qui demeure à Kalklyine ? Si, si, tu dois le connaître. Il est marié à Khadija, la sœur de notre voisine Rahma. Il y a un an, ils sont venus passer une semaine ici chez leurs parents ; ce sont des gens honnêtes, pieux et bien élevés. Mariés depuis trois ans ils désiraient vive- ment avoir un enfant. La pauvre Khadija a consulté les guérisseurs, les fqihs, les sorciers et les choua- fas sans résultat. Il y a un an, ils sont allés en pèlerinage à Sidi Ali Bou Serghine. Khadija se baigna dans la source, promit au saint de sacrifier un agneau si Dieu exauçait son vœu. Elle a eu son bébé. Depuis six jours, la joie du ménage est à son comble. Demain on procédera au sacrifice du Nom. Mon père osa faire remarquer qu’il ne voyait pas dans cet événement motif à angoisse. Mais ma mère l’interrompit et déclara qu’il était incapable d’écouter jusqu’au bout un récit.", "ar": "- تعرف علال الفران الذي يسكن في كالكليين؟ بلى، بلى، لا بد من أنك تعرفه. إنه متزوج بخديجة، أخت جارتنا رحمة. منذ سنة مضت، لقد أتوا ليمضوا أسبوعا هنا عند آبائهم، إنهم أناس شرفاء، تقاة و حسنوا التربية، متزوجان منذ ثلاث سنوات، كانا يرغبان بشدة في إنجاب طفل. لقد استشارت خديجة المسكينة المعالجين، الفقهاء، السحرة و الشوافات بدون نتيجة. منذ سنة، ذهبا في زيارة تبركية إلى سيدي علي بوسرغين. سبحت 27 خديجة في العين، وعدت الولي بالتضحية بحمل إن حقق الله أمنيتها. أنجبت طفلا. إن الأسرة في فرحة عارمة منذ ستة أيام. ستكون تضحية الاسم يوم غد. تجرأ أبي على الإشارة إلى أنه لم يكن يرى في هذا الحدث أي داع للجزع. لكن أمي قاطعته و أعلنت بأنه كان عاجزا عن الإنصات حتى نهاية القصة."}, {"fr": "- Attends ! Attends ! dit-elle, je commence à peine, tu m’interromps tout le temps.", "ar": "- قالت: انتظر! انتظر! لقد بدأت للتو، أنت تقاطعني طوال الوقت."}, {"fr": "Rahma était donc invitée au baptême et à la cérémonie du Nom. Son mari lui acheta une belle robe parsemée de fleurs multicolores. Elle sortit son foulard de mariage, le beau foulard rouge à décor d’oi- seaux, habilla de neuf sa fille Zineb et elles partirent de bonne heure ce matin. Elles passèrent par Mech- chatine, Seffarine, El Ouadine ...", "ar": "كانت رحمة إذن مدعوة إلى السبوع و حفل الاسم. اشترى لها زوجها لباسا جميلا مزركشا بأزهار متعددة الألوان. أخرجت منديل زفافها، ذلك المنديل الأحمر الجميل بزينة الطيور، ألبست ابنتها زينب ملابس جديدة و خرجتا باكرا هذا الصباح. مرتا من مشاطين، مقارين، الوادين..."}, {"fr": "- Tu ne vas pas citer toutes les rues de Fès, dit simplement mon père.", "ar": "- قال أبي ببساطة: لن تذكري كل شوارع فاس."}, {"fr": "Je pouffai de rire. Des yeux sévères se fixèrent un moment sur moi et ma mère reprit: - Elles arrivèrent à Rsif. La foule barrait le chemin. Un marchand vendait des poissons frais, un franc soixante-quinze le Rtal, (à Joutyia, les poissons se vendent deux francs vingt-cinq). Les gens se battaient pour se faire servir. Rahma et sa fille furent prises dans les remous de cette cohue. Une fois à l’air libre, Rahma rajusta son haïk et constata la disparition de Zineb ! Elle appela, cria, ameuta la foule. Le mar- chand cessa son trafic, les gens vinrent au secours de la mère affligée, mais la fille restait introuvable.", "ar": "قهقهت، استقرت علي أعين حادة للحظة و استأنفت أمي: - وصلتا إلى رسيف .كان الناس يقطعون الطريق، كان هناك تاجر يبيع السمك الطازج، بفرنك و خمس و سبعين للرطل، (في الجوطية، يباع السمك بفرنكين و خمس و عشرين) .كان الناس يتقاتلون ليشتروا .علقت رحمة و ابنتها في دوامة الازدحام .بمجرد خروجها، أصلحت رحمة حايكها و لاحظت اختفاء زينب! نادت، صاحت، استغاثت بالحشد .أوقف البائع تجارته، أتى الناس لنجدة الأم المفجوعة، لكن لم يتم إيجاد الفتاة."}, {"fr": "Rahma revint tout en larmes, nous la consolâmes de notre mieux. Allal le jardinier se dépêcha de pré- venir le mari de Rahma. Deux crieurs publics parcoururent la ville en tous sens, donnèrent le signalement de la fille, promettant une récompense à celui qui la ramènerait à ses parents. Pendant ce temps, nous, faibles femmes, nous ne pouvions que pleurer, offrir notre compassion à la malheureuse mère.", "ar": "عادت رحمة و هي تبكي، بذلنا كل ما في وسعنا لمواساتها، أسرع علال البستاني بإخبار زوج رحمة. جاب مناديان عموميان جميع أنحاء المدينة، أعطيا أوصاف الفتاة، واعدين بمكافئة لمن يعيدها لوالديها. خلال هذا الوقت، نحن، نساء ضعيفات، لم نكن نستطيع إلا البكاء، إبداء تعاطفنا مع الأم المسكينة."}, {"fr": "J’avais le cœur gros. Fatma Bziouya et moi nous partîmes à Moulay Idriss. Dans de pareilles circons- tances, il faut frapper à la porte de Dieu et de ses Saints. Cette porte cède toujours devant les affligés. Une vieille femme surprit notre douleur, elle nous en demanda le motif. Nous la mîmes au courant du triste événement. Elle nous prit par la main et nous emmena à Dar Kitoun, la maison des Idrissides, lieu d’asile de toutes les abandonnées. Là, nous trouvâmes Zineb. La moqqadama l’avait recueillie et nourrie pour l’amour du Créateur. Elle eut un rial de récompense et nous la remerciâmes pour ses bons soins. Rahma retrouva toute sa gaieté lorsque sa fille lui fut rendue.", "ar": "كان قلبي حزينا. ذهبت أنا و فاطمة بزيوية إلى مولاي إدريس. في ظروف مشابهة، يجب طرق باب الله و أوليائه دائما ما يفتح هذا الباب في وجه المفجوعين. لاحظت امرأة عجوز ألمنا، سألتنا عن السبب. أخبرناها عن الحدث المحزن. أمسكتنا من أيدينا و أخذتنا إلى دار قيطون، منزل 28 الإدريسيين، مكان لجوء جميع المتخلى عنهم. هناك، وجدنا زينب. كانت المقدمة قد استقبلتها و أطعمتها في سبيل الله. حظيت بريال كمكافئة و شكرناها لحسن ضيافتها. استعادت رحمة كل بهجتها عندما استعادت ابنتها."}, {"fr": "- Louange à Dieu! termina mon père. Prépare le lit de cet enfant, ajouta-t-il. Il tombe de sommeil. Sous mes couvertures, les yeux ouverts, j’imaginais dans une douce somnolence la maison des Idris- sides. Je me représentais une vaste demeure aux mosaïques fanées, bourdonnante comme une ruche de voix de femmes en instance de répudiation, de jeunes filles malheureuses et d’enfants perdus. Moi aussi, j’étais perdu dans une ville déserte, je cherchais en vain un lieu d’asile. Je sentis ma solitude devenir lourde à m’étouffer. Je poussai un cri. Une parole douce vint de loin apaiser ma fièvre et je tombai dans le noir, rassuré, détendu, le souffle calme.", "ar": "- ختم أبي: الحمد لله ثم أضاف: حضري فراش هذا الطفل، إنه نعسان جدا. تحت أغطيتي و بعينين مفتوحتين، كنت أتخيل في نعاس خفيف منزل الإدريسيين. كنت أتصور بيتا واسعا بفسيفساء باهت، يئز مثل قفير بأصوات نساء في دعوى طلاق، فتيات تعيسات و أطفال تائهون. أنا كذلك، كنت تائها في مدينة مهجورة، كنت أبحث عن مكان لجوء بدون جدوى. أحسست بأن وحدتي أصبحت تضيق علي الخناق. صرخت. جاءت كلمة طيبة من بعيد لتخفف حماي و سقطت في الظلام، مطمئنا، مسترخيا، أتنفس بهدوء."}, {"fr": "Le jeudi suivant, Rahma pour remercier Dieu de lui avoir rendu sa fille, organisa un repas pour les pauvres. Toutes les femmes de la maison lui prêtèrent leur concours. Lalla kanza, la chouafa, aidée de Fa- touma la plus dévouée et la plus fidèle de ses disciples, lavèrent le rez-de-chaussée à grande eau, étendirent par terre des nattes et des tapis usés. Fatma Bziouya, Rahma et ma mère s’agitèrent autour des marmites et des couscoussiers. Elles cuisinaient en plein air sur la terrasse, sur des feux de bois. L’une d’elles les ra- vitaillait en eau, une autre épluchait les légumes et la troisième, armée d’une louche en bois gigantesque, tournait les sauces qui bouillonnaient dans leur récipients de cuivre.", "ar": "في الخميس التالي ولتشكر الله لإعادته ابنتها لها، نظمت رحمة وجبة للمحتاجين. ساعدتها جميع نساء المنزل. غسلت لالة كنزة، الشوافة بمساعدة فطومة أكثر تلميذاتها تفانيا و إخلاصا، غسلن الطابق الأرضي جيدا، فرشن الأرض بحصائر و زرابي بالية. كانت فاطمة بزيوية، رحمة و أمي تتحركن حول البرام و الكساكس. كن يطبخن في الهواء الطلق على السطح، على نيران من الخشب. كانت واحدة منهن تحضر الماء و أخرى تقشر الخضر أما الثالثة فكانت تحمل مغرفة كبيرة و تحرك بها الصلصات التي كانت تغلي في أوعيتها النحاسية."}, {"fr": "Zineb et moi, abandonnés à notre fantaisie, nous courions d’une chambre à l’autre, montions en souf- flant les escaliers, recevions des nuages de fumée dans les yeux, accompagnés de réprimandes, redescen- dions nous réfugier sur le palier, ne sachant que faire de notre liberté. Nous attendions avec impatience, l’heure du déjeuner et l’arrivée des mendiants. Lorsque les grands plats de céramique que Rahma avait loués furent garnis de couscous copieusement arrosé de bouillon, surmonté d’une pyramide de viande et de légumes, Driss El Aouad partit à Moulay Idriss et à la maison des aveugles de la rue Riad Jeha, pour chercher ses hôtes. Bientôt nous entendîmes dans le couloir d’entrée, un brouhaha scandé de coups de canne et d’éclats de voix. Driss entra le premier dans le patio. Il fut suivi d’un aveugle à la barbe blanche guidé par un garçonnet d’une dizaine d’années. Ensuite, un flot de mendiants hommes et femmes se déversa dans la cour. Le premier vieillard exerçait sur cette foule en loques une véritable royauté. Tous lui obéissaient. Ils manifestaient beaucoup d’égards pour ce patriarche.", "ar": "أنا و زينب، مستسلمين لنزواتنا، كنا نجري من غرفة لأخرى، نصعد الدرج و نحن نلهث، نتلقى سحب دخان في عيوننا، مرفوقة بتوبيخات، ننزل ثانية لنلتجئ إلى البسطة، لا نعرف ماذا نفعل بحريتنا. كنا ننتظر وقت الغداء و حضور المتسولين بفارغ الصبر. عندما ملئت أطباق الخزف الكبيرة التي استأجرتها رحمة بالكسكس المسقي جيدا بالمرق و الذي يعلوه هرم من اللحم و الخضر، ذهب إدريس العاود إلى مولاي إدريس و إلى منزل العميان الذي يقع في شارع رياض جحا، ليحضر ضيوفه. بعد قليل، سمعنا في رواق المدخل، صخبا مجودا 29 بضربات عكاز و صياحات. كان إدريس أول الداخلين إلى الفناء. تبعه رجل أعمى بلحية بيضاء يرشده غلام ذو عشر سنوات. بعد ذلك، انتشر سيل من المتسولين رجال و نساء في الساحة. كان العجوز الأول يمارس سلطة حقيقية على هذا الحشد ذي الثياب الرثة. كان الجميع يطيعونه. كانوا يظهرون الكثير من الاحترام لهذا الزعيم."}, {"fr": "J’avais donc, sous les yeux, le chef des mendiants au milieu de son clan. Tout le monde s’assit sur les nattes et sur les tapis usés. Avant que le repas ne leur fût servi, ils entonnè- rent un psaume où il était question de félicités qui attendent les croyants au cœur généreux, ceux-là qui nourrissent les affamés, honorent l’hôte de Dieu. Le poème se termina par des invocations, afin d’attirer la bénédiction sur notre demeure et sur tous ses habitants. Hommes, femmes et enfants joignirent les mains, les paumes ouvertes vers le ciel. Ils récitèrent la première sourate du Coran. Je la connaissais bien cette sourate et je la récitais avec ferveur: Louange à Dieu", "ar": "علمت فيما بعد بأن منزل العميان الذي يقع في شارع رياض جحا كان له زعيم يتم اختياره و قانون داخلي كان أعضاء هذه المؤسسة يخضعون له. كان إذن أمام عيني زعيم المتسولين وسط جماعته. جلس الجميع على الحصائر و الزرابي البالية. قبل تقديم الطعام لهم، استهلوا أنشودة كانت تتحدث عن النعم التي تنتظر المؤمنين كرماء القلب، أولئك الذين يطعمون المساكين و يكرمون ضيف الله. انتهت القصيدة بأدعية لإنزال البركة على منزلنا و على كل ساكنيه. ضم الرجال، النساء و الأطفال أيديهم، كانت الكفوف مفتوحة نحو السماء. تلوا أول سور القرآن. كنت أعرف هذه السورة جيدا و تلوتها بورع:"}, {"fr": "Maître des mondes. Nous passâmes nos mais sur nos visages. Le couscous parut. Autour des plats posés à même les nattes, les mendiants s’installèrent pour manger. Des bols de terre cuite, décorés au goudron, circulaient plein d’eau. Les mendiants mangeaient et buvaient avec dignité, sans hâte, sans agitation. Rassasiés, ils se lé- chèrent soigneusement les doigts, s’essuyèrent avec des torchons mis à leur disposition. Au signal de leur chef, ils commencèrent la psalmodie d’un chapitre du livre Saint. Les murs de notre maison qui avaient souvent renvoyé le bruit des crotales et des gangas chers à la chouafa vibraient, sancti- fiés par les versets sacrés. Le chapitre choisi était particulièrement long. Il fut chanté sur un rythme plein de majesté. Les aveugles dans leur haillons, clamant avec conviction la parole de Dieu, revêtaient une noblesse et une grandeur qui frappaient l’imagination.", "ar": "الحمد لله رب العالمين مررنا أيدينا على أوجهنا. قدم الكسكس. حول الأطباق التي كانت موضوعة على الحصير، جلس المتسولون ليأكلوا. كانت زبديات من الطين، مزينة بالقطران، تقدم مليئة بالماء. كان المتسولون يأكلون و يشربون بكرامة، بدون استعجال، بدون اضطراب. بعد أن شبعوا، لعقوا أصابعهم بعناية، تنشفوا بفوط كانت موضوعة تحت تصرفهم. عند إشارة زعيمهم، بدأوا تجويد حزب من الكتاب المبين. كانت جدران منزلنا التي لطالما أصدرت صوت المجلجلات و الكانكا العزيزين على الشوافة تهتز مقدسة بفعل الآيات الكريمة. كان الحزب المختار طويلا للغاية. تم تجويده بإيقاع مليء بالعظمة. كان العميان في خرقهم يتلون كلام الله بإيمان و يكتسبون نبلا و عظمة تفوق الخيال."}, {"fr": "Après une dernière invocation prononcée par le patriarche des aveugles et ponctuée du mot amine par le chœur des assistants, l’assemblée se leva, les cannes sonnèrent sur nos mosaïques éteintes.", "ar": "بعد دعاء أخير تلاه زعيم العميان و ختم بكلمة آمين التي نطقها الحضور بصوت واحد، نهض الجماعة، رنت العكاكيز على فسيفسائنا الباهت."}, {"fr": "Les mendiants s’en allèrent, multipliant les remerciements, les formules de bénédiction.", "ar": "رحل المتسولون و هم يضاعفون الشكر و عبارات المباركة."}, {"fr": "Rahma, radieuse, invita les voisines et quelques femmes venues des maisons mitoyennes, les rassembla dans sa chambre, leur servi un excellent ragoût de viande au cardons, un couscous au pois chiches, des salades d’orange au sucre et à la cannelle. Maman prépara le thé à la menthe. Toutes jacassaient, riaient très fort, se taquinaient mutuellement, poussaient des you-you.", "ar": "30 دعت رحمة المشرقة الجارات و بعض النساء القادمات من المنازل المجاورة، جمعتهن في غرفتها، قدمت لهن وجبة ممتازة من اللحم بالخرشوف، كسكس بالحمص، سلطات برتقال بالسكر و القرفة. حضرت أمي الشاي بالنعناع. جميعهن كن تصرخن، تقهقهن، تداعبن بعضهن بالتبادل، تطلقن زغاريدا."}, {"fr": "Avant de se réunir pour le repas, ma mère et les autres voisines avaient changé de robe. Elles tirèrent de leurs coffres des caftans aux couleurs chatoyantes, des dfinas ornées de fleurs et pour se coiffer de riches foulards de soie. La fête dura jusqu’au coucher du soleil. Elle se termina sur la terrasse avec d’autres you- you, d’autres vœux et la promesse de se voir. Pendant tout ce temps personne ne s’était occupé de moi. J’avais mangé avec Zineb dans un petit plat qui m’était personnel et dont mon père m’avait fait cadeau, la veille de la fête du mouton. Nous avions réussi à avoir du thé que nous avions transvasé dans une théière de fer-blanc, jouet de Zineb et pour finir nous nous étions battus.", "ar": "قبل أن يجتمعن من أجل الطعام، كانت أمي و الجارات الأخريات قد غيرن ثيابهن، أخرجن من صناديقهن قفاطينا بألوان براقة، دفينات مزينة بأزهار و لبسن مناديل حريرية زاهية لتزيين رؤوسهن. دامت الحفلة حتي غروب الشمس. انتهت على السطح بزغاريد أخرى، أمنيات أخرى و وعد باللقاء ثانية. خلال كل هذا الوقت، لم يهتم بي أحد، كنت قد أكلت مع زينب في طبق صغير كان يخصني و هدية من أبي في ليلة عيد الأضحى. كنا قد نجحنا في الحصول على الشاي الذي سكبناه في براد من التنك، لعبة لزينب و في الأخير تشاجرنا."}, {"fr": "La nuit, la maison retomba dans le silence. Je me sentis. Je sortis ma Boîte, la vidai sur un coin de matelas, regardai un à un mes objets. Ce soir, ils ne me parlaient pas. Ils gisaient inertes, maussades, un peu hostiles. Ils avaient perdu leur pouvoir magique et devenaient méfiants, secrets. Je les remis dans leur boîte. Une fois le couvercle rabattu, ils se réveillèrent dans le noir pour se livrer à mon insu à des jeux fastueux et délicats. Ils ne savaient pas dans leur ignorance que les parois de ma Boîte à Merveilles ne pouvaient résister à ma contemplation. Mon innocent cabochon de verre grandit, se dilata, atteignit des proportions d’un palais de rêve, s’orna d’étoffes précieuses. Les clous, les boutons de porcelaine, les épingles et les perles changés en princesses, en esclaves, en jouvenceaux, pénétrèrent dans ce palais, jouè- rent de douces mélodies, se nourrirent de mets raffinés, organisèrent des séances d’escarpolette, volèrent dans les arbres pour en croquer les fruits, disparurent dans le ciel sur l’aile du vent en quête d’aventure. J’ouvris la Boîte avec d’infinies précautions afin de jouir plus intensément du spectacle. L’enchante- ment disparut, ce trouvai simplement un cabochon de verre, des boutons et des clous sans âme et sans mystère. Cette constatation fut cruelle. J’éclatai en sanglots. Ma mère survint, parla de fatigue, m’em- mena dormir.", "ar": "في الليل، عاد للمنزل هدوءه. أحسست بالحزن، أخرجت علبتي، أفرغتها على جزء من البطانية، نظرت إلى أشيائي واحدا بواحد. لم يكونوا يحدثونني هذا المساء. كانوا ينامون جامدين، متجهمين و عدائيين نوعا ما. كانوا قد فقدوا قوتهم السحرية و أصبحوا حذرين و كتومين. أعدتهم إلى علبتهم. ما إن أغلق الغطاء حتى استيقظوا في الظلام ليقوموا بدون علمي بألعاب فخمة و فاخرة. لقد كانوا يجهلون أن جدران علبة العجائب خاصتي لم تكن تستطيع أن تفلت من تأملي. كبر حجري الزجاجي البريء، تمدد، بلغ حجم قصر للأحلام، تزين بالضوء و بقماش نفيس. ولجت المسامير، أزرار الخزف الصيني، الدبابيس و الجواهر المتحولة إلى أميرات، عبدات و مراهقات إلى هذا القصر، عزفوا ألحانا عذبة، تناولوا أكلات فاخرة، نظموا حصصا للأرجوحة، تسلقوا الأشجار لقضم الفواكه، اختفوا في السماء على جناح الريح بحثا عن مغامرات. فتحت العلبة بحذر بالغ لأستمتع بالعرض بشدة أكبر. اختفى السحر، وجدت بكل بساطة حجرا زجاجيا، مسامير بدون روح و بدون غموض. كان هذا المنظر قاسيا. أجهشت بالبكاء، أتت أمي، تكلمت عن التعب، أخذتني للنوم. 31"}]}, {"fr_title": "Chapitre IV", "ar_title": "الفصل 4", "segs": [{"fr": "Dans les premiers jours du printemps, ma mère et moi, nous allâmes rendre visite à Lalla Aïcha. Nous étions invités à passer la journée. Quelques jours auparavant, ma mère prépara des gâteaux de semoule fine, des petits pains à l’anis et au sucre, du sellou, farine grillée mélangée de beurre et de diverses épices.", "ar": "في الأيام الأولى لفصل الربيع، ذهبت أنا و أمي لزيارة لالة عيشة. كنا مدعوين لقضاء اليوم كله. قبل بضعة أيام، حضرت أمي حلوى منزلية من السميد الناعم، فطائر باليانسون و السكر، سللو، دقيق محمص ممزوج بالزبدة و عدة توابل."}, {"fr": "Nous emportâmes toutes ces douceurs. Nous quittâmes la maison le matin; Driss le teigneux vint nous trouver chez l’amie de ma mère chargé de son couffin à provisions et d’un poulet de fort bonne apparence. Driss apporta aussi un pain de sucre, un paquet de thé et une brassée de menthe.", "ar": "حملنا كل هذه الحلويات. تركنا المنزل في الصباح؛ أتى إدريس الفظ للقائنا في بيت صديقة أمي محملا بقفة المخزون خاصته و دجاجة بمظهر جيد جدا. أحضر إدريس كذلك قالب سكر، علبة شاي و باقة نعناع."}, {"fr": "Lalla Aïcha protesta, reprocha à ma mère ces folles dépenses. Elle s’attendait à notre visite; elle avait fait son marché en conséquence.", "ar": "اعترضت لالة عيشة، لامت أمي على هذه المصاريف الباهظة. كانت تنتظر زيارتنا و لهذا فقد قامت بالتسوق."}, {"fr": "Lalla Aïcha habitait dans l’impasse de Zankat Hajjama une maison avec une porte basse. Cette maison rappelait, par certains côtés, Lalla Aïcha elle-même. Toutes les deux avaient connu des temps meilleurs, toutes les deux en gardaient une attitude guindée, une distinction désuète.", "ar": "كانت لالة عيشة تسكن في زقاق زنقة حجامة، منزل ذو باب منخفض. كان هذا المنزل يشبه، بطريقة ما، لالة عيشة نفسها. كانت الإثنتان معا قد عاشتا أفضل الأوقات، كانت الاثنتان تحافظان على سلوك مصطنع، لباقة بائتة."}, {"fr": "Lalla Aïcha occupait deux pièces de petites dimensions, au deuxième étage. Un balcon donnant sur le patio, garni d’une balustrade en fer forgé, conduisait à la pièce principale. L’autre chambre s’ouvrait directement sur l’escalier et servait surtout à entreposer les provisions d’hiver. Lalla Aïcha y faisait aussi sa cuisine. La grande pièce avait deux fenêtres, l’une s’ouvrait sur le patio de la maison, l’autre sur les terrasses des maisons voisines et sur les toits d’une petite mosquée de quartier. Cette chambre, deux fois plus longue que large, était d’une propreté méticuleuse. Des cretonnes à grands ramages couvraient les matelas, d’énormes coussins brodés au petit point, enveloppés dans une légère soierie transparente, s’amoncelaient ça et là. Le mur s’ornait de grandes étagères peintes, garnies de bols de faïence euro- péenne, d’assiettes décorées de roses dodues, de verres en forme de gobelets. Une pendule en bois foncé, riche en sculpture, clochetons et pendentifs, occupait sur le mur la place d’honneur. Le sol était couvert d’une natte de jonc. Par-dessus la natte, se déployait une carpette aux couleurs vives.", "ar": "كانت لالة عيشة تسكن غرفتين صغيرتين، في الطابق الثاني. كانت شرفة تطل على الفناء مزودة بدرابزين من الحديد المطرق تؤدي إلى الغرفة الرئيسية. كانت الغرفة الأخرى تطل مباشرة على الدرج و تستعمل بالخصوص كمستودع لمخزون الشتاء. كانت لالة عيشة تطبخ فيها كذلك. كان للحجرة الكبيرة نافذتان، كانت إحداهما تطل على فناء المنزل، و الأخرى على سطوح المنازل المجاورة و سطح مسجد صغير في الحي. كانت هذه الغرفة التي كان طولها يضاعف عرضها نظيفة جدا. كانت أقمشة الكريتون المليئة بالتشاحير تغطي التخوت، كانت وسائد ضخمة مطرزة بنقط صغيرة و مغلفة بنسيج حريري شفاف تتراكم هنا و هناك. كان الجدار مزينا برفوف مطلية، تحمل زبديات من الخزف الأوربي، أطباقا مزينة بورود كبيرة، كؤوسا على شكل غراريف. كانت ساعة حائطية من الخشب الداكن، غنية بالنقوش، القبيبات الجرسية و القلائد تحتل مركز الشرف. كانت الأرض مفروشة بحصير من الأسل. تم بسط سجادة ذات ألوان حية فوق الحصير."}, {"fr": "Cet ensemble baignait dans une atmosphère d’aisance, de quiétude. Ce n’était certes pas le grand luxe mais le confort, un nid douillet à l’abri du vent.", "ar": "32 كان مجموع هذه الأشياء يغمر في جو من اليسر و الهدوء. بالطبع لم يكن الترف بل الراحة، عش ناعم في مأمن من الريح."}, {"fr": "Dès notre arrivée, Lalla Aïcha nous servit des gâteaux et du thé à la menthe. Elle parla ensuite de ses douleurs de jointures qui la taquinaient de nouveau, d’une rage de dents qui l’avait rendue folle la semaine dernière, de son manque d’appétit. Elle posa mille questions à ma mère qui répondait avec complaisance, s’attardait sur un détail, se lançait dans une longue digression, mimait une scène. Nos voisins firent naturellement les frais de la fête. Ma mère en parlait sans méchanceté mais avec une assez grande liberté de langage. Elle comparait le mari de Rahma à un âne qui aurait trop mangé de son, celui de Fatma Bziouya à un rat inquiet. Mon père qu’elle appelait « l’Homme» n’échappait pas à ses coups de griffes. Sa haute taille, sa force, son silence devenaient motifs à caricature. Moi j’aimais mon père. Je le trouvais très beau. La peau blanche légèrement dorée, la barbe noire, les lèvres rouge corail, les yeux profonds et sereins, tout en lui me plaisait. Mon père, il est vrai, parlait peu et priait beaucoup, mais ma mère parlait trop et ne priait pas assez. Elle était certes plus amusante, plus gaie. Ses yeux mobiles reflé- taient une âme d’enfant. Malgré son teint d’ivoire, sa bouche généreuse, son nez court et bien fait, elle ne se piquait d’aucune coquetterie. Elle s’ingéniait à paraître plus vieille que son âge. A vingt-deux ans, elle se comportait comme une matrone mûrie par l’expérience.", "ar": "بمجرد وصولنا، قدمت لنا لالة عيشة بعض الحلوى و الشاي بالنعناع. تكلمت بعد ذلك عن آلام مفاصلها التي عادت تضيقها، عن وجع أسنان كان قد أفقدها صوابها في الأسبوع الماضي، عن شهيتها المسدودة. طرحت العديد من الأسئلة على أمي التي كانت تجيب بلباقة، تتوقف عند نقطة ما، تبدأ استطرادا طويلا، تمثل مشهدا بالحركات. بطبيعة الحال، كان جيراننا هم موضوع الحديث. لم تكن أمي تتحدث عنهم بسوء و لكن بحرية كبيرة في التعبير. كانت تقارن زوج رحمة بحمار ينهق دون توقف، و الخاص بفاطمة بزيوية بجرذ قلق. لم يكن أبي الذي كانت تدعوه ب « الرجل » يفلت من ضربات مخالبها. كانت قامته الطويلة، قوته و سكوته تصبح محط سخرية. أنا كنت أحب أبي. كان يبدو لي وسيما. بشرته بيضاء محمرة قليلا، لحيته سوداء، شفتاه حمراء مرجانية، عيناه سوداوان و صافيتان، كان كل شيء فيه يعجبني. صحيح أن أبي لم يكن يتكلم إلا قليلا و كان يصلي كثيرا، لكن أمي كانت تتكلم كثيرا و لا تصلي كفاية. كانت بالطبع أكثر تسلية و مرحا. كانت عيناها المتحركتان تعكسان روح طفلة. رغم لون بشرتها العاجي، فمها الغليظ، أنفها الصغير و المتقن، لم تكن تبدي أية أناقة. كانت تبذل جهدها لتبدو أكبر من سنها. في سن الثانية و العشرين، كانت تتصرف مثل قابلة عظيمة الخبرة."}, {"fr": "Lalla Aicha nous parla à son tour des gens de sa maison. Elle clamait leurs multiples mérites, une telle modeste et jolie, telle autre propre, économe et bonne cuisinière, telle autre pieuse et digne; à l’entendre, toutes rivalisaient de sainteté avec les anges du Paradis. Mais elle baissa la voix pour chuchoter à ma mère au creux de l’oreille sa véritable pensée. Elle termina par ces termes:", "ar": "تحدثت لنا لالة عيشة بدورها عن جيرانها. كانت تصيح بفضائلهم المتعددة، كانت إحداهن متواضعة و جميلة، و أخرى نظيفة، مقتصدة و طباخة ماهرة، كما كانت هناك أخرى تقية و شريفة؛ من يسمعها يصدق أنهن كلهن تضاهين قداسة ملائكة الجنة. لكنها أخفضت صوتها لتهمس لأمي في باطن أذنها برأيها الحقيقي. أنهت حديثها بهذه الكلمات:"}, {"fr": "- Dieu m’a bénie lorsqu’il m’inspira l’idée d’habiter cette maison où toutes les femmes vivent comme des sœurs. Des voix montèrent du rez-de-chaussée, sortirent de toutes les chambres pour remercier Lalla Aïcha de ses bonnes paroles. En chœur Lalla Aïcha et ma mère distribuèrent généreusement de nouveaux com- pliments.", "ar": "- لقد باركني الله عندما ألهمني بفكرة السكنى في هذا المنزل الذي تعيش فيه كل النساء مثل الأخوات. صعدت أصوات من الطابق السفلي، خرجت من جميع الغرف لشكر لالة عيشة على كلماتها الطيبة. وزعت أمي و لالة عيشة بصوت واحد المزيد من الثناء."}, {"fr": "Les enfants de la maison vinrent m’inviter à jouer. Ils formaient un petit groupe de quatre garçons et de trois filles. Je n’ai jamais su leurs noms. L’aînée, une fillette de neuf ans, me prit sous sa protection. Nous grimpâmes sur la terrasse. Avec de vieilles couvertures et des peaux de mouton, nous eûmes vite fait d’organiser un salon de réception. Une boîte de conserves rouillée posée sur trois cailloux joua le rôle de samovar, d’autres cailloux posés sur un disque de papier faisaient office de verres à thé. Nous sirotâmes gravement un thé mythique mais combien délicieux, mangeâmes des gâteaux imaginaires, distribuâmes des compliments à l’aînée des filles, notre hôtesse. Ensuite, nous décidâmes de jouer à la mariée. La plus petite des filles fut choisie pour figurer la mariée. L’aînée se contenta du personnage de la negafa, une de ces femmes expertes dans l’organisation de telles cérémonies. Elle descendit chercher un bout de foulard, du rouge pour les joues, de l’antimoine finement pulvérisé pour noircir les yeux. La mariée fut installée sur un coussin. Dans un vacarme de you-you et de chants improvisés, la negafa procéda selon l’usage au maquillage et à l’habillement de la jeune fiancée. Elle l’affubla d’une couverture en guise de robe, la coiffa, l’orna de papiers ajourés, simulant grossière- ment des bijoux, s’éloigna pour admirer son ouvrage.", "ar": "33 جاء أطفال المنزل ليدعوني للعب. كانوا يكونون مجموعة صغيرة تتكون من أربعة أولاد و ثلاثة بنات. لم أكن أعرف أسماءهم. وضعتني البنت الكبرى ذات التسع سنوات تحت حمايتها. صعدنا إلى السطح. قمنا بسرعة بتأثيث صالة استقبال باستعمال أغطية قديمة و جلود أكباش. لعبت علبة مصبرات صدئة موضوعة فوق ثلاثة أحجار دور السماور؛ قامت أحجار أخرى موضوعة على قرص ورقي مقام كؤوس الشاي. ارتشفنا بوقار شايا افتراضيا لكن لذيذا للغاية، أكلنا حلويات متخيلة، وزعنا مدائح للفتاة الكبرى، مضيفتنا. بعد ذلك، قررنا لعب العروس. اختيرت أصغر الفتيات لتمثل دور العروس. اكتفت الكبرى بشخصية النڭافة، واحدة من تلك النساء المتخصصات في تنظيم مثل هذه الحفلات. نزلت لتحضر قطعة منديل، أحمرا للخدين، كحلا مسحوقا جيدا لتكحيل العينين. جلست العروس على وسادة، قامت النڭافة حسب العادة بوضع التبرج و إلباس المخطوبة الشابة وسط ضجة من الزغاريد و الأغاني المرتجلة. ألبستها غطاء عوضا عن فستان، سرحت شعرها، زينتها بأوراق مفرغة، مصطنعة حليا ببذاءة، ابتعدت لتتأمل عملها."}, {"fr": "L’un des garçons, mû par un instinct de méchanceté, ramassa une poignée de terre et la jeta à la figure de notre mariée. Le drame se déchaîna. La mariée et ses invités se mirent à hurler, à se battre, à courir dans tous les sens, le visage barbouillé de larmes et de morve. Je hurlais comme tout le monde sans sa- voir pourquoi. J’essayais de me dégager des bras de la grande fille qui déployait de vains efforts pour me calmer. Une des femmes monta, distribua des taloches et des insultes, traita de démons innocents et coupables et me descendit sous son bras comme un paquet pour me remettre à ma mère. J’essuyai encore des reproches injustes. Ma mère me menaça de ne plus jamais m’emmener nulle part.", "ar": "أحد الأولاد، محركا من طرف غريزة الشر خاصته، جمع حفنة تراب و رمى بها وجه عروسنا. عمت الفوضى، بدأت العروس و مدعووها بالصراخ، بالقتال، بالجري في جميع الاتجاهات، بوجه ملطخ بالدموع و المخاط. كنت أصرخ مثل الجميع دون أن أعرف لماذا. كنت أحاول الإفلات من ذراعي البنت الكبيرة التي كانت تبذل جهدها سدى لتهدئني. صعدت إحدى النساء، وزعت بعض الصفعات و الشتائم، وصفت الأبرياء و المذنبين بالشياطين و أنزلتني تحت ذراعها مثل الحزمة لتعيدني لأمي. تلقيت المزيد من التوبيخ الظالم. هددتني أمي بأنها لن تأخذني ثانية لأي مكان."}, {"fr": "Ma mère et son amie se remirent à parler de Rahma, la femme du fabricant de charrues, de Fatma Bziouya et de tante Kanza la voyante.", "ar": "عادت أمي و صديقتها للحديث عن رحمة، زوجة صانع المحاريث، عن فاطمة بزيوية و عن خالتي كنزة العرافة."}, {"fr": "Ma mère racontait sa réconciliation avec sa voisine du premier étage, l’escapade de Zineb, le repas of- fert aux pauvres. Elle faisait l’éloge de Rahma. Elle regrettait son moment de mauvaise humeur qui avait provoqué la dispute. Rahma devenait une charmante jeune femme, si serviable! Si honnête !... - Et puis, dit ma mère, elle est si jolie! Toujours souriante, toujours vive. Son mari peut remercier Dieu de lui avoir fait présent d’une brune si délicieuse. N’aimes-tu pas cette peau halée au grain si fin, ces grands yeux qui rient? N’est-ce pas qu’elle possède une jolie bouche aux lèvres fermes, un peu boudeuses ? Lalla Aïcha approuvait, opinait du chef, soupirait de contentement.", "ar": "حكت أمي عن صلحها مع جارتها في الطابق الأول، هرب زينب، صدقة المساكين. كانت تمدح رحمة. تتأسف على لحظة تعكر المزاج التي سببت الشجار. كانت رحمة تصبح امرأة شابة فاتنة، صريحة جدا! نزيهة جدا!... 34 - قالت أمي: ثم إنها جميلة جدا! دائما مبتسمة، دائما نشيطة. يجب على زوجها أن يشكر الله لأنه أهداه سمراء لذيذة جدا. ألا تحبين هذه البشرة السفعاء بحبات صغيرة جدا، هاتان العينان الكبيرتان اللتان تضحكان؟ ألا تملك فما جميلا بشفتين مسدودتين و مقطبتين قليلا؟ كانت لالة عيشة توافق، تومئ برأسها، تتنهد من الرضى."}, {"fr": "Mais ma mère enchaînait déjà : - Fatma, ma voisine d’en face, n’a pas été, non plus oubliée par le Créateur. De jolis yeux noyés de douceur! Des sourcils d’une courbe parfaite ! Un teint ambré ! Mais je n’aime pas le tatouage de son menton.", "ar": "لكن كانت أمي تتابع مسبقا: - فاطمة، جارتي المقابلة، هي الأخرى لم ينسها الخالق. عينان جميلتان مليئتان باللطف! حاجبان بانحناء مثالي! بشرة صهباء! لكني لا أحب وشم ذقنها."}, {"fr": "- Elle a, en outre, l’agrément de sa jeunesse, ajouta l’amie. Immobile dans mon coin, j’écoutais. Je m’étonnais d’entendre ma mère rendre justice à la beauté de nos deux voisines. Cette beauté je la sentais, mais je ne pouvais la traduire par des formules concrètes. J’étais reconnaissant à ma mère d’exprimer avec des termes précis, ce qui flottait dans mon imagination sous forme d’images vagues, confuses, inachevées.", "ar": "- أضافت الصديقة: لديها كذلك نضارة الشباب. كنت أسمع ساكنا في مكاني. كنت أتعجب من سماع أمي و هي تعترف بجمال جارتينا. كنت أحس بهذا الجمال، لكن لم أكن أستطيع التعبير عنه بعبارات محددة. كنت ممتنا لأمي لتعبيرها، بعبارات دقيقة، عما كان يطفو داخل مخيلتي على شكل صور غير واضحة، مشوشة، غير مكتملة."}, {"fr": "Pour tante Kanza, les deux femmes se contentèrent de hocher la tête d’un air entendu. Tante Kanza, la chouafa, appartenait pour moi à une autre race. Elle était royale. Les chacals se sentaient chacals auprès de cette lionne. Étrange est la beauté des reines ! Non pas des reines d’un royaume éphémère que divisent la faim, la concupiscence et l’avidité, mais des reines vierges qui portent dans leurs flancs un dieu d’équité.", "ar": "بخصوص خالتي كنزة اكتفت المرأتان بهز رأسيهما دلالة على التفاهم. كانت خالتي كنزة، الشوافة تنتمي بالنسبة لي لعرق آخر. كانت ملكية. كان بنو آوى يحسون بأنهم بنو آوى بجانب هذه اللبوءة. إن جمال الملكات غريب! كلا، ليس ملكات مملكات عابرة يقضي عليها الجوع، الشبق أو الشراهة، لكن ملكات عذراوات تحملن على جنوبهن إلاه الإنصاف."}, {"fr": "Ses grands yeux, dans sa face de parchemin délicat, fascinaient ses clientes et imposaient le respect à celles qui ne l’aimaient pas. A vrai dire j’en avais vaguement peur. Je l’associais dans mes rêves aux puis- sances obscures, aux maîtres de l’Invisible avec lesquels elle entretenait un commerce familier. Je croyais qu’elle disposait de pouvoirs illimités et je considérais comme un privilège d’habiter sous le même toit qu’une personne aussi considérable.", "ar": "كانت عيناها الكبيرتان، في وجهها الشبيه ببرشمان ناعم، تفتن الزبائن و تفرض الاحترام على أولئك اللواتي كن لا يحببنها. في الحقيقة، كنت أخاف منها بشكل غير واضح. كنت أربطها في أحلامي بالقوى المظلمة، بأسياد الخفاء الذين كانت تمارس معهم تجارة مستمرة. كنت أظن بأنها كانت تتمتع بقدرات لا محدودة و كنت أعتبر السكن مع شخص بهذه الأهمية كامتياز."}, {"fr": "Moulay Larbi, le mari de Lalla Aicha, arriva inopinément. On l’entendit dire à l’entrée la phrase consa- crée :", "ar": "وصل مولاي لعربي، زوج لالة عيشة، بشكل مفاجئ. سمعناه يقول الجملة المخصصة عند المدخل:"}, {"fr": "- N’y a-t-il personne? Puis-je passer? Trois voix de femmes lui répondirent à la fois : - Passe! Passe! Passe!", "ar": "- ألا يوجد أحد؟ هل أستطيع الدخول؟ أجابته ثلاث أصوات نسائية في الوقت نفسه:"}, {"fr": "Son pas résonna dans l’escalier.", "ar": "35 - أدخل! أدخل! أدخل!"}, {"fr": "Il pénétra directement dans la petite pièce. Il était prévenu de notre visite et il ne lui était pas permis de voir ma mère. Sa femme se dépêcha de le rejoindre. Un murmure confus, entrecoupé de silences, bour- donna dans la petite pièce. Il dura longtemps. Nous étions assis, immobiles, maman et moi. Nous ne sa- vions pas comment nous occuper. Je racontai à ma mère nos jeux sur la terrasse et la raison du drame qui s’ensuivit. Elle m’écouta distraitement, me répondit par des phrases vagues, des conseils d’ordre général sur la façon de se tenir en société. Elle se leva pour regarder par la fenêtre, rencontra les yeux d’une voisine penchée elle aussi sur la, balustrade: contemplant le patio vide. Les deux femmes se saluèrent, parlèrent du printemps dont les débuts étaient toujours fatigants. L’inconnue en profita pour évoquer le. Souvenir d’une nzaha, une par- tie de plein air à laquelle elle avait participé. Il y avait de cela des années. La campagne parée comme un bouquet sentait le miel. Les oiseaux se répondaient d’un buisson à une branche. Les femmes couraient pieds nus dans l’herbe, barbotaient dans le ruisseau, chantaient des cantilènes à ravir le cœur. Au milieu de l’après-midi, un orage, d’une rare violence, s’abattit sur la nature. En hâte, tapis et couvertures furent ramassés. Chacun se charge; d’une partie des bagages : plats vides, accessoires pour le thé, gargoulettes pour l’eau fraîche. Deux hommes et cinq femmes, tous parents, composaient l’équipe. La pluie fut ac- cueillie par les uns comme une bénédiction, par les autres comme une catastrophe.", "ar": "سمع وقع خطواته في الدرج. دخل مباشرة إلى الغرفة الصغيرة. لقد كان يعلم بزيارتنا و لم يكن مسموحا له أن يرى أمي. أسرعت زوجته بموافاته. كان هناك تهامس مشوش يئز في الغرفة الصغيرة و يتخلله سكوت. دام طويلا، كنت أنا و أمي جالسين ساكنين. لم نكن نعرف كيف نشغل أنفسنا. حكيت لأمي عن ألعابنا على السطح و سبب الفوضى التي تبعتها. أنصتت إلي بشرود، أجابتني بجمل غير واضحة، نصائح ذات طابع عام حول التصرف السليم بين الناس. نهضت لتنظر من النافذة، واجهت عيني جارة تنحني هي الأخرى على الدرابزين، تتأمل الفناء الفارغ. حيت المرأتان بعضهما، تحدثتا عن فصل الربيع الذي كانت بداياته دائما متعبة. استغلت الغريبة الفرصة لتتحدث عن إحدى النزاهات، رحلة في الهواء الطلق كانت قد شاركت فيها، لقد مضت عليها سنوات. كانت البادية المزينة مثل باقة برائحة العسل. كانت الطيور تنتشر من دغل إلى غصن. النساء تجرين حافيات القدمين على العشب، تتخبطن في الجدول، تغنين أهازيج تشرح القلب. عند منتصف العصر، ضربت عاصفة خفيفة الطبيعة. جمعت السجادات و الأغطية بسرعة. تكلف كل واحد بجزء من الأمتعة: أطباق فارغة، طقم الشاي، نعارات للماء. كان الفريق يتكون من رجلين و خمس نساء، كلهم آباء. اعتبر البعض المطر كبركة أما البعض الآخر فاعتبرها كارثة."}, {"fr": "- Nous étions dans un triste état, à notre retour. Mes belles robes avaient souffert de la boue. J’avais un caftan en drap abricot comme on n’en fait plus à notre époque. Par-dessus, je portais une tunique brodée de fleurs mauves et …", "ar": "- كنا في حالة مزرية، عند عودتنا، كانت فساتيني الجميلة قد لحقها الوحل. قفطان مشمشي من ذلك الذي لم يعد يصنع في زمننا هذا. فوق هذا، كنت ألبس جلبابا مطرزا بأزهار خبازية و..."}, {"fr": "Lalla Aïcha vint nous retrouver, le visage bouleverse. Elle fit signe à ma mère de la suivre dans le coin le plus sombre de la chambre. Je restai à la fenêtre. La femme qui racontait son meilleur souvenir, demeura un moment à attendre le retour de ma mère. Ne la voyant pas revenir et me jugeant trop jeune pour apprécier la somptuosité de ses vêtements, elle laissa sa phrase inachevée, soupira, leva les yeux au Ciel pour le prendre à témoin de l’incompréhension du genre humain, rentra sa tête, disparut dans l’ombre veloutée de ses appartements. Ma mère discutait à demi voix avec son Amie. Je n’osai pas m’en approcher. J’entendis le mot « pacha » plusieurs fois au cours de leur mystérieux dialogue. Ce mot m’impressionnait, me mettait mal à l’aise. Le pacha? N’était-il par ce personnage cruel qui faisait bastonner les gens au gré de sa fantaisie ? Les mettait dans un cachot noir avec un pain d’orge et une cruche d’eau? Les laissait dévorer par les rats ? Le mot « pacha » faisait trembler les petites gens. Il s’associait dans leur esprit à des ennuis sans nombre, à des douleurs bruyantes, à des cris et à. des lamentations. Ils s’endettaient pour payer les sbires du pacha, essuyaient toutes sortes de vexations au prétoire et voyaient souvent ce qu’ils estimaient leurs droits, deve- nir par une opération du Malin, des charges contre eux. Toutes ces considérations ne les empêchaient pas de se chercher querelle pour des futilités. Ils couraient devant le « pacha » pour lui exposer leurs petites misères. Ils repartaient de là souvent mécontents, ayant essuyé quelques rebuffades.", "ar": "عادت لالة عيشة لتلاقينا، بوجه مرتبك. أشارت إلى أمي لتتبعها إلى ركن الغرفة الأكثر ظلمة. بقيت في النافذة. بقيت المرأة التي كانت تحكي أفضل ذكرياتها تنتظر عودة أمي للحظة. عندما رأت بأنها لم تعد و باعتباري صغيرا جدا لأقدر بهاء ملابسها، تركت جملتها غير مكتملة، تنهدت، رفعت عينيها إلى السماء لتشهده على عدم فهم الجنس البشري، أدخلت رأسها، اختفت في الظل الناعم لشقتها. كانت أمي تتكلم بصوت خافت مع صديقتها. لم أتجرأ على الاقتراب. سمعت كلمة « باشا » عدة مرات خلال حوارهما الغامض. كانت هذه 36 الكلمة تدهشني. تضايقني. الباشا؟ ألم يكن ذلك الشخص القاسي الذي يجعل الناس يتقاتلون فيما بينهم حسب نزوته؟ يضعهم في زنزانة سوداء بخبزة شعير و قلة ماء؟ يدعهم يلتهمون من طرف الجرذان؟ كلمة « باشا » كانت تجعل الناس الضعاف يرتجفون. كان يرتبط في ذاكرتهم بمشاكل لا تحصى، بآلام صاخبة، بصرخات و انتحابات. كانوا يستدينون ليدفعوا لرجال الباشا، يتحملون جميع أنواع الإحراج في المحاكم و يرون دائما ما كانوا يعتبرونها حقوقهم تتحول بحيلة خبيثة إلى حجج ضدهم. لم تكن كل هذه الاعتبارات تمنعهم من افتعال شجارات من أجل أشياء تافهة. كانوا يسرعون بالذهاب إلى « الباشا » ليعرضوا عليه مشاكلهم الصغيرة. كانوا يعودون من هناك دائما مستاءين، بعد تلقيهم لرفض قاس."}, {"fr": "Lalla Aïcha se mit à pleurer silencieusement. Elle se cachait le visage dans la manche de sa robe et re- niflait. Ma mère se fit rendre, lui entoura les épaules de son bras, lui parla comme elle aurait parlé à une petite fille. La scène m’amusait. Lalla Aïcha, plus âgée que ma mère, se laissait consoler, devenait la petite sœur dans les bras de son aînée. J’avais envie de rire, mais je savais que cela ne se faisait pas. Le ridicule de la situation m’obligea à fuir dans l’escalier pour ne pas me montrer incorrect. J’eus souhaité rencontrer la jeune inconnue qui savait si bien jouer la negafa. Nous aurions vécu ensemble quelque aventure extrava- gante, dans un pays enchanté. Hélas! Déjà, j’étais voué à la solitude. Je m’assis sur le haut d’une marche et je chantonnai sur un air improvisé des paroles dépourvues de sens :", "ar": "بدأت لالة عيشة بالبكاء بصمت. كانت تخفي وجهها بفستانها و تنخر، أشفقت عليها أمي، أحاطت كتفيها بذراعها، تحدثت إليها كما لو كانت تتكلم مع بنت صغيرة. كان المشهد يسليني. كانت لالة عيشة الأكبر من أمي تتلقى المواساة، تصبح الأخت الصغرى بين ذراعي الكبرى. كنت أرغب في الضحك، لكن كنت أعلم أن ذلك تصرف غير لائق. أجبرتني سخافة الموقف على الهرب إلى الدرج لكي لا أبدو قليل التهذيب. تمنيت اللقاء بالغريبة الصغيرة التي كانت تحسن لعب دور النڭافة. كنا سنعيش معا بعض المغامرات المثيرة، في بلد سحري. للأسف! كنت أعاني من الوحدة مسبقا. جلست على إحدى الدرجات و دندنت بلحن مرتجل كلمات خالية من المعنى: الباشا!"}, {"fr": "Le pacha! Mangea Lalla Aïcha O Nuit! 0 Nuit!", "ar": "أكل لالة عيشة يا ليل! يا ليل!"}, {"fr": "O mon œil !", "ar": "يا عيني!"}, {"fr": "Pleure dans la solitude.", "ar": "تبكي في الوحدة."}, {"fr": "Du fond de la chambre, ma mère m’interpella. Elle me demanda si j’avais l’intention de braire pendant longtemps encore. Je me tus, m’adossai au mur et ne tardai pas à m’endormir.", "ar": "نادتني أمي من آخر الغرفة. سألتني إن كنت أنوي النهيق لمدة أطول. سكت، استندت على الحائط و سرعان ما نمت."}, {"fr": "J’entendis quelqu’un me réveiller. Une main impitoyable me traîna dans la chambre de Lalla Aïcha où la table était mise. Je tombais de sommeil. Ma mère me força à manger, mais je ne pouvais rien avaler. Le poulet aux carottes avait un goût de paille. Je fis une énorme tache de graisse sur ma djellaba et Je subis de sévères remontrances. Enfin, on m’abandonna sur un matelas où je pus ronfler tout à loisir.", "ar": "سمعت شخصا يوقظني. جرتني يد قاسية إلى غرفة لالة عيشة حيث كانت الطاولة معدة. كنت نعسانا جدا. أجبرتني أمي على الأكل، لكن لم أستطيع 37 ابتلاع شيء. كان مذاق الدجاج بالجزر يشبه التبن. لطخت جلبابي ببقعة دهن كبيرة و تلقيت توبيخا صارما. في الأخير، وضعوني على فراش استطعت أن أشخر فيه على راحتي."}, {"fr": "Quand je me réveillai, le soleil avait disparu, les bougies clignotaient, créaient sur les murs des ombres fantastiques.", "ar": "عندما استيقظت، كانت الشمس قد اختفت، كانت الشموع تومض صانعة ظلالا رائعة على الجدار."}, {"fr": "Mon père vint nous chercher. Je descendis l’escalier, butant à chaque marche. Les rues étaient mal éclairées. Mon père s’était muni d’une lanterne en fer-blanc gracieusement ajourée et ornée de verres de couleur. Des silhouettes surgissaient du noir, prenaient forme humaine, disparaissaient un instant après, derrière nous, avalé
