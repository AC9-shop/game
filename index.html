ا. توقفت لالة عيشة. كان خداها ما يزالان يتلألآن بالبكاء و أنفها مبللا، قالت لأمي: - زبيدة، لم يعد لدي أحد في العالم، أنت صديقتي، أنت أسرتي الوحيدة. لقد تخلى عني ابن الحرام الذي بذلت الغالي و النفيس من أجله ليتزوج بامرأة أخرى، ابنة عبد الرحمان الحلاق."}, {"fr": "- Allah! Allah! cria ma mère, ô ma sœur, ma pauvre sœur, mon Dieu, quelle douleur ! Les deux femmes, de nouveau dans les bras l’une de l’autre, se mirent à sangloter. La chaleur, le lit, ces scènes affreuses dont je sentais, sans le comprendre, tout le tragique, me rendirent vraiment malade. J’eus de violents maux de tête, la fièvre me secoua tout entier. Je me mis à rendre sur ma couverture. Ma mère se précipita, affolée, criant :", "ar": "- صاحت أمي: الله! الله! يا أختي، أختي المسكينة، يا إلاهي، ياله من ألم. بدأت المرأتان من جديد بالبكاء و هما متعانقتان. جعلتني الحرارة، السرير و هذه المشاهد الشنيعة التي كنت أحس بمأساتها دون أن أفهمها مريضا. أحسست بصداع عنيف في رأسي، هزتني الحمى بكاملي. بدأت أتقيأ على غطائي. أسرعت أمي خائفة و هي تصرخ:"}, {"fr": "- Mon fils va mourir, ô mes amies, ô mes sœurs, mon fils! Sauvez mon fils! Les voisines envahirent la chambre, mes paupières se fermèrent. Dans mon crâne, je n’entendais plus que les battements d’un gigantesque tambour.", "ar": "- سيموت إبني، يا صديقاتي، يا أخواتي، ابني! أنقذوا ابني! اجتاحت الجارات الغرفة، انغلق جفناي. داخل جمجمتي، لم أعد أسمع سوى ضربات طبل عملاق. 100"}]}, {"fr_title": "Chapitre IX", "ar_title": "الفصل 9", "segs": [{"fr": "Il n’a rien mangé depuis son déjeuner d’hier. Cette phrase prononcée dans un soupir suffit pour me réveiller. Une pénombre dense remplissait notre chambre. Ma mère chuchotait. Elle s’adressait à une sil- houette indécise, debout au milieu de la pièce. La forme ne bougeait pas. Un vague murmure s’en échap- pait de temps à autre. Des syllabes dépourvues de sens me parvenaient dans mon lit. Les deux formes, m’abandonnèrent. J’essayai de bouger, le tambour qui battait dans mon crâne redoubla d’ardeur. Il se mêla à l’ombre des traînées impalpables de cendre rouge. Une nuée de minuscules étincelles tournoya autour de mon visage. Silencieuses et froides, elles transformaient le décor qui m’était familier en une atmosphère irréelle. Une douleur sourde se propagea dans mes os et me tira un gémissement.", "ar": "لم يأكل شيئا منذ غدائه البارحة. كانت هذه الجملة المنطوقة بتنهد كافية لإيقاظي. كان هناك ظليل كثيف يملأ غرفتنا. كانت أمي تهمس. كانت تخاطب خيالا غامضا و هي واقفة في وسط الغرفة. لم يكن الشكل يتحرك. كان همس غير واضح يسمع من حين لآخر. كانت مقاطع لفظية لا معنى لها تصلني إلى سريري. تركني الشكلان. حاولت التحرك، ضاعف الطبل الذي كان يقرع في جمجمتي شدته. اختلط بظل ذيول الرماد الأحمر الغير ملموسة. حامت غيمة شرارات صغيرة حول وجهي. صامتة و باردة، حولت الديكور الذي كان مألوفا بالنسبة لي إلى جو خيالي. انتشر ألم مشوش في عظامي و جعلني أتأوه."}, {"fr": "Ma mère revint, s’approcha à pas furtifs de mon lit, se pencha légèrement sur moi et resta dans cette attitude un long moment, si silencieuse qu’elle ne semblait pas respirer. Elle formait devant mes yeux une masse noire aux contours pelucheux. Je m’attendais à la voir s’effilocher et se dissoudre à l’exemple de ces fantômes qui me visitaient par mes nuits d’insomnie. Elle finit par soupirer et recula d’un pas.", "ar": "عادت أمي، اقتربت بخطوات صامتة من سريري، انحنت علي قليلا و بقيت على هذه الحالة مدة طويلة، صامتة جدا كما لو كانت لا تتنفس. كانت تشكل أمام عيني كتلة سوداء بمحيط موبر. كنت أتوقع أن أراها تتبدد و تذوب مثل تلك الأشباح التي كانت تزورني في ليالي الأرق. انتهت بالتنهد و التراجع خطوة إلى الخلف."}, {"fr": "- Je suis réveillé, lui dis-je, mais j’ai mal.", "ar": "- قلت لها: أنا مستيقظ لكنني أشعر بالألم."}, {"fr": "- Cela va mieux puisque tu me parles.", "ar": "- بما أنك تكلمني فقد تحسنت."}, {"fr": "- Pourquoi fait-il si sombre? demandai-je. - C’est le soir, répondit ma mère ; je n’ai pas voulu allumer la lampe pour ne pas gêner ton sommeil. Tu as eu la fièvre toute la nuit dernière et toute la matinée. Mes yeux n’ont pas cessé de couler. Hélas mes larmes ne peuvent soulager ta souffrance. - J’ai faim.", "ar": "- سألت: لم المكان مظلم؟ - أجابت أمي: إنه المساء، لم أرد إشعال القنديل لكي لا أقلق نومك. لقد عانيت من الحمى طوال الليلة الماضية و هذا الصباح بأكمله. لم تتوقف عيناي عن البكاء. للأسف لا تستطيع عيناي تخفيف ألمك."}, {"fr": "- Voilà une bonne nouvelle, louange à Dieu! Je vais te chercher un bol de bouillon. Elle me quitta un moment. Le bol de bouillon qu’elle m’apporta resta sur mes genoux quelques mi- nutes. Rien que l’odeur de la nourriture me soulevait le cœur. Ma mère m’exhorta en vain à y goûter. Elle m’avait soutenu le corps à l’aide de coussins. La pièce roula, tangua, fut emportée à travers l’espace, tournant sur elle-même, subissant la loi immuable des astres et des météores. Ma mère eut juste le temps de rattraper le bol qui commençait à se répandre sur les couvertures et m’allongea avec d’infinies précau- tions. Les battements de tambour sous mon crâne s’exaspéraient.", "ar": "- أشعر بالجوع. - هذا خبر جيد، الحمد لله! سأحضر لك زبدية حساء. تركتني للحظة. بقيت زبدية الحساء التي أحضرت لي بضع دقائق على ركبتي. كانت رائحة الطعام فقط تريع قلبي. ترجتني أمي لأتذوقه بدون جدوى. كانت قد أسندت جسمي بالاستعانة بعدة وسائد. تدحرجت القطعة، تأرجحت، طارت في الجو، ملتفة حول نفسها، معرضة لقانون الكواكب و النيازك الثابت. كان لأمي وقت كاف فقط لتمسك بالزبدية التي بدأت 101 بالانتشار على الأغطية و تمديدي بحذر بالغ. كانت ضربات الطبل في جمجمتي تغيظني."}, {"fr": "Les objets peu à peu ne partaient plus à la dérive. Ma mère vint s’asseoir non loin de mon lit sur un matelas très bas.", "ar": "لقد كانت الأشياء تنحرف عن مسارها شيئا فشيئا. جاءت أمي لتجلس على مقربة من سريري في فراش منخفض جدا."}, {"fr": "La femme du fabricant de charrues l’interpella: - Zoubida, comment va Sidi Mohammed ? Couvre-le bien et donne-lui à boire du thé chaud, sans doute a-t-il attrapé froid.", "ar": "نادتها زوجة صانع المحاريث: - زبيدة، كيف حال سيدي محمد؟ غطيه جيدا و اجعليه يشرب شايا ساخنا، لا شك في أنه قد أصيب بالزكام."}, {"fr": "Fatma intervint de sa fenêtre.", "ar": "تدخلت فاطمة من نافذتها."}, {"fr": "- Je crois plutôt qu’il souffre d’une insolation. Il faudrait lui entourer la tête d’écorces de citron et de feuilles de menthe.", "ar": "- أنا أظن بالأحرى بأنه أصيب بلفحة شمس. يجب إحاطة رأسه بقشور الليمون و أوراق النعناع."}, {"fr": "- Vous avez peut-être raison toutes les deux, mes sœurs, mais si Dieu ne daigne pas soulager ses souf- frances, tous mes soins resteront superflus. J’essaierai tous les remèdes pour hâter la guérison de mon enfant.", "ar": "ربما كان كلاكما على حق، يا أخواتي، لكن إذا لم يتكرم الله بتسكين معاناته، ستكون كل مجهوداتي بدون جدوى. سأجرب كل العلاجات لتسريع شفاء ابني."}, {"fr": "Mon père s’annonça à la porte d’entrée de la maison. Il arrivait plus tôt que d’habitude. Pendant qu’il grimpait l’escalier, ma mère s’empressa d’allumer la lampe à pétrole. Notre chambre fut inondée de lu- mière jaune. Mon père entra. Il vint se pencher sur moi. Ses orbites creusaient deux trous noirs dans son visage qui me parut pâle et fatigué. Il me toucha doucement le front, hocha la tête et me tourna le dos sans rien dire. Ma mère disposa la petite table basse pour le dîner. Ce fut, je crois, le dîner le plus triste de leur vie.", "ar": "أعلن أبي وصوله عند باب دخول المنزل. كان قد وصل أبكر من المعتاد. بينما كان يصعد الدرج، أسرعت أمي بإشعال قنديل الزيت. غمر ضوء أصفر غرفتنا. دخل أبي. جاء لينحني علي. كان محجراه يحدثان ثقبين أسودين في وجهه الذي بدا لي شاحبا و متعبا. لمس جبيني برفق، هز رأسه و أدار لي ظهره دون قول شيء. وضعت أمي الطاولة الصغيرة المنخفضة من أجل العشاء، أعتقد بأنه كان أتعس عشاء في حياتهما."}, {"fr": "De mon lit, j’apercevais le plat de faïence brune. Je n’arrivai pas à identifier la nourriture qui s’y trou- vait. Je savais qu’il y avait une sauce au safran, des légumes et de la viande. L’odeur du safran me donnait des nausées. Mon père et ma mère, chacun abîmé dans ses pensées, ne mangeaient pas, ne parlaient pas. Le chat de Zineb surgit de l’invisible, s’avança à pas feutrés de la table, regarda les formes immobiles des deux convives et miaula d’étonnement. Il miaula timidement, d’une voix plaintive, serrant sa queue entre ses pattes de derrière et rentrant son cou dans ses épaules. Son miaulement s’étouffa dans l’atmos- phère comme dans un tampon de coton. La frayeur s’empara de lui. Il écarquilla ses yeux jaunes, rabattit ses oreilles en arrière, cracha un horrible juron et s’en alla tous poils dehors.", "ar": "من سريري، كنت أرى طبق الخزف البني. لم أكن أستطيع تمييز نوع الطعام الذي كان فيه. كنت أعلم بأنه كان يحتوي على صلصة بالزعفران، خضر و لحم. كانت رائحة الزعفران تشعرني بالغثيان. لم يكن أبي و أمي، كل واحد غارق في تفكيره، يأكلان أو يتكلمان. ظهر قط زينب من العدم، اقترب بخطوات خافتة من الطاولة، نظر إلى الشكلين الساكنين للمدعوين و ماء من الدهشة. ماء بخجل، بصوت نائح، ضاما ذيله بين قائمتيه الخلفيتين و مدخلا عنقه في كتفيه. كتم مواءه في الجو مثل قطيلة قطنية. تملكه الرعب. حملق بعينيه الصفراوين، طوى أذنيه إلى الخلف، تفوه بشتيمة رهيبة و رحل خارجا بزغب منفوش."}, {"fr": "Mes parents n’avaient pas remué le petit doigt, n’avaient pas ouvert la bouche. Une angoisse de fin du monde s’appesantit sur toutes choses. Je fondis en sanglots. Mon père se secoua de sa torpeur et me demanda: -Où as-tu mal, mon enfant ? Tout hoquetant, je lui répondis:", "ar": "102 لم يكن والداي قد قاما بأية حركة، لم يقولا أية كلمة. كان جزع نهاية العالم يثقل على كل شيء. أجهشت بالبكاء. أفاق أبي من خبوه و سألني: - أين تشعر بالألم، يا طفلي؟ أجبته و أنا أفوق بشدة:"}, {"fr": "- Je n’ai pas mal, mais pourquoi ne parlez-vous pas?", "ar": "- أنا لا أشعر بالألم، لكن لماذا لا تتكلمان؟"}, {"fr": "- Nous n’avons rien à dire. Repose-toi et ne pleure plus.", "ar": "- ليس لدينا ما نقوله. ارتح و كف عن البكاء."}, {"fr": "Ma mère se réveilla à son tour, prit la table et se dirigea vers sa cuisine. Elle revint, les mains chargées du plateau et des verres pour le thé. Elle trouva mon père debout, se préparant déjà pour dormir. - Tu ne prends pas de thé ? lui demanda ma mère. - Non, et dorénavant, tu feras attention à ne pas trop gaspiller ton sucre.", "ar": "أفاقت أمي بدورها، أخذت الطاولة و اتجهت نحو مطبخها. عادت و يداها محملتان بصينية و كؤوس للشاي. وجدت أبي واقفا و قد بدأ يستعد للنوم. - سألته أمي: ألن تشرب الشاي؟ - لا، و من الآن فصاعدا ستنتبهين لكي لا تضيعي كثيرا سكرك."}, {"fr": "- Suis-je une femme qui gaspille?", "ar": "- هل أنا امرأة مبذرة؟"}, {"fr": "- Telle n’est pas ma pensée. Je veux simplement te dire qu’à partir de demain, il nous sera difficile d’avoir du sucre et du thé tous les Jours.", "ar": "- لم أكن أفكر في هذا. كنت أريد القول ببساطة بأنه ابتداء من الغد سيكون من الصعب علينا شراء السكر و الشاي كل يوم."}, {"fr": "Ma mère devint toute pâle. J’ouvris grands mes yeux pour ne rien perdre de la scène. Elle posa le pla- teau, se redressa, regarda mon père bien en face.", "ar": "أصبحت أمي شاحبة جدا. فتحت عيني جيدا لكي لا تفوتني أي لقطة من المشهد. وضعت الصينية، اعتدلت في جلستها، واجهت أبي جيدا."}, {"fr": "- Je pressens un grand malheur, dit-elle d’une voix brisée. Mon père resta silencieux, les paupières baissées. Brusquement, un claquement sonore me fit sursauter dans mon lit, me tira un gémissement de douleur. Ma mère s’était appliqué sur les joues ses deux mains avec la force du désespoir. Elle s’assit à même le sol, s’acharna sur son visage, se griffa, se tira les cheveux sans proférer une parole. Mon père se précipita pour lui retenir les mains. Ils luttèrent un bon moment. Ma mère s’écroula face contre terre.", "ar": "- قالت بصوت منكسر: أنا أحس بمكروه خطير. بقي أبي صامتا، بجفنين منخفضين. بشكل مفاجئ، جعتلني طقطقة مدوية أنتفض في سريري، أخرجت مني أنين ألم. كانت أمي قد أطبقت كلتا يديها على خديها بقوة اليأس. جلست على الأرض، انصبت على وجهها، خدشت نفسها، نتفت شعرها دون التلفظ بأية كلمة. سارع أبي بالإمساك بيديها. مكافحا لمدة طويلة. انهارت أمي بوجه مقابل الأرض."}, {"fr": "- 0 femme! Ne crains-tu plus la colère de Dieu? dit doucement mon père. Aie confiance en sa miséri- corde. Dieu ne nous abandonnera pas. Ce qui nous arrive, arrive tous les jours à des milliers de musul- mans. Le croyant est souvent éprouvé. J’ai perdu dans la cohue des enchères aux haïks tout notre maigre capital. J’avais mis l’argent dans un mouchoir. J’ai dû laisser le mouchoir tomber par terre, croyant le glisser dans ma sacoche.", "ar": "- يا امرأة! ألا تخشين غضب الله؟ قال أبي برفق: ثقي برحمته. لن يتخلى الله عنا. إن ما يحدث لنا، يحدث كل يوم لآلاف المسلمين. غالبا ما يعاني المؤمن. لقد فقدت في ازدحام مزاد الحوايك كل رأسمالنا الضئيل. كنت قد وضعت النقود في منديل. لا بد من أنني جعلت المنديل يقع مني أرضا، معتقدا بأنني أضعه في حقيبتي."}, {"fr": "Ma mère avait relevé la tête. Elle ne disait rien. Mon père, de sa voix calme, continuait: - Pourquoi se lamenter? Nous devons louer Dieu en toutes circonstances.", "ar": "كانت أمي قد رفعت رأسها. لم تكن تقول شيئا. كان أبي يتابع بصوته الهادئ: - لماذا النحيب؟ يجب أن نحمد الله في جميع الظروف."}, {"fr": "Enfin, ma mère sortit de son silence.", "ar": "103 خرجت أمي عن صمتها أخيرا."}, {"fr": "- Qu’allons-nous faire? - Je vais travailler.", "ar": "- ماذا سنفعل؟ - سأعمل. - كم أضعت؟"}, {"fr": "- Combien as-tu perdu? -Tout mon fonds de roulement. Je n’ai pas même de quoi payer mon ouvrier qui n’a rien touché cette semaine. Je dois aussi un mois de loyer au propriétaire de l’atelier. Je pensais régler toutes ces dettes et acheter du coton. - Les marchands ne pourraient-ils pas te faire crédit? Tu es connu honorablement.", "ar": "- كل رأسمالي العامل. ليس لدي حتى ما أدفع به لعاملي الذي لم يقبض شيئا هذا الأسبوع. أنا مدين أيضا بشهر من الكراء لصاحب الورشة. كنت أنوي تسديد كل هذه الديون و شراء بعض القطن. - ألا يمكن للتجار أن يقرضوك؟ أنت معروف بالشرف."}, {"fr": "- Jamais je ne m’abaisserai jusqu’à mendier du coton à l’un de ces voleurs. Je ne veux pas non plus du misérable salaire d’un ouvrier. Je suis un montagnard et un paysan. La saison de la moisson commence à peine, on embauche des moissonneurs. J’irai travailler aux environs de Fès.", "ar": "لن أتنازل أبدا إلى حد التسول من هؤلاء اللصوص. و لا أريد كذلك راتب عامل. أنا جبلي و ريفي. لقد بدأ موسم الحصاد للتو، يتم توظيف حصادين. سأذهب للعمل في ضواحي فاس."}, {"fr": "-Tu oserais m’abandonner avec un enfant malade ?", "ar": "- ستجرؤ على تركي مع طفل مريض؟"}, {"fr": "- Préférerais-tu mourir de faim ? Aimerais-tu devenir un objet de pitié pour tes amies et tes voisines? Je serai à deux jours de marche de la ville. Sidi Mohammed ira mieux demain. Fais-lui une soupe à la menthe sauvage; couvre-le bien afin qu’il transpire abondamment. Aujourd’hui, il a moins de fièvre que la nuit dernière.", "ar": "- هل تفضلين الموت من الجوع؟ هل تريدين أن تكوني محط شفقة صديقاتك و جاراتك؟ سأكون على بعد يومين مشيا من المدينة. سيتحسن سيدي محمد في الغد. حضري له شوربة بالنعناع المدبب؛ غطيه جيدا ليتعرق بغزارة. إن حماه اليوم أقل حدة من الليلة الماضية."}, {"fr": "- C’est un châtiment de Dieu qui nous accable. Ce sont ces maudits bracelets qui ont semé le malheur dans notre maison. Pourquoi ne les vendrais-tu pas ?", "ar": "- إن هذه عقوبة متعبة من الله. لقد كان ذلك السواران اللعينان هما من زرعا سوء الحظ في بيتنا. لماذا لا تبيعهما؟"}, {"fr": "- Je compte les vendre. Je vous laisserai cet argent pour vous nourrir pendant mon absence. Driss le teigneux nous reste fidèle, il viendra tous les jours faire les courses. Donne-lui à manger, il n’a personne.", "ar": "- أنا أنوي بيعهما. سأترك لكما هذه النقود لكي تتغذيا أثناء غيابي. سيبقى إدريس الفظ وفيا لنا، سيأتي كل يوم للتسوق. أطعميه فليس له أحد."}, {"fr": "Mon père se recueillit un moment.", "ar": "تفكر أبي للحظة."}, {"fr": "- Je vous laisserai seuls pendant un mois. Je tâcherai de ne rien dépenser de mon salaire, il me sera possible de remettre l’atelier en marche dès mon retour.", "ar": "- سأترككما لوحدكما لمدة شهر. سأحاول ألا أنفق شيئا من راتبي، سيكون بإمكاني أن أعيد إدارة الورشة بمجرد عودتي."}, {"fr": "Un grand silence s’établit, un silence lourd, moite, huileux et noir comme la suie. J’étouffais. Je désirais de toutes mes forces qu’une porte claquât, qu’une voisine poussât un cri de joie ou un gémissement de douleur, que quelque événement extraordinaire survînt pour rompre cette angoisse. Je voulais parler, dire n’importe quelle sottise mais ma gorge se serra et une plainte expira sur mes lèvres. Mes parents ne bougeaient pas, se transformaient peu à peu en personnages de cauchemar. Plus j’écar- quillais les yeux pour les voir, plus ils devenaient fluides, insaisissables, tantôt transparents, tantôt d’un noir agressif, mais sans contours précis. Pour la première fois, j’eus la sensation du vide absolu, de la soli- tude sans miséricorde. Mon cœur se remplit de peine. Une boule dure se forma dans ma poitrine, gênant ma respiration. Je fermai les yeux. Je priai avec ferveur. Je me sentais abandonné aux portes de l’Enfer. Non ! Je n’ai pas encore oublié ces instants. Seigneur! Je me souviens. Je me souviens de cette solitude vaste comme les immenses étendues des planètes mortes, de cette solitude où le son meurt sans écho, où les ombres se prolongent dans des profondeurs d’angoisse et de mort. Et le cœur qui saigne ! Source intarissable de peine, torrent surchauffé par les feux de mes chagrins et de mes douleurs ; cri de ma chair écrasée sous le poids de ta malédiction. Je n’étais qu’un enfant, Seigneur! Je ne savais pas que le jour nais- sait de la nuit, qu’après le sommeil de l’hiver, la terre sous la caresse du soleil souriait de toutes ses fleurs, bourdonnait de tous ses insectes, chantait par la voix de ses rossignols.", "ar": "خيم صمت مطبق، صمت ثقيل، رطب، دهني و أسود كالسناج. كنت أختنق. كنت أتمنى بكامل قوتي أن يصفق باب، أن تطلق جارة صرخة فرح أو أنين ألم، أن يحصل حدث خارق للعادة و يحطم هذا الفزع. كنت أريد الكلام، التفوه بأية حماقة لكن حلقي انقبض و خرج تأوه من شفتي. لم يكن والداي يتحركان، تحولا شيئا فشيئا إلى شخصيات كوابيس. كلما حملقت بعيني لأراهما، كلما أصبحا مبهمين، لا يمكن إدراكهما، تارة شفافين، و تارة بلون أسود حالك، لكن بدون محيط محدد. لأول مرة، 104 شعرت بإحساس الفراغ المطلق، الوحدة بدون رحمة. امتلأ قلبي بالألم. تكونت كرة صلبة في صدري معيقة تنفسي.أغلقت عيني. دعوت بورع. كنت أحس بأنه تم التخلي عني عند أبواب الجحيم. لا، لم أنس هذه اللحظات بعد. يا إلاهي! أنا أتذكر. أتذكر هذه الوحدة الكبيرة مثل المساحات الشاسعة للكواكب الميتة، هذه الوحدة التي يموت فيها الصوت بدون صدى، التي تطول فيها الظلال في أعماق الفزع و الموت. و القلب الذي ينزف! منبع ألم لاينضب، سيول ساخنة أكثر مما يجب بنيران أحزاني و آلامي؛ صوت بدني المسحوق تحت وزن لعنتك. لم أكن سوى طفل، يا إلاهي! لم أكن أعلم بأن النهار يولد من الليل، بأنه بعد نوم الشتاء، تبتسم الأرض بكل أزهارها تحت مداعبة الشمس، تئز بكل حشراتها، تغني بصوت عنادلها."}, {"fr": "Mon père nous quitta le surlendemain à l’aube. Il partit, avec pour tout bagage, une sacoche de berger, en palmier nain, dont il avait fait l’acquisition la veille, une faucille neuve et un sac en toile, avec une fermeture à coulisse. Ma mère l’avait confectionné dans un morceau de haïk de coton et l’avait bourré de provisions : olives noires, figues sèches, farine grillée et sucrée, deux pains parfumés à l’anis et dix qarcha- las. Nous appelons ainsi des petits pains ronds sucrés, parfumés à l’anis et à la fleur d’oranger et décorés de grains de sésame. J’étais réveillé quand mon père partit. Ma mère lui fit quelques recommandations et resta après son départ, prostrée sur son lit, le visage caché dans ses deux mains. J’eus la sensation que nous étions aban- donnés, que nous étions devenus orphelins. Tout le monde dans le quartier devait être au courant de nos ennuis matériels et du départ de mon père. Ils manifesteraient à notre égard une pitié ostentatoire plus humiliante que le pire mépris. Mon père parti, nous restions sans soutien, sans défense.", "ar": "تركنا أبي غد اليوم التالي عند الفجر. رحل، بخرج راع من الكاميروبس كمتاعه الوحيد، كان قد اشتراه في اليوم السابق، منجل جديد و حقيبة من الكتان، بسحاب مزلق. كانت أمي قد فصلتها بقطعة حايك قطني و حشتها بالمؤن: زيتون أسود، تين مجفف، دقيق محمص و محلى، خبزتان معطرتان بالقرنفل و عشرة قرشالات. هكذا نسمي خبزات دائرية صغيرة محلاة، معطرة بالقرنفل و أزهار شجرة البرتقال و مزينة بحبوب السمسم. كنت مستيقظا عندما رحل أبي. أعطته أمي بضع توصيات و بقيت بعد ذهابه، خائرة على سريرها، تخفي وجهها بيديها. شعرت بإحساس كأنه تم التخلي عنا، كأننا صرنا أيتاما. لا بد من أن جميع من في الحي كانوا على علم بمشاكلنا المادية و برحيل أبي. كانوا سيظهرون تجاهنا شفقة متباهية أكثر إذلالا من أسوأ احتقار. رحل أبي، بقينا دون دعم، دون دفاع."}, {"fr": "Le père, dans une famille comme la nôtre, représente une protection occulte. Point n’est besoin qu’il soit riche, son prestige moral donne force, équilibre, assurance et respectabilité. Mon père venait le soir seulement à la maison, mais il semblait que toute la journée se passait en pré- paratifs pour le recevoir. Je comprenais ce qui tourmentait ma mère, ce matin, dans la lumière du jour à peine naissant. Elle se rendait compte dans le tréfonds de son cœur que ses préparatifs seraient vains. Personne le soir ne pousserait plus notre porte, n’apporterait de l’extérieur la suave odeur du travail, ne servirait de lien entre nous et la vie exubérante de la rue.", "ar": "كان الأب، في أسرة مثل خاصتنا، يمثل حماية خفية. لا حاجة لأن يكون ثريا، تعطي هيبته المعنوية القوة، التوازن، الثقة و المحترمية. لم يكن أبي يعود إلى البيت إلا في المساء، لكن كان يبدو الأمر كأن طوال النهار كانت تحصل تحضيرات لاستقباله. كنت أفهم ما يعذب أمي، هذا الصباح، في ضوء النهار الذي كان بالكاد قد بدأ بالطلوع. كانت تدرك في خافية قلبها بأن تحضيراتها ستكون دون جدوى. لا أحد سيدفع بابنا في 105 المساء، لن يحضر رائحة العمل الزكية من الخارج، لن يكون رابطا بيننا و بين حياة الشارع الغزيرة."}, {"fr": "Pour ma mère et pour moi, mon père représentait la force, l’aventure, la sécurité, la paix. Il n’avait ja- mais quitté sa maison; les circonstances qui l’obligeaient ainsi à le faire prenaient dans notre imagination une figure hideuse.", "ar": "بالنسبة لي و بالنسبة لأمي، كان أبي يمثل القوة، المغامرة، الأمان، السلام. لم يسبق له أن ترك بيته؛ كانت الظروف التي تجبره على فعل ذلك هكذا تتخذ في مخيلتنا وجها قبيحا."}, {"fr": "La maison se réveillait peu à peu, saluait le soleil et ses bruits familiers. Je me sentais mieux ce matin. Je m’assis dans mon lit. Ma tête ne pesait rien sur mes épaules, mes bras n’étaient agités d’aucune fièvre. Maman, dis-je, est-ce que c’est long un mois?", "ar": "كان البيت يستيقظ شيئا فشيئا، يحيي الشمس و أصواتها المعتادة. كنت أحس بحال أفضل هذا الصباح. جلست في سريري. لم يكن لرأسي وزن على كتفي. لم تكن ذراعاي مريضتين بأية حمى. قلت: أمي، هل الشهر طويل؟"}, {"fr": "Ma mère se secoua de sa torpeur, regarda à droite, puis à gauche, comme pour reconnaître l’endroit où elle se trouvait et me fixa avec des yeux étonnés. .", "ar": "أفاقت أمي من خبوها، نظرت يمينا، ثم يسارا، كما لو كانت تحاول أن تعرف أين تجلس ثم حدقت في بعينين مندهشتين."}, {"fr": "- As-tu parlé, Sidi Mohammed?", "ar": "- هل تكلمت، سيدي محمد؟"}, {"fr": "- Oui, maman ; je te demande si un mois est long.", "ar": "- أجل، أمي، أنا أسألك إن كان الشهر طويلا."}, {"fr": "- Un mois dure un mois, mon fils, mais pour nous, le mois à venir sera une éternité. - Je sais attendre; toi, tu ne sais pas encore ou plutôt, tu l’as su autrefois mais tu as dû oublier. Ma mère parut abasourdie par cette réflexion.", "ar": "- إن الشهر يدوم شهرا، يا بني، لكن بالنسبة لنا، سيكون الشهر القادم قرنا. - أنا أعرف الانتظار؛ أنت، لا زلت لا تعرفين، أو، بالأحرى، لقد عرفت من قبل لكنك نسيت. بدت أمي مندهشة من هذه الملاحظة."}, {"fr": "- Qu’est-ce que tu attends?", "ar": "- ما الذي تنتظره؟"}, {"fr": "- J’attends d’être un homme. Toi, tu n’attends plus rien puisque tu es une grande personne.", "ar": "- أنتظر أن أصبح رجلا. أنت، لا تنتظرين شيئا منذ أن أصبحت شخصا بالغا."}, {"fr": "Je me tus un moment avant d’ajouter:", "ar": "سكت قليلا قبل أن أضيف:"}, {"fr": "- Quand tu étais une petite fille, tu ne pouvais pas faire tout ce que tu voulais, tu as attendu d’être une femme pour réaliser tes projets, acheter les vêtements dont tu avais envie, sortir avec Lalla Aicha ton amie, préparer les plats que tu aimais manger. Moi, je mange ce que tu me donnes, je ne sors jamais seul, je porte souvent des chemises qui ne sont pas à ma taille. L’étonnement de ma mère grandissait. Elle ne savait quoi me répondre; elle me considérait avec curio- sité. Calmement je murmurai :", "ar": "- عندما كنت بنتا صغيرة، لم تكوني تستطيعين فعل كل ما تريدينه، انتظرت أن تصبحي امرأة لتحققي مشاريعك، شراء الملابس التي كنت ترغبين فيها، الخروج مع لالة عيشة صديقتك، تحضير الأطباق التي كنت تحبين تناولها. أنا، آكل ما تعطينني إياه، لا أخرج لوحدي أبدا، دائما ألبس قمصانا ليست على مقاسي. كانت دهشة أمي تزداد. لم تكن تعرف بماذا تجيبني؛ كانت تحدق بي بفضول."}, {"fr": "- Quand je serai un homme, je porterai de belles djellabas blanches qui seront lavées tous les jours, je mangerai tous les matins au moins une livre de beignets très chauds avec beaucoup de beurre, parfois avec du miel. J’aurai quarante chats qui m’obéiront toujours. Ils ne feront jamais de saletés dans les coins. D’ailleurs, nous habiterons une autre maison avec un bigaradier dans la cour. Un sourire éclaira le visage de ma mère.", "ar": "كنت أهمس بهدوء: 106 عندما سأصير رجلا، سألبس جلابيب بيضاء جميلة ستغسل كل يوم، سآكل كل يوم على الأقل رطلا من الفطائر الساخنة جدا بالكثير من الزبدة، و أحيانا بالعسل. سيكون لدي أربعون قطا يطيعونني دائما. لن يتغوطوا في الزوايا أبدا. على أية حال، سنسكن منزلا آخر بنارنج في الساحة. أنارت ابتسامة وجه أمي."}, {"fr": "- Jamais ta femme n’acceptera de veiller sur ton troupeau de chats.", "ar": "- لن تقبل زوجتك بالاعتناء بقطيع قططك أبدا."}, {"fr": "- Je ne me marie pas, toi, tu aimes les chats, tu pourras t’en occuper.", "ar": "- لن أتزوج، أنت، تحبين القطط، ستتكفلين بالأمر."}, {"fr": "Elle éclata franchement de rire. Sa gaîté soudain me rendit toute ma confiance. Je ris plus fort qu’elle; je battis des mains. Ma mère mit son index sur les lèvres et me dit:", "ar": "بصراحة لقد انفجرت بالضحك. فجأة أعاد مرحها كل ثقتي بنفسي. ضحكت أكثر منها؛ كنت أضرب بيدي. وضعت أمي سبابتها على شفتيها و قالت لي:"}, {"fr": "- Que diraient les voisins s’ils t’entendaient rire de la sorte le jour du départ de ton père ?", "ar": "- ماذا سيقول الجيران لو سمعوك تضحك بهذه الطريقة في يوم رحيل أبيك."}, {"fr": "- Mon père reviendra bientôt et nous serons de nouveau très riches.", "ar": "- سيعود أبي قريبا و سنعود أغنياء جدا من جديد."}, {"fr": "- Mais nous n’avons jamais été riches.", "ar": "- لكن لم يسبق لنا أن كنا أغنياء."}, {"fr": "- Si, nous n’avions pas faim ; et notre chambre n’est-elle pas la plus jolie de la maison ?", "ar": "- بلى، لم نكن نشعر بالجوع، أليست غرفتنا أجمل واحدة في المنزل؟"}, {"fr": "- Repose-roi, mon petit ; tant que je serai vivante, tu n’auras jamais faim, dussé-je mendier. Quelqu’un gratta timidement à la porte. Ma mère se leva.", "ar": "- ارتح، يا صغيري، لن تشعر بالجوع أبدا طالما أنا حية، حتى و لو اضطررت للتسول. حك أحدهم الباب بخجل. نهضت أمي."}, {"fr": "- Qui est là ? dit-elle tout en se dirigeant vers le couloir d’entrée. Suivit un long conciliabule, tout en murmures et en chuchotements. J’entendis finalement ma mère dire d’une voix pressante: - Entre, Fatma ! Entre et donne-le-lui toi-même; à moi il refusera, il est si entêté! Entre donc!", "ar": "- قالت و هي تتجه إلى ممر الدخول: من هناك؟ تبع هذا وشوشة طويلة، كلها همسات و هسهسات. أخيرا سمعت أمي تقول بصوت ملح: - أدخلي، فاطمة! أدخلي و أعطيه له بنفسك؛ أنا لن يقبله مني، إنه عنيد جدا! هيا ادخلي!"}, {"fr": "Fatma Bziouya parut. Elle tenait à la main un bol fumant. Elle s’approcha de moi, me fit un large sourire et me demanda:", "ar": "ظهرت فاطمة بزيوية. كانت تحمل في يدها زبدية داخنة. اقتربت مني، أظهرت لي ابتسامة عريضة و سألتني:"}, {"fr": "- Comment te sens-tu ce matin, fqih !", "ar": "- كيف تشعر هذا الصباح، أيها الفقيه؟"}, {"fr": "Je ne répondis rien. Je ne voulais engager aucune conversation avec cette femme qui venait m’ama- douer afin de me faire avaler quelque breuvage infect.", "ar": "لم أجب بشيء، لم أرد الانخراط في أي حديث مع هذه المرأة التي أتت لتتملقني لكي تجعلني أبتلع شرابا نتنا."}, {"fr": "- J’ai préparé pour toi du tadeffi ! Ne voudrais-tu pas y goûter?", "ar": "- لقد حضرت تادفي من أجلك! ألا تريد أن تتذوقه؟"}, {"fr": "D’ordinaire, j’aimais le tadeffi, ce potage parfumé à la menthe sauvage. Par principe, je détournai mon visage du côté du mur. Je pensais mettre ainsi fin à toute tentative de persuasion. Ma mère vint au secours de notre voisine. - Je suis sûre que tu l’aimeras, cette soupe. Après, j’enverrai Zineb t’acheter un beignet.", "ar": "107 كنت أحب تادفي عادة، هذا الحساء المعطر بالنعناع المدبب. انطلاقا من مبادئي، أدرت وجهي إلى جهة الحائط. كنت أظن بأنني أنهي هكذا أية محاولة إقناع. أتت أمي لتنقذ جارتنا. - أنا متأكدة من أن هذه الشوربة ستعجبك. بعدها سأرسل زينب لتشتري لك فطيرة."}, {"fr": "Je me fis encore prier un moment. Je finis par me mettre sur mon séant. Je pris le bol, le humai d’une narine méfiante, regardai les deux femmes penchées sur moi avec sollicitude et déclarai que je n’aimais pas la soupe piquante.", "ar": "جعلتهما تترجيانني لمدة أطول. انتهيت بالجلوس. أخذت الزبدية، شممتها بأنف حذر، نظرت إلى المرأتين المنحنيتين علي باهتمام و أعلنت بأنني لا أحب الشوربة الحريفة."}, {"fr": "Toutes les deux me répondirent de concert, avec un ensemble émouvant, qu’il n’y avait pas dans cette soupe la moindre parcelle de piment ou de poivre. Je regardai ma mère dans les yeux et lui demandai à brûle-pourpoint comment elle pouvait le savoir puisqu’elle n’avait pas goûté à cette soupe. Elle tenta de me répondre, chercha sa phrase, s’embrouilla, soupira, leva les yeux au plafond pour prendre à témoin les solives enfumées et partit se réfugier dans la cuisine.", "ar": "أجابتني الاثنتان باتفاق، بشكل مؤثر، بأنه لم يكن في هذه الشوربة أي ذرة من الفلفل أو الفلفل الأسود. نظرت إلى أمي في العينين و سألتها بشكل مفاجئ كيف لها أن تعرف ذلك إن لم تكن قد تذوقت هذه الشوربة. حاولت أن تجيبني، بحثت عن جملتها، ارتبكت، تنهدت، رفعت عينيها إلى السماء لتشهد العوارض الخشبية المليئة بالدخان و ذهبت لتحتمي في المطبخ."}, {"fr": "Fatma insistait, -Moi, je t’affirme qu’il n’y a pas d’épices dans ce tadeffi. D’un geste, je lui collai le bol dans les mains. -Tout le monde sait que le tadeffi sans épices est absolument immangeable. Ce n’est pas parce que je lis malade que tu vas me faire manger de la colle de farine.", "ar": "كانت فاطمة تلح: - أنا، أؤكد لك بأنه لا توجد أية توابل في هذا التادفي. بحركة واحدة، وضعت الزبدية في يديها. - يعلم الجميع بأنه لا يمكن شرب التادفي بدون توابل. ليس لأنني مريض فسوف تجعلينني أشرب صمغ الدقيق."}, {"fr": "Fatma perdit patience.", "ar": "فقدت فاطمة صبرها."}, {"fr": "- Je te dis que c’est bon! Goûte d’abord avant de dire de telles sottises. Prends vite.", "ar": "- أقول لك بأنه لذيذ! تذوق أولا قبل أن تتفوه بمثل هذه الحماقات. خذ بسرعة."}, {"fr": "Je boudais toujours. Fatma devint tendre. D’une voix caressante elle m’appela: bonbon acidulé, petit fromage blanc, vermicelle au lait. Je ne pouvais pas résister à des mots si câlins, je repris le bol de tadeffi. J’avais passablement faim, je bus cette bonne soupe à grandes goulées.", "ar": "كنت لا أزال أحرد. أصبحت فاطمة حنونة. نادتني بصوت لطيف: حلوى سكرية بطعم الحامض، جبنة صغيرة بيضاء، شعرية بالحليب. لم أكن أستطيع مقاومة كلمات مدللة جدا كهذه، استعدت زبدية التادفي. كنت أشعر بالجوع بشكل مقبول، شربت هذه الشوربة اللذيذة ببلعات كبيرة."}, {"fr": "Je demandai ensuite à ma mère de me débarbouiller. Je changeai de chemise, me vêtis de ma djellaba. Je me sentais guéri mais pas encore assez fort pour retourner à l’école.", "ar": "بعد ذلك طلبت من أمي أن تنظفني. غيرت قميصي، لبست جلبابي. كنت أحس بأنني شفيت و لكن لست قويا كفاية لأعود إلى الكتاب."}, {"fr": "Pendant quelques jours, j’allais jouir de vraies vacances.", "ar": "طوال بضعة أيام، كنت سأنعم بعطلة حقيقية."}, {"fr": "Rahma m’aperçut à la fenêtre et me salua joyeusement :", "ar": "رأتني رحمة عند النافذة و حيتني بفرح:"}, {"fr": "- Louange à Dieu ! Sidi Mohammed ! Te voilà rétabli. Nous étions bien inquiets à ton sujet. Promets- moi de ne jamais tomber malade, j’en perds l’appétit, je le jure par Dieu et par ses saints vénérés.", "ar": "108 - الحمد لله! سيدي محمد! ها أنت قد استعدت عافيتك. كنا قلقين جدا بشأنك. عدني بألا تمرض مرة أخرى، لأنني أفقد شهيتي، أقسم بالله و بأوليائه المقدسين."}, {"fr": "- Qu’Allah vous conserve toi et les tiens en excellente santé, Rahma, qu’il vous donne bonheur et pros- périté, répondit ma mère du fond de sa cuisine.", "ar": "- أجابت أمي من طرف مطبخها: فليحفظك الله أنت و أقرباؤك في صحة ممتازة، يا رحمة، فليعطكم السعادة و الازدهار."}, {"fr": "Rahma s’accouda à la grille de sa fenêtre décidée à poursuivre le dialogue.", "ar": "اتكأت رحمة على سياج نافذتها مقررة استئناف الحوار."}, {"fr": "- Amine, Ô ma sœur Zoubida. Est-ce que Sidi Abdeslem est parti ce matin ? Je l’ai entendu descendre l’escalier. - Oui, il doit être déjà loin. - Dieu vous le ramènera sain et sauf.", "ar": "- آمين، يا أختي زبيدة. هل رحل سيدي عبد السلام هذا الصباح؟ لقد سمعته ينزل الدرج. - أجل، لا بد من أنه بعيد الآن."}, {"fr": "Rahma s’adressa à toute la maison pour déclarer:", "ar": "- سيعيده الله لكما سالما معافى."}, {"fr": "- Les temps deviennent durs pour les pauvres gens que nous sommes, mais sachons louer Dieu dans la joie comme dans l’adversité. Pour toute réponse, quelqu’un éternua très fort au rez-de-chaussée. Il éternua trois fois, puis se moucha avec conviction. Le bruit de ses narines me rappela le son de la trompette du Ramadan. J’éclatai d’un rire joyeux.", "ar": "خاطبت رحمة كل من في المنزل لتعلن: - إن الزمن يصبح صعبا على الناس المساكين مثلنا، لكن لنحمد الله في السراء والضراء. للرد على هذا، عطس أحدهم بشدة في الطابق الأرضي. عطس ثلاثة مرات، ثم تمخط بنخوة. ذكرني صوت أنفه بصوت بوق رمضان. انفجرت ضاحكا بفرح."}, {"fr": "Ma mère me prit par les épaules, me ramena vers mon matelas. Elle me conseilla d’une voix ferme de m’allonger. Je n’étais pas encore assez fort pour me livrer à des excentricités. Je devais rester au lit. Elle me recommanda de réciter quelques versets du Coran afin de ne pas oublier tout ce que j’avais appris et pour attirer la bénédiction sur notre maison et sur la tête de mon père, parti vers l’inconnu.", "ar": "أمسكتني أمي من كتفي، أعادتني إلى فراشي. نصحتني بصوت حازم بأن أتمدد. لم أكن قويا كفاية لأقوم بشذوذ مشابه. كان يجب علي البقاء في السرير. أوصتني بتلاوة بعض الآيات القرآنية لكي لا أنسى كل ما حفظته و لكي أجلب البركة إلى بيتنا و إلى أبي الذي رحل نحو المجهول."}, {"fr": "Je m’installai sur le matelas, l’air renfrogné. Je n’avais pas envie de réciter des versets du Coran, je n’avais plus envie de rien. J’écoutais d’une oreille distraite les papotages ordinaires des femmes de la maison. Je ne prêtais aucune attention à leurs propos. Malgré le soleil, tout me paraissait sombre. La saleté des murs que j’apercevais par notre fenêtre me dégoûtait. Enfin, ma mère servit le déjeuner. Le menu se composait de deux beignets qui m’étaient destinés, de beurre rance, d’olives noires et d’une botte de radis, cadeau de Fatma Bziouya ou plutôt de son mari, Mohammed le jardinier.", "ar": "جلست على الفراش، بوجه متجهم. لم أكن أرغب في تلاوة آيات قرآنية، لم أعد أرغب بشيء. كنت أسمع بأذن شاردة الثرثرات المألوفة لنساء البيت. لم أكن أعير أي اهتمام لكلماتهن. رغم الشمس، كان كل شيء يبدو لي مظلما. كان وسخ الجدران الذي كنت أراه من نافذتنا يثير اشمئزازي. أخيرا، قدمت أمي الغداء. كانت الوجبة تتكون من فطيرتين كانتا لي، زبدة زنخة، زيتون أسود و باقة فجل كانت هدية من فاطمة بزيوية أو بالأحرى من زوجها، محمد البستاني."}, {"fr": "J’entamai un beignet. Il devint dans ma bouche pâteux et sans goût. Je le mâchai, le remâchai, le pro- menant d’une joue à l’autre; je finis par l’avaler sans plaisir. La table débarrassée, ma mère posa à même le bois, une petite théière d’émail dont nous ne nous servions jamais et deux verres. Sans plateau, sans bouilloire dans la pièce, sans le rituel habituel qui présidait à la préparation du thé, une impression de dénuement flottait dans l’atmosphère. Seuls, les ménages misérables procédaient de la sorte.", "ar": "بدأت بتناول فطيرة. أصبحت عجينية و بدون مذاق في فمي. مضغتها، أعدت مضغها، ممررا إياها من خد لآخر؛ انتهيت بابتلاعها دون لذة. أخليت الطاولة، وضعت أمي على الطاولة مباشرة برادا من المينا لم نكن 109 نستعمله أبدا و كأسين. دون صينية، دون مرجل في الغرفة، دون الطقس المعتاد الذي كان يسبق تحضير الشاي، كان انطباع فقر يطفو في الجو. وحدها الأسر البائسة من كانت تتصرف بهذه الطريقة."}, {"fr": "A mes réflexions, ma mère répondit qu’elle ne pouvait plus passer son temps à faire briller le plateau, laver les verres, astiquer la théière d’étain. Qu’allait-elle donc faire de son temps ? Je ne savais.", "ar": "أجابت أمي على ملاحظاتي بأنها لم تعد تستطيع تضييع وقتها في تلميع الصينية، غسل الكؤوس، صقل البراد القصديري. ماذا كانت ستفعل بوقتها إذن؟ لم أكن أعلم."}, {"fr": "Après déjeuner, ma mère me recommanda d’être bien sage, prit son haïk et partit rendre visite à Lalla Aicha son amie. Elles avaient tellement de choses à se dire. Je me souviens encore des heures affreuses passées à attendre. Sans oser me mettre à la fenêtre, répri- mant l’envie que j’avais de courir dans l’escalier, de sauter au soleil sur la terrasse. Je jetai un coup d’œil dans ma Boîte à Merveilles. Ce n’était plus une boîte à merveilles mais un cercueil où gisaient les pi- toyables cadavres de mes rêves. Je fis une atroce grimace. Les voisines ne devaient pas m’entendre pleurer. Je me mouchai dans un vieux chiffon qui traînait par terre. Couché sur le dos, je contemplai fixement les taches squameuses qui constellaient les murs de notre chambre. Elles ne bougeaient plus. Elles organi- saient autrefois en mon honneur des ballets à ravir les yeux. Je passais des heures à suivre les évolutions de ces formes changeantes. Maintenant, elles n’étaient plus que des taches figées qui me donnaient la nausée.", "ar": "بعد الغداء، أوصتني أمي بأن أكون عاقلا جدا، لبست حائكها و ذهبت لزيارة صديقتها لالة عيشة. كان لديهما الكثير لتقولاه لبعضهما البعض. لا زلت أتذكر الساعات الرهيبة التي أمضيتها في انتظارها. دون أن أجرؤ على الذهاب إلى النافذة، كابحا رغبتي في الجري في الدرج، في القفز على السطح تحت الشمس. ألقيت نظرة على علبة العجائب خاصتي. لم تعد علبة عجائب بل تابوتا ترقد فيه جثث أحلامي المثيرة للشفقة. قمت بتكشيرة فظيعة. لا بد من أن الجارات لم تسمعنني و أنا أبكي. مسحت أنفي بخرقة قديمة كانت مرمية على الأرض. ممددا على ظهري، تأملت البقع المتقشرة التي كانت تتراكم على جدران غرفتنا. لم تعد تتحرك. كانت تنظم على شرفي حفلات راقصة تفتن العيون فيما مضى. كنت أمضي ساعات و أنا أتابع هذه الأشكال المتغيرة. لم تعد الآن سوى بقع ساكنة تشعرني بالغثيان."}, {"fr": "Mon cœur se mit à battre de tristesse, d’angoisse, de dépit et de colère. Il battait surtout de peur. Mal- gré les discussions des voisines, le bruit familier des petits balais de doum, les crépitements des étincelles, les ronflements des soufflets, j’avais peur. Épuisé par mes larmes silencieuses, je finis par m’endormir. Quand ma mère revint, j’avais de nouveau la fièvre. Elle me couvrit chaudement, s’assit à côté de mon lit et pleura longtemps. Elle chantonnait doucement, s’interrompait de temps à autre pour se moucher, reprenait son murmure. Le soir, elle ne prépara pas de dîner, elle se coucha tôt. J’avais de la peine à m’endormir. Je m’agitais dans mon lit, me tournais, me retournais sans réussir à sombrer dans le sommeil. Brusquement l’orage se déchaîna. Le vent fonça sur la maison avec des hurlements de fureur. Les portes claquèrent. Au milieu des gémissements, des pleurs et des chuintements de la rafale, s’éleva un chant ti- mide de flûtiau. Ce n’était pas une flûte humaine, semblable à ces roseaux à sept trous qui font danser les fantômes à la lumière des étoiles, c’était, à n’en pas douter, quelque instrument d’une matière luisante et froide, forgé sans bruit au fond des eaux par un djinn atteint de démence. Elle parlait un langage à la fois déchirant et suave, parfois incompréhensible, grimaçant, maléfique, parfois d’une nostalgie farouche. Il y avait des appels, des supplications, des reproches, des rires d’hyène, de longs cris de douleur, des mots d’amour et des phrases de colère.", "ar": "بدأ قلبي بالدق من الحزن، من الفزع، من الغيظ و الغضب. كان يدق بالأخص من الخوف. رغم أحاديث الجارات، الصوت المألوف لمكانس الدوم، صرير الشرارات، أزيز المنافخ، كنت أشعر بالخوف. متعبا من دموعي الصامتة، انتهيت بالنوم. عندما عادت أمي، كنت قد أصبت بالحمى من جديد. غطتني بشكل دافئ، جلست بجانب سريري و بكت مطولا. كانت تدندن بهدوء، تتوقف من وقت لآخر لتمسح أنفها، تعود لهمسها. في المساء، لم تحضر العشاء، نامت باكرا. وجدت صعوبة في النوم. كنت أتحرك في سريري، أستدير، أتقلب دون أن أتمكن من الغطيط في النوم. بشكل مفاجئ، هبت العاصفة. انقض الريح على بيتنا بهزيز الغضب. صفقت الأبواب. وسط تأوهات، دموع و نعيب العاصفة، سمع لحن شبابة خافت. لم يكن نايا بشريا، تشبه تلك الأبواص ذات السبع ثقوب التي تجعل 110 الأشباح ترقص تحت ضوء النجوم، كانت، بلا شك، بعض الآلات الموسيقية من مادة لامعة و باردة، مطرقة في أعماق المياه من طرف جن فقد عقله. كانت تتكلم أحيانا بلغة مؤثرة و عذبة، أحيانا مبهمة، متجهمة، شريرة، أحيانا بحنين شرس. كان هناك نداءات، توسلات، توبيخات، ضحكات الضبع، صراخات ألم طويلة، كلمات حب و جمل غضب."}, {"fr": "Le vent riait, jouait avec les portes, les cognait de fureur. Pour conjurer ces forces obscures, je récitai trois fois la sourate de l’Unité. Tremblant de tous mes membres, j’enfouis mon visage dans un coussin ; Je finis par m’endormir.", "ar": "كان الريح يضحك، يلعب مع الأبواب، يضربها من الغضب. لكي يعيذ قواه المظلمة، تلوت ثلاثة مرات سورة الإخلاص. مرتجفا بكل أطرافي، وضعت وسادة على وجهي؛ انتهيت بالنوم."}, {"fr": "Ma vie s’écoulait dans deux mondes opposés. Le jour je subissais toutes sortes de contraintes, je prenais part à des drames que je ne comprenais pas, la nuit me servait d’appât à ses monstres, me lançait dans le vide de ses abîmes, me faisait don de fruits que mes mains ne pouvaient saisir. Vie double, semée d’em- bûches, de mirages, de farces, mais à laquelle je finis par m’habituer. Je n’agissais pas, je subissais. Chaque fragment du devenir couvait une parcelle de mystère. Les instants se succédaient avec chacun sa charge de joie, hélas! trop éphémère, avec son poids de peine qui imprimait dans ma chair sa meurtrissure. Au gré de l’humeur des uns et de la fantaisie des autres, mes jours me paraissaient sombres ou radieux, mes nuits, un havre de repos, un lieu de torture, un moment de félicité, le douloureux calvaire des âmes damnées de toute éternité.", "ar": "كانت حياتي تمضي في عالمين متعارضين. في النهار كنت أعاني من كل أنواع الإكراهات، كنت أشارك في بلايا لم أكن أفهمها، كان الليل يقدمني كطعم لوحوشه، يرميني في فراغ هاوياته، يهديني فواكه لم تكن يداي تستطيعان إمساكها. حياة مزدوجة، مليئة بالعوائق، بالسرابات، المقالب، لكن الأمر انتهى بي بالاعتياد عليها. لم أكن أتصرف، كنت أتحمل. كانت كل قطعة من المستقبل تخبئ ذرة غموض. كانت كل واحدة من اللحظات تتعاقب بشحنة فرحها، للأسف! سريعة الزوال، بوزن ألمها الذي كان يطبع على جسمي كدمته. حسب مزاج البعض أو نزوة الآخرين، كانت أيامي تبدو لي مظلمة أو مشرقة، ليالي، ملجأ راحة، مكان تعذيب، لحظة هناء، محنة الأرواح الملعونة إلى الأبد."}, {"fr": "Ceci me donna par la suite le goût de l’aventure, à savoir: le goût de la mort. Je mourais chaque soir pour renaître instantanément dans un univers sans dimensions. Je ressuscitais chaque matin pour retrou- ver le soleil, le chant des moineaux, le pain, le blé et la fraîcheur de l’eau de source. Le pain et l’eau avaient bon goût et je me réjouissais d’être sur une terre où ils ne manquaient pas. Cependant, dans les heures de chagrin et de solitude, ils me paraissaient amers, fades, durs pour mon gosier trop étroit. Bien sûr, je préférais le jour à la nuit, les jours en principe se tenaient, obéissaient à la à logique du temps, se succédaient en apparence bien en ordre. Les nuits enfantaient des personnages, des sites, des événements, lesquels créaient leur espace et leur temps. Mes parents, les voisins, les enfants du Msid , le maître et sa baguette de cognassier habitaient la terre ensoleillée mais il m’arrivait la nuit de les rencontrer dans des pays lointains privés de lumière, dans des sentiers hérissés de dangers. Nos rapports, souvent n’étaient plus les mêmes que pendant le jour. Maintes fois, j’essayai de les éviter, mes efforts s’avéraient toujours vains. Je ne pouvais leur échapper, ni dans ce monde, ni dans aucun autre. Il leur était donné de me choyer ou de me tourmenter selon leur bon plaisir. Plus tard je me défendrai. Maintenant, je n’étais qu’un enfant, un enfant couché en chien de fusil qui ronflait discrètement alors que tous les hommes étaient déjà partis au travail, alors que toutes les voisines avaient déjà procédé à leur toilette. Ma mère me réveilla.", "ar": "أعطاني هذا مذاق المغامرة فيما بعد، أي: مذاق الموت. كنت أموت كل ليلة لأبعث فورا في عالم بدون أبعاد. كنت أعود للحياة كل صباح لأرى الشمس، غناء الدوريات، خبز القمح و برودة ماء العين. كان للخبز و الماء طعم لذيذ و كنت أفرح لكوني على أرض لا ينقصان فيها. مع ذلك، في ساعات كآبتي و وحدتي، كانا يبدوان لي مرين، تفهين، صلبين على حلقي الضيق جدا. بالطبع، كنت أفضل النهار على الليل، كانت الأيام تبقى مبدئيا خاضعة لمنطق الزمن، تتعاقب بشكل مرتب جيدا من حيث المظهر. كانت الليالي تخلق شخصيات، مواقع، أزمنة. كان والداي، الجيران، أطفال المسيد، المعلم و عصا السفرجل خاصته يسكنون الأرض المشمسة لكن كان 111 يحدث لي في الليل أن ألتقي بهم في بلدان بعيدة محرومين من الضوء، في دروب محفوفة بالمخاطر. كانت علاقاتنا غالبا لا تكون كما كانت عليه في النهار. حاولت عدة مرات تجنبهم لكن كان يتبين بأن مجهوداتي كانت دون جدوى. لم أكن أستطيع الإفلات منهم، لا في هذا العالم، و لا في أي واحد آخر. كان قد عهد لهم بتدليلي أو تعذيبي كما يحلو لهم. بعد ذلك سأدافع عن نفسي. الآن، لم أكن سوى طفل، طفل مصافق كان يشخر بصمت بينما كان جميع الرجال قد ذهبوا للعمل، بينما كانت جميع الجارات قد اغتسلن. أيقظتني أمي:"}, {"fr": "- Sidi Mohammed, tu es mal couché, tu vas attraper le torticolis.", "ar": "- سيدي محمد، أنت تنام بشكل خاطئ، ستصاب بالصعر."}, {"fr": "J’entrouvris péniblement mes paupières. Le jour inondait notre chambre.", "ar": "واربت جفني بصعوبة. كان ضوء النهار يغمر غرفتنا."}, {"fr": "- Lève-toi et va faire tes ablutions, pendant ce temps, je vais te faire cuire un œuf.", "ar": "- انهض و اذهب لتتوضأ، سأطبخ لك بيضة خلال هذا الوقت."}, {"fr": "- J’aime beaucoup les œufs à l’huile avec du piment rouge et du persil.", "ar": "- أحب كثيرا البيض بالزيت مع الفلفل الأحمر و البقدونس."}, {"fr": "- Je sais, je mettrai du piment rouge et du persil et même une pincée de cumin. Cette phrase n’échappa pas à l’oreille de Rahma. Elle se mit à sa fenêtre et cria:", "ar": "- أعلم، سأضع فلفلا أحمر، بقدونس و حفنة كمون أيضا. لم تفلت هذه الجملة من أذن رحمة. وقفت عند نافذتها و صاحت:"}, {"fr": "- Nous appelons ce plat une omelette juive, c’est délicieux.", "ar": "- نسمي هذا الطبق بالعجة اليهودية، إنها لذيذة."}, {"fr": "Ma mère répondit :", "ar": "أجابت أمي:"}, {"fr": "- Sidi Mohammed est encore malade, il a des envies comme une femme enceinte.", "ar": "- لازال سيدي محمد مريضا، إن لديه وحما مثل المرأة الحامل."}, {"fr": "Toutes les voisines se mêlèrent à la conversation. Les unes riaient, les autres faisaient des vœux pour mon prompt rétablissement. Tante Kanza, la choua- fa, raconta un de ses souvenirs: elle avait connu une jeune femme enceinte qui, un jour, se rendant au bain, avait vu dans une boutique de laitier de beaux fromages blancs. Elle désira en goûter, mais le laitier, un avaricieux, un disciple de Satan, refusa de lui en offrir la moindre miette. L’enfant arriva au monde quelques mois plus tard. Sur son ventre, se détachait bien visible un morceau de fromage blanc.", "ar": "أنصتت كل الجارات إلى الحديث. كانت بعضهن تضحكن، و أخريات تتمنين لي الشفاء العاجل. حكت خالتي كنزة، الشوافة، واحدة من ذكرياتها: كانت قد عرفت امرأة شابة حاملا كانت في يوم من الأيام ذاهبة إلى الحمام فرأت في دكان لمشتقات الحليب جبنا أبيض جميلا. أرادت تذوقه، لكن اللبان، مقتر، تابع للشيطان، رفض إعطاءها أدنى فتات. ولد الطفل بعد بضعة شهور. على بطنه، كانت تبرز بوضوح قطعة جبن أبيض."}, {"fr": "Tante Kanza l’avait vu, de ses yeux vu.", "ar": "كانت خالتي كنزة قد رأتها بأم عينيها."}, {"fr": "- Heureusement, dit une voix, sans la moindre ironie, que le morceau de fromage ne pendait pas à son front ou à l’une de ses joues.", "ar": "- قال صوت بدون أدنى سخرية: من حسن الحظ أن قطعة الجبن لم تظهر على جبينه أو واحد من خدوده."}, {"fr": "Driss, le teigneux, appela de la porte d’entrée. Ma mère lui demanda de patienter une seconde, elle allait descendre. Elle coupa un gros quartier de pain, courut à sa cuisine l’enduire de beurre rance, empa- queta dans un papier graisseux une poignée d’olives noires et s’engouffra dans l’escalier. Avant de remon- ter, elle emprunta le seau de tante Kanza, le remplit d’eau du puits et grimpa péniblement les marches. A la porte de notre cuisine, trônait depuis toujours la jarre d’eau potable en terre poreuse. Ma mère y versa le seau. Elle revint vers moi et me dit:", "ar": "نادى إدريس الفظ من باب الدخول. طلبت منه أمي أن ينتظر للحظة، كانت ستنزل. قطعت ربع خبزة كبير، جرت إلى مطبخها لدهنه بالزبدة الزنخة، لفت قبضة من الزيتون الأسود داخل ورق أدسم و اندفعت إلى الدرج. قبل 112 أن تصعد من جديد، استعارت دلو خالتي كنزة، ملأته بماء البئر و صعدت الدرجات بصعوبة. كانت دائما تتصدر باب مطبخنا جرة الماء الصالح للشرب المصنوعة من طين مسامي. سكبت أمي الدلو فيها. عادت إلي و قالت لي:"}, {"fr": "- Je vais me préparer, nous allons sortir ensemble; nous passerons prendre Lalla Aïcha qui nous attend. Aujourd’hui, je t’emmène voir quelqu’un que tu ne con nais pas. N’es-tu pas content de sortir un peu ? Nous allons très loin ...", "ar": "- سوف أستعد، سنخرج سوية؛ سنمر لاصطحاب لالة عيشة التي تنتظرنا. سآخذك اليوم لترى شخصا لا تعرفه. ألست سعيدا بالخروج قليلا؟ سنذهب بعيدا..."}, {"fr": "Tout en parlant, elle s’enveloppait dans son haïk, serrait son voile, secouait la poussière de ses ba- bouches.", "ar": "بينما كانت تتكلم، كانت تلف نفسها بحائكها، تشد حجابها، تنفض الغبار عن بلغتها."}, {"fr": "- Tu ne connais pas le quartier Qalqlyine, tu verras, c’est un joli quartier avec des derbs étroits qui des- cendent en pente, des maisons aux plafonds peints et un ou deux figuiers qui sortent des murs et se pen- chent sur la ruelle. Tu aimeras tout cela. Mouche-toi, qu’as-tu fait de ton mouchoir ? Mouche-toi donc !", "ar": "- أنت لا تعرف حي كالكليين، سترى، إنه حي جميل بدروب ضيقة ينزل منحدرا، منازل بسقوف مطلية و شجرة تين أو اثنتان تخرج من الجدران و تتدلى على الزقاق. سيعجبك كل هذا. امسح أنفك، ما الذي فعلته بمنديلك؟ فلتمسح أنفك إذن!"}, {"fr": "Je tournais en rond à la recherche de mon mouchoir, je le découvris enfin sous un coussin tout froissé et collé. Je tirai dessus pour avoir une surface suffisante pour y placer mon nez. Je me mouchai fort, si fort que mes doigts furent tout mouillés. Je jetai le mouchoir et m’essuyai les doigts à même ma djellaba.", "ar": "كنت أضيع وقتي في البحث عن منديلي، وجدته أخيرا تحت وسادة منكمشة و ملتصقة. شددته لأحصل على مساحة كافية لأضع فيها أنفي. مسحت أنفي بشدة، بشدة لدرجة أن أصابعي كلها تبللت. رميت المنديل و مسحت أصابعي بجلبابي."}, {"fr": "Nous nous disposions à quitter la chambre quand Fatma Bziouya interpella ma mère.", "ar": "كنا نهم بالخروج من البيت عندما نادت فاطمة بزيوية أمي."}, {"fr": "- Lalla Zoubida ! Où vas-tu ?", "ar": "- لالة زبيدة، إلى أين أنت ذاهبة؟"}, {"fr": "- Lalla Aicha nous a invités à passer la journée, avec elle, elle est si seule!", "ar": "- لقد دعتنا لالة عيشة لقضاء اليوم عندها، إنها وحيدة جدا!"}, {"fr": "- Que devient son mari, Sidi Larbi ? N’a-t-il pas encore répudié la fille du coiffeur ?", "ar": "- ماذا حل بزوجها، سيدي العربي؟ ألم يطلق ابنة الحلاق بعد؟"}, {"fr": "- Non, mais je sais qu’il paie actuellement son ingratitude envers Lalla Aïcha. Sa belle-famille lui rend les jours amers, l’accuse de laisser sa jeune femme souffrir de faim. Ma mère enleva son voile qui la gênait pour parler. La maison était tout oreilles. Quelle aubaine d’en savoir plus long que les autres ! Quelle magnifique occasion de montrer à routes ces envieuses dans quelle estime la tenait Lalla Aicha. Elle lui confiait tous ses secrets! A la fin, elle laissa entendre qu’elle en savait beaucoup plus long, mais que les convenances lui interdisaient de tout révéler. Nous partîmes enfin. Je marchais devant, dévorant des yeux les étalages. Arrivés à Sidi Ahmed Tijani, ma mère se dirigea vers le tronc aux offrandes. Dans un mur couvert de mosaïques, s’ouvrait un trou, à hauteur d’homme, sur- monté d’une grille en bronze ouvragé. Ma mère ne déposa aucune offrande dans le trou.", "ar": "- لا، لكنني أعرف بأنه يدفع حاليا ثمن نكرانه لجميل لالة عيشة. إن عائلة زوجته تجعل أيامه مرة، إنها تتهمه بترك زوجته الشابة تعاني من الجوع. نزعت أمي حجابها الذي كان يزعجها لكي تتكلم. كان البيت كله آذانا صاغية. يالها من مصادفة سعيدة أن تعرف أكثر من الآخرين! يالها من فرصة رائعة لتبين لكل هؤلاء الحسودات حجم التقدير الذي تكنه لالة عيشة لها. كانت تبوح لها بكل أسرارها! في النهاية، لمحت إلى أنها كانت تعرف ماهو أطول من ذلك، لكن اللياقة لم تكن تسمح لها بإفشاء كل شيء. رحلنا أخيرا. كنت أمشي في المقدمة، وأنا أحملق إلى عروض البضائع. عند وصولنا إلى سيدي أحمد تيجاني، اتجهت أمي إلى وعاء القرابين. في 113 جدار مغطى بالفسيفساء، كان يوجد ثقب، بمستوى الإنسان، يعلوه سياج من البرونز المتقن الصنع."}, {"fr": "Elle y introduisit simplement sa main, frotta sa joue contre la boiserie qui l’entourait et murmura une vague prière, J’étais trop petit pour atteindre le trou, je collai mes lèvres sur la mosaïque froide du mur. Cette manifestation de respect pour Sidi Ahmed Tijani fit plaisir à ma mère.", "ar": "لم تضع أمي أي قربان في الثقب. أدخلت فيه يدها فقط، فركت خدها بالمنجور الذي كان يحيط به و همست بدعاء ملتبس، كنت قصيرا جدا لأبلغ الثقب، ألصقت شفتي بفسيفساء الجدار الباردة. أسعد إظهار الاحترام لسيدي أحمد تيجاني هذا أمي."}, {"fr": "- Viens, mon petit œil, et qu’Allah te préserve de tout mal! Me dit-elle.", "ar": "- قالت لي: تعال، يا عيني الصغيرة، وليحفظك الله من كل شر!"}, {"fr": "Je la suivis. Nous fîmes quelques pas. Un marchand de poivrons et de tomates s’était installé dans l’angle d’une ruelle. Il exposait par terre ses légumes en petits tas bien ordonnés, de forme pyramidale.", "ar": "تبعتها. مشينا بضع خطوات. كان بائع فلفل و طماطم قد جلس عند زاوية الزقاق. كان يعرض خضره على الأرض على شكل كومات صغيرة مرتبة جيدا، على شكل هرمي."}, {"fr": "- Combien vends-tu tes tomates ? lui demanda ma mère. Elle se courba, tâta par ci, toucha par-là, mé- langea poivrons et tomates, sema le désordre. Le marchand, furieux, lui répondit que cette marchandise n’était pas à vendre, surtout à une cliente aussi ennuyeuse.", "ar": "- سألته أمي: بكم تبيع طماطمك؟ انحنت، جست هنا، لمست هناك، خلطت الطماطم بالفلفل، أحدثت الفوضى. أجابها البائع، و هو غاضب، بأن هذه السلعة لم تكن للبيع، خصوصا لزبونة مزعجة مثلها."}, {"fr": "Très digne, ma mère se leva et lui conseilla de ramasser ses ordures s’il n’avait pas l’intention de les vendre. On ne devait pas permettre à des fainéants de cette espèce d’encombrer la rue et de gêner la cir- culation. Elle allait sûrement continuer sa diatribe mais je m’emparai de sa main et la forçai à me suivre. Nous abandonnâmes le marchand secoué de colère.", "ar": "بشكل وقور، وقفت أمي و نصحته بأن يجمع نفاياته إن لم يكن ينوي بيعها. لا يجب السماح لكسالى من هذا النوع بأن يملأوا الأزقة و يعيقوا حركة المرور. لابد من أنها كانت ستكمل نقدها اللاذع لكنني أمسكت بيدها و أجبرتها على اللحاق بي. تركنا البائع يشتعل غضبا."}, {"fr": "A notre gauche, se dressait un portail mon mental orné de clous et de marteaux de bronze d’un très beau travail,", "ar": "إلى يسارنا، كانت توجد بوابة ضخمة مزينة بمسامير و مطارق من البرونز بطريقة جميلة جدا."}, {"fr": "- Mé! Dis-moi à qui appartient cette maison?", "ar": "- مي، قولي لي لمن هذا المنزل؟"}, {"fr": "- Ce n’est pas une maison, c’est un bureau de Chrétiens.", "ar": "- إنه ليس منزلا، إنه مكتب مسيحيين."}, {"fr": "- Je vois des Musulmans y entrer.", "ar": "- أرى مسلمين يدخلون إليه."}, {"fr": "- Ils travaillent avec les Chrétiens. Les Chrétiens, mon fils, sont riches et paient bien ceux qui connais- sent leur langue.", "ar": "- إنهم يعملون مع المسيحيين. المسيحيون أغنياء يا بني و يدفعون جيدا لمن يعرف لغتهم."}, {"fr": "- Est-ce que je parierai la langue des Chrétiens quand je serai grand ?", "ar": "- هل سأتكلم لغة المسيحيين عندما أكبر؟"}, {"fr": "- Dieu te préserve, mon fils, de tout contact avec ces gens que nous ne connaissons pas.", "ar": "- فليحفظك الله، يا بني، من أية صلة بأناس لا نعرفهم."}, {"fr": "La rue Zenqat-Hajjama s’ouvrait à main gauche, face à l’ancien marché aux esclaves. Dés l’entrée de la maison, ma mère appela Lalla Aïcha, Elle nous souhaita la bienvenue de sa chambre du deuxième étage et nous pria de monter. Elle nous attendait, assise devant sa bouilloire qui lançait des jets de vapeur. La chambre offrait l’image de la désolation. Elle suait la misère et l’ennui. Je l’avais connue en des jours meilleurs. Plus de cretonne sur les matelas, plus de carpettes aux couleurs gaies ! Les étagères de bois peint avec leur cargaison de bols de faïence et d’assiettes décorées avaient disparu, l’horloge laissait à sa place une tache claire sur le mur. Le nombre des matelas n’avait pas changé mais ils étaient bourrés de crin végétal au lieu de laine. Le crin s’était tassé, les matelas étaient froids et durs. D’ailleurs, toute la pièce paraissait froide et dure. Une sorte d’angoisse imprégnait l’atmosphère. La maison me parut morte. Les locataires silencieux se tenaient tapis, sans aucun doute, dans les coins les plus sombres de leurs pièces. Un petit chat miaulait désespérément sur la terrasse. Il avait dû miauler pendant des jours. Sa voix sai- gnait à chaque appel. Lalla Aïcha prépara le thé. Elle le servit dans un petit plateau de cuivre jaune aux gravures effacées. Elle s’acquittait de ses devoirs d’hôtesse avec beaucoup de dignité.", "ar": "كان شارع زنقة حجامة يقع إلى اليسار، قبالة سوق العبيد القديم. منذ مدخل البيت، نادت أمي لالة عيشة، تمنت لنا قدوما ميمونا من غرفتها في الطابق الثاني و رجتنا لنصعد. كانت تنتظرنا، جالسة أمام مرجلها الذي كان يطلق تدفقات دخان. 114 كانت الغرفة تعكس صورة الأسى. كانت تبدي البؤس و الضجر. لقد عرفتها في أيام أفضل. لم يعد هناك كريتون على الأفرشة، لم تعد هناك سجادة بألوان زاهية! كانت الرفوف الخشبية المطلية بحمولتها من الزبديات الخزفية و الأطباق المزينة قد اختفت، تركت الساعة الحائطية بقعة فاتحة في مكانها على الجدار. لم يتغير عدد الأفرشة لكنها صارت محشوة بلبدة نباتية بدل الصوف. كانت اللبدة قد ضمرت، كانت الأفرشة باردة و قاسية. على أية حال، كانت الغرفة كلها تبدو باردة و قاسية. كان الجو مشبعا بما يشبه الفزع. بدا لي البيت ميتا. كان المستأجرون الصامتون يجلسون، بدون أدنى شك، في الزوايا الأكثر ظلمة من غرفهم. كان قط يموء بشكل يائس على السطح. لا بد من أنه ماء طوال أيام. كان صوته ينزف عند كل نداء. حضرت لالة عيشة الشاي. قدمته في طبق نحاسي بنقوش ممحوة. كانت تقوم بواجب المضيفة بشرف كبير."}, {"fr": "Personne ne disait rien. Chacun de nous trois poursuivait son rêve particulier, s’absorbait dans ses pen- sées. Lalla Aïcha rompit le silence.", "ar": "لم يكن أحد يقول شيئا. كان كل واحد من ثلاثتنا يتابع حلمه الخاص، يغرق في أفكاره. كسرت لالة عيشة الصمت."}, {"fr": "- Nous irons plutôt dans le quartier Seffah, le fqih de Qalklyine est en voyage dans le djebel. Il paraît qu’il a encore de la famille dans un village perdu. Sidi El Arafi que nous irons consulter est aveugle. Je tiens les renseignements de Khadouj Lalaouia qui l’a consulté deux ou trois fois. Elle m’a affirmé que tout ce qu’il lui avait prédit s’était réalisé point par point.", "ar": "- سنذهب بالأحرى إلى حي صفاح، لقد سافر فقيه كالكليين إلى الجبل. يبدو بأنه لازال لديه عائلة في قرية نائية. إن سيدي العرفي الذي سنذهب لاستشارته أعمى. لقد حصلت على المعلومات من خدوج العلوية التي استشارته مرتين أو ثلاثة. لقد أكدت لي بأن كل ما تنبأ لها به قد تحقق نقطة بنقطة."}, {"fr": "J’ai de l’espoir, Zoubida ; avec l’aide de ce voyant, je suis sûre d’atteindre le but. Nous sommes de très faibles créatures, le bonheur est chose fragile. Mon nid a été saccagé, je n’aurai de repos que le jour où il redeviendra ce qu’il était.", "ar": "لدي أمل، يا زبيدة؛ بمساعدة هذا العراف، أنا متأكدة من أنني سأصيب هدفي. نحن مخلوقات ضعيفة جدا، إن السعادة شيء هش. لقد خرب بيتي، لن أرتاح حتى اليوم الذي يعود فيه إلى ما كان عليه."}, {"fr": "Ma mère hochait la tête, moi je soupirais parce que je savais que dans de telles circonstances il conve- nait de soupirer. Le silence s’établit de nouveau.", "ar": "كانت أمي تهز رأسها، أنا كنت أتنهد لأنني كنت أعرف بأنه في مثل هذه الظروف كان من اللائق التنهد. خيم الصمت من جديد."}, {"fr": "Ma mère dit enfin:", "ar": "قالت أمي في الأخير:"}, {"fr": "-Lalla Aicha j’ai, moi aussi, grand besoin de conseils. Je tremble pour ma maison, pour mon mari, pour mon fils. Quand la colère de Dieu se déchaîne sur les gens pauvres comme nous, elle les réduit en cendres. Les personnes qui « savent nous sont d’un secours précieux. Sidi El Arafi a bonne réputation, il nous aidera sûrement.", "ar": "- لالة عيشة، أنا كذلك في حاجة ماسة إلى النصيحة. أنا خائفة على بيتي، على زوجي و على ابني. عندما يحل غضب الله على الناس الفقراء مثلنا فإنه يحولهم إلى رماد. إن الناس الذين « يعلمون » يكونون عونا ثمينا لنا. إن سيدي العارافي يملك سمعة جيدة، سيساعدنا بالتأكيد."}, {"fr": "- II est permis à l’esclave de faire ce qui est en son pouvoir pour remédier à sa misère, ensuite il doit s’en remettre à son seigneur pour l’accomplissement de ses desseins. Ayons confiance. Lalla Aïcha, qui n’avait rien perdu de son embonpoint, s’arracha péniblement du sol, prit son haïk.", "ar": "115 - من المسموح للعبد أن يبذل قصارى جهده ليعالج بؤسه، بعدها يجب أن يترك الأمر بيد الله لانجاز نواياه. لنكن على أمل. نهضت لالة عيشة، التي لم تفقد شيئا من وزنها الزائد، بصعوبة من الأرض، أخذت حايكها. 116"}]}, {"fr_title": "Chapitre X", "ar_title": "الفصل 10", "segs": [{"fr": "Nous n’avions eu aucune peine à trouver la maison de Si El Arafi. Les gens du quartier Seffah, fiers d’être les voisins d’un homme aussi illustre, s’empressèrent de nous renseigner. Un enfant de mon âge s’était offert de nous accompagner. Il nous guida à travers un dédale de rues de plus en plus étroites, de plus en plus sombres, de plus en plus encombrées de tas d’ordures et de chats efflanqués. Nous abou- tîmes enfin à une petite place inondée de soleil. Sur cet espace lumineux s’ouvraient les entrées de deux moulins à eau, de trois portes de maisons vétustes et une bouche d’égout. Des nuages de poussière et de mouches tournoyaient dans l’air. Diverses odeurs s’y livraient bataille: ordures ménagères, pissat d’âne, cuisine maigre, benjoin et encens y mêlaient leurs effluves!", "ar": "لم نجد أية صعوبة في إيجاد بيت سي العارافي. كان ناس حي صفاح، فخورين بكونهم جيران رجل مشهور جدا، يسارعون بإرشادنا. تطوع طفل في مثل سني بمرافقتنا. دلنا عبر متاهة من الشوارع التي كانت تصبح ضيقة أكثر فأكثر، مظلمة أكثر فأكثر، مليئة أكثر فأكثر بأكوام النفايات و القطط الضالة. وصلنا أخيرا إلى ساحة صغيرة تغمرها أشعة الشمس. في هذا الفضاء المشرق كان يوجد مدخلا طاحونتين مائيتين، ثلاثة أبواب لمنازل عتيقة و فتحة مجاري. كانت سحب من الغبار و الذباب تدور في الجو. كانت روائح متعددة تتعارك فيما بينها: نفايات منزلية، بول حمير، أطباق قليلة الدسم، و كان البنزوين و اللبان يمزجان نفحهما بها."}, {"fr": "L’enfant qui nous accompagnait, pointa son index droit vers la porte centrale, fourra l’index gauche dans sa narine et s’en alla sans rien dire. La porte s’ouvrit. Une vieille femme au visage découvert portant sur la tête une corbeille de roseaux sortit. Elle nous dévisagea calmement, hocha la tête. Elle se dirigea vers le boyau noir par lequel nous étions arrivés. Nous nous engageâmes à la queue leu-leu dans le cou- loir d’entrée. Nous battions le sol du bout de nos babouches avant de poser le pied. Il faisait nuit dans le couloir. Le pavé en était irrégulier. De temps en temps, ma mère ou Lalla Aïcha appelait le Prophète à son secours. Elles butaient à tour de rôle sur le même obstacle, un pavé mal ajusté, une brique qui traînait là par mégarde.", "ar": "صوب الطفل الذي كان يرافقنا سبابته اليمنى نحو الباب الرئيسي، دس سبابته اليسرى في أنفه و رحل دون أن يقول شيئا. فتح الباب. خرجت امرأة عجوز بوجه مكشوف تحمل على رأسها سلة من القصب. حدقت إلينا بهدوء، هزت رأسها. اتجهت نحو الزنقة السوداء التي أتينا منها. مشينا واحدا تلو الآخر في ممر الدخول. كنا نضرب الأرض بطرف بلغاتنا قبل أن نحط قدمنا. كان الممر مظلما. لم يكن البلاط متناسقا. من حين لآخر، كانت أمي أو لالة عيشة تطلب من النبي نجدتها. كانتا تتعثران بنفس الحاجز بالدور، بلاطة مرصوفة بشكل خاطئ، آجرة كانت مرمية هناك سهوا."}, {"fr": "Le couloir tourna à gauche. La lumière du patio nous éblouit. Nous soupirâmes de contentement : un pied de vigne grimpait le long du mur qui nous faisait face. Les feuilles, d’un vert dense, éclataient, sur la blancheur de la chaux qui couvrait tous les murs de la maison. Cette cour respirait une paix monacale. Des pigeons roucoulaient et des tourterelles répondaient dans leur langage. En vain, je cherchai des yeux ces oiseaux qui nous accueillaient joyeusement. Ils devaient nous épier de leurs cachettes pleines d’ombre et de fraîcheur. .", "ar": "انعطف الممر إلى اليسار. بهرنا ضوء الفناء. تنهدنا من الرضى: كانت هناك قدم دالية تتسلق على طول الجدار الذي كان يواجهنا. كانت الأوراق، بلون أخضر داكن، تزهوا فوق بياض الجير الذي كان يغطي كل جدران المنزل. كانت هذه الساحة تبدي سلاما رهبانيا. كان هناك حمام يهدل و ترغل يجيبون بلغتهم. كنت أبحث بعيني عن هذه الطيور التي كانت تستقبلنا بفرح لكن دون جدوى. لا بد من أنها كانت تراقبنا من مخابئها المليئة بالظل و البرودة."}, {"fr": "Il n’y avait personne dans le patio. Pendant quelques minutes, nous restâmes là, ne sachant à qui nous adresser. Ma mère osa appeler:", "ar": "لم يكن هناك أحد في الفناء. بقينا هناك بضع دقائق و نحن لا نعرف من نخاطب. تجرأت أمي و نادت:"}, {"fr": "- Ô gens de la maison ! Une voix de femme demanda :", "ar": "117 - يا سكان البيت! سأل صوت امرأة:"}, {"fr": "- Qui voulez-vous voir ?", "ar": "- من تريدون مقابلته؟"}, {"fr": "Ma mère reprit: - Ô gens de la maison, est-ce chez vous qu’habite Sidi El Arafi ? Nous désirons le consulter. La tête d’une petite fille négroïde surgit d’une lucarne. Des yeux, elle nous indiqua l’escalier qui se trouvait à notre droite.", "ar": "- استأنفت أمي: يا سكان البيت، هل يسكن سيدي العارافي في بيتكم؟ إننا نريد استشارته. ظهر رأس بنت صغيرة تشبه الزنوج من كوة. دلتنا بعينيها إلى الدرج الذي كان على يميننا."}, {"fr": "- Montez, dit-elle, Sidi El Arafi habite au premier.", "ar": "- قالت: اصعدوا، إن سيدي العارافي يسكن في الطابق الأول."}, {"fr": "A peine avions-nous grimpé trois marches que Lalla Aicha se mit à respirer comme un soufflet de forge:", "ar": "بالكاد صعدنا ثلاث درجات حتى بدأت لالة عيشة بالتنفس مثل منفخ المسبك:"}, {"fr": "- Montez tous les deux, nous conseilla-t-elle, vous m’attendrez sur le palier.", "ar": "- نصحتنا: اصعدا أنتما الإثنان، ستنتظرانني عند البسطة."}, {"fr": "Du palier, partaient en tous sens plusieurs couloirs et plusieurs autres escaliers tout aussi usés. Les marches usées ne facilitaient pas la montée. Au bout de l’un des couloirs s’ouvrait la chambre de Sidi El Arafi. Un rideau à grandes bandes jaunes et rouges en défendait l’accès. Lalla Aïcha nous rejoignit, suant, s’étouffant, hoquetant des lambeaux de prières et des formules d’ap- pel à la miséricorde divine. Je soulevai le rideau pour laisser passer mes deux compagnes. Ma mère risqua un œil à l’intérieur de la pièce et demanda:", "ar": "من البسطة، كانت هناك عدة ممرات تذهب في جميع الاتجاهات بالإضافة إلى عدة أدراج مهترئة كذلك. كانت الدرجات المهترئة تعرقل الصعود. في نهاية أحد هذه الممرات كانت توجد غرفة سيدي العارافي. كانت ستارة بشرائط صفراء و حمراء تمنع ولوجها. التحقت بنا لالة عيشة و هي تتعرق و تختنق و تفوق بأدعية و عبارات نداء للرحمة الإلاهية. رفعت الستارة لأمهد الطريق لمرافقتي. ألقت أمي نظرة على الغرفة و سألت:"}, {"fr": "- C’est bien ici que demeure Sidi El Arafi ?", "ar": "- هل صحيح بأن سيدي العارافي يسكن هنا؟"}, {"fr": "- Oui, c’est ici, n’ayez aucune crainte d’approcher, pèlerins que Dieu a envoyés vers nous. Je suis El Arafi, le pauvre aveugle. Je ne refuse jamais de recevoir les hôtes de Dieu.", "ar": "- أجل، هذا صحيح، لا خشية عليكم من الاقتراب يا حجاج الله الذين أرسلهم إلينا. أنا هو العارافي، الأعمى المسكين. لا أرفض أبدا استقبال ضيوف الله."}, {"fr": "Nous entrâmes, l’un derrière l’autre, abandonnant nos babouches dans le couloir.", "ar": "دخلنا، واحدا تلو الآخر، تاركين بلغاتنا في الممر."}, {"fr": "Lalla Aicha, ponctuant chaque mot d’un profond soupir, déclara:", "ar": "- أعلنت لالة عيشة و هي تنطق كل كلمة بتنهد عميق:"}, {"fr": "- Nous sommes les hôtes de Dieu, ô notre maître! Mais nous sommes aussi tes hôtes.", "ar": "- إننا ضيوف الله، يا سيدنا، لكننا ضيوفك كذلك."}, {"fr": "- Soyez les bienvenus! Soyez les bienvenus! Et si vous êtes assoiffés, nous avons de l’eau qui rafraîchit les gorges desséchées. Approchez et asseyez-vous. Mes yeux ne peuvent vous voir mais mon cœur me dit que vous êtes des gens de bien. Il y a parmi vous un enfant. Mon oreille perçoit le bruit de ses pas sur la natte. Est-ce une fille ou un garçon?", "ar": "- مرحبا بكم! مرحبا بكم! و إن كنتم تشعرون بالعطش، لدينا ماء يروي الحلوق المتجففة. اقتربوا و اجلسوا. لا تستطيع عيناي رؤيتكما لكن قلبي يقول لي بأنكم أناس أخيار. إن بينكم طفلا. تسمع أذناي وقع خطواته على الحصير. هل هي بنت أو ولد؟"}, {"fr": "- Un garçon, répondit ma mère. S’adressant à moi elle ajouta: - Embrasse la main du chérif, mon fils, et demande lui de te bénir.", "ar": "- أجابت أمي: ولد. أضافت و هي تخاطبني: 118 - قبل يد الشريف، يا بني، و اطلب منه أن يباركك."}, {"fr": "L’aveugle tendit la main droite dans l’espace et dit:", "ar": "مد الأعمى يده في الفراغ و قال:"}, {"fr": "- Dieu te bénisse, mon fils ! Dieu te bénisse! Viens près de moi !", "ar": "- باركك الله، يا بني، باركك الله! تعال إلى جانبي!"}, {"fr": "Sa figure rayonnait de bonté. Il avait le visage long et maigre, couleur de pain brûlé. Les globes lai- teux qui remplissaient ses orbites ne m’inspiraient aucune frayeur. Je m’avançai. Je mis ma main dans la sienne. Je posai mes lèvres sur ses doigts. Il me sourit et m’attira doucement sur ses genoux. Sa main passa légère sur mon visage. Elle en tâta chaque volume et chaque creux. Elle s’arrêta sur mon front, glissa vers les oreilles, aboutit à la nuque.", "ar": "كان وجهه يشرق طيبة. كان وجهه طويلا و هزيلا، بلون الخبز المحروق. لم تكن مقلتاه اللتان تملآن محجريه تثيران خوفي. تقدمت. وضعت يدي في يده. وضعت شفتي على أصابعه. ابتسم لي و جرني بلطف إلى ركبتيه. مرر يده بشكل خفيف على وجهي. جست فيه كل جزء و جوف. توقفت على جبيني، انزلقت نحو الأذنين، وصلت إلى العنق."}, {"fr": "Pendant toute cette exploration, il ne cessa de répéter: « Que Dieu bénisse! Que Dieu bénisse! »", "ar": "خلال كل هذا الاستكشاف، لم يتوقف عن ترديد: « فليبارك الله! فليبارك الله! »"}, {"fr": "II saisit un chapelet qui se trouvait à portée de sa main et me le passa sept fois sur le dos. Tout en pro- cédant à cette cérémonie, il récitait des versets du Coran que je connaissais, mais je les savais imparfaite- ment. Il s’arrêta enfin et me dit:", "ar": "تناول مسبحة كانت في متناول يده و أدارها فوق ظهري سبع مرات. بينما كان يقوم بهذا الطقس، كان يتلو آيات قرآنية كنت أعرفها، لكنني لم أكن أحفظها بشكل تام. توقف أخيرا و قال لي:"}, {"fr": "- Tu dois savoir le verset du Trône; récite-le souvent, il te protégera contre toutes les mauvaises in- fluences. Sidi El Arafi portait une chemise de cotonnade très ample. Sur sa tête était juché un bonnet de laine tricoté qui avait certainement rétréci au lavage. Après lui avoir embrassé, encore une fois, la main, J’allai m’asseoir quelques pas plus loin. Sa femme vint à son tour nous souhaiter la bienvenue. Elle nous offrit de l’eau très fraîche qu’elle versait d’une cruche en terre cuite. J’avais l’impression d’avoir déjà vu, cette femme. Peut-être au bain maure. Elle avait une peau café au lait, plus café que lait. Elle parlait avec l’accent du Tafilalet. Les gestes étaient menus et pleins de grâce. Je me souviens encore de son visage aux yeux très rapprochés, au nez minuscule, mais aux lèvres généreuses. Je revois aussi ses dents, frottées à l’écorce de noyer, des dents larges, solidement enfoncées dans la chair couleur de dattes tirs gencives.", "ar": "- لا بد من أنك تعرف آية الكرسي؛ أتلوها دائما، سوف تحميك من كل النوايا السيئة. كان سيدي العارافي يرتدي قميصا قطنيا واسعا جدا. كان يلبس على رأسه قلنسوة صوفية كانت قد ضاقت عند الغسل. بعد أن قبلت يده مرة أخرى ذهبت لأجلس على بعد بضع خطوات منه. أتت زوجته بدورها لترحب بنا. قدمت لنا ماء باردا جدا كانت تسكبه في قلة فخارية. كان لدي انطباع بأنني سبق و رأيت هذه المرأة. ربما في الحمام العمومي. كانت بشرتها كلون القهوة بالحليب. كانت تتكلم بلكنة تافيلالت. كانت حركاتها خفيفة و مفعمة بالخير. لازلت أتذكر وجهها ذي العينين المتقاربتين جدا، بأنف صغير لكن بشفتين منتفختين جدا. أتذكر كذلك أسنانها المحكوكة بقشور الجوز، أسنان عريضة، مغروزة بقوة في لحم اللثة التي كانت بلون التمر. صحيح أن سيدي العارافي لم يكن يعيش في رخاء."}, {"fr": "Sidi El Arafi ne nageait certes pas dans l’opulence. Les matelas reposaient sur une natte de jonc. La natte, d’un jaune brun, ne résisterait pas longtemps encore à la décrépitude. Les couvertures de cretonne, très propres, souffraient de vieillesse. Il y avait une étagère au mur. Au-dessus trônait, solitaire, un sucrier en fer-blanc peint en rouge orné de dessins à l’encre d’or, à moitié effacés. La djellaba de Sidi El Arafi pendait à la tête du lit. Sidi El Arafi demanda à sa femme de lui apporter son panier. Ma mère, Lalla Aïcha et moi restions silencieux. Il allait se passer quelque événement d’importance. Je le sentais. Une vague d’inquiétude me submergea. Je frémissais aussi de curiosité.", "ar": "كانت الأفرشة موضوعة على حصير من الأسل. ما كان الحصير الأصفر البني ليقاوم القدم لمدة أطول. كانت أغطية الكريتون النظيفة جدا تعاني من الشيخوخة. كان هناك رف في الحائط. كانت تتصدره سكرية وحيدة من التنك مطلية بالأحمر المزين برسوم من الحبر الذهبي، نصف ممحية. كان جلباب سيدي العارافي يتدلى من مقدمة السرير. 119 طلب سيدي العارافي من زوجته أن تحضر له سلته. بقيت أنا و أمي و لالة عيشة صامتين. كان حدث هام سيحصل. كنت أشعر بذلك. غمرتني موجة من القلق. كنت أرتعش من الفضول."}, {"fr": "La femme de Sidi El Arafi posa devant son mari un panier rond en sparterie surmonté d’un grand cou- vercle conique. L’aveugle tendit le bras, rencontra le couvercle et le souleva lentement. Je tendis le cou. J’avais vaguement peur. Je m’attendais à voir surgir un monstre hideux, peut-être un nuage de fumée qui se serait transformé sous nos yeux en un démon prêt à satisfaire nos moindres caprices. Le panier ne contenait rien de semblable. Il dégageait une douce odeur de benjoin et d’encens. Je re- gardai de plus près les objets que la main de Sidi El Arafi s’apprêtait à prendre. Je souris.", "ar": "وضعت زوجة سيدي العرفي أمام زوجها سلة دائرية من الحلفاء يعلوها غطاء مخروطي كبير. مد الأعمى ذراعه، لمس الغطاء و رفعه ببطئ. مددت عنقي. كنت خائفا على نحو غامض. كنت أتوقع خروج وحش بشع، ربما سحابة دخان كانت ستتحول أمام أعيننا إلى شيطان جاهز لتنفيذ كل طلباتنا. لم تكن السلة تحتوي على أي شيء مشابه. كانت تفوح منها رائحة بنزوين و لبان عطرة. نظرت عن قرب إلى الأشياء التي كانت يد سيدي العارافي تتأهب لتناولها. ابتسمت."}, {"fr": "Le panier de Sidi El Arafi rappelait ma Boîte à Merveilles. Il connaissait le « secret». Bien sûr, tout le monde disait qu’il était très savant. Un vrai savant doit nécessairement posséder une boîte à merveilles. Je comprenais maintenant. Malgré sa cécité, il était gai et de caractère paisible. Il ne voyait pas le soleil, les fleurs et les oiseaux, mais sa nuit s’animait parfois de la joie des personnages que chaque objet de son panier pouvait évoquer. Je tendis moi aussi la main pour toucher les menus objets. Un regard de ma mère arrêta mon geste. Sidi El Arafi récita à voix basse une longue prière. La main, les doigts écartés, planait sur le contenu du panier comme un oiseau qui s’apprête à se poser dans son nid.", "ar": "كانت سلة سيدي العارافي تذكرني بعلبة العجائب خاصتي. كان يعرف « السر ». كان الجميع يقولون بالطبع بأنه عراف ماهر. أي عراف حقيقي لا بد له من أن يمتلك علبة عجائب. لقد فهمت الآن. رغم عماه. كان مرحا و ذا شخصية مسالمة. لم يكن يرى الشمس، الأزهار و الطيور، لكن ليله كان ينتعش أحيانا بالشخصيات التي كان يمثلها كل شيء من سلته. مددت يدي أنا كذلك لألمس الأشياء الصغيرة. أوقفت نظرة من أمي حركتي. تلا سيدي العارافي دعاء طويلا بصوت منخفض. كانت اليد، بأصابع متباعدة، تحوم فوق محتوى السلة مثل طائر يستعد ليحط في عشه."}, {"fr": "Il s’arrêta et s’adressant à nous il dit: - Ne vous attendez pas à ce que je vous dévoile l’avenir. L’avenir appartient à Dieu, l’omnipotent. Ces coquillages et ces amulettes m’aident à sentir vos peines, vous rapprochent de mon cœur. Quand je vous parlerai, c’est mon cœur que vous entendrez. Sidi Mohammed, n’est-ce pas là le nom de l’enfant qui vous accompagne?", "ar": "توقف و قال و هو يخاطبنا: - لا تتوقعوا أن أكشف لكم الغيب. إن الغيب ملك لله، القدير، إن هذه المحارات و الأحراز تساعدني لأحس بألمكم، تقربكم من قلبي. عندما سأحدثكم، إن قلبي هو من سوف تسمعونه. سيدي محمد، أليس هذا هو اسم الطفل الذي يرافقكم؟ - أجابت أمي بصوت خجول: أجل."}, {"fr": "- Oui, répondit ma mère d’une voix timide. Le voyant reprit: - Sidi Mohammed sait que c’est vrai ce que je vous dis. Un enfant pur fait partie encore des légions angéliques, ces êtres de lumière. La vérité étant lumière ne peut lui échapper… Approche, Sidi Moham- med, plonge ta main dans ce panier et saisis un objet sans le voir.", "ar": "- إن سيدي محمد يعرف بأن ما أقوله لكم صحيح. إن طفلا طاهرا ما يزال ينتمي إلى الكتائب الملائكية، هذه المخلوقات النورانية. لا تستطيع الحقيقة أن تفلت منه لكونها نورا... اقترب، يا سيدي محمد، أدخل يدك في هذه السلة و تناول شيئا دون أن تراه."}, {"fr": "Je suivis à la lettre ce qu’il m’ordonna de faire. Une boule de verre, de la grosseur d’un œuf, se logea dans le creux de ma main. Elle était agréable au toucher et d’une couleur aquatique. Je la regardai avant de la lui remettre. Dans sa masse transparente brillait une grosse bulle d’air. De minuscules satellites me- naient une ronde autour de cet astre. Les doigts de Sidi El Arafi caressèrent longtemps la boule de verre. Il ne disait rien. Sa figure devint grave. Il parla enfin lentement, détachant chaque syllabe.", "ar": "120 نفذت ما طلبه مني حرفيا. استقرت كرة زجاجية، بحجم بيضة، في باطن يدي. كانت ناعمة الملمس و ذات لون مائي. نظرت إليها قبل أن أعيدها إليه. كانت فقاعة هواء كبيرة تلمع في كتلتها الشفافة. كانت أقمار صغيرة تدور حول هذا الكوكب. لمست أصابع سيدي العارافي الكرة الزجاجية لمدة طويلة. لم يكن يقول شيئا. أصبح وجهه صارما. أخيرا تكلم بهدوء و هو ينطق كل مقطع لفظي على حدة."}, {"fr": "- Écoute, enfant de bon augure et souviens-toi. Le diamant s’appelle, dans le langage des connaisseurs, l’orphelin, le solitaire parce qu’il est rare et qu’aucune autre pierre ne peut rivaliser avec lui en dureté et en beauté. Chaque homme peut s’appeler comme le diamant, l’orphelin ou le solitaire. Désormais, ne sois plus triste. Si les hommes t’abandonnent, regarde en dedans de toi. Me comprends-tu bien, fils? Que de merveilles, que de merveilles recèle ton cœur ! Quand tu oublies de contempler tes trésors, ta santé en souffre et tu deviens débile. Regarde la boule que tu viens de me remettre. A l’intérieur de cette masse transparente, il y a l’image du soleil. Là elle est à l’abri de toute souillure, là elle est inaccessible à tout ce qui n’est pas lumière. Sois comme cette image, tu triompheras de tous les obstacles. Dieu te bénisse, mon enfant! Dieu te bénisse! Approche ton front de mes lèvres.", "ar": "- اسمع، أيها الطفل المبارك و تذكر. إن الألماس يسمى، حسب لغة الخبراء، اليتيم، الوحيد لأنه نادر و لعدم وجود أي حجر آخر يمكنه أن ينافسه في الصلابة و الجمال. يمكن لأي رجل أن يسمى مثل الألماس، اليتيم أو الوحيد. من الآن فصاعدا، لا تكن حزينا بعد الآن. إذا تخلى الرجال عن بعضهم، أنظر إلى داخلك. هل تفهمني جيدا، يا بني؟ يا للعجائب، يا للعجائب التي يخبؤها قلبك! عندما تنسى أن تتأمل كنوزك، تعاني صحتك من هذا و تصبح ضعيفا. أنظر إلى الكرة التي أعدتها إلي للتو. بداخل هذه الكتلة الشفافة، توجد صورة الشمس. إنها في مأمن من أي وسخ هناك. إنها منيعة على كل ما ليس نورا. كن مثل هذه الصورة، ستنتصر على كل العقبات. باركك الله، يا طفلي! باركك الله! قرب جبينك من شفتي."}, {"fr": "Il m’embrassa sur le front. Ensuite, nous récitâmes à haute voix, tous les deux, une courte prière.", "ar": "قبل جبيني. بعدها، تلونا بصوت مرتفع، نحن الاثنان، دعاء قصيرا."}, {"fr": "L’émotion m’étranglait. Mes yeux se remplirent de larmes. Je nageais dans la pure félicité.", "ar": "كان الانفعال يخنقني. امتلأت عيناي بالدموع. كنت أسبح في الهناء الخالص."}, {"fr": "Cette scène avait produit sur ma mère et sur Lalla Aïcha une forte impression. Elles restaient silen- cieuses dans une attitude de respect. Sidi El Arafi écarta le panier et demanda à boire. Sa femme lui remplit d’eau un bol en terre poreuse et s’éclipsa. Le voyant s’essuya la bouche avec une petite serviette éponge qu’il roula ensuite en boule et mit sous l’un de ses genoux. Enfin, il s’adressa aux deux femmes:", "ar": "كانت هذه الأحداث قد تركت في أمي و لالة عيشة انطباعا قويا. بقيتا صامتتين في حالة احترام. أبعد سيدي العارافي السلة و طلب أن يشرب. ملأت له زوجته زبدية من طين مسامي با
